  } else if (runSheet === 'after') {
    title = 'Running after weights';
    const sess = ctx.plan.map((ss, i) => ({ ss, i }))
      .filter(x => !x.ss.outside && x.ss.dist * (x.ss.avgPace || x.ss.pace || x.ss.repPace || 6) <= 70);
    let calc = '<p>No treadmill-length run this week, so there is nothing to stack after weights.</p>';
    let m = null;
    if (sess.length) {
      const longest = sess.reduce((a, b) =>
        (b.ss.dist * (b.ss.avgPace || b.ss.pace || 6)) > (a.ss.dist * (a.ss.avgPace || a.ss.pace || 6)) ? b : a);
      const mins = Math.round(longest.ss.dist * (longest.ss.avgPace || longest.ss.pace || longest.ss.repPace || 6));
      m = postGymMath(mins, new Date().getDay());
      const sw = m.sleepWith, wo = m.sleepWithout;
      calc = `
        <p>${hhmm(gymArrival)} in, ${m.lift.mins} min of weights, done ${hhmm(m.liftDone)}, then ${mins} min on the treadmill: <b>out at ${hhmm(m.finish)}</b>.
        Up at ${hhmm(sw.wake)} tomorrow, so that is <b style="color:${sw.ok ? '#1B7F5A' : '#7A5200'};">${fmtDur(sw.mins)} of sleep</b>${sw.ok ? '.' : `, under your ${fmtDur(sleepTarget)}.`}</p>
        <p>Skipping the run gets you home ${fmtDur(m.cost)} earlier, ${fmtDur(wo.mins)} of sleep instead. That is the whole trade${sw.ok ? ', and you can afford it tonight.' : ', so it is a judgement call, not a rule.'}</p>
        ${m.arrivesInRush ? `<p>${hhmm(gymArrival)} is inside your busy window. In by ${hhmm(gymBusy[0] - 15)} or after ${hhmm(gymBusy[1])} if that matters tonight.</p>` : ''}`;
    }
    body = `
      <div class="sheet-sec">
        <h3>Tonight</h3>
        ${calc}
      </div>
      <div class="sheet-sec">
        <h3>The gym</h3>
        <div class="field-row">
          <label class="field">At the gym by<input type="time" value="${tm(gymArrival)}" onchange="setGymTime('arrive', this.value)"></label>
          <label class="field">Busy from<input type="time" value="${tm(gymBusy[0])}" onchange="setGymTime('busyFrom', this.value)"></label>
          <label class="field">Busy until<input type="time" value="${tm(gymBusy[1])}" onchange="setGymTime('busyTo', this.value)"></label>
        </div>
        <div class="field-row">
          <label class="field">Weights take (min)<input type="number" min="15" max="180" value="${liftMinutes}" onchange="setLiftMinutes(this.value)"></label>
          <label class="field">Sleep target (hours)<input type="number" step="0.5" min="4" max="12" value="${(sleepTarget / 60).toFixed(1)}" onchange="setSleepTarget(this.value)"></label>
        </div>
        ${m && m.lift.measured ? `<p>Your last ${m.lift.n} sessions actually ran ${m.lift.mins} min, so that is what is used.</p>` : ''}
      </div>
      <div class="sheet-sec">
        <h3>What time you are up</h3>
        <div class="wake-grid">
          ${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="field">${DAY_NAMES[d]}<input type="time" value="${tm(wakeTimes[d])}" onchange="setWake(${d}, this.value)"></label>`).join('')}
        </div>
        <p style="margin-top:8px;">Change any of these and the numbers above follow.</p>
      </div>`;
  } else {
    title = 'Run settings';
    const v = hrVerdict(), t = hrVerdictText(v);
    body = `
      <div class="sheet-sec">
        <h3>Heart rate</h3>
        <p><b>${t.title}.</b> ${t.body}</p>
        <div class="field-row">
          <label class="field">Age<input type="number" value="${age}" onchange="setHR('age', this.value)"></label>
          <label class="field">Max HR<input type="number" value="${maxHR || ''}" placeholder="${estMaxHR()}" onchange="setHR('max', this.value)"></label>
          <label class="field">Resting HR<input type="number" value="${restHR || ''}" placeholder="on waking" onchange="setHR('rest', this.value)"></label>
        </div>
        <p>Your easy cap is <b>${easyCapHR()} bpm</b>, and everything in the app that says easy means under that. ${restHR
          ? `It comes from your <b>heart rate reserve</b> (${restHR}–${estMaxHR()}), which tracks oxygen uptake far better than a percentage of max and matters most when resting HR is high.`
          : `It is a percentage of max for now, which ignores resting HR. Put a resting figure in and it switches to heart rate reserve, the better method. Measure it lying down before you get up, not sitting at your desk.`}
        ${maxHR ? '' : ' Max is estimated at ' + estMaxHR() + ' from your age, worth about ±20 bpm.'}</p>
      </div>
      <div class="sheet-sec">
        <h3>The plan</h3>
        ${runAdjust ? `<p>Plan rebuilt from your current fitness${runAdjust.mode === 'extend' && runAdjust.extraWeeks ? `, timeline extended ${runAdjust.extraWeeks} weeks` : runAdjust.mode === 'repace' ? ', goal pace revised to what you can prove' : runAdjust.mode === 'redist' ? ', goal distance revised, ' + fmtPace(GOAL_PACE) + ' pace kept' : ', goal unchanged'}. <button class="link-btn" style="padding:0; min-height:0;" onclick="clearRecal()">Undo</button></p>` : '<p>Missed a few weeks, or the paces feel wrong? Rebuild the plan from what you can run today.</p>'}
        <button class="bk-btn" style="margin-top:10px;" onclick="runSheet=null; openRecal();">${runAdjust ? 'Re-adjust the plan' : 'Behind? Get back on track'}</button>
      </div>
      <div class="sheet-sec">
        <h3>You</h3>
        <div class="field-row">
          <label class="field">Bodyweight (kg)<input type="number" value="${bodyKg}" onchange="setBodyKg(this.value)"></label>
        </div>
        <p>Used for the calorie figure on each run.</p>
      </div>`;
  }
  return `
    <div class="swap-modal show" onclick="if(event.target===this)closeRunSheet()">
      <div class="swap-sheet">
        <div class="swap-head"><span>${title}</span><button class="swap-close" onclick="closeRunSheet()" aria-label="Close">✕</button></div>
        ${body}
      </div>
    </div>`;
}

function renderRunPlan() {
  const w = getProgramWeek();
  const totalDays = Math.ceil((RACE_DATE - PROGRAM_START) / (1000*60*60*24));
  const elapsedDays = totalDays - getDaysToRace();
  const timePct = Math.max(0, Math.min(100, (elapsedDays / totalDays) * 100));
  const readiness = getReadinessStatus();
  // Bar tracks gates DUE so far, clearing a future gate early does not fill it
  const _rd = getReadiness();
  const readyPct = _rd.due.length === 0 ? 0 : Math.round((_rd.dueHit / _rd.due.length) * 100);
  const adj = getAdjustmentRecommendation();
  const phase = getCurrentPhase();
  const wr = weekRunList();
  const wk = wr.wk, list = wr.list;
  const m = weekRunMatch(list);
  const isDone = i => m.a[i] !== undefined;

  // The session pinned to today if there is one, otherwise whichever is next.
  const dayIdx = new Date().getDay();
  let nextIdx = runSlots.findIndex((x, i) => x.d === dayIdx && list[i] && !isDone(i));
  if (nextIdx < 0) nextIdx = list.findIndex((x, i) => !isDone(i));
  const openIdx = runOpen !== null && list[runOpen] && !isDone(runOpen) ? runOpen : nextIdx;

  const gp = runAdjust && runAdjust.goalPace ? runAdjust.goalPace : GOAL_PACE;
  const gd = runAdjust && runAdjust.goalDist ? runAdjust.goalDist : GOAL_DIST;
  const adjusted = runAdjust && (runAdjust.goalPace || runAdjust.goalDist);
  const rd = runAdjust && runAdjust.targetDate ? new Date(runAdjust.targetDate) : RACE_DATE;
  const rdStr = rd.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const goalName = adjusted ? gd + 'km at ' + fmtPace(gp) + '/km' : ACTIVE_STAGE.name;
  const nx = nextCheckpoint();
  const ctx = { w, gp, gd, rdStr, goalName, timePct, readyPct, readiness, adj, plan: list };

  if (!wk) {
    return `<div class="card" style="text-align:center;">${w === 0
      ? 'Week 1 starts ' + programStartLabel() + '. Until then, keep logging runs to establish your baseline.'
      : '<b style="color:#1B7F5A;">Program complete.</b>'}</div>
      <div class="btn-3">
        <button onclick="openRunSheet('checkpoints')">Checkpoints</button>
        <button onclick="openRunSheet('after')">After weights</button>
        <button onclick="openRunSheet('settings')">Settings</button>
      </div>
      ${renderRecalModal()}${renderRunSheet(ctx)}`;
  }

  const sc = wr.sc;
  const secs = Math.round(Math.abs(sc.d.shift) * 60);
  const banner = sc.d.shift < 0
    ? `<div class="banner up"><strong>Paces scaled ${secs}s/km faster.</strong> Your best recent effort projects to ${fmtPace(sc.d.prof.paceGoal)}/km for the half, ahead of the ${fmtPace(sc.d.expect)} the plan expects this week, so the quality sessions below are harder. Easy and long runs stay easy.</div>`
    : sc.d.shift > 0
    ? `<div class="banner down"><strong>Paces eased ${secs}s/km.</strong> Your best recent effort projects to ${fmtPace(sc.d.prof.paceGoal)}/km for the half, behind the ${fmtPace(sc.d.expect)} the plan expects this week. Earn these back and they tighten automatically.</div>`
    : '';

  const kmDone = m.runs.reduce((s, r) => s + (r.distance || 0), 0);
  const kmPlan = list.reduce((s, x) => s + (x.dist || 0), 0);
  const isRaceWeek = list.some(x => x.type === 'race');
  const bonusKm = Math.min(6, Math.max(4, Math.round((list.find(x => x.type === 'easy') || { dist: 5 }).dist * 0.8)));
  const bonusRun = m.spare.find(r => r.distance >= 3);

  const rows = list.map((s, i) => {
    if (isDone(i)) {
      const r = m.runs[m.a[i]];
      return `<div class="run-row done">${IC.dia('done')}<span class="nm">${s.label}</span><span class="km">${r.distance.toFixed(1)} km · done ${DAY_NAMES[new Date(r.date).getDay()]}</span></div>`;
    }
    if (i === openIdx) return renderSessionCard(s, i === nextIdx, false, i);
    const est = Math.round(s.dist * (s.avgPace || s.pace || s.repPace || 6));
    return `<button class="run-row" onclick="showRun(${i})" aria-label="Show ${s.label}">${IC.dia('todo')}<span class="nm">${s.label}<small>${s.type === 'easy' || s.type === 'long' ? 'Easy, under your heart rate cap' : 'About ' + est + ' min'}${runSlots[i] && runSlots[i].d >= 0 ? ' · ' + DAY_NAMES[runSlots[i].d] : ''}</small></span><span class="km">${s.dist} km</span>${IC.chev}</button>`;
  }).join('');

  // If there is only time for one, which one. Only said when it is not the obvious next.
  const pend = list.map((ss, i) => ({ ss, i })).filter(x => !isDone(x.i))
    .sort((a, b) => (SESSION_WEIGHT[b.ss.type] || 30) - (SESSION_WEIGHT[a.ss.type] || 30));
  const oneOnly = pend.length > 1 && pend[0].i !== openIdx
    ? `<p class="fine" style="margin:6px 0 2px;">Only time for one more this week? Make it <b style="color:#10242B;">${pend[0].ss.label}</b>, the most valuable of the ${pend.length} still to do.</p>` : '';

  const v = hrVerdict();
  const st = easyPaceStrain();
  const tone = readiness.behind > 1 ? 'bad' : readiness.behind === 1 ? 'warn' : 'good';
  const toneIcon = t => `<span style="color:${t === 'good' ? '#1B7F5A' : '#B93D0B'};display:flex;">${t === 'good' ? IC.check : IC.warn}</span>`;

  return `
    <div class="wk-head">
      <span class="eyebrow">This week · ${phase}</span>
      <span class="small muted">${kmDone.toFixed(1)} of ${kmPlan.toFixed(1)} km</span>
    </div>
    <p class="wk-focus">${wk.focus}${runAdjust ? ' <b>Rebuilt from your current fitness.</b>' : ''}</p>
    ${banner}
    ${rows}
    ${pend.length === 0 ? `<div class="banner up" style="margin-top:8px;"><strong>All ${list.length} runs done this week.</strong> Anything else is a bonus.</div>` : ''}
    ${!isRaceWeek ? `<div class="run-row opt${bonusRun ? ' done' : ''}">${IC.dia(bonusRun ? 'done' : 'opt')}<span class="nm">${bonusRun ? 'Bonus run' : 'Bonus easy run, only if a day opens up'}</span><span class="km">${bonusRun ? bonusRun.distance.toFixed(1) + ' km · done' : bonusKm + ' km'}</span></div>` : ''}
    ${oneOnly}

    ${nx ? `<div class="status-line" style="margin-top:10px;">${IC.flag}<span>Next checkpoint: <b>${nx.name}</b>, ${nx.when}${nx.days > 0 ? ', in ' + nx.days + ' day' + (nx.days === 1 ? '' : 's') : nx.anyDay ? ', this week' : ', today'}.</span></div>` : '<div style="height:10px;"></div>'}
    <div class="status-line">${toneIcon(tone)}<span><b>${readiness.status.charAt(0) + readiness.status.slice(1).toLowerCase()}.</b> ${readiness.msg}</span></div>
    ${adj && adj.action !== 'ON TRACK' && adj.gap !== readiness.behind ? `<div class="status-line">${toneIcon(adj.gap <= -1 ? 'good' : 'warn')}<span><b>${adj.action.charAt(0) + adj.action.slice(1).toLowerCase()}.</b> ${adj.msg}</span></div>` : ''}
    ${!v.need && !v.easyIsEasy ? `<div class="status-line">${toneIcon('warn')}<span><b>Easy is not easy yet.</b> Steady runs are averaging ${v.avgHR} bpm, over your cap of ${v.cap}. <button class="link-btn" style="padding:0; min-height:0;" onclick="openRunSheet('settings')">Heart rate</button></span></div>` : ''}
    ${st ? `<div class="status-line">${toneIcon('warn')}<span><b>Easy runs may be costing you.</b> You have done ${st.easyDone} of ${st.easyTotal} easy runs but only ${st.qualityDone} of ${st.qualityTotal} quality sessions. That is the pattern you get when the easy runs are hard enough to turn up tired to the ones that matter. Run every easy day under ${easyCapHR()} bpm for a fortnight, even if that means 6:30, and see what the quality runs do.</span></div>` : ''}
    ${readiness.behind > 0 || runAdjust ? `<button class="bk-btn" style="margin:4px 0 12px;" onclick="openRecal()">${runAdjust ? 'Re-adjust the plan' : 'Behind? Get back on track'}</button>` : ''}

    <div class="btn-3" style="margin-top:6px;">
      <button onclick="openRunSheet('checkpoints')">Checkpoints</button>
      <button onclick="openRunSheet('after')">After weights</button>
      <button onclick="openRunSheet('settings')">Settings</button>
    </div>
    ${renderRecalModal()}${renderRunSheet(ctx)}
  `;
}

function renderRunning() {
  const w = getProgramWeek();
  const n = RUN_PROGRAM.length;
  const readiness = getReadinessStatus();
  const gp = runAdjust && runAdjust.goalPace ? runAdjust.goalPace : GOAL_PACE;
  const gd = runAdjust && runAdjust.goalDist ? runAdjust.goalDist : GOAL_DIST;
  const adjusted = runAdjust && (runAdjust.goalPace || runAdjust.goalDist);
  const rd = runAdjust && runAdjust.targetDate ? new Date(runAdjust.targetDate) : RACE_DATE;
  const dtr = Math.ceil((rd - new Date()) / 86400000);
  const nm = String(ACTIVE_STAGE.name);
  const big = adjusted ? gd + ' km at ' + fmtPace(gp) : (nm.indexOf(', ') > 0 ? nm.split(', ')[1].replace(/^./, c => c.toUpperCase()) : nm);
  const status = w === 0 ? 'starts ' + programStartLabel()
    : w > n ? 'plan complete'
    : 'Week ' + w + ' of ' + n + ' · ' + readiness.status.toLowerCase() + (runAdjust ? ' · adjusted' : '');
  return mapHead({
      kicker: (ACTIVE_STAGE.short || 'Race') + ' · ' + rd.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + fmtPace(gp) + '/km',
      title: big, big: true, sub: `<b style="color:#10242B;">${status.charAt(0).toUpperCase() + status.slice(1)}</b>`,
      right: `<div class="map-side"><div class="n">${dtr > 0 ? dtr : dtr === 0 ? 'Today' : 'Done'}</div><div class="l">${dtr > 0 ? 'day' + (dtr === 1 ? '' : 's') + ' to go' : dtr === 0 ? 'race day' : 'race run'}</div></div>`,
      art: planProfileSVG(w) }) + `
    <div class="sheet">
      <div class="seg" role="tablist">
        <button class="${runningSubTab === 'plan' ? 'active' : ''}" onclick="runningSubTab='plan'; render();">Plan</button>
        <button class="${runningSubTab === 'log' ? 'active' : ''}" onclick="runningSubTab='log'; render();">Log a run</button>
      </div>
      ${runningSubTab === 'plan' ? renderRunPlan() : `<div class="legacy">${renderRunImport()}${renderRunLog()}</div>`}
    </div>`;
}

// ── Import a run from a watch file (GPX or TCX) ──
let importedRun = null;   // { date, note } waiting for the Log button
function renderRunImport() {
  return `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-label">From your watch</div>
      <label class="bk-file" style="margin-bottom:8px;">Fill in from a GPX or TCX file<input type="file" accept=".gpx,.tcx,application/gpx+xml,application/xml,text/xml" onchange="importRunFile(this)"></label>
      <p class="small muted" id="importNote">${importedRun ? importedRun.note : 'Garmin Connect and Strava can both export a run as GPX or TCX. Pick the file and the distance, time, heart rate and date fill in below. Check them, then press Log.'}</p>
    </div>`;
}
function parseRunFile(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('That file could not be read as GPX or TCX.');
  const all = (root, name) => Array.from(root.getElementsByTagName('*')).filter(e => e.localName === name);
  const one = (root, name) => all(root, name)[0];
  const laps = all(doc, 'Lap');
  if (laps.length) {                                   // TCX: the watch's own totals
    let secs = 0, metres = 0, hrSum = 0, hrSecs = 0;
    laps.forEach(l => {
      const kids = Array.from(l.children);
      const t = parseFloat((kids.find(e => e.localName === 'TotalTimeSeconds') || {}).textContent);
      const d = parseFloat((kids.find(e => e.localName === 'DistanceMeters') || {}).textContent);
      const h = kids.find(e => e.localName === 'AverageHeartRateBpm');
      if (t > 0) secs += t;
      if (d > 0) metres += d;
      const hv = h ? parseFloat(h.textContent) : NaN;
      if (hv > 0 && t > 0) { hrSum += hv * t; hrSecs += t; }
    });
    const start = laps[0].getAttribute('StartTime') || (one(doc, 'Id') || {}).textContent;
    return { km: metres / 1000, min: secs / 60, hr: hrSecs ? Math.round(hrSum / hrSecs) : null, date: start ? new Date(start) : null };
  }
  const pts = all(doc, 'trkpt');
  if (pts.length < 2) throw new Error('No run found in that file.');
  const R = 6371000, rad = x => x * Math.PI / 180;
  let metres = 0, secs = 0, hrSum = 0, hrN = 0, prev = null, first = null;
  pts.forEach(p => {
    const lat = parseFloat(p.getAttribute('lat')), lon = parseFloat(p.getAttribute('lon'));
    const tEl = Array.from(p.children).find(e => e.localName === 'time');
    const t = tEl ? new Date(tEl.textContent) : null;
    const hrEl = all(p, 'hr')[0];
    const hv = hrEl ? parseFloat(hrEl.textContent) : NaN;
    if (hv > 30 && hv < 240) { hrSum += hv; hrN++; }
    if (isNaN(lat) || isNaN(lon)) return;
    if (!first && t) first = t;
    if (prev) {
      const a = Math.sin(rad(lat - prev.lat) / 2) ** 2 + Math.cos(rad(prev.lat)) * Math.cos(rad(lat)) * Math.sin(rad(lon - prev.lon) / 2) ** 2;
      const d = 2 * R * Math.asin(Math.sqrt(a));
      const dt = t && prev.t ? (t - prev.t) / 1000 : 0;
      // A gap of more than 30 seconds with almost no movement is a paused watch.
      if (!(dt > 30 && d < 15)) { metres += d; if (dt > 0) secs += dt; }
    }
    prev = { lat, lon, t };
  });
  if (!(metres > 0) || !(secs > 0)) throw new Error('That GPX file has no timed track in it.');
  return { km: metres / 1000, min: secs / 60, hr: hrN ? Math.round(hrSum / hrN) : null, date: first };
}
function importRunFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onerror = () => { const n = document.getElementById('importNote'); if (n) n.textContent = 'That file could not be opened.'; };
  fr.onload = () => {
    let r;
    try { r = parseRunFile(String(fr.result)); }
    catch (e) { const n = document.getElementById('importNote'); if (n) { n.textContent = e.message + ' Type the run in below instead.'; n.style.color = '#B93D0B'; } return; }
    const when = r.date && !isNaN(r.date) ? r.date : new Date();
    importedRun = { date: when.toISOString(),
      note: 'From ' + f.name + ': ' + when.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + r.km.toFixed(2) + ' km in ' + fmtClock(r.min) + (r.hr ? ', average HR ' + r.hr : '') + '. Check the boxes below, add the hard part if there was one, then press Log. It will be saved on that date.' };
    currentRunType = 'regular'; currentIntervals = [];
    render();
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    const whole = Math.floor(r.min + 1e-9), sec = Math.round((r.min - whole) * 60);
    set('runDistance', r.km.toFixed(2));
    set('runTime', sec === 60 ? whole + 1 : whole);
    set('runTimeSec', sec === 60 ? 0 : sec);
    if (r.hr) set('runHR', r.hr);
    try { updatePace(); updateHRHint(); } catch (e) {}
  };
  fr.readAsText(f);
}

function renderRunLog() {
  const today = localDateStr(new Date());
  const todaysRuns = runningLogs.filter(r => localDateStr(r.date) === today);
  const isInterval = currentRunType === 'interval' || currentRunType === 'interval-treadmill';
  const isTreadmill = currentRunType === 'treadmill' || currentRunType === 'interval-treadmill';

  const intervalsHTML = isInterval ? currentIntervals.map((interval, idx) => `
    <div style="background: #FFFFFF; border: 1px solid #C9D6D3; border-radius: 6px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: end;">
      <div>
        <label style="font-size:12px; color: #5B6E74;">Speed (km/h)</label>
        <input type="number" value="${interval.speed}" step="0.5" oninput="updateInterval(${idx}, 'speed', this.value); updateIntervalTotals();" style="width: 100%; padding: 6px; background: #EEF2F1; border: 1px solid #C9D6D3; color: #10242B; border-radius: 4px; font-size: 12px;">
      </div>
      <div>
        <label style="font-size:12px; color: #5B6E74;">Time (min)</label>
        <input type="number" value="${interval.time}" step="1" oninput="updateInterval(${idx}, 'time', this.value); updateIntervalTotals();" style="width: 100%; padding: 6px; background: #EEF2F1; border: 1px solid #C9D6D3; color: #10242B; border-radius: 4px; font-size: 12px;">
      </div>
      <button onclick="deleteInterval(${idx}); render();" style="padding: 6px 10px; background: #FDEBE3; color: #B93D0B; border: 1px solid #B93D0B; border-radius: 4px; font-size:12px; cursor: pointer;">✕</button>
    </div>
  `).join('') : '';

  return `
    <div style="margin-bottom: 16px;">
      <h2 style="font-size: 18px; margin-bottom: 12px;">Running Log</h2>

      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; color: #3E5158;">Type</label>
        <select id="runType" onchange="currentRunType = this.value; currentIntervals = []; render()" style="width: 100%; padding: 8px; background: #F4F7F6; border: 1px solid #C9D6D3; color: #10242B; border-radius: 6px; margin-top: 4px;">

// Minutes from a minutes box and an optional seconds box. Null when empty.
function readMinSec(minId, secId) {
  const m = parseFloat((document.getElementById(minId) || {}).value);
  const sc = parseFloat((document.getElementById(secId) || {}).value);
  const t = (isNaN(m) ? 0 : m) + (isNaN(sc) ? 0 : Math.min(59, Math.max(0, sc)) / 60);
  return t > 0 ? t : null;
}

function updatePace() {
  const isTreadmill = currentRunType === 'treadmill' || currentRunType === 'interval-treadmill';
  const input1 = parseFloat(document.getElementById('runDistance').value);
  const time = readMinSec('runTime', 'runTimeSec');
  
  const paceMinKmEl = document.getElementById('paceMinPerKm');
  const paceKmPerHEl = document.getElementById('paceKmPerH');
  
  if (!input1 || !time || input1 <= 0 || time <= 0) {
    paceMinKmEl.textContent = isTreadmill && treadmillMode === 'distance' ? '--:--' : isTreadmill ? '--' : '--:--';
    paceKmPerHEl.textContent = '--';
    return;
  }
  
  if (isTreadmill && treadmillMode === 'speed') {
    // For treadmill speed mode: input1 is speed (km/h), calculate distance
    const speed = input1;
    const distance = (speed * time) / 60;
    paceMinKmEl.textContent = distance.toFixed(2);
    paceKmPerHEl.textContent = speed.toFixed(1);
  } else {
    // For regular/distance mode: input1 is distance, calculate pace
    const distance = input1;
    const paceMinKm = (time / distance);
    const paceMin = Math.floor(Math.round(paceMinKm * 60) / 60);
    const paceSec = Math.round(paceMinKm * 60) % 60;
    const paceStr = `${paceMin}:${paceSec.toString().padStart(2, '0')}`;
    const speed = (distance / time * 60).toFixed(1);
    
    paceMinKmEl.textContent = paceStr;
    paceKmPerHEl.textContent = speed;
  }
}

async function logRun() {
  const type = currentRunType;
  const isTreadmill = type === 'treadmill' || type === 'interval-treadmill';
  const input1 = parseFloat(document.getElementById('runDistance').value);
  const time = readMinSec('runTime', 'runTimeSec');
  const notes = document.getElementById('runNotes').value;
  const hrEl = document.getElementById('runHR');
  const hr = hrEl && hrEl.value ? parseInt(hrEl.value, 10) : null;
  
  if (!input1 || !time || input1 <= 0 || time <= 0) {
    alert('Please enter valid values');
    return;
  }
  
  let distance;
  if (isTreadmill && treadmillMode === 'speed') {
    // input1 is speed (km/h)
    distance = (input1 * time) / 60;
  } else {
    // input1 is distance (km)
    distance = input1;
  }
  
  const pace = time / distance;
  const run = {
    date: importedRun ? importedRun.date : new Date().toISOString(),
    type,
    distance: parseFloat(distance.toFixed(2)),
    time,
    pace,
    notes
  };
  if (hr >= 60 && hr <= 230) run.hr = hr;
  const segD = parseFloat((document.getElementById('runSegDist') || {}).value);
  const segT = readMinSec('runSegMin', 'runSegSec');
  if (segD > 0 && segT > 0 && segD <= run.distance + 0.05) run.seg = { distance: +segD.toFixed(2), time: segT };
  
  checkBenchmarkHit(run); // must run BEFORE push, see function comment
  runningLogs.push(run);
  
  await save();
  if (importedRun) {
    runningLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
    importedRun = null;
    await save();
  }
  await checkStageAdvance();
  for (const id of ['runDistance', 'runTime', 'runTimeSec', 'runNotes', 'runSegDist', 'runSegMin', 'runSegSec']) {
    const el = document.getElementById(id); if (el) el.value = '';
  }
  if (hrEl) hrEl.value = '';
  render();
}

function updateHRHint() {
  const el = document.getElementById('hrHint');
  const v = parseInt((document.getElementById('runHR') || {}).value, 10);
  if (!el) return;
  if (!(v >= 60 && v <= 230)) {
    el.style.color = '#5B6E74';
    el.textContent = 'Logging this settles what "easy" actually means for you, instead of guessing from pace tables.';
    return;
  }
  const z = hrZone(v), pct = Math.round(hrPct(v) * 100);
  el.style.color = z.z <= 2 ? '#1B7F5A' : z.z === 3 ? '#7A5200' : '#B93D0B';
  el.textContent = v + ' bpm is ' + pct + '% of '
    + (restHR ? 'your reserve (' + restHR + '\u2013' + estMaxHR() + ')' : 'an estimated max of ' + estMaxHR())
    + ' \u2014 zone ' + z.z + ', ' + z.name + '.'
    + (z.z <= 2 ? ' Genuinely easy.'
      : z.z === 3 ? ' Steady, not easy. Fine for a long run, too hard for a recovery one.'
      : ' That is a workout, whatever it felt like.');
}

function deleteRun(idx) {
  const today = localDateStr(new Date());
  const todaysRuns = runningLogs.filter(r => localDateStr(r.date) === today);
  const run = todaysRuns[idx];
  runningLogs = runningLogs.filter(r => r !== run);
  save();
  render();
}

function addInterval() {
  currentIntervals.push({ speed: 10, time: 5 });
  render();
}

function deleteInterval(idx) {
  currentIntervals.splice(idx, 1);
  render();
}

function updateInterval(idx, field, value) {
  if (field === 'speed') {
    currentIntervals[idx].speed = parseFloat(value) || 0;
  } else if (field === 'time') {
    currentIntervals[idx].time = parseInt(value) || 0;
  }
  updateIntervalTotals();
}

function updateIntervalTotals() {
  let totalDist = 0, totalTime = 0;
  for (const interval of currentIntervals) {
    totalDist += (interval.speed * interval.time) / 60;
    totalTime += interval.time;
  }
  const distEl = document.getElementById('totalDistance');
  const timeEl = document.getElementById('totalTime');
  if (distEl) distEl.textContent = totalDist.toFixed(2);
  if (timeEl) timeEl.textContent = totalTime;
}

async function logIntervalRun() {
  if (currentIntervals.length === 0) {
    alert('Add at least one interval');
    return;
  }
  
  let totalDist = 0, totalTime = 0;
  for (const interval of currentIntervals) {
    totalDist += (interval.speed * interval.time) / 60;
    totalTime += interval.time;
  }
  
  const type = currentRunType;
  const notes = document.getElementById('runNotes').value;
  const pace = totalTime / totalDist;
  
  const run = {
    date: new Date().toISOString(),
    type,
    distance: parseFloat(totalDist.toFixed(2)),
    time: totalTime,
    pace,
    notes,
    intervals: JSON.parse(JSON.stringify(currentIntervals))
  };
  
  checkBenchmarkHit(run); // must run BEFORE push, see function comment
  runningLogs.push(run);
  
  await save();
  currentIntervals = [];
  document.getElementById('runNotes').value = '';
  render();
}


function getDeloadSuggestion() {
  // Detect if 3+ lifts are stalled — requires at least 3 separate SESSIONS with no meaningful e1RM progress
  if (inRebuild()) return null;   // climbing back is not stalling
  const stalledExercises = [];
  // Twenty exercise ids appear on more than one day. Grouping by id alone made
  // three different scheduled days for one lift look like three stalled lifts.
  const byExDay = {};
  for (const [exId, logList] of Object.entries(logs)) {
    for (const l of logList) {
      const k = exId + '\u0000' + (l.day || '');
      (byExDay[k] = byExDay[k] || []).push(l);
    }
  }
  for (const [key, logList] of Object.entries(byExDay)) {
    const exId = key.split('\u0000')[0];
    const sessions = groupByDate(sinceRestart(logList));
    if (sessions.length < 3) continue; // need at least 3 sessions to call it a stall
    const [s1, s2, s3] = sessions; // most recent first
    const e1 = avgE1RM(s1.sets);
    const e2 = avgE1RM(s2.sets);
    const e3 = avgE1RM(s3.sets);
    const range = Math.max(e1, e2, e3) - Math.min(e1, e2, e3);
    if (range / e1 < 0.02 && !stalledExercises.includes(exId)) stalledExercises.push(exId); // <2% variation across 3 sessions = stall
  }
  return stalledExercises.length >= 3 ? stalledExercises : null;
}

// The two-stage ladder is gone — the plan now runs straight at 12km @ 4:30, so
// there is no second stage to unlock. Kept as a no-op because logRun() calls it,
// and because the goal is still worth celebrating the moment it is actually run.
async function checkStageAdvance() {
  if (goalHit) return false;
  const done = runningLogs.some(r => runEfforts(r).some(ef => ef.distance >= GOAL_DIST - 0.05
    && (ef.time / ef.distance) <= GOAL_PACE + 0.005));
  if (!done) return false;
  goalHit = true;
  benchmarkCelebration = { benchmark: ACTIVE_STAGE.name.toUpperCase() + '. DONE.', show: true };
  await saveStage();
  return true;
}
// The next time trial or race in the plan, with its date.
function nextCheckpoint() {
  const cw = getPlanWeek(), today = localDateStr(new Date());
  for (const w of RUN_PROGRAM) {
    if (w.week < cw) continue;
    for (let i = 0; i < w.sessions.length; i++) {
      const s = w.sessions[i];
      if (!s.benchmark || !s.benchmark.strict) continue;
      let d, anyDay = false;
      if (s.type === 'race') d = new Date(RACE_DATE);
      else {
        const slot = runSlots[i] || runSlots[2];
        anyDay = !(slot.d >= 0);
        d = new Date(PROGRAM_START.getFullYear(), PROGRAM_START.getMonth(), PROGRAM_START.getDate() + (w.week - 1) * 7 + (anyDay ? 0 : (slot.d + 6) % 7));
      }
      const ds = localDateStr(d);
      const until = localDateStr(new Date(d.getFullYear(), d.getMonth(), d.getDate() + (anyDay ? 7 : 1)));
      if (until <= today) continue;
      if (getReadiness().benchmarks.some(b => b.name === s.benchmark.name && b.hit)) continue;
      const days = Math.max(0, Math.round((new Date(ds + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000));
      const lbl = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      return { name: s.benchmark.name, week: w.week, days, anyDay,
               when: anyDay ? 'week ' + w.week + ', from ' + lbl : lbl };
    }
  }
  return null;
}
async function saveRunDays() {
  const v = JSON.stringify({ runSlots, anyDay: 1, workHours, bodyKg, gymArrival, gymBusy, wakeTimes, sleepTarget, liftMinutes, maxHR, restHR, age });
  try { await window.storage.set('run-days', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-run-days', v); } catch(e) {}
}
async function setRunDay(idx, day) {
  runSlots[idx].d = parseInt(day, 10);
  await saveRunDays();
  render();
}
async function setRunTime(idx, hhmmStr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmmStr || '');
  if (!m) return;
  runSlots[idx].t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  await saveRunDays();
  render();
}
/* Anything before 9am is fiction. Flag it rather than letting the plan quietly
   depend on a start he has told me will never happen. */
function tooEarly(slot) { return slot.t < EARLIEST; }
async function setWorkDay(dow, startStr, endStr) {
  const pm = x => { const m = /^(\d{1,2}):(\d{2})$/.exec(x || ''); return m ? +m[1] * 60 + +m[2] : null; };
  const a = pm(startStr), b = pm(endStr);
  workHours[dow] = (a === null || b === null || b <= a) ? null : [a, b];
  await saveRunDays();
  render();
}
/* Does this run land inside a work shift? */
function clashesWithWork(slot) {
  const w = workHours[slot.d];
  if (!w) return false;
  return slot.t >= w[0] - 45 && slot.t < w[1];   // 45min lead-in to get there and changed
}
function toggleWorkEditor() { workEditorOpen = !workEditorOpen; render(); }

async function setGymTime(which, v) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); if (!m) return;
  const mins = +m[1] * 60 + +m[2];
  if (which === 'arrive') gymArrival = mins;
  else if (which === 'busyFrom') gymBusy = [mins, Math.max(mins + 30, gymBusy[1])];
  else if (which === 'busyTo') gymBusy = [Math.min(gymBusy[0], mins - 30), mins];
  await saveRunDays(); render();
}
async function setWake(dow, v) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); if (!m) return;
  wakeTimes[dow] = +m[1] * 60 + +m[2];
  await saveRunDays(); render();
}
async function setHR(which, v) {
  const n = parseInt(v, 10);
  if (which === 'max') maxHR = (n >= 120 && n <= 230) ? n : null;
  else if (which === 'rest') restHR = (n >= 30 && n <= 120) ? n : null;
  else if (which === 'age') { if (n >= 12 && n <= 90) age = n; }
  await saveRunDays(); render();
}
async function setLiftMinutes(v) {

}

/* A run after weights is not the problem. Arriving at 8:30 is. This is the
   arithmetic that says so: when you would actually finish, and by how much you
   would miss your own bed. Evidence is clear that exercise finishing inside 4
   hours of sleep costs you sleep, and at high intensity past bedtime it is
   about 40 fewer minutes a night. */
function postGymMath(sessionMinutes, dow) {
  const d = typeof dow === 'number' ? dow : new Date().getDay();
  const ll = liftLength();
  const liftDone = gymArrival + ll.mins;
  const finish = liftDone + 15 + sessionMinutes;   // 15 to change and get on the treadmill
  const sleepWith = sleepAfter(finish, d);         // if he does the run
  const sleepWithout = sleepAfter(liftDone, d);    // if he just lifts and goes home
  const cost = sleepWithout.mins - sleepWith.mins; // what the run actually costs him
  const arrivesInRush = gymArrival >= gymBusy[0] && gymArrival < gymBusy[1];
  return { finish, liftDone, sleepWith, sleepWithout, cost, arrivesInRush,
           lift: ll, ok: sleepWith.ok };
}

/* Running BEFORE weights is only a problem when they are stacked together.
   Endurance work leaves AMPK elevated for about three hours, which is why the
   guidance is to separate the two by more than that; low-intensity endurance
   before strength is specifically fine. His oval run at 4:30 and a gym at 8:30
   is four hours apart, so it costs the weights nothing. */
function preLiftGap(runIdx) {
  const slot = runSlots[runIdx];
  if (!slot || liftOnDay(slot.d) === null) return null;
  const wk = RUN_PROGRAM.find(x => x.week === getPlanWeek());
  const ss = wk && wk.sessions[runIdx];
  if (!ss) return null;
  const mins = Math.round(ss.dist * (ss.avgPace || ss.pace || ss.repPace || 6));
  const runEnds = slot.t + mins;
  const gap = gymArrival - runEnds;
  const easy = ss.type === 'easy' || ss.type === 'long';
  return { gap, mins, runEnds, easy, safe: gap >= AMPK_GAP, marginal: gap >= 60 && gap < AMPK_GAP };
}

function getPredictedRaceTime() {
  // A 12km prediction is only meaningful if based on longer runs (6km+).
  // A fast 5km tells you top-end pace, not endurance — these are different things.
  // Riegel formula: T2 = T1 × (D2/D1)^1.06
  // The closer the basis run is to 12km, the more reliable the prediction.
  // Use the BEST effort normalised to race distance, not merely the longest run.
  // A sharp 4km says more about your engine than a plodded 8km.
  const recentRuns = runningLogs.filter(r => {
    if (!r.distance || !r.time) return false;
    const daysAgo = (Date.now() - new Date(r.date)) / (1000 * 60 * 60 * 24);
    const pace = r.time / r.distance;
    return daysAgo <= 42 && r.distance >= 2 && pace < 9.0 && pace > 2.5;
  });
  
  if (recentRuns.length < 1) return null;
  
  const efforts = recentRuns.flatMap(runEfforts).filter(ef => ef.distance >= 2);
  let basisRun = efforts[0], bestEq = Infinity;
  for (const r of efforts) {
    const eq = r.time * Math.pow(GOAL_DIST / r.distance, 1.06);
    if (eq < bestEq) { bestEq = eq; basisRun = r; }
  }
  
  const t1 = basisRun.time;
  const d1 = basisRun.distance;
  const predicted = t1 * Math.pow(GOAL_DIST / d1, 1.06);
  const tenK = t1 * Math.pow(10 / d1, 1.06);
  return { 
    time: predicted, tenK,
    display: fmtClock(predicted),
    basedOn: `${+d1.toFixed(2)}km ${basisRun.seg ? 'effort' : 'run'}`,
    runsUsed: recentRuns.length
  };
}

function getWeeklySummary() {
  const now = new Date();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
  // Compare local date STRINGS — avoids UTC-vs-local midnight mismatch across timezones
  const weekStartStr = localDateStr(weekStart);
  const weekEndStr = localDateStr(weekEnd);
  
  const inThisWeek = (dateStr) => {
    const s = localDateStr(dateStr);
    return s >= weekStartStr && s < weekEndStr;
  };
  
  const currentDays = currentWeek === 'A' ? WEEK_A : WEEK_B;
  // Count SESSIONS, not distinct days. Repeating push-2 on Monday and Friday is two
  // sessions — keying only by dayKey collapsed them into one and undercounted the week.
  // Each entry is "dayKey|YYYY-MM-DD", so the same split on two dates counts twice.
  const doneThisWeek = new Set();

  // 1. Days explicitly marked complete this week
  for (const dayKey of currentDays) {
    if (lastCompleted[dayKey] && inThisWeek(lastCompleted[dayKey])) {
      doneThisWeek.add(dayKey + '|' + localDateStr(lastCompleted[dayKey]));
    }
  }

  // 2. Tagged log entries — one session per (day, date) pair
  for (const dayKey of currentDays) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day !== dayKey || !inThisWeek(l.date)) continue;
        doneThisWeek.add(dayKey + '|' + localDateStr(l.date));
      }
    }
  }

  // 3. Untagged logs: for each date, attribute it to the best-matching split day
  const untaggedByDate = {};
  for (const dayKey of currentDays) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day || !inThisWeek(l.date)) continue;
        const dk = localDateStr(l.date);
        if (!untaggedByDate[dk]) untaggedByDate[dk] = {};
        untaggedByDate[dk][dayKey] = (untaggedByDate[dk][dayKey] || 0) + 1;
      }
    }
  }
  for (const [dateStr, dayCounts] of Object.entries(untaggedByDate)) {
    const best = Object.entries(dayCounts).sort((a, b) => b[1] - a[1])[0];
    if (best) doneThisWeek.add(best[0] + '|' + dateStr);
  }

  const thisWeekRuns = runningLogs.filter(r => inThisWeek(r.date));
  const totalRunDist = thisWeekRuns.reduce((sum, r) => sum + r.distance, 0);
  
  return { completedDays: doneThisWeek.size, runsCompleted: thisWeekRuns.length, totalRunDist };
}

function getStreak() {
  // Count consecutive weeks with 3+ training sessions (lifts + runs combined)
  // The current (in-progress) week doesn't break the streak even if incomplete
  const SESSION_THRESHOLD = 3;
  
  // Build a count of sessions per week (keyed by week-start timestamp)
  const sessionsByWeek = {};
  const tally = (dateStr) => {
    const d = new Date(dateStr);
    const ws = new Date(d);
    ws.setHours(0,0,0,0);
    ws.setDate(d.getDate() - daysSinceMonday(d)); // Monday start
    const key = ws.getTime();
    sessionsByWeek[key] = (sessionsByWeek[key] || 0) + 1;
  };
  // Count one lift session per distinct (split day, date) pair. Using lastCompleted
  // alone undercounts: it only stores the MOST RECENT completion per day key, so
  // repeating a split twice in a week registered once.
  const liftSessions = new Set();
  Object.entries(lastCompleted).forEach(([dk, d]) => { if (d) liftSessions.add(dk + '|' + localDateStr(d)); });
  for (const dayKey of Object.keys(SPLIT)) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day === dayKey) liftSessions.add(dayKey + '|' + localDateStr(l.date));
      }
    }
  }
  liftSessions.forEach(k => tally(k.split('|')[1]));
  runningLogs.forEach(r => tally(r.date));
  
  // Current week start
  const now = new Date();
  const curWeekStart = new Date(now);
  curWeekStart.setHours(0,0,0,0);
  curWeekStart.setDate(now.getDate() - daysSinceMonday(now));
  let cur = new Date(curWeekStart);
  
  let streak = 0;
  let isCurrentWeek = true;
  let guard = 0;
  while (true) {
    const count = sessionsByWeek[cur.getTime()] || 0;
    if (count >= SESSION_THRESHOLD) {
      streak++;
    } else if (isCurrentWeek) {
      // Current week in progress — don't count it, but don't break streak
    } else {
      break; // a past week missed the threshold → streak ends
    }
    isCurrentWeek = false;
    // Step back a calendar week. Subtracting 168 hours lands an hour off across a
    // daylight-saving change, the key misses, and a long streak silently resets.
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - 7);
    if (++guard > 260) break; // 5 years back, max
  }
  
  return streak;
}

// ── Backup safety ─────────────────────────────────────────────────────────────
function validateBackup(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'It is not a backup file.';
  const known = ['logs','runningLogs','currentWeek','SPLIT','lastCompleted','earlyFinishes','timestamp'];
  if (!known.some(k => k in d)) return 'It has none of the fields a backup should have.';
  if ('logs' in d && (typeof d.logs !== 'object' || d.logs === null || Array.isArray(d.logs)))
    return 'The lift logs in it are the wrong shape.';
  if ('runningLogs' in d && !Array.isArray(d.runningLogs))
    return 'The run logs in it are the wrong shape.';
  if ('currentWeek' in d && d.currentWeek !== 'A' && d.currentWeek !== 'B')
    return 'The week in it is neither A nor B.';
  if ('logs' in d) {
    for (const k of Object.keys(d.logs)) if (!Array.isArray(d.logs[k]))
      return 'The sets logged for "' + k + '" are the wrong shape.';
  }
  return null;
}
function cleanLogs(raw) {
  const out = {};
  for (const [exId, list] of Object.entries(raw)) {
    const keep = (list || []).filter(l => l && typeof l.date === 'string' && !isNaN(new Date(l.date))
      && typeof l.reps === 'number' && l.reps > 0
      && (typeof l.weight === 'number' && isFinite(l.weight) && l.weight >= 0));
    if (keep.length) out[exId] = keep;
  }
  return out;
}
function cleanRuns(raw) {
  return raw.filter(r => r && typeof r.date === 'string' && !isNaN(new Date(r.date))
    && typeof r.distance === 'number' && isFinite(r.distance) && r.distance > 0);
}
function summariseBackup(d) {
  const sets = Object.values(d.logs || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
  const lifts = Object.keys(d.logs || {}).length;
  const runs = Array.isArray(d.runningLogs) ? d.runningLogs.length : 0;
  return sets + ' sets across ' + lifts + ' lifts · ' + runs + ' runs';
}
// ===== Backup & restore =====
// Restoring runs in its own sheet and never uses alert(), confirm() or a file
// picker opened from code. All three fail silently on iPhone: a picker opened
// after a dialog is refused because it no longer counts as your tap, and some
// viewers block dialogs outright, so confirm() just answers "Cancel" without
// ever showing. The "Choose backup file" button IS the file input, so your own
// tap opens it, and every question is asked with buttons in the sheet.

// Everything worth carrying between copies of the app, in one place, so the
// export, the restore point and the restore can never drift apart again.
function backupSnapshot() {
  return {
    app: 'iron-and-road', version: 2,
    timestamp: new Date().toISOString(),
    currentWeek, weekAnchor,
    SPLIT,                          // older copies read exercise order from this
    logs, lastCompleted, earlyFinishes, runningLogs,
    restOverrides,
    runAdjust: runAdjust || null,
    schedule: { runSlots, anyDay: true, workHours, wakeTimes, gymArrival, gymBusy,
                sleepTarget, liftMinutes, bodyKg, goalHit, maxHR, restHR, age },
  };
}

async function saveRestorePoint() {
  const snap = backupSnapshot();
  delete snap.SPLIT;
  snap.at = Date.now();
  const v = JSON.stringify(snap);
  try { await window.storage.set('restore-point', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-restore-point', v); } catch(e) {}
}
async function readRestorePoint() {
  let raw = null;
  try { const r = await window.storage.get('restore-point'); if (r && r.value) raw = r.value; } catch(e) {}
  if (!raw) { try { raw = localStorage.getItem('gym-tracker-restore-point'); } catch(e) {} }
  if (!raw) return null;
  try { const p = JSON.parse(raw); return validateBackup(p) ? null : p; } catch (e) { return null; }
}

// ── Merging ──
// Two copies of the app can each hold sets the other does not, e.g. a session
// logged in a fresh copy before the old backup came across. Merge keeps both.
const bkSetKey = l => l.date + '|' + l.weight + '|' + l.reps + '|' + (l.tag || '');
const bkRunKey = r => r.date + '|' + r.distance;
function unionLogs(a, b) {
  const out = {};
  for (const src of [a || {}, b || {}]) {
    for (const [exId, list] of Object.entries(src)) {
      if (!Array.isArray(list)) continue;
      const bucket = out[exId] || (out[exId] = { keys: new Set(), items: [] });
      for (const l of list) {
        if (!l || !l.date) continue;
        const k = bkSetKey(l);
        if (bucket.keys.has(k)) continue;
        bucket.keys.add(k); bucket.items.push(l);
      }
    }
  }
  const res = {};
  for (const [exId, bucket] of Object.entries(out))
    if (bucket.items.length) res[exId] = bucket.items.sort((x, y) => new Date(x.date) - new Date(y.date));
  return res;
}
function unionRuns(a, b) {
  const seen = new Set(), out = [];
  for (const r of (a || []).concat(b || [])) {
    if (!r || !r.date) continue;
    const k = bkRunKey(r);
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((x, y) => new Date(x.date) - new Date(y.date));
}
function unionCompleted(a, b) {
  const out = Object.assign({}, a || {});
  for (const [k, v] of Object.entries(b || {}))
    if (!out[k] || new Date(v) > new Date(out[k])) out[k] = v;
  return out;
}
// What the app holds right now that a backup does not.
function backupDiff(d) {
  const inLogs = cleanLogs(d.logs && typeof d.logs === 'object' && !Array.isArray(d.logs) ? d.logs : {});
  const have = new Set();
  for (const [ex, list] of Object.entries(inLogs)) for (const l of list) have.add(ex + '#' + bkSetKey(l));
  let sets = 0, runs = 0, newest = null;
  for (const [ex, list] of Object.entries(logs || {})) for (const l of (list || [])) {
    if (!l || !l.date || have.has(ex + '#' + bkSetKey(l))) continue;
    sets++; if (!newest || new Date(l.date) > new Date(newest)) newest = l.date;
  }
  const haveRuns = new Set(cleanRuns(Array.isArray(d.runningLogs) ? d.runningLogs : []).map(bkRunKey));
  for (const r of (runningLogs || [])) {
    if (!r || !r.date || haveRuns.has(bkRunKey(r))) continue;
    runs++; if (!newest || new Date(r.date) > new Date(newest)) newest = r.date;
  }
  return { sets, runs, newest };
}

// ── Building the restored state ──
// Everything is worked out first and only then swapped in, so a bad backup
// changes nothing. A field the backup does not carry is left as it is.
function buildRestore(d, mode) {
  const n = {};
  const inLogs = cleanLogs(d.logs && typeof d.logs === 'object' && !Array.isArray(d.logs) ? d.logs : {});
  const inRuns = Array.isArray(d.runningLogs) ? cleanRuns(d.runningLogs) : [];
  const inDone = (d.lastCompleted && typeof d.lastCompleted === 'object' && !Array.isArray(d.lastCompleted)) ? d.lastCompleted : {};
  const inEarly = Array.isArray(d.earlyFinishes) ? d.earlyFinishes.filter(e => e && e.day && e.date) : [];
  if (mode === 'merge') {
    n.logs = unionLogs(logs, inLogs);
    n.runningLogs = unionRuns(runningLogs, inRuns);
    n.lastCompleted = unionCompleted(lastCompleted, inDone);
    const seen = new Set(); n.earlyFinishes = [];
    for (const e of (earlyFinishes || []).concat(inEarly)) {
      const k = e.day + '|' + e.date;
      if (!seen.has(k)) { seen.add(k); n.earlyFinishes.push(e); }
    }
  } else {
    n.logs = 'logs' in d ? inLogs : logs;
    n.runningLogs = 'runningLogs' in d ? inRuns : runningLogs;
    n.lastCompleted = 'lastCompleted' in d ? inDone : lastCompleted;
    n.earlyFinishes = 'earlyFinishes' in d ? inEarly : earlyFinishes;
  }

  // Week A/B. Restoring the week letter on its own is not enough: a fresh copy
  // anchors "this Monday = Week A" the first time it opens, and on the next
  // reload that anchor overrode the restored week. Restore the anchor instead,
  // or rebuild one from when the backup was taken, and let the calendar roll
  // it forward to today.
  const wa = d.weekAnchor;
  if (wa && /^\d{4}-\d{2}-\d{2}$/.test(wa.monday || '') && (wa.week === 'A' || wa.week === 'B')) {
    n.weekAnchor = { monday: wa.monday, week: wa.week };
  } else if (d.currentWeek === 'A' || d.currentWeek === 'B') {
    const t = d.timestamp && !isNaN(new Date(d.timestamp)) ? new Date(d.timestamp)
            : (typeof d.at === 'number' ? new Date(d.at) : new Date());
    n.weekAnchor = { monday: localDateStr(mondayOf(t)), week: d.currentWeek };
  }

  // Settings he typed in, checked field by field against the same limits the
  // app uses when it loads them.
  const sc = d.schedule && typeof d.schedule === 'object' && !Array.isArray(d.schedule) ? d.schedule : null;
  if (sc) {
    const s = {};
    const okSlot = x => x && Number.isInteger(x.d) && x.d >= -1 && x.d <= 6 && Number.isInteger(x.t) && x.t >= 0 && x.t < 1440;
    if (Array.isArray(sc.runSlots) && sc.runSlots.length === 3 && sc.runSlots.every(okSlot)) {
      s.runSlots = sc.runSlots.map((x, i) => {
        // an older backup pinned every run to a day; restoring it should not
        const o = { d: sc.anyDay ? x.d : -1, t: x.t };
        if (okSlot(x.alt)) o.alt = { d: x.alt.d, t: x.alt.t };
        else if (runSlots[i] && runSlots[i].alt) o.alt = { ...runSlots[i].alt };
        return o;
      });
    }
    if (sc.workHours && typeof sc.workHours === 'object' && !Array.isArray(sc.workHours)) {
      const wh = {};
      for (let dd = 0; dd < 7; dd++) {
        const v = sc.workHours[dd];
        wh[dd] = (Array.isArray(v) && v.length === 2 && v[1] > v[0]) ? v : null;
      }
      s.workHours = wh;
    }
    if (sc.wakeTimes && typeof sc.wakeTimes === 'object' && !Array.isArray(sc.wakeTimes)) {
      const wt = {};
      for (let dd = 0; dd < 7; dd++) {
        const v = sc.wakeTimes[dd];
        wt[dd] = (typeof v === 'number' && v >= 0 && v < 1440) ? v : wakeTimes[dd];
      }
      s.wakeTimes = wt;
    }
    if (typeof sc.gymArrival === 'number' && sc.gymArrival >= 0 && sc.gymArrival < 1440) s.gymArrival = sc.gymArrival;
    if (Array.isArray(sc.gymBusy) && sc.gymBusy.length === 2 && sc.gymBusy[1] > sc.gymBusy[0]) s.gymBusy = sc.gymBusy;
    if (typeof sc.sleepTarget === 'number' && sc.sleepTarget >= 240 && sc.sleepTarget <= 720) s.sleepTarget = sc.sleepTarget;
    if (typeof sc.liftMinutes === 'number' && sc.liftMinutes >= 15 && sc.liftMinutes <= 180) s.liftMinutes = sc.liftMinutes;
    if (typeof sc.bodyKg === 'number' && sc.bodyKg >= 35 && sc.bodyKg <= 250) s.bodyKg = sc.bodyKg;
    if ('goalHit' in sc) s.goalHit = !!sc.goalHit;
    if ('maxHR' in sc) s.maxHR = (typeof sc.maxHR === 'number' && sc.maxHR >= 120 && sc.maxHR <= 230) ? sc.maxHR : null;
    if ('restHR' in sc) s.restHR = (typeof sc.restHR === 'number' && sc.restHR >= 30 && sc.restHR <= 120) ? sc.restHR : null;
    if (typeof sc.age === 'number' && sc.age >= 12 && sc.age <= 90) s.age = sc.age;
    n.schedule = s;
  }
  if (d.restOverrides && typeof d.restOverrides === 'object' && !Array.isArray(d.restOverrides)) {
    const ro = {};
    for (const [k, v] of Object.entries(d.restOverrides)) if (typeof v === 'number' && v >= 15 && v <= 600) ro[k] = v;
    n.restOverrides = ro;
  }
  // A plan adjustment only means something for the plan it was made against.
  if (d.runAdjust && typeof d.runAdjust === 'object' && d.runAdjust.plan === PLAN_ID) n.runAdjust = d.runAdjust;
  // Exercise order is deliberately NOT restored. The programmed order is the
  // program's, and an old backup would quietly undo it.
  return n;
}

async function commitRestore(n) {
  logs = n.logs; runningLogs = n.runningLogs; lastCompleted = n.lastCompleted; earlyFinishes = n.earlyFinishes;
  if (n.weekAnchor) { weekAnchor = n.weekAnchor; const w = autoWeek(); if (w) currentWeek = w; }
  const s = n.schedule;
  if (s) {
    if (s.runSlots) runSlots = s.runSlots;
    if (s.workHours) workHours = s.workHours;
    if (s.wakeTimes) wakeTimes = s.wakeTimes;
    if ('gymArrival' in s) gymArrival = s.gymArrival;
    if (s.gymBusy) gymBusy = s.gymBusy;
    if ('sleepTarget' in s) sleepTarget = s.sleepTarget;
    if ('liftMinutes' in s) liftMinutes = s.liftMinutes;
    if ('bodyKg' in s) bodyKg = s.bodyKg;
    if ('goalHit' in s) goalHit = s.goalHit;
    if ('maxHR' in s) maxHR = s.maxHR;
    if ('restHR' in s) restHR = s.restHR;
    if ('age' in s) age = s.age;
  }
  if (n.restOverrides) restOverrides = n.restOverrides;
  if (n.runAdjust) runAdjust = n.runAdjust;
  await save();
  await saveWeek();
  if (n.weekAnchor) await saveWeekAnchor();
  await saveLastCompleted();
  await saveEarlyFinishes();
  if (s) { await saveRunDays(); if ('goalHit' in s) await saveStage(); }
  if (n.restOverrides) await saveRest();
  if (n.runAdjust) await saveRunAdjust();
}

// ── Reading a file or pasted text ──
function bkParse(text) {
  let t = String(text == null ? '' : text).replace(/^﻿/, '').trim();
  const a = t.indexOf('{'), z = t.lastIndexOf('}');
  if (a === -1 || z < a) return { error: 'There is no backup in that. A backup is a block of text that starts with {.' };
  t = t.slice(a, z + 1);
  let data = null;
  try { data = JSON.parse(t); }
  catch (e) {
    // Text that went through Notes or Messages can come back with curly quotes.
    try { data = JSON.parse(t.replace(/[“”]/g, '"')); }
    catch (e2) { return { error: 'That could not be read as a backup. If you pasted it, check you copied the whole file, from the first { to the last }.' }; }
  }
  const problem = validateBackup(data);
  if (problem) return { error: 'That is not an Iron & Road backup. ' + problem };
  return { data };
}

let bk = { step: 'pick', data: null, name: '', error: '', paste: '', pasteOpen: false, mode: '', rp: null };

async function openBackup(step) {
  bk = { step: step || 'pick', data: null, name: '', error: '', paste: '', pasteOpen: false, mode: '', rp: await readRestorePoint() };
  renderBackup();
  const m = document.getElementById('backupModal');
  if (m) m.classList.add('show');
}
function closeBackup() {
  const m = document.getElementById('backupModal');
  if (m) m.classList.remove('show');
  bk.data = null;
}
function bkGo(step) { bk.step = step; bk.error = ''; renderBackup(); }
// The old entry points, kept so anything still calling them lands in the sheet.
function importData() { return openBackup('pick'); }
function undoImport() { return openBackup('undo'); }

function bkReview(text, name) {
  const r = bkParse(text);
  if (r.error) { bk.step = 'pick'; bk.error = r.error; bk.data = null; }
  else { bk.step = 'review'; bk.error = ''; bk.data = r.data; bk.name = name || ''; }
  renderBackup();
}
async function bkFromFile(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) { bk.step = 'pick'; bk.error = 'That file is far too big to be a backup.'; renderBackup(); return; }
  let text = null;
  try { text = await f.text(); }
  catch (e) {
    try {
      text = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = () => rej(fr.error || new Error('unreadable'));
        fr.readAsText(f);
      });
    } catch (e2) {
      bk.step = 'pick'; bk.error = 'That file could not be opened on this phone. Try pasting it instead, below.';
      renderBackup(); return;
    }
  }
  bkReview(text, f.name);
}
function bkFromPaste() {
  const t = document.getElementById('bkPaste');
  bk.paste = t ? t.value : '';
  bk.pasteOpen = true;
  if (!bk.paste.trim()) { bk.step = 'pick'; bk.error = 'Paste the backup text in first.'; renderBackup(); return; }
  bkReview(bk.paste, 'pasted text');
}

async function bkRestore(mode) {
  if (!bk.data) return;
  let next;
  try { next = buildRestore(bk.data, mode); }
  catch (e) {
    bk.step = 'pick'; bk.error = 'That backup could not be applied, so nothing was changed. (' + ((e && e.message) || e) + ')';
    renderBackup(); return;
  }
  try {
    await saveRestorePoint();
    await commitRestore(next);
  } catch (e) {
    bk.step = 'pick'; bk.rp = await readRestorePoint();
    bk.error = 'Saving stopped part-way (' + ((e && e.message) || e) + '). What you had before is safe: use Undo below.';
    renderBackup(); render(); return;
  }
  bk.step = 'done'; bk.mode = mode; bk.data = null; bk.paste = '';
  bk.rp = await readRestorePoint();
  renderBackup(); render();
}
async function bkUndo() {
  const rp = bk.rp || await readRestorePoint();
  if (!rp) { bk.step = 'pick'; bk.error = 'There is nothing to undo.'; renderBackup(); return; }
  let next;
  try { next = buildRestore(rp, 'replace'); }
  catch (e) { bk.step = 'pick'; bk.error = 'The undo point could not be read, so nothing was changed.'; renderBackup(); return; }
  try {
    await saveRestorePoint();          // what is here now becomes the undo, so this can be swapped back
    await commitRestore(next);
  } catch (e) {
    bk.step = 'pick'; bk.error = 'Saving stopped part-way (' + ((e && e.message) || e) + ').'; renderBackup(); render(); return;
  }
  bk.step = 'done'; bk.mode = 'undo'; bk.rp = await readRestorePoint();
  renderBackup(); render();
}

function bkEsc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function bkWhen(ts) {
  const d = new Date(ts);
  if (!ts || isNaN(d)) return 'at an unknown time';
  const days = Math.round((new Date(localDateStr(new Date()) + 'T12:00:00') - new Date(localDateStr(d) + 'T12:00:00')) / 86400000);
  const time = d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
  if (days === 0) return 'today ' + time;
  if (days === 1) return 'yesterday ' + time;
  const date = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  return days > 0 && days < 7 ? date : date + ', ' + days + ' days ago';
}
function bkCount(d) {
  const sets = Object.values(d.logs || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
  const runs = Array.isArray(d.runningLogs) ? d.runningLogs.length : 0;
  return { sets, runs, lifts: Object.keys(d.logs || {}).length };
}
const bkPlural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

function renderBackup() {
  const body = document.getElementById('bkBody'), title = document.getElementById('bkTitle');
  if (!body) return;
  const err = bk.error ? `<div class="bk-err">${bkEsc(bk.error)}</div>` : '';

  if (bk.step === 'review' && bk.data) {
    if (title) title.textContent = 'Check the backup';
    const d = bk.data, c = bkCount(d), here = bkCount({ logs, runningLogs });
    const sc = d.schedule && typeof d.schedule === 'object' ? d.schedule : {};
    const row = (ok, label) => `<li>${ok ? '<b>✓</b>' : '<span class="bk-no">○</span>'} ${label}</li>`;
    const card = `
      <div class="bk-card">

          ${row(c.sets > 0, 'Lift logs across ' + bkPlural(c.lifts, 'exercise'))}

          ${row(sc.restHR || sc.maxHR, 'Heart rate settings')}
          ${row(d.restOverrides && Object.keys(d.restOverrides).length, 'Rest timer changes')}
        </ul>
      </div>`;
    const diff = backupDiff(d);
    const empty = here.sets === 0 && here.runs === 0;
    let actions;
    if (empty) {
      actions = `<button class="bk-btn primary" onclick="bkRestore('replace')">Restore this backup</button>`;
    } else if (diff.sets || diff.runs) {
      const what = [diff.sets ? bkPlural(diff.sets, 'set') : '', diff.runs ? bkPlural(diff.runs, 'run') : ''].filter(Boolean).join(' and ');
      actions = `
        <p class="bk-warn alert">The app has <b>${what}</b> that ${diff.sets + diff.runs === 1 ? 'is' : 'are'} not in this backup, the newest from ${bkWhen(diff.newest)}. Merge keeps ${diff.sets + diff.runs === 1 ? 'it' : 'them'}. Replace deletes ${diff.sets + diff.runs === 1 ? 'it' : 'them'}.</p>
        <button class="bk-btn primary" onclick="bkRestore('merge')">Merge into the app</button>
        <button class="bk-btn" onclick="bkRestore('replace')">Replace everything</button>`;
    } else {
      actions = `
        <p class="bk-warn">Everything in the app now is already in this backup.</p>
        <button class="bk-btn primary" onclick="bkRestore('replace')">Restore this backup</button>`;
    }
    body.innerHTML = err + card + actions + `
      <p class="bk-fine">What is in the app now is kept, so this can be undone.</p>
      <button class="bk-link" onclick="bkGo('pick')">Choose a different file</button>`;
    return;
  }

  if (bk.step === 'done') {
    if (title) title.textContent = bk.mode === 'undo' ? 'Put back' : 'Restored';
    const here = bkCount({ logs, runningLogs });
    body.innerHTML = `
      <div class="bk-ok">✓ ${bk.mode === 'merge' ? 'Merged' : bk.mode === 'undo' ? 'Put back' : 'Restored'}</div>
      <p class="bk-lead">The app now holds ${bkPlural(here.sets, 'set')} and ${bkPlural(here.runs, 'run')}. It is Week ${currentWeek} on the calendar.</p>
      <button class="bk-btn primary" onclick="closeBackup()">Done</button>
      ${bk.rp ? `<button class="bk-link" onclick="bkGo('undo')">${bk.mode === 'undo' ? 'Swap back' : 'Wrong file? Undo it'}</button>` : ''}`;
    return;
  }

  if (bk.step === 'undo') {
    if (title) title.textContent = 'Undo the last restore';
    if (!bk.rp) {
      body.innerHTML = `<p class="bk-lead">There is nothing to undo yet.</p><button class="bk-btn" onclick="bkGo('pick')">Back</button>`;
      return;
    }
    const c = bkCount(bk.rp);
    body.innerHTML = err + `
      <p class="bk-lead">This puts back what the app held just before the last restore.</p>
      <div class="bk-card"><div class="bk-big">${bkPlural(c.sets, 'set')} · ${bkPlural(c.runs, 'run')}</div>
        <div class="bk-meta">As it was ${bkWhen(bk.rp.at || bk.rp.timestamp)}</div></div>
      <button class="bk-btn primary" onclick="bkUndo()">Put it back</button>
      <p class="bk-fine">What is here now becomes the undo, so you can swap back.</p>
      <button class="bk-link" onclick="bkGo('pick')">Back</button>`;
    return;
  }

  if (title) title.textContent = 'Restore a backup';
  body.innerHTML = err + `
    <p class="bk-lead">Choose the <b>.json</b> file you saved with . You will see what is in it before anything changes.</p>
    <label class="bk-file"><span>Choose backup file</span><input type="file" onchange="bkFromFile(this)" aria-label="Choose backup file"></label>
    <details class="bk-more"${bk.paste || bk.pasteOpen ? ' open' : ''} ontoggle="bk.pasteOpen = this.open">
      <summary>File picker not working? Paste the backup text instead</summary>
      <textarea id="bkPaste" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Open the backup file, copy all of it, and paste it here">${bkEsc(bk.paste || '')}</textarea>
      <button class="bk-btn" onclick="bkFromPaste()">Check this backup</button>

function checkBenchmarkHit(run) {
  // IMPORTANT: must be called BEFORE the run is pushed into runningLogs,
  // so getReadiness() reflects only prior runs and we can detect a NEW hit.
  const efforts = runEfforts(run);
  if (!efforts.length) return false;
  const { benchmarks } = getReadiness();
  for (const b of benchmarks) {
    if (b.hit) continue; // already achieved before this run
    // Same matching rule as getReadiness: distance meets-or-exceeds, pace fast enough
    const tol = b.strict ? 0 : 0.04;
    if (efforts.some(ef => ef.distance >= b.dist - 0.05 && ef.time / ef.distance <= b.pace + tol)) {
      benchmarkCelebration = { benchmark: b.name, show: true };
      setTimeout(() => { benchmarkCelebration.show = false; render(); }, 3000);
      return true;
    }
  }
  return false;
}

async function exportData() {
  const json = JSON.stringify(backupSnapshot(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gym-tracker-backup-' + localDateStr(new Date()) + '.json';
  // Attached to the page and revoked late: iPhone reads the file after the click
  // returns, and revoking straight away handed it an empty download.
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  try { localStorage.setItem('gym-tracker-last-backup', new Date().toISOString()); } catch(e) {}
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
}

function getDailyQuote() {
  const now = new Date();
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];

// ── Lock-in ──────────────────────────────────────────────────────────────────
// Night is where sessions die: tired, delay to 10pm, then it is too late. So the
// home screen says, in numbers, what skipping tonight does to the rest of the week.
const WEEK_LIFTS = 5, WEEK_RUNS = 3;
function skipCost() {
  const now = new Date();
  const dow = daysSinceMonday(now);               // Mon 0 .. Sun 6
  const s = getWeeklySummary();
  const liftsLeft = Math.max(0, WEEK_LIFTS - s.completedDays);
  const runsLeft = Math.max(0, WEEK_RUNS - s.runsCompleted);
  const daysLeft = 6 - dow;                       // lifting days left, today included (Sat is the makeup)
  const act = getActivityByDate()[localDateStr(now)] || {};
  const runs = runsLeft ? ' Plus ' + runsLeft + ' run' + (runsLeft === 1 ? '' : 's') + '.' : '';
  if (dow === 6) {
    return liftsLeft
      ? { tone: 'ok', text: 'Sunday is the rest day. This week finished ' + liftsLeft + ' lift' + (liftsLeft === 1 ? '' : 's') + ' short, and Monday is a clean slate. Nothing carries over.' }
      : { tone: 'good', text: 'Sunday is the rest day. Every lift done this week. Nothing owed.' };
  }
  if (!liftsLeft && !runsLeft) return { tone: 'good', text: 'Week done. Everything from here is a bonus.' };
  if (!liftsLeft) return { tone: 'good', text: 'Lifting is done for the week.' + runs };
  if (act.lift) return { tone: 'good', text: 'Today is in the bank. ' + liftsLeft + ' lift' + (liftsLeft === 1 ? '' : 's') + ' left across ' + (daysLeft - 1) + ' day' + (daysLeft - 1 === 1 ? '' : 's') + '.' + runs };
  if (liftsLeft > daysLeft) return { tone: 'bad', text: 'Already over: ' + liftsLeft + ' lifts left and ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's') + ' to fit them. Get tonight done and keep it to one missed.' };
  const slack = daysLeft - liftsLeft;
  if (slack === 0) return { tone: 'bad', text: 'No slack left. Skip tonight and this week finishes a lift short.' + runs };
  if (slack === 1) return { tone: 'warn', text: 'Skip tonight and the slack is gone: ' + liftsLeft + ' lifts in ' + (daysLeft - 1) + ' days, Saturday included.' + runs };
  return { tone: 'ok', text: 'Skip tonight and it is ' + liftsLeft + ' lifts across ' + (daysLeft - 1) + ' days. Saturday stops being a spare day.' + runs };
}

// The Twelve: twelve weeks from the restart. A week holds at 4 lifts and 2 runs,
// so one bad night does not break it, and a full week is 5 and 3.
const LOCK_START = '2026-11-16', LOCK_WEEKS = 12;
const LOCK_LIFTS = 4, LOCK_RUNS = 2;
function lockBoard() {
  const start = new Date(LOCK_START + 'T00:00:00');
  const act = getActivityByDate();
  const todayStr = localDateStr(new Date());
  const out = [];
  for (let i = 0; i < LOCK_WEEKS; i++) {
    const ws = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i * 7);
    const a = localDateStr(ws), b = localDateStr(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 7));
    let lifts = 0;
    for (const [d, v] of Object.entries(act)) if (v.lift && d >= a && d < b) lifts++;
    const runs = runningLogs.filter(r => { const d = localDateStr(r.date); return d >= a && d < b; }).length;
    const state = todayStr < a ? 'future'
      : todayStr < b ? 'now'
      : (lifts >= WEEK_LIFTS && runs >= WEEK_RUNS) ? 'full'
      : (lifts >= LOCK_LIFTS && runs >= LOCK_RUNS) ? 'held' : 'short';
    out.push({ week: i + 1, lifts, runs, state, held: lifts >= LOCK_LIFTS && runs >= LOCK_RUNS });
  }
  return out;
}

// ── Helpers for the IRON & ROAD home ──

function getTodayRunSession() {
  const w = getPlanWeek();
  const wk = RUN_PROGRAM.find(x => x.week === w);
  if (!wk) return null;
  // After the race, nothing is owed. On race day, the race is today's run.
  if (localDateStr(new Date()) > localDateStr(RACE_DATE)) return null;
  const ri = wk.sessions.findIndex(x => x.type === 'race');
  if (ri >= 0 && localDateStr(new Date()) === localDateStr(RACE_DATE))
    return { session: wk.sessions[ri], done: isSessionDone(wk.sessions[ri], ri, wk.sessions), today: true };
  // A session he pinned to today is today's run. Otherwise it is whichever is next.
  const dow = new Date().getDay();
  let idx = runSlots.findIndex((x, i) => x.d === dow && wk.sessions[i] && i !== ri);
  if (idx >= 0) return { session: wk.sessions[idx], done: isSessionDone(wk.sessions[idx], idx, wk.sessions), today: true };
  idx = wk.sessions.findIndex((x, i) => i !== ri && !isSessionDone(x, i, wk.sessions));
  return idx < 0 ? null : { session: wk.sessions[idx], done: false, today: false };
}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// Which split day, if any, falls on this weekday. Mon-Fri are lifting days.
function liftOnDay(dow) {
  if (dow < 1 || dow > 5) return null;
  const days = currentWeek === 'A' ? WEEK_A : WEEK_B;
  return SPLIT[days[dow - 1]] ? days[dow - 1] : null;
}

/* Ranked so a bad week is not a write-off. If only one run happens, it should
   be the one that drives the adaptation, not the easy filler. */
/* Ranked by what the session IS, not where it sits. Week 1 is two easy runs and
   a long one, and calling the second easy run "1st priority" because it happens
   to sit in the middle is nonsense. */
const SESSION_WEIGHT = { race: 100, confidence: 95, timetrial: 90, racepace: 80,
  long: 79, interval: 78, tempo: 75, primer: 25, easy: 20 };   // a half is built on the long run
const ORDINAL = ['1st', '2nd', '3rd', '4th'];
function sessionRank(i, weekPlan) {
  const plan = weekPlan || (RUN_PROGRAM.find(x => x.week === getPlanWeek()) || {}).sessions;
  if (!plan || !plan[i]) return '\u2014';
  const order = plan.map((s, j) => ({ j, w: SESSION_WEIGHT[s.type] || 30, d: s.dist || 0 }))
    .sort((a, b) => b.w - a.w || b.d - a.d);
  const at = order.findIndex(x => x.j === i);
  return ORDINAL[at] || '\u2014';
}

/* The floor. All-or-nothing is what turns "I do not fancy 9km" into zero km.
   Every session has a smaller version that still counts as showing up, and
   isSessionDone() already credits anything within 80% of the planned distance. */
function sessionFloor(s) {
  if (s.type === 'race' || s.type === 'confidence' || s.type === 'timetrial') return null;
  if (s.type === 'long') return { dist: Math.max(4, Math.round(s.dist * 0.6)),
    text: 'Cut it to ' + Math.max(4, Math.round(s.dist * 0.6)) + 'km, same easy pace. Still counts.' };
  if (s.type === 'interval') return { dist: Math.max(3, Math.round(s.dist * 0.55)),
    text: 'Halve the reps: ' + Math.max(2, Math.floor(s.reps / 2)) + '\u00d7 instead of ' + s.reps + '. Same pace, walk home.' };
  if (s.type === 'tempo' || s.type === 'racepace') return { dist: Math.max(3, Math.round(s.dist * 0.55)),
    text: 'Halve the hard part, keep the warmup and cooldown. Still counts.' };
  return { dist: Math.max(2, Math.round(s.dist * 0.5)),
    text: 'Just ' + Math.max(2, Math.round(s.dist * 0.5)) + 'km easy. Twenty minutes out the door beats a skipped week.' };
}

// Roughly 1 kcal per kg per km, near enough independent of pace.
function sessionKcal(s) { return Math.round(s.dist * bodyKg * 0.95); }

function getActivityByDate() {
  // localDateStr → { lift: bool, run: bool } across all history
  const map = {};
  const mark = (dateStr, kind) => {
    const k = localDateStr(dateStr);
    if (!map[k]) map[k] = { lift: false, run: false };
    map[k][kind] = true;
  };
  for (const entries of Object.values(logs)) for (const l of entries) mark(l.date, 'lift');
  for (const r of runningLogs) mark(r.date, 'run');
  for (const d of Object.values(lastCompleted)) mark(d, 'lift');
  return map;
}

// This week's run sessions exactly as the Run page shows them (rebuilt and scaled).
function weekRunList() {
  const w = getProgramWeek();
  const eff = getEffectiveProgram();
  const wk = w >= 1 && w <= eff.length ? eff[w - 1] : null;
  if (!wk) return { w, wk: null, list: [], sc: null };
  let list = wk.sessions;
  if (runAdjust) { const p = getFitnessProfile(); if (p) list = buildBridgeWeek(p); }
  const sc = scaleSessions(list);
  return { w, wk, list: sc.list, sc };
}
// Which logged run ticked which session, and which runs are left over.
function weekRunMatch(list) {
  const now = new Date();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  const runs = runningLogs.filter(r => new Date(r.date) >= weekStart && typeof r.distance === 'number');
  const a = list.length ? matchRunsToSessions(runs, list, true) : {};
  const used = new Set(Object.values(a));
  return { runs, a, spare: runs.filter((r, i) => !used.has(i)) };
}

const RUN_SHORT = { easy: 'Easy', long: 'Long', interval: 'Reps', tempo: 'Tempo', racepace: 'Pace',
  timetrial: 'Trial', confidence: 'Big run', race: 'Race', primer: 'Primer' };

/* The week as a trail, one stop per day, Monday to Sunday. A day is a circle when
   it is a lifting day and a diamond when it is a run-only day (Saturday, unless a
   lift is owed). A run done on a lifting day rides on that day as a small diamond,
   because he often does both. Runs still to do belong to no day, so they are
   counted in the corner instead of being given a place in the order. */
function weekStops() {
  const now = new Date();
  const ws = mondayOf(now);
  const todayKey = localDateStr(now), todayIdx = daysSinceMonday(now);
  const days = currentWeek === 'A' ? WEEK_A : WEEK_B;
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const activity = getActivityByDate();
  // which session was actually lifted on which date this week
  const liftedOn = {}, doneKeys = new Set();
  days.forEach(k => {
    if (!SPLIT[k]) return;
    sessionDatesFor(k).forEach(d => { liftedOn[d] = liftedOn[d] || k; doneKeys.add(k + '|' + d); });
  });
  const stops = [];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i);
    const key = localDateStr(dt);
    const planned = i < 5 && SPLIT[days[i]] ? days[i] : null;
    const did = liftedOn[key] || null;
    const lifted = !!did || !!(activity[key] && activity[key].lift);
    const runsDone = runningLogs.filter(r => localDateStr(r.date) === key && typeof r.distance === 'number').length;
    stops.push({ i, key, day: DAYS[i], planned, did, lifted, runsDone, runPinned: 0,
      past: key < todayKey, today: key === todayKey, future: key > todayKey });
  }
  // lifts already missed (their day has gone and they were not done any day this week)
  const wkA = stops[0].key, wkB = localDateStr(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 7));
  const doneThisWeek = k => trainedInRange(k, wkA, wkB);
  const owed = days.filter((k, i) => SPLIT[k] && i < Math.min(5, todayIdx) && !doneThisWeek(k));
  const firstOwed = days.find(k => SPLIT[k] && !doneThisWeek(k)) || null;
  // runs: planned this week, done, pinned to a day, and floating
  const wr = weekRunList();
  let total = 0, doneRuns = 0, floating = 0;
  if (wr.wk && todayKey <= localDateStr(RACE_DATE)) {
    const m = weekRunMatch(wr.list);
    total = wr.list.length;
    wr.list.forEach((s, idx) => {
      if (m.a[idx] !== undefined) { doneRuns++; return; }
      const slot = runSlots[idx];
      const di = slot && slot.d >= 0 ? (slot.d + 6) % 7 : -1;
      if (di >= todayIdx) stops[di].runPinned++; else floating++;
    });
  }
  stops.forEach(s => {
    if (s.i < 5) {
      s.shape = 'lift';
      s.label = s.did ? chipDayName(SPLIT[s.did].name) : s.planned ? chipDayName(SPLIT[s.planned].name) : s.lifted ? 'Lift' : 'Rest';
      s.state = s.lifted ? 'done' : s.past ? 'missed' : 'todo';
    } else if (s.i === 5) {
      // Saturday: the run day, unless a lift is owed, in which case it is the makeup.
      const makeup = s.today ? firstOwed : (owed.length ? owed[0] : null);
      if (s.lifted) { s.shape = 'lift'; s.label = s.did ? chipDayName(SPLIT[s.did].name) : 'Lift'; s.state = 'done'; }
      else if (makeup && !s.past) { s.shape = 'lift'; s.label = 'Makeup'; s.state = 'todo'; s.makeup = makeup; }
      else if (s.runsDone) { s.shape = 'run'; s.label = 'Run'; s.state = 'done'; }
      else if (!s.past && total > doneRuns) { s.shape = 'run'; s.label = 'Run'; s.state = 'todo'; }
      else { s.shape = 'rest'; s.label = s.past ? 'Nothing' : 'Free'; s.state = 'rest'; }
    } else {
      if (s.lifted) { s.shape = 'lift'; s.label = s.did ? chipDayName(SPLIT[s.did].name) : 'Lift'; s.state = 'done'; }
      else if (s.runsDone) { s.shape = 'run'; s.label = 'Run'; s.state = 'done'; }
      else { s.shape = 'rest'; s.label = 'Rest'; s.state = 'rest'; }
    }
    // a run on top of a lifting day shows as a badge; on a run-only day it is the stop itself
    s.badge = s.shape === 'run' ? null : s.runsDone ? 'done' : s.runPinned ? 'todo' : null;
  });
  return { stops, todayIdx, total, doneRuns, toFit: Math.max(0, total - doneRuns) };
}

function trailSVG(t) {
  const pts = t.stops.map((s, i) => ({ x: 30 + i * 55, y: 150 - (i / 6) * 70 + (i % 2 ? 12 : -10) }));
  const line = (from, to) => pts.slice(from, to + 1).map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const late = new Date().getHours() >= 15;
  const dia = (x, y, r, attrs) => `<rect x="${(x - r).toFixed(1)}" y="${(y - r).toFixed(1)}" width="${2 * r}" height="${2 * r}" ${attrs} transform="rotate(45 ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  let nodes = '', labels = '';
  t.stops.forEach((s, i) => {
    const p = pts[i], x = p.x.toFixed(1), y = p.y.toFixed(1);
    const done = s.state === 'done';
    if (s.today) {
      nodes += `<circle cx="${x}" cy="${y}" r="17" fill="#FFFFFF"/>`;
      const col = done ? '#10242B' : '#E8501A';
      if (s.shape === 'run') nodes += dia(p.x, p.y, 9, `fill="${col}"`);
      else if (s.shape === 'rest') nodes += `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#E8501A" stroke-width="3"/>`;
      else nodes += `<circle cx="${x}" cy="${y}" r="12" fill="${col}"/>`;
      if (done) nodes += `<polyline points="${(p.x - 5).toFixed(1)},${(p.y + 0.5).toFixed(1)} ${(p.x - 1.4).toFixed(1)},${(p.y + 4).toFixed(1)} ${(p.x + 5).toFixed(1)},${(p.y - 3.6).toFixed(1)}" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
      const word = done ? 'Done today' : s.shape === 'rest' ? 'Today' : late ? 'Tonight' : 'Today';
      const w = word.length * 6.6 + 22;
      const px = Math.min(390 - w - 6, Math.max(6, p.x - w / 2 - 14));
      labels += `<rect x="${px.toFixed(1)}" y="${(p.y - 53).toFixed(1)}" width="${w.toFixed(1)}" height="24" rx="12" fill="#10242B"/><text x="${(px + w / 2).toFixed(1)}" y="${(p.y - 37).toFixed(1)}" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">${word}</text>`;
    } else if (s.shape === 'lift') {
      nodes += done ? `<circle cx="${x}" cy="${y}" r="9" fill="#10242B"/>`
        : s.state === 'missed' ? `<circle cx="${x}" cy="${y}" r="8" fill="#DCE6E4" stroke="#6F8389" stroke-width="2" stroke-dasharray="3 3"/>`
        : `<circle cx="${x}" cy="${y}" r="8" fill="#FFFFFF" stroke="#10242B" stroke-width="2.5"/>`;
    } else if (s.shape === 'run') {
      nodes += done ? dia(p.x, p.y, 8, 'fill="#10242B"') : dia(p.x, p.y, 7, 'fill="#FFFFFF" stroke="#10242B" stroke-width="2.5"');
    } else {
      nodes += `<circle cx="${x}" cy="${y}" r="4" fill="#6F8389"/>`;
    }
    // the run that rode along with a lifting day
    if (s.badge) {
      const o = s.today ? 18 : 13;
      nodes += `<circle cx="${(p.x + o).toFixed(1)}" cy="${(p.y - o).toFixed(1)}" r="9" fill="#DCE6E4"/>`
        + (s.badge === 'done' ? dia(p.x + o, p.y - o, 5, 'fill="#10242B"') : dia(p.x + o, p.y - o, 4.5, 'fill="#FFFFFF" stroke="#10242B" stroke-width="2"'));
    }
    const lx = Math.min(364, Math.max(26, p.x));
    labels += `<text x="${lx.toFixed(1)}" y="${(p.y + 27).toFixed(1)}" font-size="11" font-weight="700" fill="#10242B" text-anchor="middle">${s.day}</text>`
      + `<text x="${lx.toFixed(1)}" y="${(p.y + 40).toFixed(1)}" font-size="11" font-weight="${s.state === 'missed' ? 500 : 600}" fill="#3E5158" text-anchor="middle">${s.state === 'missed' ? 'missed' : s.label}</text>`;
  });
  // runs float: they are counted here, not given a day
  let key = '';
  if (t.total) {
    for (let k = 0; k < t.total; k++) key += dia(30 + k * 17, 16, 5, k < t.doneRuns ? 'fill="#10242B"' : 'fill="#FFFFFF" stroke="#10242B" stroke-width="2"');
    key += `<text x="${30 + t.total * 17 - 2}" y="20" font-size="12" font-weight="600" fill="#3E5158">${t.toFit === 0 ? 'All ' + t.total + ' runs done' : t.toFit + ' run' + (t.toFit === 1 ? '' : 's') + ' to fit in, any day'}</text>`;
  }
  const said = t.stops.map(s => s.day + ' ' + (s.state === 'missed' ? s.label + ' missed' : s.label + (s.state === 'done' ? ' done' : '')) + (s.badge === 'done' ? ' plus a run' : '')).join(', ');
  return `<svg class="map-art" role="img" aria-label="This week day by day: ${said}.${t.total ? ' ' + t.doneRuns + ' of ' + t.total + ' runs done.' : ''}" viewBox="0 0 390 198" font-family="Inter, system-ui, sans-serif">
    ${key}
    ${t.todayIdx > 0 ? `<polyline points="${line(0, t.todayIdx)}" fill="none" stroke="#10242B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${t.todayIdx < 6 ? `<polyline points="${line(t.todayIdx, 6)}" fill="none" stroke="#10242B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/>` : ''}
    ${nodes}${labels}
  </svg>`;
}

// The Twelve, drawn as twelve peaks. Climbed is filled, held is outlined in green.
function renderLockBoard() {
  const b = lockBoard();
  const past = b.filter(x => x.state !== 'future' && x.state !== 'now');
  const held = past.filter(x => x.state === 'full' || x.state === 'held').length;
  const now = b.find(x => x.state === 'now');
  const startLabel = new Date(LOCK_START + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const H = [26, 32, 24, 34, 28, 36, 26, 32, 24, 34, 28, 38];
  const peak = (x, i) => {
    const top = 40 - H[i % 12];
    const st = x.state === 'now' && x.held ? 'held-now' : x.state;
    const paint = st === 'full' ? 'fill="#1B7F5A"'
      : st === 'held' ? 'fill="#E3F1EB" stroke="#1B7F5A" stroke-width="2"'
      : st === 'short' ? 'fill="#FFFFFF" stroke="#9FB2AE" stroke-width="2" stroke-dasharray="3 3"'
      : st === 'now' ? 'fill="#FFFFFF" stroke="#E8501A" stroke-width="2"'
      : st === 'held-now' ? 'fill="#E3F1EB" stroke="#E8501A" stroke-width="2"'
      : 'fill="#EEF2F1"';

    return `<div class="peak ${x.state}"><svg role="img" aria-label="Week ${x.week}, ${word}" viewBox="0 0 28 40" preserveAspectRatio="none"><path d="M1 39 L14 ${top} L27 39 Z" ${paint} stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="v">${x.state === 'future' ? '' : x.lifts + '·' + x.runs}</div></div>`;

      <p class="fine">Twelve weeks from ${startLabel}, lifts·runs under each. A week holds at ${LOCK_LIFTS}·${LOCK_RUNS} and is full at ${WEEK_LIFTS}·${WEEK_RUNS}.${now ? (now.held ? ' This week is already held.' : ' This week needs ' + Math.max(0, LOCK_LIFTS - now.lifts) + ' more lift' + (LOCK_LIFTS - now.lifts === 1 ? '' : 's') + ' and ' + Math.max(0, LOCK_RUNS - now.runs) + ' more run' + (LOCK_RUNS - now.runs === 1 ? '' : 's') + ' to hold.') : ''}</p>
    </div>`;
}

/* The ledger: ten weeks, one column each, Monday at the top. Under each column
   is that week's lifts and runs, so a good or bad week reads at a glance. */
function ledgerWeeks(activity) {
  const now = new Date();
  const start = mondayOf(now);
  const out = [];
  for (let wk = 9; wk >= 0; wk--) {
    const ws = new Date(start.getFullYear(), start.getMonth(), start.getDate() - wk * 7);
    const a = localDateStr(ws), b = localDateStr(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 7));
    const days = [];
    let lifts = 0;
    for (let d = 0; d < 7; d++) {
      const dt = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + d);
      const key = localDateStr(dt);
      const act = activity[key];
      if (act && act.lift) lifts++;
      days.push({ key, future: dt > now, lift: !!(act && act.lift), run: !!(act && act.run) });
    }
    const rr = runningLogs.filter(r => { const d = localDateStr(r.date); return d >= a && d < b; });
    out.push({ ws, days, lifts, runs: rr.length, km: rr.reduce((s, r) => s + (r.distance || 0), 0), current: wk === 0 });
  }
  return out;
}
function renderLedger(activity) {
  const weeks = ledgerWeeks(activity);
  const todayKey = localDateStr(new Date());
  const DL = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let cells = '<span></span>';
  let lastMonth = -1;
  weeks.forEach(w => {
    const m = w.ws.getMonth();
    cells += `<span class="wd">${m !== lastMonth ? w.ws.toLocaleDateString('en-GB', { month: 'short' }) : ''}</span>`;
    lastMonth = m;
  });
  for (let d = 0; d < 7; d++) {
    cells += `<span class="dl">${DL[d]}</span>`;
    weeks.forEach(w => {
      const c = w.days[d];
      const cls = c.future ? 'future' : c.lift && c.run ? 'both' : c.lift ? 'lift' : c.run ? 'run' : '';
      const what = c.future ? 'to come' : c.lift && c.run ? 'lift and run' : c.lift ? 'lift' : c.run ? 'run' : 'nothing logged';
      cells += `<span class="lg ${cls}${c.key === todayKey ? ' today' : ''}" role="img" aria-label="${c.key}: ${what}"></span>`;
    });
  }
  cells += '<span></span>';
  weeks.forEach(w => {
    const held = w.lifts >= LOCK_LIFTS && w.runs >= LOCK_RUNS;
    cells += `<span class="wt${held ? ' held' : ''}">${w.lifts}·${w.runs}</span>`;
  });
  const tl = weeks.reduce((s, w) => s + w.lifts, 0), tr = weeks.reduce((s, w) => s + w.runs, 0), tk = weeks.reduce((s, w) => s + w.km, 0);
  return `
    <div class="block">
      <div class="block-head"><span class="t">The ledger</span><span class="s">last 10 weeks</span></div>
      <div class="ledger2">${cells}</div>
      <div class="ledger-key">
        <span><i style="background:#10242B;"></i>Lift</span>
        <span><i style="background:#E8501A;"></i>Run</span>
        <span><i style="background:linear-gradient(135deg,#10242B 0 50%,#E8501A 50% 100%);"></i>Both</span>
      </div>
      <p class="fine">Under each week: lifts·runs, green when the week held (${LOCK_LIFTS}·${LOCK_RUNS} or better). Ten weeks: ${tl} lift${tl === 1 ? '' : 's'}, ${tr} run${tr === 1 ? '' : 's'}, ${tk.toFixed(0)} km.</p>
    </div>`;
}

/* Sunday: the week in one card. What got done, how it compares with last week,
   and the one run that matters most next week. */
function renderWeekReview(activity) {
  if (new Date().getDay() !== 0) return '';
  const weeks = ledgerWeeks(activity);
  const cur = weeks[9], prev = weeks[8];
  const held = cur.lifts >= LOCK_LIFTS && cur.runs >= LOCK_RUNS;
  const full = cur.lifts >= WEEK_LIFTS && cur.runs >= WEEK_RUNS;
  const dl = cur.lifts - prev.lifts, dr = cur.runs - prev.runs;
  const cmp = (prev.lifts + prev.runs === 0) ? '' : (dl === 0 && dr === 0) ? ' Same as last week.'
    : ` Last week was ${prev.lifts} lift${prev.lifts === 1 ? '' : 's'} and ${prev.runs} run${prev.runs === 1 ? '' : 's'}.`;
  const days = currentWeek === 'A' ? WEEK_A : WEEK_B;
  const a = localDateStr(cur.ws), b = localDateStr(new Date(cur.ws.getFullYear(), cur.ws.getMonth(), cur.ws.getDate() + 7));
  const missed = days.filter(k => SPLIT[k] && !trainedInRange(k, a, b)).map(k => shortDayName(SPLIT[k].name));
  const nw = RUN_PROGRAM.find(x => x.week === getProgramWeek() + 1);
  const key = nw ? nw.sessions.slice().sort((x, y) => (SESSION_WEIGHT[y.type] || 30) - (SESSION_WEIGHT[x.type] || 30))[0] : null;
  return `
    <div class="review">
      <div class="card-label">Week in review</div>
      <div class="big">${cur.lifts} lift${cur.lifts === 1 ? '' : 's'}, ${cur.runs} run${cur.runs === 1 ? '' : 's'}, ${cur.km.toFixed(1)} km</div>
      <p>${full ? '<b>A full week.</b>' : held ? '<b>The week held.</b>' : '<b>The week came up short.</b> Monday is a clean slate.'}${cmp}${missed.length ? ' Not done: ' + missed.join(', ') + '.' : ''}</p>
      <p style="margin-top:6px;">Tomorrow starts Week ${currentWeek === 'A' ? 'B' : 'A'}.${key ? ' The run that matters most next week: <b>' + key.label + ', ' + key.dist + ' km</b>.' : ''}</p>
    </div>`;
}

function renderHome() {
  const summary = getWeeklySummary();
  const deloadSuggestion = getDeloadSuggestion();
  const w = getProgramWeek();
  const daysToRace = getDaysToRace();
  const streak = getStreak();
  const activity = getActivityByDate();

  // Today's lift session (Mon to Fri split, Saturday is the makeup, Sunday is rest)
  const days = currentWeek === 'A' ? WEEK_A : WEEK_B;
  const dayIdx = new Date().getDay();
  const now2 = new Date();
  const wkStart = new Date(now2.getFullYear(), now2.getMonth(), now2.getDate() - daysSinceMonday(now2));
  const wkStartStr = localDateStr(wkStart);
  const wkEndStr = localDateStr(new Date(wkStart.getTime() + 7 * 86400000));
  // Reads the log, not just the button, so a session you forgot to close is not
  // offered back to you on Saturday as if you never did it.
  const doneThisWeek = (dayKey) => trainedInRange(dayKey, wkStartStr, wkEndStr);

  let todayDayKey = null;
  let isMakeup = false;
  if (dayIdx >= 1 && dayIdx <= 5) {
    todayDayKey = days[dayIdx - 1];
  } else if (dayIdx === 6) {
    todayDayKey = days.find(k => !doneThisWeek(k)) || null;
    isMakeup = !!todayDayKey;
  }
  const todayDay = todayDayKey ? SPLIT[todayDayKey] : null;
  const isCompleted = !!todayDayKey && doneThisWeek(todayDayKey);
  const todayRun = getTodayRunSession();

  const progWeek = RUN_PROGRAM.find(x => x.week === w);
  const distTarget = progWeek ? progWeek.sessions.reduce((s, x) => s + (x.dist || 0), 0) : 15;

  const trail = weekStops();
  const late = now2.getHours() >= 15;
  let mins = liftMinutes;
  try { mins = postGymMath(0, dayIdx).lift.mins || liftMinutes; } catch (e) {}

  const runDay = dayIdx === 6 && !todayDay && !!todayRun && !todayRun.done;
  // ── Where you are: today's session ──
  let hero;
  if (todayDay && !isCompleted) {
    hero = `
      <div class="hero">
        <span class="eyebrow hot">${isMakeup ? 'Saturday makeup' : (late ? 'Tonight' : 'Today') + ' \u00b7 ' + now2.toLocaleDateString('en-GB', { weekday: 'long' })}</span>
        <span class="hero-title">${shortDayName(todayDay.name)}</span>
        <span class="hero-meta">${todayDay.exercises.length} lifts · about ${mins} min${todayDay.exercises.some(e => e.warmup) ? ' · ' + todayDay.exercises.filter(e => e.warmup).length + ' with a warm-up ramp' : ''}</span>
      </div>
      <button class="btn wide" onclick="activeTab='track'; selectedDay='${todayDayKey}'; cardOpen={}; render();">Start session ${IC.arrow}</button>`;
  } else if (isCompleted) {
    hero = `
      <div class="hero">
        <span class="stamp">${IC.check} Done today</span>
        <span class="hero-title">${shortDayName(todayDay.name)}</span>
        <span class="hero-meta">${todayRun && todayRun.done ? 'Run done too. A full day.' : 'Week ' + currentWeek + '. Every set is saved.'}</span>
      </div>
      <button class="btn wide ghost" onclick="undoMarkDayComplete('${todayDayKey}'); render();">Undo complete</button>`;
  } else if (runDay) {
    // Saturday with the lifts done is not a rest day for him: it is the run day.
    hero = `
      <div class="hero">
        <span class="eyebrow hot">Saturday · run day</span>
        <span class="hero-title">${todayRun.session.label}</span>
        <span class="hero-meta">${todayRun.session.dist} km · every lift is done this week</span>
      </div>
      <button class="btn wide" onclick="activeTab='running'; runningSubTab='plan'; render();">See the run ${IC.arrow}</button>`;
  } else {
    hero = `
      <div class="hero">
        <span class="eyebrow">${dayIdx === 6 ? 'Saturday · all caught up' : 'Sunday · Week ' + currentWeek}</span>
        <span class="hero-title">Rest day</span>
        <span class="hero-meta">${dayIdx === 6 ? 'Every lift done this week. Recover hard.' : 'Recovery is where the work pays out.'}</span>
      </div>`;
  }
  const runRow = todayRun && !runDay && !(isCompleted && todayRun.done) ? `
      <button class="row-link" onclick="activeTab='running'; runningSubTab='plan'; render();">
        ${IC.dia(todayRun.done ? 'done' : 'todo')}
        <span style="flex:1; min-width:0;"><span class="k">${todayRun.done ? 'Run done' : todayRun.today ? (isCompleted ? 'Still to run today' : 'Run today') : 'Next run, any day'}</span><span class="v">${todayRun.session.label} · ${todayRun.session.dist} km</span></span>
        ${IC.chev}
      </button>` : '';

  const cost = skipCost();
  const sub = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
    + ' · Week ' + currentWeek + (inRebuild() ? ' · Rebuild ' + rebuildWeek() + ' of 3' : '');

  return mapHead({
      title: 'Iron &amp; Road', sub,
      right: `<button class="icon-btn" aria-label="Settings and backup" onclick="openMenu()">${IC.sliders}</button>`,
      art: trailSVG(trail) }) + `
    <div class="sheet">
      ${hero}
      ${runRow}
      <div class="cost ${cost.tone}">${cost.tone === 'good' ? IC.check : cost.tone === 'ok' ? IC.dot : IC.warn}<span>${cost.text}</span></div>
      ${renderRebuildCard()}

      <div class="stats">
        <div class="stat"><div class="n">${summary.completedDays}<small> of 5</small></div><div class="l">lifts</div></div>
        <div class="stat"><div class="n">${summary.runsCompleted}<small> of 3</small></div><div class="l">runs</div></div>
        <div class="stat"><div class="n">${summary.totalRunDist.toFixed(1)}<small> of ${distTarget.toFixed(0)}</small></div><div class="l">km</div></div>
      </div>
      <p class="streak">${streak > 0 ? '<b>' + streak + ' week streak.</b> ' : 'No streak yet. '}${w > 0 && w <= RUN_PROGRAM.length ? 'Run plan week ' + w + ' of ' + RUN_PROGRAM.length + '.' : w === 0 ? 'Run plan starts ' + programStartLabel() + '.' : ''}${daysToRace > 0 ? ' ' + daysToRace + ' day' + (daysToRace === 1 ? '' : 's') + ' to race day.' : daysToRace === 0 ? ' Race day.' : ''}</p>

      ${renderWeekReview(activity)}
      ${renderLockBoard()}
      ${renderLedger(activity)}

      <div class="block"><p class="quote">“${getDailyQuote()}”</p></div>

      ${(() => {
        // Backup nudge: browser storage can be evicted by the OS, exports are the real safety net
        let last = null;
        try { last = localStorage.getItem('gym-tracker-last-backup'); } catch(e) {}
        const days = last ? Math.floor((Date.now() - new Date(last)) / 86400000) : null;
        if (days !== null && days < 14) return '';
        let kb = 0;
        try { kb = Math.round(JSON.stringify({logs, runningLogs, lastCompleted}).length / 1024); } catch(e) {}
        return `
          <div class="notice">
            <div>
              <div class="t">${days === null ? 'No backup yet' : days + ' days since backup'}</div>
              <div class="d">Phones can clear browser storage. Your data (about ${kb}KB) exports in one tap. Do it fortnightly.</div>
            </div>
            <button class="btn" style="flex-shrink:0;" onclick="exportData()">Back up</button>
          </div>`;
      })()}
      ${deloadSuggestion ? `
        <div class="notice">
          <div>
            <div class="t">Recovery check</div>
            <div class="d">${deloadSuggestion.length} lifts are stalled across 3+ sessions. A deload week will reset the trend.</div>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function render() {
  // Render benchmark celebration if active
  if (benchmarkCelebration?.show) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #E8501A; color: #10242B; padding: 24px; border-radius: 12px; font-weight: 700; font-size: 18px; z-index: 998; text-align: center; box-shadow: 0 8px 32px rgba(232,68,58,0.4);';
    overlay.textContent = `BENCHMARK HIT!\n${benchmarkCelebration.benchmark}`;
    document.body.appendChild(overlay);
    benchmarkCelebration.show = false;   // one showing, not one per re-render
    setTimeout(() => overlay.remove(), 3000);
  }
  
  renderWeekIndicator();
  const rt = document.getElementById('restTimer');
  if (rt) rt.classList.toggle('off-lift', activeTab !== 'track');
  const c = document.getElementById('content');
  if (activeTab === 'home') {
    c.innerHTML = renderHome();
  } else if (activeTab === 'track') {
    c.innerHTML = renderTrack();
  } else if (activeTab === 'running') {
    c.innerHTML = renderRunning();
  } else {
    c.innerHTML = mapHead({ title: 'Progress', sub: 'Lifts, runs and personal bests' })
      + '<div class="sheet"><div class="legacy">' + renderProgress() + '</div></div>';
  }
}

function installBits(){
  try{
    var mf={name:'Iron & Road',short_name:'Iron & Road',start_url:'.',display:'standalone',
      background_color:'#DCE6E4',theme_color:'#DCE6E4',orientation:'portrait',
      icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
    var t=document.createElement('link');t.rel='apple-touch-icon';t.href=ICON192;
    document.head.appendChild(t);
    var f=document.createElement('link');f.rel='icon';f.type='image/png';f.href=ICON192;
    document.head.appendChild(f);
  }catch(e){}
}
installBits();

load();

// ===== Draggable rest timer =====
(function makeTimerDraggable() {
  const el = document.getElementById('restTimer');
  if (!el) return;
  const PAD = 8;
  let dragging = false, moved = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

  function clamp(left, top) {
    const r = el.getBoundingClientRect();
    const maxLeft = Math.max(PAD, window.innerWidth - r.width - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - r.height - PAD);
    return [Math.min(Math.max(left, PAD), maxLeft), Math.min(Math.max(top, PAD), maxTop)];
  }
  function applyPos(left, top) {
    [left, top] = clamp(left, top);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
  }
  function savePos() {
    try { localStorage.setItem('gym-timer-pos', JSON.stringify({ left: parseFloat(el.style.left), top: parseFloat(el.style.top) })); } catch (e) {}
  }

  el.addEventListener('pointerdown', (e) => {
    // Drag only from the ⠿ handle. Grabbing the whole pill meant a swipe that
    // started anywhere near it refused to scroll the page.
    if (!e.target.closest('.timer-grip')) return;
    dragging = true; moved = false;
    const r = el.getBoundingClientRect();
    origLeft = r.left; origTop = r.top;
    startX = e.clientX; startY = e.clientY;
    el.classList.add('dragging');
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    applyPos(origLeft + dx, origTop + dy);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if (moved) savePos();
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);

  // Re-clamp on rotate/resize so it never ends up off-screen
  window.addEventListener('resize', () => {
    if (el.style.left) applyPos(parseFloat(el.style.left), parseFloat(el.style.top));
  });

  // Restore saved position
  try {
    const p = JSON.parse(localStorage.getItem('gym-timer-pos'));
    if (p && isFinite(p.left) && isFinite(p.top)) applyPos(p.left, p.top);
  } catch (e) {}
})();

async function completeDay(dayKey) {
  const summary = getSessionSummary(dayKey);
  await markDayComplete(dayKey);
  render();
  showSessionSummaryModal(summary);
}

function toggleReorder() {
  reorderMode = !reorderMode;
  render();
}

// Drag-to-reorder. The ⋮⋮ handle was previously decorative — only the Up/Down
// buttons did anything. These handlers make the card actually draggable.
let dragFromIdx = null;
function dragStart(e, idx) {
  dragFromIdx = idx;
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(idx)); } catch (_) {} }
  if (e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.add('dragging');
}
function dragOver(e, idx) {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
}
async function dragDrop(e, idx) {
  e.preventDefault();
  let from = dragFromIdx;
  if (from === null && e.dataTransfer) { const d = parseInt(e.dataTransfer.getData('text/plain'), 10); if (!isNaN(d)) from = d; }
  if (from === null || from === idx) return;
  const arr = SPLIT[selectedDay].exercises;
  const [moved] = arr.splice(from, 1);
  arr.splice(idx, 0, moved);
  dragFromIdx = null;
  await saveOrder();
  render();
}
function dragEnd(e) {
  dragFromIdx = null;
  if (e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('dragging');
}

// Restore the programmed sequence for the current day
async function resetDayOrder() {
  const orig = DEFAULT_SPLIT[selectedDay];
  if (!orig) return;
  const cur = SPLIT[selectedDay].exercises;
  const ordered = [];
  for (const o of orig.exercises) {
    const match = cur.find(e => (e.origId || e.id) === o.id);
    if (match) ordered.push(match);
  }
  for (const e of cur) if (!ordered.includes(e)) ordered.push(e);
  SPLIT[selectedDay].exercises = ordered;
  await saveOrder();
  render();
}

async function moveExercise(idx, direction) {
  const day = SPLIT[selectedDay];
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= day.exercises.length) return;
  const arr = day.exercises;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  await saveOrder();
  render();
}

function toggleCard(exId, currentlyOpen) {
  cardOpen[exId] = !currentlyOpen;
  render();
}

function sparkSVG(values, color) {
  // Tiny e1RM trend, oldest → newest
  if (!values || values.length < 2) return '';
  const w = 64, h = 20, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / span) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function isManualDone(exId, dayKey) {
  return manualDone[exId + '|' + dayKey] === localDateStr(new Date());
}
async function saveManualDone() {
  try { await window.storage.set('manual-done', JSON.stringify(manualDone)); } catch(e) {}
  try { localStorage.setItem('gym-tracker-manual-done', JSON.stringify(manualDone)); } catch(e) {}
}
async function saveEarlyFinishes() {
  try { await window.storage.set('early-finishes', JSON.stringify(earlyFinishes)); } catch(e) {}
  try { localStorage.setItem('gym-tracker-early-finishes', JSON.stringify(earlyFinishes)); } catch(e) {}
}
function regularSetsToday(exId) {
  return getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
}
function earlyFinishesThisWeek() {
  const now = new Date();
  const ws = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  ws.setHours(0, 0, 0, 0);
  return earlyFinishes.filter(e => new Date(e.date) >= ws).length;
}
// Guardrail: a tap on "Finish early" opens an honesty prompt rather than finishing instantly
function askFinish(exId) {
  if (regularSetsToday(exId) < 1) return; // no zero-effort skips
  finishConfirm = exId;
  cardOpen[exId] = true;
  render();
}
function cancelFinish() { finishConfirm = null; render(); }
async function confirmFinish(exId) {
  const done = regularSetsToday(exId);
  if (done < 1) { finishConfirm = null; render(); return; } // safety: at least one working set
  manualDone[exId + '|' + selectedDay] = localDateStr(new Date());
  cardOpen[exId] = false;
  finishConfirm = null;
  const ex = SPLIT[selectedDay].exercises.find(e => e.id === exId);
  earlyFinishes.push({ date: new Date().toISOString(), exId, day: selectedDay, done, target: ex ? ex.sets : null });
  await saveManualDone();
  await saveEarlyFinishes();
  render();
}
async function reopenEx(exId) {
  delete manualDone[exId + '|' + selectedDay];
  const t = localDateStr(new Date());
  earlyFinishes = earlyFinishes.filter(e => !(e.exId === exId && e.day === selectedDay && localDateStr(e.date) === t));
  await saveManualDone();
  await saveEarlyFinishes();
  render();
}

function renderExerciseCard(ex, idx, totalCount) {
  if (reorderMode) {
    return `
      <div class="card reorder-mode" draggable="true" data-idx="${idx}"
           ondragstart="dragStart(event, ${idx})" ondragover="dragOver(event, ${idx})"
           ondrop="dragDrop(event, ${idx})" ondragend="dragEnd(event)">
        <div class="exercise-header">
          <div>
            <div class="exercise-name">${idx + 1}. ${ex.name}</div>
            <div class="exercise-meta">${ex.sets} sets</div>
          </div>
          <span class="reorder-handle">⋮⋮</span>
        </div>
        <div class="move-buttons">
          <button class="move-btn" onclick="moveExercise(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑ Up</button>
          <button class="move-btn" onclick="moveExercise(${idx}, 1)" ${idx === totalCount - 1 ? 'disabled' : ''}>↓ Down</button>
        </div>
        <button class="move-btn" style="width:100%; margin-top:6px;" onclick="resetDayOrder()">↺ Reset to programmed order</button>
      </div>
    `;
  }

  const rec = getLiveRec(ex.id, ex.sets, ex.reps, selectedDay) || getRec(ex.id, ex.sets, ex.reps, selectedDay, idx);
  const todaysSets = getTodaysSets(ex.id);
  const today = localDateStr(new Date());
  const rawPrior = (logs[ex.id] || []).filter(l => localDateStr(l.date) !== today);
  // Day-isolated history: Week A and Week B variants track independently (legacy untagged logs as fallback)
  const taggedPrior = rawPrior.filter(l => l.day === selectedDay);
  const allLogs = taggedPrior.length > 0 ? taggedPrior : rawPrior.filter(l => !l.day);
  const sessions = groupByDate(allLogs);
  const lastSession = sessions[0];

  // Target sets with flexibility to add/remove
  const targetSets = ex.sets;
  const setsTableRows = [];
  
  // Count regular (non-warmup, non-dropset) sets logged today
  const regularSetCount = todaysSets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  
  // Show all logged sets first
  for (let i = 0; i < todaysSets.length; i++) {
    const setData = todaysSets[i];
    const isWarmup = setData.tag === 'warmup';
    const isDropset = setData.tag === 'dropset';
    const className = isWarmup ? 'warmup' : isDropset ? 'dropset' : 'complete';
    const numClass = isWarmup ? 'warmup' : isDropset ? 'dropset' : 'complete';
    const label = isWarmup ? 'W' : isDropset ? 'D' : '✓';
    
    setsTableRows.push(`
      <div class="set-row ${className}">
        <button class="set-num ${numClass} set-type-btn" onclick="cycleSetType('${ex.id}','${setData.date}')" title="Tap to change set type">${label}</button>
        <input type="number" step="0.5" value="${setData.weight}" style="background:#26241F;border:1px solid #36332C;color:#fff;padding:4px;border-radius:4px;font-size:12px;width:100%;text-align:center" onchange="updateLog('${ex.id}','${setData.date}',this.value,'weight')">
        <input type="number" value="${setData.reps}" style="background:#26241F;border:1px solid #36332C;color:#fff;padding:4px;border-radius:4px;font-size:12px;width:100%;text-align:center" onchange="updateLog('${ex.id}','${setData.date}',this.value,'reps')">
        <button class="delete-btn" onclick="deleteLog('${ex.id}','${setData.date}')">✕</button>
      </div>
    `);
  }
  
  // Always show input form for the next regular set if we haven't hit target
  if (regularSetCount < targetSets) {
    const nextSetNum = regularSetCount + 1;
    // Carry the weight forward: today's top working set, else what the engine says.
    const doneW = todaysSets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset' && s.weight > 0)
      .map(s => s.weight);
    let prefillW = doneW.length ? Math.max(...doneW) : null;
    if (prefillW === null && lastSession) {
      const lw = lastSession.sets.filter(x => x.tag !== 'warmup' && x.tag !== 'dropset' && x.weight > 0)
        .map(x => x.weight);
      if (lw.length) prefillW = Math.max(...lw);   // open at last session's top set
    }
    setsTableRows.push(`
      <div class="log-form">
        <span class="set-num">${nextSetNum}</span>
        <input type="number" step="0.5" inputmode="decimal" placeholder="${ex.bodyweight ? '+kg / 0' : 'kg'}" id="w-${ex.id}-set${nextSetNum}"${prefillW !== null ? ` value="${prefillW}"` : ''} onkeydown="if(event.key==='Enter')logRegularSet('${ex.id}')">
        <input type="number" inputmode="numeric" placeholder="reps" id="r-${ex.id}-set${nextSetNum}" onkeydown="if(event.key==='Enter')logRegularSet('${ex.id}')">
        ${ex.bodyweight ? `<button class="btn" style="background:#15233A;border:1px solid #2C4A66;color:#3D7BFF;padding:6px 8px;font-size:11px;" onclick="logBodyweightSet('${ex.id}')">BW</button>` : ''}
        <button class="btn" onclick="logRegularSet('${ex.id}')">Log</button>
      </div>
    `);
  }

  const setsDoneCount = todaysSets.length;
  const workingSetsDone = todaysSets.filter(s => s.tag !== 'warmup').length;
  const manualDoneFlag = isManualDone(ex.id, selectedDay);
  const isComplete = regularSetCount >= targetSets || manualDoneFlag;
  const open = cardOpen[ex.id] !== undefined ? cardOpen[ex.id] : !isComplete;
  
  // e1RM sparkline: last 8 day-isolated sessions, oldest → newest
  const sparkVals = sessions.slice(0, 8).reverse().map(s => avgE1RM(s.sets));
  const spark = sparkVals.length >= 2 ? sparkSVG(sparkVals, isComplete ? '#37C871' : '#E8443A') : '';

  return `
    <div class="card ${isComplete ? 'complete-card' : ''}">
      <div class="card-head" onclick="toggleCard('${ex.id}', ${open})">
        <div style="min-width: 0;">
          <div class="exercise-name">${ex.name}${ex.warmup ? ' 🔥' : ''}${ex.superset ? ' ↔' : ''}${ex.dropset ? ' ↓' : ''}</div>
          <div class="exercise-meta">${ex.reps ? ex.reps + ' reps · ' : ''}${workingSetsDone}/${targetSets} today · ${sessions.length} session${sessions.length === 1 ? '' : 's'}</div>
        </div>
        <div class="head-right">
          ${spark}
          ${isComplete ? `<span class="done-chip">✓ ${manualDoneFlag && regularSetCount < targetSets ? `DONE · ${regularSetCount}/${targetSets}` : 'DONE'}</span>` : `<span class="target-sets">${targetSets} sets</span>`}
          <span class="chev ${open ? 'open' : ''}">▼</span>
        </div>
      </div>
      <div class="card-body" style="display: ${open ? 'block' : 'none'};">
      ${ex.warmup ? (() => {
        const topWeight = lastSession ? Math.max(...lastSession.sets.map(s => s.weight)) : null;
        const ramp = getWarmupRamp(topWeight);
        if (ramp) {
          const rampText = ramp.map(r => `${r.weight}kg×${r.reps}`).join(' → ');
          return `<div style="font-size: 11px; color: #F2C12E; background: #332408; padding: 8px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #F2C12E;">🔥 <strong>WARMUP:</strong> ${rampText}<br><span style="color:#d4a574; font-size:10px;">Based on last working weight (${topWeight}kg)</span></div>`;
        }
        return `<div style="font-size: 11px; color: #F2C12E; background: #332408; padding: 6px 8px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #F2C12E;">🔥 WARMUP REQUIRED — Log a working set to see your warmup ramp</div>`;
      })() : ''}
      ${ex.superset ? `<div style="font-size: 11px; color: #37C871; background: #0F3D22; padding: 6px 8px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #37C871;">↔ SUPERSET — Pair with next exercise on same stack</div>` : ''}
      ${ex.dropset ? `<div style="font-size: 11px; color: #7FB2FF; background: #15295C; padding: 6px 8px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #7FB2FF;">↓ DROP SET — Last set to failure, then reduce weight</div>` : ''}
      ${ex.notes ? `<div style="font-size: 12px; color: #A39E93; background: #26241F; padding: 8px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #E8443A; line-height: 1.4;">${ex.notes}</div>` : ''}
      <div class="recommendation rec-${rec.type}">${rec.text}</div>
      ${lastSession ? `<div class="last-session"><strong>Last (${daysAgo(lastSession.date)}):</strong> ${formatSets(lastSession.sets)}</div>` : ''}
      <div class="todays-sets">
        <div class="todays-sets-header">
          <span>Today's Sets</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:10px;color:#A39E93">${workingSetsDone} working${setsDoneCount > workingSetsDone ? ` · ${setsDoneCount - workingSetsDone} warmup` : ''}</span>
            <button class="rest-pill" onclick="cycleRest('${ex.id}', event)" title="Rest between sets — tap to change">&#9201; ${fmtRest(restFor(ex.id))}${restOverrides[ex.id] ? '' : ''}</button>
          </span>
        </div>
        ${setsTableRows.join('')}
      </div>
      ${finishConfirm === ex.id ? `
      <div class="finish-confirm">
        <div class="fc-q">Cooked, or one more? <span class="fc-sub">${regularSetCount}/${targetSets} done</span></div>
        <div class="fc-btns">
          <button class="fc-more" onclick="cancelFinish()">↩ One more set</button>
          <button class="fc-done" onclick="confirmFinish('${ex.id}')">✓ I'm cooked</button>
        </div>
      </div>` : ''}
      <div class="set-options">
        <button class="btn-small" onclick="addWarmup('${ex.id}')">+ Warmup</button>
        <button class="btn-small" onclick="addDropset('${ex.id}')">+ Drop Set</button>
        <button class="btn-small" onclick="openSwap(${idx})">⇄ Swap</button>
        ${manualDoneFlag
          ? `<button class="btn-small btn-reopen" onclick="reopenEx('${ex.id}')">↩ Reopen</button>`
          : (regularSetCount >= targetSets ? ''
             : (regularSetCount >= 1 && finishConfirm !== ex.id
                ? `<button class="btn-small btn-finish" onclick="askFinish('${ex.id}')">✓ Finish early</button>`
                : ''))}
        <button class="btn-small" onclick="toggleHistory('${ex.id}')">${showHistory[ex.id] ? '▴ History' : '▾ History'}</button>
      </div>
      ${showHistory[ex.id] ? renderHistory(ex.id) : ''}
      </div>
    </div>
  `;
}

// Best working weight to hang a warmup or drop set off: today's top set if there
// is one, otherwise the last one logged for this exercise on this day.
function refWorkingWeight(exId) {
  const today = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset' && s.weight > 0);
  if (today.length) return Math.max(...today.map(s => s.weight));
  const prior = (logs[exId] || []).filter(l => l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0
    && (!l.day || l.day === selectedDay));
  return prior.length ? prior[prior.length - 1].weight : 0;
}

async function addWarmup(exId) {
  if (!logs[exId]) logs[exId] = [];
  const ref = refWorkingWeight(exId);
  logs[exId].push({ date: new Date().toISOString(), weight: ref ? roundToPlate(ref * 0.5) : 20, reps: 10, tag: 'warmup', day: selectedDay });
  await save();
  render();
}

async function addDropset(exId) {
  if (!logs[exId]) logs[exId] = [];
  const ref = refWorkingWeight(exId);
  logs[exId].push({ date: new Date().toISOString(), weight: ref ? roundToPlate(ref * 0.7) : 0, reps: 8, tag: 'dropset', day: selectedDay });
  await save();
  render();
}

function renderHistory(exId) {
  const raw = logs[exId] || [];
  const tagged = raw.filter(l => l.day === selectedDay);
  const dayLogs = tagged.length > 0 ? tagged : raw.filter(l => !l.day);
  const sessions = groupByDate(dayLogs);
  if (sessions.length === 0) return '<div class="history"><div style="color:#6E695F;font-size:11px">No history yet</div></div>';
  return `<div class="history">${sessions.slice(0, 12).map(s => `
    <div class="history-row">
      <span>${new Date(s.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'})}</span>
      <span>${formatSets(s.sets)}</span>
    </div>
  `).join('')}</div>`;
}

function toggleHistory(exId) {
  showHistory[exId] = !showHistory[exId];
  render();
}

async function logBodyweightSet(exId) {
  // Pre-fills 0kg then logs — shortcut for bodyweight exercises
  const regularSetCount = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  const nextSetNum = regularSetCount + 1;
  const rEl = document.getElementById(`r-${exId}-set${nextSetNum}`);
  const wEl = document.getElementById(`w-${exId}-set${nextSetNum}`);
  if (!rEl) return;
  const r = parseInt(rEl.value);
  if (!r || r <= 0) { rEl.focus(); return; }
  if (wEl) wEl.value = '0';
  if (!logs[exId]) logs[exId] = [];
  
  const todayStr = localDateStr(new Date());
  const priorLogs = logs[exId].filter(l => localDateStr(l.date) !== todayStr);
  const hasPriorHistory = priorLogs.length > 0;
  // For BW sets, don't fire PR (0kg e1RM is meaningless for comparison)
  
  logs[exId].push({ date: new Date().toISOString(), weight: 0, reps: r, day: selectedDay, bw: true });
  await save();
  startTimer(true, exId);
  render();
}

async function logRegularSet(exId) {
  const regularSetCount = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  const nextSetNum = regularSetCount + 1;
  const wEl = document.getElementById(`w-${exId}-set${nextSetNum}`);
  const rEl = document.getElementById(`r-${exId}-set${nextSetNum}`);
  if (!wEl || !rEl) return;
  const w = parseFloat(wEl.value);
  const r = parseInt(rEl.value);
  // Allow 0kg for bodyweight exercises (bw flag), otherwise require positive weight
  const ex = Object.values(SPLIT).flatMap(d => d.exercises).find(e => e.id === exId);
  const isBW = ex?.bodyweight;
  if (isNaN(w) || (!isBW && w <= 0) || (isBW && w < 0) || !r || r <= 0) return;
  if (!logs[exId]) logs[exId] = [];
  
  // Check if this is a new PR — only if the exercise has prior history
  const todayStr = localDateStr(new Date());
  const allPriorLogs = logs[exId].filter(l => localDateStr(l.date) !== todayStr);
  // Compare against same-day history for accurate PRs (Week A and Week B track independently)
  const sameDayLogs = allPriorLogs.filter(l => l.day === selectedDay);
  const priorLogs = sameDayLogs.length > 0 ? sameDayLogs : allPriorLogs.filter(l => !l.day);
  const priorWorking = priorLogs.filter(l => l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0);
  // Sets already logged today count towards the bar to clear, otherwise every set
  // at a new top weight fires the same trophy again.
  const doneToday = logs[exId].filter(l => localDateStr(l.date) === todayStr && l.day === selectedDay
    && l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0);
  const bestSoFar = priorWorking.concat(doneToday);
  const newE1RM = w * (1 + r / 30);
  
  // Three PR types, all day-isolated, working sets only:
  let priorBestE1RM = 0, priorMaxWeight = 0, priorBestRepsAtThisWeight = 0;
  for (const l of bestSoFar) {
    const e = l.weight * (1 + l.reps / 30);
    if (e > priorBestE1RM) priorBestE1RM = e;
    if (l.weight > priorMaxWeight) priorMaxWeight = l.weight;
    if (l.weight === w && l.reps > priorBestRepsAtThisWeight) priorBestRepsAtThisWeight = l.reps;
  }
  const hasHistory = priorWorking.length > 0 && w > 0;
  let prType = null;
  if (hasHistory) {
    if (w > priorMaxWeight) prType = { label: 'WEIGHT PR', detail: `Heaviest ever: ${w}kg (was ${priorMaxWeight}kg)` };
    else if (w === priorMaxWeight && priorBestRepsAtThisWeight > 0 && r > priorBestRepsAtThisWeight) prType = { label: 'REP PR', detail: `${r} reps at ${w}kg (was ${priorBestRepsAtThisWeight})` };
    else if (priorBestE1RM > 0 && newE1RM > priorBestE1RM * 1.01) prType = { label: 'e1RM PR', detail: `Est. 1RM ${newE1RM.toFixed(1)}kg (was ${priorBestE1RM.toFixed(1)}kg)` };
  }
  
  logs[exId].push({ date: new Date().toISOString(), weight: w, reps: r, day: selectedDay });
  
  await save();
  if (navigator.vibrate) navigator.vibrate(prType ? [30, 40, 30] : 10);
  
  // Trophy: bib-styled, names the PR type
  if (prType) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-2deg); background: #F2EFE7; color: #141311; padding: 22px 30px; border-radius: 16px; border-top: 6px solid #E8443A; z-index: 998; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,0.7); min-width: 230px;';
    overlay.innerHTML = '<div style="font-size: 30px; margin-bottom: 4px;">🏆</div>'
      + '<div style="font-family: Anton, sans-serif; font-size: 24px; letter-spacing: 1.5px;">' + prType.label + '</div>'
      + '<div style="font-size: 14px; font-weight: 700; margin-top: 6px;">' + w + 'kg × ' + r + ' reps</div>'
      + '<div style="font-size: 12px; color: rgba(20,19,17,0.6); margin-top: 2px;">' + prType.detail + '</div>';
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 4000);
  }
  
  startTimer(true, exId);
  render();
}


async function deleteLog(exId, date) {
  logs[exId] = (logs[exId] || []).filter(l => l.date !== date);
  await save();
  render();
}

async function updateLog(exId, date, newValue, field) {
  const log = (logs[exId] || []).find(l => l.date === date);
  if (!log) return;
  if (field === 'weight') {
    const v = parseFloat(newValue);
    if (isNaN(v) || v < 0) { render(); return; }   // junk in the box: put the old number back
    log.weight = v;
  } else if (field === 'reps') {
    const v = parseInt(newValue, 10);
    if (isNaN(v) || v < 1) { render(); return; }
    log.reps = v;
  }
  await save();
  render();
}

// Cycle a logged set's type: working → warmup → drop set → working.
// Lets a mistagged set be corrected in place instead of deleting later sets.
async function cycleSetType(exId, date) {
  const log = (logs[exId] || []).find(l => l.date === date);
  if (!log) return;
  if (log.tag === 'warmup') log.tag = 'dropset';
  else if (log.tag === 'dropset') delete log.tag; // becomes a working set
  else log.tag = 'warmup';
  await save();
  render();
}

    <div style="display: flex; gap: 6px; margin-bottom: 14px;">

      <button onclick="progressTab = 'runs'; render();" style="flex: 1; padding: 8px; background: ${progressTab === 'runs' ? '#E8443A' : '#36332C'}; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Runs</button>

function getPersonalBests() {
  // Best working-set e1RM per exercise across all history (weighted sets only)
  const nameById = {};
  for (const day of Object.values(SPLIT)) {
    for (const ex of day.exercises) if (!nameById[ex.id]) nameById[ex.id] = ex.name;
  }
  const bests = [];
  for (const [exId, entries] of Object.entries(logs)) {
    let best = null;
    for (const l of entries) {
      if (l.tag === 'warmup' || l.tag === 'dropset' || !l.weight || l.weight <= 0) continue;
      const e = l.weight * (1 + l.reps / 30);
      if (!best || e > best.e1rm) best = { e1rm: e, weight: l.weight, reps: l.reps, date: l.date };
    }
    if (best && nameById[exId]) bests.push({ name: nameById[exId], ...best });
  }
  return bests.sort((a, b) => b.e1rm - a.e1rm).slice(0, 8);
}

let progOpen = {}; // per-card expand state on the Progress tab

function e1rmChartSVG(values, color) {
  // Full-width session chart: e1RM per session, oldest → newest
  if (!values || values.length < 2) return '';
  const W = 320, H = 110, padL = 32, padR = 8, padY = 14;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const x = i => padL + (i / (values.length - 1)) * (W - padL - padR);
  const y = v => H - padY - ((v - min) / span) * (H - padY * 2);
  const line = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block; margin: 6px 0 4px;">
      <line x1="${padL}" y1="${y(max)}" x2="${W-padR}" y2="${y(max)}" stroke="#36332C" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="${padL}" y1="${y(min)}" x2="${W-padR}" y2="${y(min)}" stroke="#36332C" stroke-width="1" stroke-dasharray="3 4"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#F2EFE7"/>`).join('')}
      <text x="2" y="${y(max) + 4}" font-size="9" fill="#A39E93" font-weight="700">${max.toFixed(0)}</text>
      <text x="2" y="${y(min) + 4}" font-size="9" fill="#6E695F">${min.toFixed(0)}</text>
    </svg>`;
}

function renderLiftProgress() {
  // Build day-isolated exercise records, in PROGRAM order (day sequence, then slot order)
  const dayOrder = [...WEEK_A, ...WEEK_B];
  const allExercises = [];
  for (const dayKey of dayOrder) {
    const day = SPLIT[dayKey];
    day.exercises.forEach((ex, slot) => {
      const dayLogs = (logs[ex.id] || []).filter(l => !l.day || l.day === dayKey);
      if (dayLogs.length === 0) return;
      const sorted = dayLogs.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
      const sessions = groupByDate(sorted); // already newest first
      let change = 0;
      const e1rms = sessions.map(s => avgE1RM(s.sets));
      if (sessions.length >= 2) change = ((e1rms[0] - e1rms[e1rms.length-1]) / e1rms[e1rms.length-1]) * 100;
      allExercises.push({ ...ex, dayKey, dayName: shortDayName(day.name), slot, _sessions: sessions, _e1rms: e1rms, _change: change });
    });
  }
  if (allExercises.length === 0) {
    return '<div class="empty">Log some sessions to see your progression here.</div>';
  }
  
  const dayNames = [...new Set(allExercises.map(e => e.dayName))];
  const filtered = progressFilter === 'all' ? allExercises : allExercises.filter(ex => ex.dayName === progressFilter);
  
  return `
    ${(() => {
      const bests = getPersonalBests();
      if (bests.length === 0) return '';
      return `
        <div class="card">
          <div class="card-label">Personal bests · top e1RM</div>
          ${bests.map(b => `
            <div class="pr-row">
              <span class="pr-name">${b.name}</span>
              <span><span class="pr-val">${b.e1rm.toFixed(0)}kg</span><span class="pr-sub">${b.weight}×${b.reps} · ${daysAgo(b.date)}</span></span>

    <details class="legend">
      <summary>What the numbers mean</summary>
      <p><b>e1RM</b> is your estimated one-rep max: what the set you just did suggests you could lift once,
      worked out with the Epley formula (weight &times; (1 + reps &divide; 30)). 60kg&times;8 and 70kg&times;5 are
      both about 76kg. It is the fairest single number for comparing sessions where the weight
      <em>and</em> the reps moved, which is why the chart plots it rather than raw kilos.</p>
      <p><b>Slot</b> is where this lift sat in the session, so <span class="lg-k">#3 of 6</span> means it was
      third. The same lift is measurably weaker when it runs late, so a dip on the chart on a day it

      <p><b>The percentage</b> is the change from your first logged session on this day to your most

    <div class="progress-day-filter">

      ${dayNames.map(d => `<button class="${progressFilter === d ? 'active' : ''}" onclick="progressFilter = '${d}'; render();">${d}</button>`).join('')}

      const spark = sparkSVG(chartVals.slice(-8), ex._change >= 0 ? '#37C871' : '#E8443A');
      const deltaChip = sessions.length >= 2
        ? `<span style="font-size: 12px; font-weight: 800; color: ${ex._change >= 0.5 ? 'var(--green)' : ex._change <= -0.5 ? 'var(--red)' : 'var(--text-2)'};">${ex._change >= 0 ? '+' : ''}${ex._change.toFixed(1)}%</span>`
        : '<span style="font-size: 11px; color: var(--text-3);">baseline</span>';
      
      // Average position in session (fatigue context for reading the graph)
      const positions = sessions.slice(0, 6).map(s => getSessionPosition(ex.id, localDateStr(s.date), ex.dayKey)).filter(p => p !== null);
      const avgPos = positions.length ? (positions.reduce((a,b) => a+b, 0) / positions.length) : null;
      
      return `
        <div class="card">
          <div class="card-head" onclick="toggleProg('${key}', ${open})">

              <div class="exercise-meta">${ex.dayName} · ${sessions.length} session${sessions.length === 1 ? '' : 's'} · best ${Math.max(...ex._e1rms).toFixed(0)}kg e1RM</div>
            </div>

                <div style="font-size: 11px; color: var(--text-3); margin-bottom: 8px; line-height: 1.4;">⚠ This exercise's slot has moved between #${Math.min(...positions)+1} and #${Math.max(...positions)+1} — dips on the chart when it ran late are fatigue, not lost strength.</div>` : ''}
              ${sessions.slice(0, 6).map((s, i) => {
                const pos = getSessionPosition(ex.id, localDateStr(s.date), ex.dayKey);
                return `
                  <div class="history-row">
                    <span>${daysAgo(s.date)}${pos !== null ? ' · #' + (pos+1) : ''}</span>
                    <span>${formatSets(s.sets)} · <strong style="color: var(--text);">${avgE1RM(s.sets).toFixed(0)}kg</strong> <span style="color:var(--text-3);font-size:10px;">e1RM</span></span>
                  </div>`;
              }).join('')}
            </div>` : ''}
        </div>`;
    }).join('')}
  `;
}
function renderRunProgress() {
  if (runningLogs.length === 0) {
    return '<div style="color: #6E695F; font-size: 14px; padding: 20px; text-align: center;">Log some runs to see your progression here.</div>';
  }

  const byType = { regular: [], treadmill: [], interval: [], 'interval-treadmill': [] };
  runningLogs.forEach(run => {
    // Unknown/missing type (legacy imports, outdoor runs) buckets as regular instead of crashing
    (byType[run.type] || byType.regular).push(run);
  });

  const typeNames = { regular: '🏃 Regular Runs', treadmill: '🏃 Treadmill', interval: '⚡ Interval', 'interval-treadmill': '⚡ Interval Treadmill' };
  const activeTypes = Object.keys(byType).filter(t => byType[t].length > 0);

  return `
    <div style="display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;">
      ${activeTypes.map(t => `
        <div style="display: inline-block; padding: 6px 12px; background: ${progressFilter === t ? '#E8443A' : '#36332C'}; color: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;" onclick="progressFilter = '${t}'; render();">${typeNames[t]}</div>
      `).join('')}
    </div>
    
    ${activeTypes.map(type => {
      const runs = byType[type];
      if (runs.length === 0 || (progressFilter !== 'all' && progressFilter !== type)) return '';
      
      const sortedRuns = runs.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
      const totalDist = runs.reduce((sum, r) => sum + r.distance, 0);
      const totalTime = runs.reduce((sum, r) => sum + r.time, 0);
      const avgSpeed = (totalDist / totalTime * 60).toFixed(1);
      const fastestPace = Math.min(...runs.map(r => r.time / r.distance));
      const fastestPaceMin = Math.floor(fastestPace);
      const fastestPaceSec = Math.round((fastestPace - fastestPaceMin) * 60);
      
      const distances = sortedRuns.map(r => r.distance);
      const minDist = Math.min(...distances) * 0.9;

// ====== Rest Timer ======
// One rest length for a heavy triple and a lateral raise made no sense in an app
// that models rep ranges everywhere else. The default comes off the bottom of the
// exercise's own rep range; tap the pill on the card to override it.
const REST_STEPS = [45, 60, 90, 120, 150, 180, 240];
function exById(exId) {
  return Object.values(SPLIT).flatMap(d => d.exercises).find(e => e.id === exId) || null;
}
function restDefaultFor(ex) {
  if (!ex) return 150;
  const m = String(ex.reps || '').match(/\d+/);
  const low = m ? parseInt(m[0], 10) : 10;
  if (low <= 6) return 180;   // heavy compound
  if (low <= 10) return 150;
  if (low <= 14) return 90;
  return 60;                  // high-rep isolation
}
function restFor(exId) {
  if (restOverrides[exId]) return restOverrides[exId];
  return restDefaultFor(exById(exId));
}
function fmtRest(sec) {
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
async function cycleRest(exId, ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  const cur = restFor(exId);
  let i = REST_STEPS.indexOf(cur);
  if (i < 0) i = REST_STEPS.indexOf(150);
  restOverrides[exId] = REST_STEPS[(i + 1) % REST_STEPS.length];
  await saveRest();
  render();
}

function toggleTimer() {
  if (timerRunning) pauseTimer();
  else startTimer();
}

function startTimer(fresh, exId) {
  if (exId) restLen = restFor(exId);
  // If timer is at 0 or finished, start a fresh rest period
  if (fresh || timerSeconds <= 0 || timerEndedNotified) {
    timerSeconds = restLen;
    timerEndedNotified = false;
  }
  timerRunning = true;
  // Anchor to an absolute end time so backgrounding doesn't lose track
  timerEndTime = Date.now() + timerSeconds * 1000;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 250);
  tickTimer();
  savePlace();
}

function tickTimer() {
  if (!timerRunning || timerEndTime === null) return;
  const remaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
  timerSeconds = remaining;
  if (remaining <= 0) {
    timerSeconds = 0;
    pauseTimer();
    if (!timerEndedNotified) {
      timerEndedNotified = true;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      playBeep();
      flashRestOver();
    }
  }
  updateTimerUI();
}

function pauseTimer() {
  timerRunning = false;
  // Capture remaining time so resume continues from where it left off
  if (timerEndTime !== null) {
    timerSeconds = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
  }
  timerEndTime = null;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  updateTimerUI();
  savePlace();
}

function resetTimer() {
  pauseTimer();
  timerSeconds = restLen;
  timerEndTime = null;
  timerEndedNotified = false;
  updateTimerUI();
  savePlace();
}

// Re-sync the moment the app comes back to the foreground
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerRunning) tickTimer();
});

function updateTimerUI() {
  const display = document.getElementById('timerDisplay');
  const timer = document.getElementById('restTimer');
  const btn = document.getElementById('timerStartBtn');
  const mins = Math.floor(timerSeconds / 60);
  const secs = timerSeconds % 60;
  display.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

  timer.classList.remove('running', 'warning', 'done');
  if (timerSeconds === 0) {
    timer.classList.add('done');
    display.textContent = "GO!";
  } else if (timerRunning && timerSeconds <= 10) {
    timer.classList.add('warning');
  } else if (timerRunning) {
    timer.classList.add('running');
  }
  btn.textContent = timerRunning ? '⏸' : '▶';
  // Collapsed unless a rest period is actually under way
  timer.classList.toggle('idle', !timerRunning && timerSeconds >= restLen);
}

let audioCtx = null;
// iOS starts every AudioContext suspended and only lets a user gesture resume it.
// The beep used to be built inside a setInterval callback, so on an iPhone it
// never made a sound. This unlocks the context on the first tap of the session.
let audioUnlocked = false;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioUnlocked) {
      const b = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination); src.start(0);
      audioUnlocked = true;
    }
  } catch (e) {}
}
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('click', unlockAudio, { passive: true });

// Phone on silent, or iOS ignoring navigator.vibrate: flash the screen instead.
function flashRestOver() {
  try {
    const f = document.createElement('div');
    f.className = 'rest-flash';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1400);
  } catch (e) {}
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.4);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + i * 0.4 + 0.05);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i * 0.4 + 0.25);
      osc.start(audioCtx.currentTime + i * 0.4);
      osc.stop(audioCtx.currentTime + i * 0.4 + 0.3);
    }
  } catch (e) {}
}

function paceToSpeed(p) { return 60 / p; }
function speedToPace(s) { return 60 / s; }
function fmtPace(p) { const m = Math.floor(p); const s = Math.round((p - m) * 60); return `${m}:${s.toString().padStart(2,'0')}`; }

  const now = new Date();
  if (now < PROGRAM_START) return 0;
  const diffDays = Math.floor((now - PROGRAM_START) / (1000*60*60*24));
  return Math.min(Math.floor(diffDays / 7) + 1, RUN_PROGRAM.length);
}

  const now = new Date();
  return Math.ceil((RACE_DATE - now) / (1000*60*60*24));
}

  if (w === 0) return 'Pre-Program';
  return RUN_PROGRAM[w-1] ? RUN_PROGRAM[w-1].phase : 'Complete';

  }
  // A gate is PROVEN only by a run inside the last 42 days — the same window the
  // fitness engine uses. Fitness decays; a fast run from months ago is history, not
  // evidence of what you can do now. Older qualifying runs are marked EXPIRED so you
  // can see you once had it, without it inflating your readiness.
  const GATE_WINDOW = 42;
  benchmarks.forEach(b => {
    let hit = false, expired = false, hitDate = null;
    for (const run of runningLogs) {
      if (!run.distance || !run.time) continue;
      const runPace = run.time / run.distance;
      if (!(run.distance >= b.dist - 0.05 && runPace <= b.pace + 0.04)) continue;
      const days = (Date.now() - new Date(run.date)) / 86400000;
      if (days <= GATE_WINDOW) {
        if (!hit || new Date(run.date) > new Date(hitDate)) { hit = true; hitDate = run.date; b.by = run; }
      } else if (!hit) expired = true;
    }
    b.hit = hit; b.expired = !hit && expired; b.hitDate = hitDate;
    // A harder run legitimately proves easier gates (6km @4:48 proves 3km @5:20).
    // That is real capability, but it is NOT the same as having done the session,
    // so gates cleared before their week are flagged rather than counted as progress.
    b.ahead = hit && b.week > getProgramWeek();
  });
  const hitCount = benchmarks.filter(b => b.hit).length;
  const w = getProgramWeek();
  const due = benchmarks.filter(b => b.week <= w);
  return { benchmarks, hitCount, total: benchmarks.length, due, dueHit: due.filter(b => b.hit).length };
}

function getReadinessStatus() {
  const w = getProgramWeek();
  const { benchmarks, hitCount, total, due, dueHit } = getReadiness();
  const behind = due.length - dueHit;
  let status, color, msg;
  if (w === 0) {
    status = 'Not started'; color = '#A39E93';
    msg = 'Program starts June 1. Log your runs and the readiness gate will track whether 4:30/km is locked in.';
  } else if (behind === 0) {
    status = 'ON TRACK'; color = '#37C871';
    msg = due.length === 0
      ? `No pace benchmarks are due yet — week ${w} is base work. Just get the runs in; the gates start in week ${benchmarks.length ? Math.min(...benchmarks.map(b => b.week)) : 3}.`
      : `You have hit every pace benchmark due so far (${dueHit}/${due.length}). ${fmtPace(GOAL_PACE)}/km for ${GOAL_DIST}k is on track. Keep training consistently.`;
  } else if (behind === 1) {
    status = 'SLIGHTLY BEHIND'; color = '#F2C12E';
    const missed = due.find(b => !b.hit);
    msg = `You are behind on one benchmark: "${missed.name}". Repeat that session before moving on. Do not progress until you have hit it — the plan only works if each step is proven.`;
  } else {
    status = 'BEHIND — ADJUST'; color = '#E8443A';
    msg = `You are behind on ${behind} benchmarks. Be honest: either training has been inconsistent, or the timeline needs adjusting. Better to find out now than on race day. Consider holding the current phase an extra week, or revising the goal to a pace you can prove.`;
  }
  return { status, color, msg, hitCount, total, behind };
}

function isSessionDone(s, sessionIndex, weekPlan) {
  // Each run this week can tick off ONE planned session, and the longest planned
  // session gets first pick of the longest run. Counting by order alone meant a
  // single 8km marked the 5km easy run done and the 8km long run never done.
  const now = new Date();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  const runs = runningLogs
    .filter(r => new Date(r.date) >= weekStart && typeof r.distance === 'number')
    .sort((a, b) => b.distance - a.distance); // longest first
  const plan = (weekPlan && weekPlan.length) ? weekPlan : [s];
  const idx  = (weekPlan && weekPlan.length) ? sessionIndex : 0;
  const used = new Array(runs.length).fill(false);
  const done = {};
  plan.map((p, i) => ({ i, dist: p.dist || 0 }))
      .sort((a, b) => b.dist - a.dist)
      .forEach(({ i, dist }) => {
        for (let k = 0; k < runs.length; k++) {
          if (used[k]) continue;
          if (runs[k].distance >= dist * 0.8) { used[k] = true; done[i] = true; break; }
        }
      });
  return !!done[idx];
}

// ===== RECALIBRATION ENGINE =====
// When training slips, the plan must be rebuilt from CURRENT fitness rather than
// the fantasy of the original schedule. Everything here is derived from logged runs.
const RIEGEL = 1.06;
const WEEKLY_GAIN = 0.005; // ~0.5%/wk pace improvement with consistent training

// Best current fitness across ALL runs (not just long ones): a fast 4km says more
// about your engine than a plodded 8km, so every run is normalised to a 12km
// equivalent via Riegel and the best one wins.
function getFitnessProfile() {
  const runs = runningLogs.filter(r => {
    if (!r.distance || !r.time) return false;
    const days = (Date.now() - new Date(r.date)) / 86400000;
    const p = r.time / r.distance;
    return days <= 42 && r.distance >= 2 && p > 2.5 && p < 9;
  });
  if (runs.length === 0) return null;
  let best = null;
  for (const r of runs) {
    const eq = r.time * Math.pow(12 / r.distance, RIEGEL);
    if (!best || eq < best.eq) best = { eq, run: r };
  }
  const pace12 = best.eq / 12;
  const k = best.run.time / Math.pow(best.run.distance, RIEGEL); // pace(D) = k·D^0.06
  const longest = Math.max(...runs.map(r => r.distance));
  return {
    pace12, k, runs: runs.length, longest,
    basis: best.run,
    easy: pace12 + 1.05,
    tempo: pace12 - 0.10,
    interval: pace12 - 0.45
  };
}
function paceAtDistance(k, d) { return k * Math.pow(d, RIEGEL - 1); }
function distanceAtPace(k, pace) { return Math.pow(pace / k, 1 / (RIEGEL - 1)); }
function projectPace(pace, weeks) { return pace * Math.pow(1 - WEEKLY_GAIN, Math.max(0, weeks)); }

// The three honest ways out. You can hold any TWO of {distance, pace, date} —
// this computes what the third has to become.
function getRecalOptions() {
  const p = getFitnessProfile();
  if (!p) return null;
  const weeksLeft = Math.max(0, getDaysToRace() / 7);
  const goalPace = (runAdjust && runAdjust.goalPace) || GOAL_PACE;
  const goalDist = (runAdjust && runAdjust.goalDist) || GOAL_DIST;

  // A: keep distance + pace → how long until it's provable?
  const weeksNeeded = p.pace12 <= GOAL_PACE ? 0
    : Math.log(GOAL_PACE / p.pace12) / Math.log(1 - WEEKLY_GAIN);
  const extraWeeks = Math.max(0, Math.ceil(weeksNeeded - weeksLeft));
  const newDate = new Date(RACE_DATE.getTime() + extraWeeks * 7 * 86400000);

  // B: keep distance + date → what pace is provable?
  const provPace = projectPace(p.pace12, weeksLeft);
  const provTime = provPace * GOAL_DIST;

  // C: keep pace + date → what distance is provable at 4:30?
  const kProj = p.k * Math.pow(1 - WEEKLY_GAIN, weeksLeft);
  let provDist = distanceAtPace(kProj, GOAL_PACE);
  if (!isFinite(provDist) || provDist < 0) provDist = 0;
  provDist = Math.max(0, Math.min(provDist, GOAL_DIST));

  return { p, weeksLeft, goalPace, goalDist, weeksNeeded, extraWeeks, newDate, provPace, provTime, provDist };
}

// Rebuild the week from what you can actually run today. Race-pace continuous work
// is only prescribed once the gap to goal pace is small enough to be honest.
function buildBridgeWeek(p) {
  const gap = p.pace12 - GOAL_PACE;
  const easy = Math.round(p.easy * 20) / 20;
  const longDist = Math.max(6, Math.min(Math.round(p.longest * 1.1), GOAL_DIST));
  const sessions = [
    { type: 'easy', label: 'Easy Run', dist: 5, pace: easy,
      desc: 'Rebuild block. Conversational — this is aerobic base, not a test. Slow is the point.' },
  ];
  if (gap > 0.35) {
    // Too far off goal pace for continuous work — sharpen with short reps instead
    const repPace = Math.max(GOAL_PACE, p.interval);
    sessions.push({ type: 'interval', label: 'Intervals 5×800m', dist: 6, reps: 5, repDist: 0.8,
      repPace, recovery: '90s walk/jog',
      desc: `Reps at ${fmtPace(repPace)}/km — quick but repeatable. Short reps first: you earn continuous race pace, you don't start there.` });
  } else {
    sessions.push({ type: 'tempo', label: 'Threshold', dist: 6, pace: Math.round(p.tempo * 20) / 20,
      desc: `1.5km warmup, 3km @ ${fmtPace(p.tempo)}/km, 1.5km cooldown. Controlled and hard, not maximal.` });
  }
  sessions.push({ type: 'long', label: 'Long Run', dist: longDist, pace: Math.round((easy + 0.1) * 20) / 20,
    desc: `${longDist}km easy. Time on feet rebuilds the endurance the plan assumed you had. No pace pressure.` });
  return sessions;
}

// ===== RECALIBRATION UI =====
async function saveRunAdjust() {
  const v = runAdjust ? JSON.stringify(runAdjust) : '';
  try { if (v) await window.storage.set('run-adjust', v); else await window.storage.delete('run-adjust'); } catch(e) {}
  try { if (v) localStorage.setItem('gym-tracker-run-adjust', v); else localStorage.removeItem('gym-tracker-run-adjust'); } catch(e) {}
}
function openRecal() { recalOpen = true; recalReason = null; render(); }
function closeRecal() { recalOpen = false; render(); }
function pickReason(r) { recalReason = r; render(); }
async function applyRecal(mode) {
  const o = getRecalOptions();
  if (!o) { closeRecal(); return; }
  runAdjust = { reason: recalReason, mode, setAt: new Date().toISOString(), bridgeFrom: localDateStr(new Date()) };
  if (mode === 'extend') { runAdjust.targetDate = o.newDate.toISOString(); runAdjust.extraWeeks = o.extraWeeks; }
  else if (mode === 'repace') { runAdjust.goalPace = o.provPace; runAdjust.goalDist = GOAL_DIST; }
  else if (mode === 'redist') { runAdjust.goalPace = GOAL_PACE; runAdjust.goalDist = Math.round(o.provDist * 2) / 2; }
  await saveRunAdjust();
  recalOpen = false;
  render();
}
async function clearRecal() {
  runAdjust = null;
  await saveRunAdjust();
  render();
}

function renderRecalModal() {
  if (!recalOpen) return '';
  const o = getRecalOptions();
  const reasons = [
    ['missed', 'Missed sessions — life got busy'],
    ['illness', 'Illness or injury'],
    ['toohard', 'The paces are too hard for me right now'],
    ['restart', 'Coming back after a break']
  ];
  let body;
  if (!o) {
    body = `<div style="color:#A39E93;font-size:13px;padding:16px 0;">Not enough recent runs to recalibrate from. Log 1–2 honest runs (any distance) and come back — I'll rebuild the plan from real numbers.</div>`;
  } else if (!recalReason) {

      reasons.map(([k, label]) => `<button class="swap-item" onclick="pickReason('${k}')"><div class="swap-item-name">${label}</div></button>`).join('');
  } else {
    const curPace = fmtPace(o.p.pace12);

    body = `
      <div style="background:#26241F;border-radius:10px;padding:11px;margin-bottom:12px;font-size:12px;color:#A39E93;line-height:1.5;">
        <strong style="color:#fff;">Where you actually are:</strong> your best recent run projects to
        <strong style="color:#fff;">${curPace}/km</strong> for 12km (from ${o.p.basis.distance}km).
        Goal pace is 4:30 — a gap of <strong style="color:#E8443A;">${Math.round(gap * 60)}s/km</strong>, with ${Math.round(o.weeksLeft)} weeks left.
      </div>
      <div class="swap-sub">Hold any two — the third has to move</div>
      <button class="swap-item" onclick="applyRecal('extend')">
        <div class="swap-item-name">Keep 12km @ 4:30 — move the date</div>
        <div class="swap-item-meta">${o.extraWeeks <= 0 ? 'Already achievable — just rebuild the block' : `Needs ~${o.extraWeeks} more weeks → ${dateStr}`}</div>
      </button>
      <button class="swap-item" onclick="applyRecal('repace')">
        <div class="swap-item-name">Keep 12km on Sep 12 — revise the pace</div>
        <div class="swap-item-meta">Provable: ${fmtPace(o.provPace)}/km → ${provMin}:${provSec.toString().padStart(2,'0')}</div>
      </button>
      <button class="swap-item" onclick="applyRecal('redist')">
        <div class="swap-item-name">Keep 4:30/km on Sep 12 — revise the distance</div>
        <div class="swap-item-meta">Provable: ~${(Math.round(o.provDist * 2) / 2).toFixed(1)}km at 4:30/km</div>
      </button>
      <button class="swap-reset" onclick="applyRecal('rebuild')">Change nothing — just rebuild this week from current fitness</button>
      <div style="font-size:11px;color:#6E695F;margin-top:10px;line-height:1.5;">All four rebuild this week's sessions from what you can run today. Projections assume ~0.5%/week improvement with consistent training.</div>`;
  }
  return `
    <div class="swap-modal show" onclick="if(event.target===this)closeRecal()">
      <div class="swap-sheet">
        <div class="swap-head"><span>⟲ Back on track</span><button class="swap-close" onclick="closeRecal()">✕</button></div>
        <div class="swap-body">${body}</div>
      </div>
    </div>`;
}

// ===== DYNAMIC ADJUSTMENT SYSTEM =====
// Tracks actual performance and adjusts phases based on benchmark achievement
// Phase week-ranges are derived from the ACTIVE program so they never go stale
// when the program changes length or shape.
function getPhaseBounds() {
  const order = [], map = {};
  for (const w of RUN_PROGRAM) {
    if (!map[w.phase]) { map[w.phase] = [w.week, w.week]; order.push(w.phase); }
    else map[w.phase][1] = w.week;
  }
  return order.map(name => ({ name, start: map[name][0], end: map[name][1] }));
}
function getPhaseNum(week) {
  const b = getPhaseBounds();
  for (let i = 0; i < b.length; i++) if (week >= b[i].start && week <= b[i].end) return i + 1;
  return b.length;
}
function getPhasePerformance(phaseNum) {
  const b = getPhaseBounds();
  const ph = b[Math.min(Math.max(phaseNum, 1), b.length) - 1];
  const startWeek = ph.start, endWeek = ph.end;
  const { benchmarks, hitCount } = getReadiness();
  
  // Benchmarks relevant to this phase
  const phaseBenchmarks = benchmarks.filter(b => b.week >= startWeek && b.week <= endWeek);
  const phaseHits = phaseBenchmarks.filter(b => b.hit).length;
  const phaseTotal = phaseBenchmarks.length;
  const hitRatio = phaseTotal > 0 ? phaseHits / phaseTotal : 0;
  
  // Score: 0-1 scale
  // 1.0 = hit all benchmarks for phase
  // 0.5 = hit half
  // 0.0 = hit none
  return { hitCount: phaseHits, total: phaseTotal, ratio: hitRatio, phaseBenchmarks };
}

function getAdjustmentRecommendation() {
  const w = getProgramWeek();
  if (w === 0) return null; // program hasn't started
  
  const { benchmarks, hitCount, total } = getReadiness();
  
  const phaseNum = getPhaseNum(w);
  const perf = getPhasePerformance(phaseNum);
  const _b = getPhaseBounds()[phaseNum - 1];
  const phaseStart = _b.start, phaseEnd = _b.end;
  const weeksInPhase = w - phaseStart + 1;
  const expectedHits = Math.ceil((weeksInPhase / (phaseEnd - phaseStart + 1)) * perf.total);
  const actualHits = perf.hitCount;
  const gap = expectedHits - actualHits;
  
  let action, color, msg;
  
  if (gap <= -1) {
    // Ahead: you've hit more benchmarks than expected
    action = 'ACCELERATE';
    color = '#37C871';
    msg = (() => {
      const d = getDynamicShift();
      return d.shift < 0
        ? `You're ahead of schedule — hitting benchmarks early. This week's quality paces have already been scaled ${Math.round(Math.abs(d.shift)*60)}s/km faster to match. Easy runs stay easy.`
        : `You're ahead of schedule — hitting benchmarks early. Log a faster effort and the quality paces will scale up automatically.`;
    })();
  } else if (gap === 0) {
    // On track
    action = 'ON TRACK';
    color = '#3D7BFF';
    msg = `You're hitting benchmarks as planned. Stick with the current phase — consistency is what locks in race day.`;
  } else if (gap === 1) {
    // Slightly behind
    action = 'HOLD';
    color = '#F2C12E';
    const missedBench = perf.phaseBenchmarks.find(b => !b.hit);
    msg = `You're one benchmark behind this phase. Repeat the session for "${missedBench.name}" before moving forward — each step must be proven.`;
  } else {
    // Behind by >1
    action = 'REPEAT PHASE';
    color = '#E8443A';
    msg = `You're behind by ${gap} benchmarks. Hold this phase for another week and nail the missing sessions. Better to over-prepare than under-prepare before race day.`;
  }
  
  return { action, color, msg, phaseNum, gap, expectedHits, actualHits };
}

// Real dynamic scaling. Previously ACCELERATE only *said* it would push intensity
// and then returned the unmodified plan. This actually rewrites the prescribed
// paces from current fitness, so blitzing the gates makes the sessions harder.
function getDynamicShift() {
  const prof = getFitnessProfile();
  if (!prof) return { shift: 0, state: 'none', prof: null };
  const gap = prof.pace12 - GOAL_PACE; // negative = already faster than goal pace
  let shift = 0, state = 'hold';
  if (gap < -0.02) {           // ahead of goal fitness → prescribe faster
    shift = Math.max(gap * 0.6, -0.33);  // cap at 20s/km faster
    state = 'accelerate';
  } else if (gap > 0.30) {     // well short → ease the quality work back
    shift = Math.min((gap - 0.30) * 0.5, 0.25);
    state = 'ease';
  }
  // Gate bonus: hitting benchmarks ahead of schedule earns a further nudge.
  // Computed inline from readiness — calling getAdjustmentRecommendation() here
  // would recurse, since its ACCELERATE branch calls getDynamicShift().
  try {
    const r = getReadiness();
    const w = getProgramWeek();
    const dueTotal = r.benchmarks.filter(b => b.week <= w).length;
    const hitTotal = r.benchmarks.filter(b => b.hit).length;
    if (hitTotal - dueTotal >= 1 && state !== 'ease') { shift -= 0.05; state = 'accelerate'; }
  } catch (e) {}
  return { shift: Math.max(shift, -0.4), state, gap, prof };
}

// Quality work scales; easy and long runs never do — easy must stay easy.
const QUALITY_TYPES = ['tempo', 'interval', 'racepace', 'confidence'];
function scaleSessions(sessions) {
  const d = getDynamicShift();
  if (!d.shift) return { list: sessions, d };
  const list = sessions.map(s => {
    if (!QUALITY_TYPES.includes(s.type)) return s;
    const o = Object.assign({}, s);
    if (o.repPace) o.repPace = Math.max(3.5, o.repPace + d.shift);
    if (o.pace) o.pace = Math.max(3.5, o.pace + d.shift);
    return o;
  });
  return { list, d };
}

function getEffectiveProgram() {
  // Returns the program with dynamic adjustments applied
  // For now: if behind, extend current phase; if ahead, keep original (no compression to avoid burnout)
  const w = getProgramWeek();
  const adj = getAdjustmentRecommendation();
  
  if (!adj) return RUN_PROGRAM; // pre-program or no adjustment needed
  
  // If REPEAT PHASE, shift all future weeks forward by 1
  if (adj.action === 'REPEAT PHASE') {
    const shifted = RUN_PROGRAM.map((p, i) => ({
      ...p,
      week: p.week + (w >= p.week ? 1 : 0) // shift weeks at/past current
    }));
    return shifted;
  }
  
  // Otherwise return original (ON TRACK, HOLD, or ACCELERATE all follow planned path)
  return RUN_PROGRAM;
}

                <span style="color: #fff; font-weight: 500;">${run.distance.toFixed(2)}km</span>
                <span style="color: #A39E93; margin-left: 8px;">${run.time}min</span>
                <span style="color: #6E695F; margin-left: 8px; font-size: 11px;">${date}</span>
              </div>
              <div style="text-align: right;">
                <div style="color: #E8443A; font-weight: 500; font-size: 12px;">${paceStr}/km</div>
                <div style="color: #A39E93; font-size: 11px;">${speed} km/h</div>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function updatePace() {
  const isTreadmill = currentRunType === 'treadmill' || currentRunType === 'interval-treadmill';
  const input1 = parseFloat(document.getElementById('runDistance').value);
  const time = parseInt(document.getElementById('runTime').value);
  
  const paceMinKmEl = document.getElementById('paceMinPerKm');
  const paceKmPerHEl = document.getElementById('paceKmPerH');
  
  if (!input1 || !time || input1 <= 0 || time <= 0) {
    paceMinKmEl.textContent = isTreadmill && treadmillMode === 'distance' ? '--:--' : isTreadmill ? '--' : '--:--';
    paceKmPerHEl.textContent = '--';
    return;
  }
  
  if (isTreadmill && treadmillMode === 'speed') {
    // For treadmill speed mode: input1 is speed (km/h), calculate distance
    const speed = input1;
    const distance = (speed * time) / 60;
    paceMinKmEl.textContent = distance.toFixed(2);
    paceKmPerHEl.textContent = speed.toFixed(1);
  } else {
    // For regular/distance mode: input1 is distance, calculate pace
    const distance = input1;
    const paceMinKm = (time / distance);
    const paceMin = Math.floor(paceMinKm);
    const paceSec = Math.round((paceMinKm - paceMin) * 60);
    const paceStr = `${paceMin}:${paceSec.toString().padStart(2, '0')}`;
    const speed = (distance / time * 60).toFixed(1);
    
    paceMinKmEl.textContent = paceStr;
    paceKmPerHEl.textContent = speed;
  }
}

async function logRun() {
  const type = currentRunType;
  const isTreadmill = type === 'treadmill' || type === 'interval-treadmill';
  const input1 = parseFloat(document.getElementById('runDistance').value);
  const time = parseInt(document.getElementById('runTime').value);
  const notes = document.getElementById('runNotes').value;
  
  if (!input1 || !time || input1 <= 0 || time <= 0) {
    alert('Please enter valid values');
    return;
  }
  
  let distance;
  if (isTreadmill && treadmillMode === 'speed') {
    // input1 is speed (km/h)
    distance = (input1 * time) / 60;
  } else {
    // input1 is distance (km)
    distance = input1;
  }
  
  const pace = time / distance;
  const run = {
    date: new Date().toISOString(),
    type,
    distance: parseFloat(distance.toFixed(2)),
    time,
    pace,
    notes
  };
  
  checkBenchmarkHit(run); // must run BEFORE push — see function comment
  runningLogs.push(run);
  
  await save();
  await checkStageAdvance();
  document.getElementById('runDistance').value = '';
  document.getElementById('runTime').value = '';
  document.getElementById('runNotes').value = '';
  render();
}

function deleteRun(idx) {
  const today = localDateStr(new Date());
  const todaysRuns = runningLogs.filter(r => localDateStr(r.date) === today);
  const run = todaysRuns[idx];
  runningLogs = runningLogs.filter(r => r !== run);
  save();
  render();
}

function addInterval() {
  currentIntervals.push({ speed: 10, time: 5 });
  render();
}

function deleteInterval(idx) {
  currentIntervals.splice(idx, 1);
  render();
}

function updateInterval(idx, field, value) {
  if (field === 'speed') {
    currentIntervals[idx].speed = parseFloat(value) || 0;
  } else if (field === 'time') {
    currentIntervals[idx].time = parseInt(value) || 0;
  }
  updateIntervalTotals();
}

function updateIntervalTotals() {
  let totalDist = 0, totalTime = 0;
  for (const interval of currentIntervals) {
    totalDist += (interval.speed * interval.time) / 60;
    totalTime += interval.time;
  }
  const distEl = document.getElementById('totalDistance');
  const timeEl = document.getElementById('totalTime');
  if (distEl) distEl.textContent = totalDist.toFixed(2);
  if (timeEl) timeEl.textContent = totalTime;
}

async function logIntervalRun() {
  if (currentIntervals.length === 0) {
    alert('Add at least one interval');
    return;
  }
  
  let totalDist = 0, totalTime = 0;
  for (const interval of currentIntervals) {
    totalDist += (interval.speed * interval.time) / 60;
    totalTime += interval.time;
  }
  
  const type = currentRunType;
  const notes = document.getElementById('runNotes').value;
  const pace = totalTime / totalDist;
  
  const run = {
    date: new Date().toISOString(),
    type,
    distance: parseFloat(totalDist.toFixed(2)),
    time: totalTime,
    pace,
    notes,
    intervals: JSON.parse(JSON.stringify(currentIntervals))
  };
  
  checkBenchmarkHit(run); // must run BEFORE push — see function comment
  runningLogs.push(run);
  
  await save();
  currentIntervals = [];
  document.getElementById('runNotes').value = '';
  render();
}


function getDeloadSuggestion() {
  // Detect if 3+ lifts are stalled — requires at least 3 separate SESSIONS with no meaningful e1RM progress
  const stalledExercises = [];
  // Twenty exercise ids appear on more than one day. Grouping by id alone made
  // three different scheduled days for one lift look like three stalled lifts.
  const byExDay = {};
  for (const [exId, logList] of Object.entries(logs)) {
    for (const l of logList) {
      const k = exId + '\u0000' + (l.day || '');
      (byExDay[k] = byExDay[k] || []).push(l);
    }
  }
  for (const [key, logList] of Object.entries(byExDay)) {
    const exId = key.split('\u0000')[0];
    const sessions = groupByDate(logList);
    if (sessions.length < 3) continue; // need at least 3 sessions to call it a stall
    const [s1, s2, s3] = sessions; // most recent first
    const e1 = avgE1RM(s1.sets);
    const e2 = avgE1RM(s2.sets);
    const e3 = avgE1RM(s3.sets);
    const range = Math.max(e1, e2, e3) - Math.min(e1, e2, e3);
    if (range / e1 < 0.02 && !stalledExercises.includes(exId)) stalledExercises.push(exId); // <2% variation across 3 sessions = stall
  }
  return stalledExercises.length >= 3 ? stalledExercises : null;
}

// Stage 1 is "proven" by a logged run of 12km+ at sub-60 pace. When that lands,
// stage 2 unlocks automatically and rebases the program to the following Monday.
function stage1Proven() {
  return runningLogs.some(r => r.distance >= 11.95 && r.time > 0 && (r.time / r.distance) <= 5.02);
}
async function checkStageAdvance() {
  if (runStage !== 1 || !stage1Proven()) return false;
  const done = runningLogs.filter(r => r.distance >= 11.95 && (r.time / r.distance) <= 5.02)
    .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
  const d = new Date(done.date);
  const nextMon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - daysSinceMonday(d) + 7);
  stage2Start = localDateStr(nextMon);
  applyStage(2);
  await saveStage();
  benchmarkCelebration = { benchmark: 'SUB-60 12K — Stage 1 complete. Stage 2 unlocked: 12km @ 4:30.', show: true };
  return true;
}
async function saveStage() {
  const v = JSON.stringify({ runStage, stage2Start });
  try { await window.storage.set('run-stage', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-run-stage', v); } catch(e) {}
}
async function setStageManually(n) {
  if (n === 2 && !stage2Start) stage2Start = localDateStr(new Date());
  applyStage(n);
  await saveStage();
  render();
}

function getPredictedRaceTime() {
  // A 12km prediction is only meaningful if based on longer runs (6km+).
  // A fast 5km tells you top-end pace, not endurance — these are different things.
  // Riegel formula: T2 = T1 × (D2/D1)^1.06
  // The closer the basis run is to 12km, the more reliable the prediction.
  // Use the BEST effort normalised to race distance, not merely the longest run.
  // A sharp 4km says more about your engine than a plodded 8km.
  const recentRuns = runningLogs.filter(r => {
    if (!r.distance || !r.time) return false;
    const daysAgo = (Date.now() - new Date(r.date)) / (1000 * 60 * 60 * 24);
    const pace = r.time / r.distance;
    return daysAgo <= 42 && r.distance >= 2 && pace < 9.0 && pace > 2.5;
  });
  
  if (recentRuns.length < 1) return null;
  
  let basisRun = recentRuns[0], bestEq = Infinity;
  for (const r of recentRuns) {
    const eq = r.time * Math.pow(GOAL_DIST / r.distance, 1.06);
    if (eq < bestEq) { bestEq = eq; basisRun = r; }
  }
  
  const t1 = basisRun.time;
  const d1 = basisRun.distance;
  const d2 = GOAL_DIST;
  
  const predicted12kmTime = t1 * Math.pow(d2 / d1, 1.06);
  const mins = Math.floor(predicted12kmTime);
  const secs = Math.round((predicted12kmTime - mins) * 60);
  return { 
    time: predicted12kmTime, 
    display: `${mins}:${secs.toString().padStart(2, '0')}`,
    basedOn: `${d1}km run`,
    runsUsed: recentRuns.length
  };
}

function getWeeklySummary() {
  const now = new Date();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
  // Compare local date STRINGS — avoids UTC-vs-local midnight mismatch across timezones
  const weekStartStr = localDateStr(weekStart);
  const weekEndStr = localDateStr(weekEnd);
  
  const inThisWeek = (dateStr) => {
    const s = localDateStr(dateStr);
    return s >= weekStartStr && s < weekEndStr;
  };
  
  const currentDays = currentWeek === 'A' ? WEEK_A : WEEK_B;
  // Count SESSIONS, not distinct days. Repeating push-2 on Monday and Friday is two
  // sessions — keying only by dayKey collapsed them into one and undercounted the week.
  // Each entry is "dayKey|YYYY-MM-DD", so the same split on two dates counts twice.
  const doneThisWeek = new Set();

  // 1. Days explicitly marked complete this week
  for (const dayKey of currentDays) {
    if (lastCompleted[dayKey] && inThisWeek(lastCompleted[dayKey])) {
      doneThisWeek.add(dayKey + '|' + localDateStr(lastCompleted[dayKey]));
    }
  }

  // 2. Tagged log entries — one session per (day, date) pair
  for (const dayKey of currentDays) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day !== dayKey || !inThisWeek(l.date)) continue;
        doneThisWeek.add(dayKey + '|' + localDateStr(l.date));
      }
    }
  }

  // 3. Untagged logs: for each date, attribute it to the best-matching split day
  const untaggedByDate = {};
  for (const dayKey of currentDays) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day || !inThisWeek(l.date)) continue;
        const dk = localDateStr(l.date);
        if (!untaggedByDate[dk]) untaggedByDate[dk] = {};
        untaggedByDate[dk][dayKey] = (untaggedByDate[dk][dayKey] || 0) + 1;
      }
    }
  }
  for (const [dateStr, dayCounts] of Object.entries(untaggedByDate)) {
    const best = Object.entries(dayCounts).sort((a, b) => b[1] - a[1])[0];
    if (best) doneThisWeek.add(best[0] + '|' + dateStr);
  }

  const thisWeekRuns = runningLogs.filter(r => inThisWeek(r.date));
  const totalRunDist = thisWeekRuns.reduce((sum, r) => sum + r.distance, 0);
  
  return { completedDays: doneThisWeek.size, runsCompleted: thisWeekRuns.length, totalRunDist };
}

function getStreak() {
  // Count consecutive weeks with 3+ training sessions (lifts + runs combined)
  // The current (in-progress) week doesn't break the streak even if incomplete
  const SESSION_THRESHOLD = 3;
  
  // Build a count of sessions per week (keyed by week-start timestamp)
  const sessionsByWeek = {};
  const tally = (dateStr) => {
    const d = new Date(dateStr);
    const ws = new Date(d);
    ws.setHours(0,0,0,0);
    ws.setDate(d.getDate() - daysSinceMonday(d)); // Monday start
    const key = ws.getTime();
    sessionsByWeek[key] = (sessionsByWeek[key] || 0) + 1;
  };
  // Count one lift session per distinct (split day, date) pair. Using lastCompleted
  // alone undercounts: it only stores the MOST RECENT completion per day key, so
  // repeating a split twice in a week registered once.
  const liftSessions = new Set();
  Object.entries(lastCompleted).forEach(([dk, d]) => { if (d) liftSessions.add(dk + '|' + localDateStr(d)); });
  for (const dayKey of Object.keys(SPLIT)) {
    for (const ex of SPLIT[dayKey].exercises) {
      for (const l of (logs[ex.id] || [])) {
        if (l.day === dayKey) liftSessions.add(dayKey + '|' + localDateStr(l.date));
      }
    }
  }
  liftSessions.forEach(k => tally(k.split('|')[1]));
  runningLogs.forEach(r => tally(r.date));
  
  // Current week start
  const now = new Date();
  const curWeekStart = new Date(now);
  curWeekStart.setHours(0,0,0,0);
  curWeekStart.setDate(now.getDate() - daysSinceMonday(now));
  let cur = new Date(curWeekStart);
  
  let streak = 0;
  let isCurrentWeek = true;
  let guard = 0;
  while (true) {
    const count = sessionsByWeek[cur.getTime()] || 0;
    if (count >= SESSION_THRESHOLD) {
      streak++;
    } else if (isCurrentWeek) {
      // Current week in progress — don't count it, but don't break streak
    } else {
      break; // a past week missed the threshold → streak ends
    }
    isCurrentWeek = false;
    // Step back a calendar week. Subtracting 168 hours lands an hour off across a
    // daylight-saving change, the key misses, and a long streak silently resets.
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - 7);
    if (++guard > 260) break; // 5 years back, max
  }
  
  return streak;
}

// ── Backup safety ─────────────────────────────────────────────────────────────
function validateBackup(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'It is not a backup file.';
  const known = ['logs','runningLogs','currentWeek','SPLIT','lastCompleted','earlyFinishes','timestamp'];
  if (!known.some(k => k in d)) return 'It has none of the fields a backup should have.';
  if ('logs' in d && (typeof d.logs !== 'object' || d.logs === null || Array.isArray(d.logs)))
    return 'The lift logs in it are the wrong shape.';
  if ('runningLogs' in d && !Array.isArray(d.runningLogs))
    return 'The run logs in it are the wrong shape.';
  if ('currentWeek' in d && d.currentWeek !== 'A' && d.currentWeek !== 'B')
    return 'The week in it is neither A nor B.';
  if ('logs' in d) {
    for (const k of Object.keys(d.logs)) if (!Array.isArray(d.logs[k]))
      return 'The sets logged for "' + k + '" are the wrong shape.';
  }
  return null;
}
function cleanLogs(raw) {
  const out = {};
  for (const [exId, list] of Object.entries(raw)) {
    const keep = (list || []).filter(l => l && typeof l.date === 'string' && !isNaN(new Date(l.date))
      && typeof l.reps === 'number' && l.reps > 0
      && (typeof l.weight === 'number' && isFinite(l.weight) && l.weight >= 0));
    if (keep.length) out[exId] = keep;
  }
  return out;
}
function cleanRuns(raw) {
  return raw.filter(r => r && typeof r.date === 'string' && !isNaN(new Date(r.date))
    && typeof r.distance === 'number' && isFinite(r.distance) && r.distance > 0);
}
function summariseBackup(d) {
  const sets = Object.values(d.logs || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
  const lifts = Object.keys(d.logs || {}).length;
  const runs = Array.isArray(d.runningLogs) ? d.runningLogs.length : 0;
  return sets + ' sets across ' + lifts + ' lifts · ' + runs + ' runs';
}
async function saveRestorePoint() {
  const v = JSON.stringify({ at: Date.now(), currentWeek, logs, runningLogs, lastCompleted, earlyFinishes });
  try { await window.storage.set('restore-point', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-restore-point', v); } catch(e) {}
}
async function undoImport() {
  let raw = null;
  try { const r = await window.storage.get('restore-point'); if (r && r.value) raw = r.value; } catch(e) {}
  if (!raw) { try { raw = localStorage.getItem('gym-tracker-restore-point'); } catch(e) {} }

  if (!raw) { alert('There is nothing to undo.'); return; }
  try {
    const p = JSON.parse(raw);
    if (!confirm('Put back the data from just before the last import?\n\n' + summariseBackup(p))) return;
    logs = p.logs || {};
    runningLogs = p.runningLogs || [];
    lastCompleted = p.lastCompleted || {};
    earlyFinishes = Array.isArray(p.earlyFinishes) ? p.earlyFinishes : [];
    if (p.currentWeek) currentWeek = p.currentWeek;
    await save(); await saveWeek(); await saveLastCompleted(); await saveEarlyFinishes();
    alert('✓ Put back.');
    render();
  } catch (e) { alert('That undo point could not be read.'); }
}

async function importData() {
  let hasUndo = false;
  try { hasUndo = !!localStorage.getItem('gym-tracker-restore-point'); } catch(e) {}
  if (hasUndo && confirm('Undo the last restore instead of importing a new file?\n\nOK = undo, Cancel = pick a file.')) {
    return undoImport();
  }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);

      // A file that merely parses is not a backup. Check the shape before it is
      // allowed anywhere near the log store, and keep a restore point either way.
      const problem = validateBackup(data);
      if (problem) { alert('That file was not imported.\n\n' + problem); return; }
      const counts = summariseBackup(data);
      if (!confirm('Restore this backup?\n\n' + counts +
        '\n\nThis replaces everything currently in the app. Your current data is kept as a one-time undo.')) return;
      await saveRestorePoint();
      
      // Restore data — note: SPLIT (exercise definitions) is NOT restored wholesale,
      // or an old backup would wipe newer exercise updates (flags, notes, rep ranges).
      // We only apply the exercise ORDER from the backup.
      if (data.currentWeek) currentWeek = data.currentWeek;
      if (data.SPLIT) {
        for (const dayKey of Object.keys(SPLIT)) {
          if (!data.SPLIT[dayKey] || !data.SPLIT[dayKey].exercises) continue;
          const orderIds = data.SPLIT[dayKey].exercises.map(e => e.id);
          const ordered = [];
          for (const exId of orderIds) {
            const ex = SPLIT[dayKey].exercises.find(e => e.id === exId);
            if (ex && !ordered.includes(ex)) ordered.push(ex);
          }
          for (const ex of SPLIT[dayKey].exercises) {
            if (!ordered.includes(ex)) ordered.push(ex);
          }
          SPLIT[dayKey].exercises = ordered;
        }
      }
      if (data.logs) logs = cleanLogs(data.logs);
      if (data.lastCompleted && typeof data.lastCompleted === 'object' && !Array.isArray(data.lastCompleted)) lastCompleted = data.lastCompleted;
      if (Array.isArray(data.earlyFinishes)) { earlyFinishes = data.earlyFinishes; await saveEarlyFinishes(); }
      if (Array.isArray(data.runningLogs)) runningLogs = cleanRuns(data.runningLogs);
      
      // Persist ALL data types (not just logs/runs)
      await save();
      await saveWeek();
      await saveLastCompleted();
      await saveOrder();
      
      alert('✓ Restored.\n\n' + summariseBackup({ logs, runningLogs }) +
        '\n\nWrong file? Tap 📥 again and choose Undo.');
      render();
    } catch (err) {
      alert('✗ Invalid JSON file: ' + err.message);
    }
  };
  input.click();
}

function checkBenchmarkHit(run) {
  // IMPORTANT: must be called BEFORE the run is pushed into runningLogs,
  // so getReadiness() reflects only prior runs and we can detect a NEW hit.
  if (!run.distance || !run.time) return false;
  const pace = run.time / run.distance;
  const { benchmarks } = getReadiness();
  for (const b of benchmarks) {
    if (b.hit) continue; // already achieved before this run
    // Same matching rule as getReadiness: distance meets-or-exceeds, pace fast enough
    if (run.distance >= b.dist - 0.05 && pace <= b.pace + 0.04) {
      benchmarkCelebration = { benchmark: b.name, show: true };
      setTimeout(() => { benchmarkCelebration.show = false; render(); }, 3000);
      return true;
    }
  }
  return false;
}

async function exportData() {
  const data = {
    timestamp: new Date().toISOString(),
    currentWeek,
    SPLIT,
    logs,
    lastCompleted,
    earlyFinishes,
    runningLogs,
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  try { localStorage.setItem('gym-tracker-last-backup', new Date().toISOString()); } catch(e) {}
  URL.revokeObjectURL(url);
}

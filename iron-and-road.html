// ===== Exercise swap =====
// Build a replacement exercise from the catalog, preserving the slot's set count (volume).
function buildSwapEx(newId, origId, sets) {
  const def = EX_CATALOG[newId];
  const ex = { id: newId, origId: origId, name: def.name, sets: sets, reps: def.reps, notes: def.notes };
  if (def.warmup) ex.warmup = true;
  if (def.bodyweight) ex.bodyweight = true;
  return ex;
}

async function saveExtras() {
  const v = JSON.stringify({ date: localDateStr(new Date()), extras });
  try { await window.storage.set('split-extras', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-split-extras', v); } catch(e) {}
}
function buildExtraEx(id) {
  const def = EX_CATALOG[id];
  const ex = { id: id, name: def.name, sets: 3, reps: def.reps, notes: def.notes, added: true };
  if (def.bodyweight) ex.bodyweight = true;
  return ex;
}
function openAddEx() { addExOpen = true; addExGroup = null; render(); }
function closeAddEx() { addExOpen = false; addExGroup = null; render(); }
function pickAddGroup(g) { addExGroup = g; render(); }
async function doAddEx(id) {
  if (!EX_CATALOG[id] || !selectedDay) return;
  if (!extras[selectedDay]) extras[selectedDay] = [];
  extras[selectedDay].push(id);
  SPLIT[selectedDay].exercises.push(buildExtraEx(id));
  cardOpen[id] = true;
  addExOpen = false; addExGroup = null;
  await saveExtras();
  await saveOrder();
  render();
}
async function removeExtraEx(id) {
  if (!selectedDay) return;
  // Only ever removes one he added, and only when nothing is logged against it today.
  if (getTodaysSets(id).length) return;
  const list = extras[selectedDay] || [];
  const at = list.lastIndexOf(id);
  if (at < 0) return;
  list.splice(at, 1);
  if (!list.length) delete extras[selectedDay];
  const exs = SPLIT[selectedDay].exercises;
  for (let i = exs.length - 1; i >= 0; i--) if (exs[i].id === id && exs[i].added) { exs.splice(i, 1); break; }
  await saveExtras();
  await saveOrder();
  render();
}
async function setExtraSets(id, n) {
  const v = parseInt(n, 10);
  if (!(v >= 1 && v <= 10)) return;
  const ex = SPLIT[selectedDay].exercises.find(e => e.id === id && e.added);
  if (ex) { ex.sets = v; render(); }
}
async function saveSwaps() {
  // Persisted with today's date so swaps hold for the current day and auto-revert
  // overnight. The saved program itself is never overwritten.
  const payload = JSON.stringify({ date: localDateStr(new Date()), swaps });
  try { await window.storage.set('split-swaps', payload); } catch(e) {}
  try { localStorage.setItem('gym-tracker-split-swaps', payload); } catch(e) {}
}

let swapTargetIdx = null;
/* Exercises added to a day on the fly. Day-scoped and reverting overnight, the
   same as swaps, because this is "the shoulder machine was taken so I did
   another chest thing", not a permanent change to the program. */
let extras = {};          // dayKey -> [exerciseId, ...]
let addExOpen = false;
let addExGroup = null;

function openSwap(idx) {
  swapTargetIdx = idx;
  renderSwapModal();
  const m = document.getElementById('swapModal');
  if (m) m.classList.add('show');
}
function closeSwap() {
  const m = document.getElementById('swapModal');
  if (m) m.classList.remove('show');
  swapTargetIdx = null;
}

function renderSwapModal() {
  const body = document.getElementById('swapBody');
  if (!body || swapTargetIdx === null) return;
  const cur = SPLIT[selectedDay].exercises[swapTargetIdx];
  const meta = EX_CATALOG[cur.id];
  if (!meta) { body.innerHTML = '<div class="swap-empty">No alternatives stored for this exercise.</div>'; return; }
  const group = meta.group;
  // Same muscle group only; drop the current exercise and any duplicate display names
  const seen = new Set([cur.name]);
  const cands = Object.keys(EX_CATALOG)
    .filter(id => EX_CATALOG[id].group === group && id !== cur.id)
    .map(id => Object.assign({ id }, EX_CATALOG[id]))
    .filter(c => { if (seen.has(c.name)) return false; seen.add(c.name); return true; });
  // Same movement pattern first ("best match"), then alphabetical
  cands.sort((a, b) => {
    const ap = a.pattern === meta.pattern ? 0 : 1, bp = b.pattern === meta.pattern ? 0 : 1;
    if (ap !== bp) return ap - bp;
    return a.name.localeCompare(b.name);
  });
  const swapped = cur.origId && cur.id !== cur.origId;
  let html = `<div class="swap-sub">${GROUP_LABEL[group] || group} · keeps ${cur.sets} sets</div>`;
  html += `<div class="swap-current">Currently: <strong>${cur.name}</strong></div>`;
  if (cands.length === 0) {
    html += `<div class="swap-empty">No other ${GROUP_LABEL[group] || group} exercises stored yet.</div>`;
  } else {
    html += cands.map(c => {
      const best = c.pattern === meta.pattern;
      return `<button class="swap-item" onclick="doSwap('${c.id}')">
        <div class="swap-item-name">${c.name}${best ? ' <span class="swap-best">best match</span>' : ''}</div>
        <div class="swap-item-meta">${c.equip} · ${c.reps} reps</div>
      </button>`;
    }).join('');
  }
  if (swapped) {
    const orig = EX_CATALOG[cur.origId];
    html += `<button class="swap-reset" onclick="doSwap('${cur.origId}')">↺ Reset to original${orig ? `, ${orig.name}` : ''}</button>`;
  }
  body.innerHTML = html;
}

async function doSwap(newId) {
  if (swapTargetIdx === null) return;
  const day = SPLIT[selectedDay];
  const cur = day.exercises[swapTargetIdx];
  if (!EX_CATALOG[newId]) { closeSwap(); return; }
  const origId = cur.origId || cur.id;
  day.exercises[swapTargetIdx] = buildSwapEx(newId, origId, cur.sets);
  cardOpen[newId] = true;
  if (newId === origId) {
    if (swaps[selectedDay]) { delete swaps[selectedDay][origId]; if (!Object.keys(swaps[selectedDay]).length) delete swaps[selectedDay]; }
  } else {
    if (!swaps[selectedDay]) swaps[selectedDay] = {};
    swaps[selectedDay][origId] = newId;
  }
  await saveSwaps();
  await saveOrder(); // keep saved order ids in sync with the new id
  closeSwap();
  render();
}

/* When was this split day actually trained?

   The SETS are the record, not the button. Every set is written to storage the
   instant it is logged, tagged with its split day, so the log already knows a
   session happened whether or not Mark Day Complete was ever pressed. Reading
   lastCompleted alone made a forgotten button look like a lost workout: the
   day chip said "last 15d ago" while yesterday's sets sat safely in the log.

   lastCompleted is now only the fallback, for a session with nothing logged
   against it. Warmups do not count as a session on their own. */
function sessionDatesFor(dayKey) {
  const out = new Set();
  // Match on the day tag rather than the current exercise list, so sets logged
  // against an exercise that has since been swapped out still count.
  for (const entries of Object.values(logs)) {
    if (!Array.isArray(entries)) continue;
    for (const l of entries) if (l && l.day === dayKey && l.tag !== 'warmup') out.add(localDateStr(l.date));
  }
  if (lastCompleted[dayKey]) out.add(localDateStr(lastCompleted[dayKey]));
  return out;
}
function lastSessionDate(dayKey) {
  let best = null;
  sessionDatesFor(dayKey).forEach(d => { if (!best || d > best) best = d; });
  return best;
}
function trainedInRange(dayKey, startStr, endStr) {
  let hit = false;
  sessionDatesFor(dayKey).forEach(d => { if (d >= startStr && d < endStr) hit = true; });
  return hit;
}
function getLastCompletedForDay(dayKey) {
  const d = lastSessionDate(dayKey);
  if (!d) return null;
  // Use calendar-day difference (via daysAgo), not elapsed hours. Counting hours
  // makes an evening completion read as "today" the next morning (<24h elapsed).
  return daysAgo(d);
}

/* Heal history on load: any PAST day whose log shows a session gets its stamp
   back. Deliberately stops at yesterday. Stamping today would flip the day to
   "completed" on the first set and take the Mark Day Complete button away
   mid-workout, along with the summary it shows you. */
let healedSessions = 0;
function backfillCompletions() {
  const today = localDateStr(new Date());
  for (const dayKey of Object.keys(SPLIT)) {
    let best = null;
    sessionDatesFor(dayKey).forEach(d => { if (d < today && (!best || d > best)) best = d; });
    if (!best) continue;
    const have = lastCompleted[dayKey] ? localDateStr(lastCompleted[dayKey]) : null;
    if (have && have >= best) continue;
    // Noon local, so the stored ISO string lands on the right calendar day in
    // any timezone rather than sliding a day either way.
    lastCompleted[dayKey] = new Date(best + 'T12:00:00').toISOString();
    healedSessions++;
  }
  if (healedSessions) saveLastCompleted();
}

/* Tell him it happened, once, on the load that repaired it. Silent repair of
   something he thought he had lost is worse than no repair: he would still
   believe the sets were gone. */
function showHealedNotice() {
  const n = healedSessions;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<b>' + (n === 1 ? '1 session restored' : n + ' sessions restored') + '</b><br>'
    + 'You logged ' + (n === 1 ? 'it' : 'them') + ' but never pressed the finish button, so the day chip '
    + 'was reading off the button instead of your sets. The sets were never lost. Fixed now, and it will not happen again.';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 9000);
  el.onclick = () => el.remove();
}

async function markDayComplete(dayKey) {
  lastCompleted[dayKey] = new Date().toISOString();
  await saveLastCompleted();
}

function getWarmupRamp(workingWeight) {
  // Calculate warmup sets based on working weight (assumes 20kg barbell)
  const BAR = 20;
  if (!workingWeight || workingWeight <= BAR) return null;
  
  const ramp = [];
  // Empty bar
  ramp.push({ weight: BAR, reps: 10, label: 'Bar' });
  // ~50%
  const w50 = roundToPlate(workingWeight * 0.5);
  if (w50 > BAR) ramp.push({ weight: w50, reps: 5, label: '50%' });
  // ~70%
  const top = () => ramp[ramp.length - 1].weight;
  const w70 = roundToPlate(workingWeight * 0.7);
  if (w70 > top()) ramp.push({ weight: w70, reps: 3, label: '70%' });
  // ~85%
  const w85 = roundToPlate(workingWeight * 0.85);
  if (w85 > top()) ramp.push({ weight: w85, reps: 1, label: '85%' });
  
  return ramp;
}

function roundToPlate(weight) {
  // Round to nearest 2.5kg (smallest practical plate increment per side = 1.25kg = 2.5kg total)
  return Math.round(weight / 2.5) * 2.5;
}

async function undoMarkDayComplete(dayKey) {
  delete lastCompleted[dayKey];
  await saveLastCompleted();
}

function groupByDate(exLogs) {
  const map = {};
  for (const log of exLogs) {
    const day = localDateStr(log.date);
    if (!map[day]) map[day] = { date: log.date, sets: [] };
    map[day].sets.push({ weight: log.weight, reps: log.reps, tag: log.tag, fullDate: log.date });
  }
  Object.values(map).forEach(d => d.sets.sort((a,b) => new Date(a.fullDate) - new Date(b.fullDate)));
  return Object.values(map).sort((a,b) => new Date(b.date) - new Date(a.date));
}

function avgE1RM(sets) {
  const working = sets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset');
  const src = working.length > 0 ? working : sets; // fallback to all if no working sets
  const e1rms = src.map(s => s.weight * (1 + s.reps / 30));
  return e1rms.reduce((a,b) => a+b, 0) / e1rms.length;
}


function formatSets(sets) {
  const working = sets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset');
  const src = working.length > 0 ? working : sets;
  const fmtW = (s) => s.weight === 0 || s.bw ? 'BW' : s.weight + 'kg';
  if (src.every(s => s.weight === src[0].weight && s.reps === src[0].reps)) {
    return `${src.length}×${src[0].reps} @ ${fmtW(src[0])}`;
  }
  return src.map(s => `${fmtW(s)}×${s.reps}`).join(', ');
}

function localDateStr(date) {
  // Returns YYYY-MM-DD in the user's LOCAL timezone — not UTC
  const d = new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Days elapsed since Monday (0=Mon, 1=Tue, ... 6=Sun) — weeks start on Monday
function daysSinceMonday(d) { return (d.getDay() + 6) % 7; }

function daysAgo(date) {
  const today = localDateStr(new Date());
  const then = localDateStr(date);
  const diffMs = new Date(today) - new Date(then);
  const d = Math.round(diffMs / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  return `${d}d ago`;
}

function getTodaysSets(exId) {
  // Day-aware: shared exercises (e.g. tp-cable on push-1 AND sa-1) must not leak
  // sets between days logged on the same date. Untagged legacy sets still show.
  const today = localDateStr(new Date());
  return (logs[exId] || [])
    .filter(l => localDateStr(l.date) === today && (!l.day || !selectedDay || l.day === selectedDay))
    .sort((a,b) => new Date(a.date) - new Date(b.date));
}

function parseRepRange(repsStr) {
  // Parse "5–8", "12-20", "10–12", "AMRAP" etc. Returns {low, high} or null
  if (!repsStr) return { low: 8, high: 12 }; // sensible default
  const nums = repsStr.match(/\d+/g);
  if (!nums || nums.length === 0) return { low: 8, high: 12 };
  if (nums.length === 1) return { low: parseInt(nums[0]), high: parseInt(nums[0]) };
  return { low: parseInt(nums[0]), high: parseInt(nums[1]) };
}

function getEquipment(exId) {
  // Infer from the exercise NAME — IDs lie (lr-db is actually a cable D-handle)
  let name = '';
  for (const day of Object.values(SPLIT)) {
    const ex = day.exercises.find(e => e.id === exId);
    if (ex) { name = ex.name.toLowerCase(); break; }
  }
  if (/cable/.test(name)) return 'cable';
  if (/machine|smith/.test(name)) return 'machine';
  if (/\bdb\b|dumbbell/.test(name)) return 'db';
  if (/\bbb\b|barbell|ez bar/.test(name)) return 'bb';
  return 'other';
}

// Plate-loaded lower body: 2.5kg is a rounding error on a leg press, and the
// program notes always said +5kg for these.
const JUMP_OVERRIDE = { 'lp-m': 5, 'lp-high': 5, 'hs-m': 5, 'ht-bb': 5, 'ht-m': 5, 'gb-m': 5, 'scr-m': 5, 'sclf-m': 5, 'cp-m': 5 };
function getLoadJump(weight, low, high, exId) {
  // Real-world increments only — never suggest a jump the equipment can't make
  if (weight === 0) return 2.5;             // bodyweight → first load is a 2.5kg belt
  if (exId && JUMP_OVERRIDE[exId]) return JUMP_OVERRIDE[exId];
  const eq = exId ? getEquipment(exId) : 'other';
  if (eq === 'db') return weight < 10 ? 1 : 2;        // dumbbell racks: 1kg steps small, 2kg after
  if (eq === 'bb') return 2.5;                         // 1.25 plates per side
  if (eq === 'cable' || eq === 'machine') return 2.5;  // one stack pin
  return weight < 10 ? 1 : 2.5;
}

function getSessionPosition(exId, dateKey, dayKey) {
  // Where in the session this exercise was done that day (0 = first, by first working set time)
  const firsts = [];
  for (const [id, entries] of Object.entries(logs)) {
    let first = null;
    for (const l of entries) {
      if (localDateStr(l.date) !== dateKey) continue;
      if (dayKey && l.day && l.day !== dayKey) continue;
      if (l.tag === 'warmup' || l.tag === 'dropset') continue;
      if (!first || new Date(l.date) < new Date(first)) first = l.date;
    }
    if (first) firsts.push({ id, t: new Date(first).getTime() });
  }
  firsts.sort((a, b) => a.t - b.t);
  const i = firsts.findIndex(f => f.id === exId);
  return i === -1 ? null : i;
}

// Live in-session guidance. Once working sets exist for TODAY, this replaces the
// last-session recommendation so the advice can't contradict what you've already
// lifted this session (e.g. telling you to repeat 26kg after you've hit 28kg).
function getLiveRec(exId, targetSets, repsStr, dayKey) {
  const { low, high } = parseRepRange(repsStr);
  const rangeText = low === high ? `${low}` : `${low}–${high}`;
  const todayWorking = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset');
  if (todayWorking.length === 0) return null;

  const lastSet = todayWorking[todayWorking.length - 1];
  const setsDone = todayWorking.length;
  const setsLeft = targetSets - setsDone;
  const w = lastSet.weight;
  const isBW = w === 0;
  const jump = getLoadJump(w, low, high, exId);
  const disp = kg => isBW ? 'BW' : (+kg.toFixed(2)) + 'kg';
  const nextUp = disp(w + jump);
  const nextDown = disp(Math.max(0, w - jump));
  const topToday = Math.max(...todayWorking.map(s => s.weight));
  const topTodaySets = todayWorking.filter(s => s.weight === topToday);
  const bestReps = Math.max(...topTodaySets.map(s => s.reps));

  const soFar = `${setsDone}/${targetSets} in, last: ${disp(w)}×${lastSet.reps}.`;

  // Session finished: summarise and point at next time
  if (setsLeft <= 0) {
    const minTop = Math.min(...topTodaySets.map(s => s.reps));
    // Did the session fall apart after the first top-weight set?
    const firstTopIdx = todayWorking.findIndex(s => s.weight === topToday);
    const collapsedAfter = todayWorking.slice(firstTopIdx + 1).filter(s => s.reps < low);
    if (collapsedAfter.length > 0 && bestReps >= low) {
      const worst = collapsedAfter.reduce((a, s) => s.reps < a.reps ? s : a, collapsedAfter[0]);
      const droppedToo = collapsedAfter.some(s => s.weight < topToday);
      if (droppedToo) {
        const openAt = Math.max(0, topToday - getLoadJump(topToday, low, high, exId));
        return { type: 'deload', text: `✓ ${targetSets} sets done, but ${disp(topToday)}×${bestReps} then ${disp(worst.weight)}×${worst.reps}, you went past sustainable. Next session open at ${disp(openAt)} and hold ${low}+ across every set.` };
      }
      return { type: 'hold', text: `✓ ${targetSets} sets done. ${disp(topToday)}×${bestReps} then ×${worst.reps}, one good set, not a sustainable load. Repeat ${disp(topToday)} next session and earn ${low}+ on every set before adding weight.` };
    }
    if (minTop >= high) {
      return { type: 'push', text: `✓ All ${targetSets} sets done. You owned ${disp(topToday)} for ${minTop}+ reps across the board, next session start at ${disp(topToday + getLoadJump(topToday, low, high, exId))} and rebuild to ${low}.` };
    }
    if (bestReps >= low) {
      return { type: 'hold', text: `✓ All ${targetSets} sets done. Top: ${disp(topToday)}×${bestReps}. Stay here next session and push every set toward ${high} before adding load.` };
    }
    return { type: 'hold', text: `✓ All ${targetSets} sets done. Top: ${disp(topToday)}×${bestReps}, under your ${rangeText} target. Repeat ${disp(topToday)} next session and build reps to ${low}+.` };
  }

  const setNo = setsDone + 1;
  // Fatigue: reps falling away sharply within the session
  const firstReps = todayWorking[0].reps;
  const fading = setsDone >= 2 && lastSet.reps <= firstReps - 3;

  if (lastSet.reps >= high) {
    return { type: 'push', text: `${soFar} That's the top of your ${rangeText} range, go up. Set ${setNo}: ${nextUp}, aim ${low}+ reps.` };
  }
  if (lastSet.reps >= low) {
    return { type: 'hold', text: `${soFar} In range. Set ${setNo}: stay at ${disp(w)} and match or beat ${lastSet.reps} reps.${fading ? ' Reps are fading, hold the weight, quality over ego.' : ''}` };
  }
  if (setsDone === 1) {
    return { type: 'hold', text: `${soFar} Under your ${rangeText} range. Set ${setNo}: drop to ${nextDown} to land back in range.` };
  }
  return { type: 'deload', text: `${soFar} Below ${low} reps and fading. Set ${setNo}: drop to ${nextDown} and finish the session in range rather than grinding.` };
}

// ===== Rebuild block =====
// Back on Tue 17 Nov after a patchy stretch. Every lift read as "down", which is
// true and no use to anyone. For three weeks the first session back is the
// baseline, the old working weight is a target rather than a verdict, and the
// climb back is quicker than normal progression, because strength you have had
// before returns far faster than it was built. Nothing is deleted. Afterwards,
// progression runs on the sessions since the restart, so the old numbers never
// come back as a "down 18%".
const REBUILD_START = '2026-11-17';
const REBUILD_END = '2026-12-07';            // exclusive: Mon 7 Dec is back to normal
function inRebuild(d) { const x = localDateStr(d || new Date()); return x >= REBUILD_START && x < REBUILD_END; }
function rebuildWeek() {
  const a = mondayOf(new Date(REBUILD_START + 'T12:00:00')), b = mondayOf(new Date());
  return Math.max(1, Math.min(3, Math.round((b - a) / (7 * 86400000)) + 1));
}
// Only what has happened since the restart, once anything has.
function sinceRestart(list) {
  return list.some(l => localDateStr(l.date) >= REBUILD_START) ? list.filter(l => localDateStr(l.date) >= REBUILD_START) : list;
}
const isWorkingSet = l => l.tag !== 'warmup' && l.tag !== 'dropset';
function dayLogsFor(exId, dayKey) {
  const all = logs[exId] || [];
  const tagged = all.filter(l => l.day === dayKey);
  return tagged.length ? tagged : all.filter(l => !l.day);
}
// What he was lifting before the break: the heaviest top set across the last four
// sessions before the restart, inside the four months before it.
function rebuildRef(exId, dayKey) {
  const floor = localDateStr(new Date(new Date(REBUILD_START + 'T12:00:00').getTime() - 120 * 86400000));
  const pre = dayLogsFor(exId, dayKey).filter(l => isWorkingSet(l) && l.weight > 0
    && localDateStr(l.date) < REBUILD_START && localDateStr(l.date) >= floor);
  if (!pre.length) return null;
  let best = null;
  for (const ses of groupByDate(pre).slice(0, 4)) {
    const top = Math.max(...ses.sets.map(x => x.weight));
    const reps = Math.max(...ses.sets.filter(x => x.weight === top).map(x => x.reps));
    if (!best || top > best.top) best = { top, reps, date: ses.date };
  }
  return best;
}
const fmtKgR = kg => (+kg.toFixed(2)) + 'kg';
function getRebuildRec(exId, targetSets, repsStr, dayKey) {
  const ref = rebuildRef(exId, dayKey);
  if (!ref) return null;
  const today = localDateStr(new Date());
  const post = dayLogsFor(exId, dayKey).filter(l => isWorkingSet(l) && localDateStr(l.date) >= REBUILD_START && localDateStr(l.date) !== today);
  const postSessions = groupByDate(post);
  // Three weeks for everything, and past that for any lift that has not yet had
  // two sessions since the restart.
  if (!inRebuild() && postSessions.length >= 2) return null;
  const { low, high } = parseRepRange(repsStr);
  const wk = rebuildWeek(), rir = inRebuild() && wk === 1 ? 3 : 2;
  const tag = inRebuild() ? `Rebuild week ${wk} of 3` : 'Rebuild';
  const old = `${fmtKgR(ref.top)}×${ref.reps}`;
  const step = getLoadJump(ref.top, low, high, exId);
  if (!postSessions.length) {
    const open = Math.max(step, Math.round(ref.top * 0.75 / step) * step);
    return { type: 'start', open, text: `${tag}. Before the break: ${old}. Open at ${fmtKgR(open)} and stop every set with ${rir} reps still in you${rir === 3 ? ', and skip any drop set' : ''}. Today sets the baseline. It is not a test against the old number.` };
  }
  const lw = postSessions[0].sets;
  const top = Math.max(...lw.map(x => x.weight));
  if (!(top > 0) || top >= ref.top * 0.95) return null;   // near the old numbers: normal progression takes over
  const topSets = lw.filter(x => x.weight === top);
  const minReps = Math.min(...topSets.map(x => x.reps));
  const pct = Math.round(top / ref.top * 100);
  if (minReps >= low) {
    const stepNow = getLoadJump(top, low, high, exId);
    const rate = minReps >= high + 2 ? 0.15 : 0.075;           // far too easy last time: climb harder
    const climb = Math.max(stepNow, Math.round(top * rate / stepNow) * stepNow);
    const next = Math.min(ref.top, top + climb);
    return { type: 'push', open: next, text: `${tag}: ${pct}% of your old ${old}. Last time ${formatSets(lw)}, all in range. Go to ${fmtKgR(next)} today with ${rir} reps in reserve. Strength you have had before comes back much faster than it was built.` };
  }
  return { type: 'hold', open: top, text: `${tag}: ${pct}% of your old ${old}. Last time ${formatSets(lw)}, under ${low} on some sets. Stay at ${fmtKgR(top)} and own ${low}+ on every set before it climbs.` };
}
// Today's progress back toward the old best, for the Progress tab.
function rebuildBack(exId, dayKey) {
  const list = dayLogsFor(exId, dayKey).filter(l => isWorkingSet(l) && l.weight > 0);
  const pre = list.filter(l => localDateStr(l.date) < REBUILD_START);
  const post = list.filter(l => localDateStr(l.date) >= REBUILD_START);
  if (!pre.length || !post.length) return null;
  const preBest = Math.max(...groupByDate(pre).map(x => avgE1RM(x.sets)));
  const latest = avgE1RM(groupByDate(post)[0].sets);
  return latest < preBest ? Math.round(latest / preBest * 100) : null;
}

function getRec(exId, targetSets, repsStr, dayKey, todayPos) {
  const rb = getRebuildRec(exId, targetSets, repsStr, dayKey);
  if (rb) return rb;
  const todayStr = localDateStr(new Date());
  const { low, high } = parseRepRange(repsStr);
  const rangeText = low === high ? `${low}` : `${low}–${high}`;
  
  const allLogs = (logs[exId] || []).filter(l => localDateStr(l.date) !== todayStr);
  const taggedLogs = allLogs.filter(l => l.day === dayKey);
  const exLogs = sinceRestart(taggedLogs.length > 0 ? taggedLogs : allLogs.filter(l => !l.day));
  
  const sorted = exLogs.slice().sort((a,b) => new Date(b.date) - new Date(a.date));

  if (sorted.length === 0) {
    return { type: 'start', text: `First session on this day. Pick a weight you can hit ${targetSets} sets of ${rangeText} reps with solid form. Log it and I'll track your progression from here.` };
  }
  
  const sessions = groupByDate(sorted);
  const latest = sessions[0];
  
  const latestWorking = latest.sets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset');
  if (latestWorking.length === 0) {
    return { type: 'start', text: `Only warmup sets logged last session. Log your working sets and I'll start tracking progression.` };
  }
  
  const latestTop = Math.max(...latestWorking.map(s => s.weight));
  // Judge reps ONLY on sets performed at the top working weight. Averaging reps
  // across mixed loads (a light high-rep set + heavy low-rep sets) yields a
  // meaningless number and produces advice that contradicts the actual sets.
  const latestTopSets = latestWorking.filter(s => s.weight === latestTop);
  const latestAvgReps = latestTopSets.reduce((a,s) => a+s.reps, 0) / latestTopSets.length;
  const latestMinReps = Math.min(...latestTopSets.map(s => s.reps));
  const latestE1RM = avgE1RM(latestWorking);
  const jump = getLoadJump(latestTop, low, high, exId);
  const isBW = latestTop === 0;
  const topDisplay = isBW ? 'BW' : latestTop + 'kg';
  const nextDisplay = isBW ? 'BW +2.5kg' : (latestTop + jump).toFixed(2).replace(/\.?0+$/, '') + 'kg';
  
  // Gate loading: high-rep work AND any jump >15% of current load must own the
  // TOP of the range on EVERY set first (one stack pin at 12.5kg is a 20% jump)
  const isHighRep = high >= 15;
  const bigRelativeJump = !isBW && latestTop > 0 && (jump / latestTop) > 0.15;
  const strictGate = isHighRep || bigRelativeJump;
  const readyToLoad = strictGate ? latestMinReps >= high : latestAvgReps >= high;
  const gateNote = bigRelativeJump ? ` (+${jump}kg here is ${Math.round(jump/latestTop*100)}%, every set must earn it)` : '';
  
  // Fatigue context: today's slot vs the slot in the comparison session
  let fatigueNote = '';
  let fatigueSaves = false;
  if (todayPos !== undefined && todayPos !== null) {
    const prevPos = getSessionPosition(exId, localDateStr(latest.date), dayKey);
    if (prevPos !== null) {
      const delta = todayPos - prevPos;
      if (delta >= 2) {
        fatigueNote = ` Slotted ${delta} spots later than last time, expect ~5% less under fatigue. Matching last session IS progress here.`;
        fatigueSaves = true;
      } else if (delta <= -2) {
        fatigueNote = ` ${Math.abs(delta)} spots fresher than last time, good day to attack the top of the range.`;
      }
    }
  }

  // ── Overreach check ──
  // A single strong set at the top weight shouldn't green-light more load if the
  // session fell apart afterwards (e.g. 28×10 then 28×4, or 28×10 then 26×6).
  // Judge sustainability across the sets that FOLLOWED the first top-weight set.
  const dispW = wt => wt === 0 ? 'BW' : (+wt.toFixed(2)) + 'kg';
  const firstTopIdx = latestWorking.findIndex(s => s.weight === latestTop);
  const afterTop = latestWorking.slice(firstTopIdx + 1);
  const collapsed = afterTop.filter(s => s.reps < low);
  const bestTopReps = Math.max(...latestTopSets.map(s => s.reps));
  if (collapsed.length > 0 && bestTopReps >= low) {
    const recLine = `Last: ${formatSets(latestWorking)}`;
    const worst = collapsed.reduce((a, s) => s.reps < a.reps ? s : a, collapsed[0]);
    const droppedAndStillFailed = collapsed.some(s => s.weight < latestTop);
    // Heaviest load below the failed top weight that you actually hit in range at
    // some point. Requiring EVERY set at that load to be in range is too harsh —
    // late-session sets are fatigued by the overreach itself, not too heavy per se.
    const weightsUsed = [...new Set(latestWorking.map(s => s.weight))]
      .filter(wt => !droppedAndStillFailed || wt < latestTop)
      .sort((a, b) => b - a);
    let sustainable = null;
    for (const wt of weightsUsed) {
      const at = latestWorking.filter(s => s.weight === wt);
      if (at.some(s => s.reps >= low)) { sustainable = wt; break; }
    }
    if (droppedAndStillFailed) {
      const openAt = sustainable !== null ? sustainable : Math.max(0, latestTop - jump);
      return { type: 'deload', text: `${recLine}. You hit ${topDisplay}×${bestTopReps}, then dropped to ${dispW(worst.weight)}×${worst.reps}, that top set cost you the rest of the session. Open at ${dispW(openAt)} and hold ${low}+ across all ${targetSets} sets before going back to ${topDisplay}.${fatigueNote}` };
    }
    return { type: 'hold', text: `${recLine}. You owned ${topDisplay}×${bestTopReps} but it fell to ×${worst.reps}, one good set, not a sustainable load. Stay at ${topDisplay} and earn ${low}+ on every set before adding weight.${fatigueNote}` };
  }

  if (sessions.length === 1) {
    const rec = `Last: ${formatSets(latestWorking)}`;
    if (readyToLoad) {
      return { type: 'push', text: `${rec}. Hit the top of your ${rangeText} range, add load. ${strictGate ? `${nextDisplay}${gateNote}, reset to ${low} reps and build back up.` : `Try ${nextDisplay}, aim for ${low}+ reps.`}${fatigueNote}` };
    } else if (latestAvgReps >= low) {
      return { type: 'hold', text: `${rec}. In range. The lever is reps: push toward ${high} at ${topDisplay}${strictGate ? ' on every set' : ''}. Hit ${high}${strictGate ? ' across the board' : ''} → ${nextDisplay}.${fatigueNote}` };
    } else {
      return { type: 'hold', text: `${rec}. Below your ${rangeText} target, a touch heavy. Hold ${topDisplay} and build reps to ${low}+ on every set before adding load.${fatigueNote}` };
    }
  }

  const prev = sessions[1];
  const prevWorking = prev.sets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset');
  const prevTop = prevWorking.length > 0 ? Math.max(...prevWorking.map(s => s.weight)) : 0;
  const prevTopSets = prevWorking.filter(s => s.weight === prevTop);
  const prevAvgReps = prevTopSets.length > 0 ? prevTopSets.reduce((a,s) => a+s.reps, 0) / prevTopSets.length : 0;
  const prevE1RM = avgE1RM(prevWorking.length > 0 ? prevWorking : prev.sets);
  
  const e1rmGain = ((latestE1RM - prevE1RM) / prevE1RM) * 100;
  const repGain = latestAvgReps - prevAvgReps;

  // Stall ladder: 3 flat → PUSH harder · 4 flat → deload
  const flatVals = n => sessions.slice(0, n).map(s => {
    const wk = s.sets.filter(x => x.tag !== 'warmup' && x.tag !== 'dropset');
    return avgE1RM(wk.length > 0 ? wk : s.sets);
  });
  if (sessions.length >= 4) {
    const v = flatVals(4);
    if ((Math.max(...v) - Math.min(...v)) / latestE1RM < 0.02) {
      return { type: 'deload', text: `Four sessions flat at ${topDisplay}. You've pushed, now reset: drop to ${(latestTop * 0.88).toFixed(1)}kg for a week, move it crisply, and the rebound usually breaks the wall.` };
    }
  }
  if (sessions.length >= 3) {
    const v = flatVals(3);
    if ((Math.max(...v) - Math.min(...v)) / latestE1RM < 0.02) {
      return { type: 'push', text: `Three sessions stuck at ${topDisplay}, force it. Rest exactly 2:00, 3s eccentrics, add ONE rep to set 1. Break ${Math.min(high, Math.round(latestAvgReps) + 1)} reps and ${nextDisplay} unlocks. Still flat next time → deload.${fatigueNote}` };
    }
  }

  if (e1rmGain > 3) {
    if (readyToLoad) {
      return { type: 'push', text: `+${e1rmGain.toFixed(1)}% and you've hit the ceiling of ${rangeText}. Load it: ${nextDisplay}${gateNote}${strictGate ? `, rebuild from ${low} reps` : `, aim ${low}+ reps`}.${fatigueNote}` };
    }
    return { type: 'push', text: `+${e1rmGain.toFixed(1)}% stronger. Keep climbing reps toward ${high} at ${topDisplay}${strictGate ? ' on every set' : ''}. Ceiling first, then ${nextDisplay}.${fatigueNote}` };
  }
  else if (e1rmGain > 0.5) {
    if (repGain >= 2) {
      return { type: 'push', text: `✓ +${repGain.toFixed(0)} reps at ${topDisplay}. ${readyToLoad ? `You've hit ${high}, move to ${nextDisplay}${gateNote}.` : `${Math.max(1, Math.round(high - latestAvgReps))} more reps before the weight moves. Keep filling the range.`}${fatigueNote}` };
    }
    return { type: 'hold', text: `✓ Small gain. Chase ${Math.min(high, Math.ceil(latestAvgReps + 1))} reps on all sets at ${topDisplay}${strictGate ? ', every set hits the ceiling before load moves' : ''}.${fatigueNote}` };
  }
  else if (e1rmGain >= -0.5) {
    return { type: 'hold', text: `→ Flat from last session. Same weight (${topDisplay}), chase +1 rep per set${fatigueNote ? '.' : ', and check sleep and food if it happens again.'}${fatigueNote}` };
  }
  else {
    if (fatigueSaves) {
      return { type: 'hold', text: `→ Down ${Math.abs(e1rmGain).toFixed(1)}%, but you hit this exercise much deeper into the session than last time, that's fatigue, not lost strength. Hold ${topDisplay}; judge it next time the slot is fresh.` };
    }
    return { type: 'deload', text: `Down ${Math.abs(e1rmGain).toFixed(1)}% on working sets. Don't chase it, repeat ${topDisplay} with a slow 3s eccentric, targeting ${rangeText}. Drops again next time → cut 5–10% and rebuild.${fatigueNote}` };
  }
}

function renderWeekIndicator() {
  const dEl = document.getElementById('todayDate');
  if (dEl) dEl.textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
}

function shortDayName(name) {
  // "Leg 1 (W1 - Quad Emphasis)" → "Leg 1"
  return name.replace(/\s*\(.*?\)\s*/g, '').trim();
}

// A day chip is about 65px wide on a phone. "Shoulders/Arms 1" is not.
// The trailing 1/2 is dropped too: the Week A/B toggle directly above already
// says which week it is, and the full name is in the session header below.
function chipDayName(name) {
  return shortDayName(name)
    .replace(/\s*\d+$/, '')
    .replace(/^Shoulders\/Arms/i, 'Sh/Arms')
    .replace(/^Chest\/Back/i, 'Ch/Back');
}

function mondayOf(d) {
  const x = new Date(d);
  return new Date(x.getFullYear(), x.getMonth(), x.getDate() - daysSinceMonday(x));
}
function thisMonday() { return localDateStr(mondayOf(new Date())); }
function nextMonday() {
  const m = mondayOf(new Date());
  return new Date(m.getFullYear(), m.getMonth(), m.getDate() + 7);
}
// Which week the calendar says it is. Null until an anchor exists.
function autoWeek() {
  if (!weekAnchor || !weekAnchor.monday) return null;
  const a = mondayOf(new Date(weekAnchor.monday + 'T00:00:00'));
  const weeks = Math.round((mondayOf(new Date()) - a) / (7 * 86400000));
  const flipped = (((weeks % 2) + 2) % 2) === 1;
  return flipped ? (weekAnchor.week === 'A' ? 'B' : 'A') : weekAnchor.week;
}
function applyAutoWeek() {
  if (!weekAnchor) { weekAnchor = { monday: thisMonday(), week: currentWeek }; saveWeekAnchor(); return; }
  const w = autoWeek();
  if (w && w !== currentWeek) { currentWeek = w; selectedDay = null; saveWeek(); }
}
async function saveWeekAnchor() {
  const v = JSON.stringify(weekAnchor);
  try { await window.storage.set('week-anchor', v); } catch(e) {}
  try { localStorage.setItem('gym-tracker-week-anchor', v); } catch(e) {}
}

async function setWeek(w) {
  if (currentWeek === w) return;
  currentWeek = w;
  // Re-anchor: you have just told it which week this is, so every Monday from
  // here flips correctly without you having to remember again.
  weekAnchor = { monday: thisMonday(), week: w };
  selectedDay = null;
  reorderMode = false;
  await saveWeek();
  await saveWeekAnchor();
  await savePlace();
  render();
}

async function toggleWeek() {
  await setWeek(currentWeek === 'A' ? 'B' : 'A');
}

let currentStopId = null;   // the lift you are on: the first one not finished
let noteOpen = {};          // per-exercise "How to" panel
function toggleNote(exId) { noteOpen[exId] = !noteOpen[exId]; render(); }
function exDone(ex) {
  const n = getTodaysSets(ex.id).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  return n >= ex.sets || isManualDone(ex.id, selectedDay);
}
function renderTrack() {
  const day = selectedDay ? SPLIT[selectedDay] : null;
  let sub = 'Week ' + currentWeek + (inRebuild() ? ' \u00b7 Rebuild ' + rebuildWeek() + ' of 3' : '');
  if (day) {
    const done = day.exercises.filter(exDone).length;
    const first = day.exercises.find(ex => !exDone(ex));
    currentStopId = first ? first.id : '';
    sub += ' \u00b7 ' + (first ? 'stop ' + (day.exercises.indexOf(first) + 1) + ' of ' + day.exercises.length : 'all ' + day.exercises.length + ' stops done');
  }
  return mapHead({ title: day ? shortDayName(day.name) : 'Lift', sub })

}

function renderDaySelector() {

  const isCompleted = lastCompleted[selectedDay] && localDateStr(lastCompleted[selectedDay]) === localDateStr(new Date());
  
  // Session progress: exercises with all working sets logged
  const doneCount = day.exercises.filter(ex => {

  const total = day.exercises.length;

  // ── Day finished screen ──

          <div style="display:flex; flex-wrap:wrap; gap:5px;">
            ${groups.map(g => `<button onclick="pickAddGroup('${g}')" style="background:#EEF2F1;border:1px solid #C9D6D3;color:#3E5158;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;">${GROUP_LABEL[g]}</button>`).join('')}
          </div>
        </div>`;
      }
      const here = new Set(SPLIT[selectedDay].exercises.map(e => e.id));
      const seen = new Set();
      const cands = Object.keys(EX_CATALOG)
        .filter(id => EX_CATALOG[id].group === addExGroup && !here.has(id))
        .map(id => Object.assign({ id }, EX_CATALOG[id]))
        .filter(c => { if (seen.has(c.name)) return false; seen.add(c.name); return true; })
        .sort((a, b) => a.name.localeCompare(b.name));
      return `<div style="background:#F4F7F6; border:1px solid #C9D6D3; border-radius:10px; padding:12px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <button onclick="pickAddGroup(null)" style="background:none;border:none;color:#7A5200;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;">\u2039 ${GROUP_LABEL[addExGroup]}</button>
          <button onclick="closeAddEx()" style="background:none;border:none;color:#5B6E74;font-size:16px;cursor:pointer;font-family:inherit;line-height:1;">\u00d7</button>
        </div>
        ${cands.length ? cands.map(c => `<button class="swap-item" onclick="doAddEx('${c.id}')">
            <div class="swap-item-name">${c.name}</div>

          </button>`).join('')
          : `<div class="swap-empty">Everything stored for ${GROUP_LABEL[addExGroup]} is already on today.</div>`}
      </div>`;
    })() : ''}
    ${reorderMode ? `
      <p style="font-size:12px;color:var(--text-3);margin:-6px 0 10px;line-height:1.5;">

    ${(() => {
      let lastLogged = null;
      for (const ex of day.exercises) {
        for (const l of (logs[ex.id] || [])) {
          if (l.day !== selectedDay) continue;
          if (!lastLogged || new Date(l.date) > new Date(lastLogged)) lastLogged = l.date;
        }
      }
      return `
        <div style="font-size:13px;color:var(--text-2);margin-bottom:2px;">${day.exercises.length} lifts \u00b7 ${lastLogged ? 'last logged ' + daysAgo(lastLogged) : 'first session on this day, so today sets your baseline'}</div>
        ${(() => { const n = earlyFinishesThisWeek(); return `<div style="font-size:12px;color:${n > 0 ? '#7A5200' : 'var(--text-3)'};margin-bottom:12px;">${n === 0 ? 'No early finishes this week' : n + ' early finish' + (n === 1 ? '' : 'es') + ' this week'}</div>`; })()}`;
    })()}
    <div id="exerciseList" class="route">

    </div>
    ${isCompleted ? `
      <div class="card" style="border-color: rgba(55,200,113,0.35); text-align: center;">
        <div style="color: var(--green); font-weight: 800; margin-bottom: 8px;">✓ Day completed</div>
        <button class="btn" style="width:100%; background: var(--raised); color: var(--text); border: 1px solid var(--line);" onclick="undoMarkDayComplete('${selectedDay}'); render();">Undo</button>
      </div>

      <button class="btn" onclick="completeDay('${selectedDay}')" style="width:100%;margin-top:8px;padding:14px;font-size:15px;">

    ${renderCancelDay()}
  `;
}

      </div>

      </div>

  }
  return `<button class="btn" onclick="askCancelDay('${selectedDay}')" style="width:100%; margin-top:10px; padding:11px; font-size:13px; background:var(--raised); color:var(--text-2); border:1px solid var(--line);">
    \u2715 Cancel this day
  </button>
  <p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:6px;line-height:1.5;">
    Started the wrong day? This clears today's sets for it so it does not count as a session.
  </p>`;
}

function getSessionSummary(dayKey) {
  const day = SPLIT[dayKey];
  const today = localDateStr(new Date());
  const prs = [];
  const incomplete = [];
  let improved = 0, regressed = 0, flat = 0, exercisesLogged = 0;
  let volumeToday = 0, volumeLast = 0;
  let hasComparison = false;
  
  for (const ex of day.exercises) {
    const allLogs = logs[ex.id] || [];
    const todaySets = allLogs.filter(l => localDateStr(l.date) === today && l.tag !== 'warmup' && l.tag !== 'dropset');
    // Day-isolated prior history (legacy untagged fallback) — matches getRec/PR logic
    const rawPrior = allLogs.filter(l => localDateStr(l.date) !== today);
    const taggedPrior = rawPrior.filter(l => l.day === dayKey);
    const priorLogs = taggedPrior.length > 0 ? taggedPrior : rawPrior.filter(l => !l.day);
    const priorSessions = groupByDate(priorLogs); // most recent first
    
    const doneCount = todaySets.length;
    if (doneCount < ex.sets) {
      incomplete.push({ name: ex.name, done: doneCount, target: ex.sets });
    }
    if (doneCount === 0) continue;
    exercisesLogged++;
    
    const todayVol = todaySets.reduce((s, x) => s + x.weight * x.reps, 0);
    volumeToday += todayVol;
    const todayBestE1RM = Math.max(...todaySets.map(s => s.weight * (1 + s.reps / 30)));
    
    // All-time prior best → PR check
    let priorBestE1RM = 0;
    for (const l of priorLogs) {
      const e = l.weight * (1 + l.reps / 30);
      if (e > priorBestE1RM) priorBestE1RM = e;
    }
    if (priorLogs.length > 0 && todayBestE1RM > priorBestE1RM * 1.01) {
      prs.push({ name: ex.name, e1rm: Math.round(todayBestE1RM) });
    }
    
    // vs most recent prior session
    if (priorSessions.length > 0) {
      hasComparison = true;
      const lastSets = priorSessions[0].sets;
      volumeLast += lastSets.reduce((s, x) => s + x.weight * x.reps, 0);
      const lastBestE1RM = Math.max(...lastSets.map(s => s.weight * (1 + s.reps / 30)));
      if (todayBestE1RM > lastBestE1RM * 1.01) improved++;
      else if (todayBestE1RM < lastBestE1RM * 0.99) regressed++;
      else flat++;
    }
  }
  
  // Verdict
  let verdict, verdictColor, verdictEmoji;
  if (!hasComparison) {
    verdict = 'Baseline set'; verdictColor = '#1D6A82'; verdictEmoji = '';
  } else if (prs.length > 0) {
    verdict = 'PR session!'; verdictColor = '#7A5200'; verdictEmoji = '';
  } else if (improved > regressed) {
    verdict = 'Stronger than last time'; verdictColor = '#1B7F5A'; verdictEmoji = '';
  } else if (regressed > improved) {
    verdict = 'Down from last time'; verdictColor = '#B93D0B'; verdictEmoji = '';
  } else {
    verdict = 'Holding steady'; verdictColor = '#1D6A82'; verdictEmoji = '→';
  }
  
  const volChange = volumeLast > 0 ? ((volumeToday - volumeLast) / volumeLast) * 100 : null;
  
  return { prs, incomplete, improved, regressed, flat, volumeToday, volumeLast, volChange, exercisesLogged, verdict, verdictColor, verdictEmoji, hasComparison, dayName: day.name };
}

function showSessionSummaryModal(s) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px;';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  
  const volLine = s.volChange !== null
    ? `<div style="display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #C9D6D3;">
         <span style="color:#3E5158; font-size:13px;">Total volume</span>
         <span style="font-size:13px; font-weight:600; color:${s.volChange >= 0 ? '#1B7F5A' : '#B93D0B'};">${Math.round(s.volumeToday).toLocaleString()}kg <span style="font-size:12px;">(${s.volChange >= 0 ? '+' : ''}${s.volChange.toFixed(0)}%)</span></span>
       </div>`
    : `<div style="display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #C9D6D3;">

// Drag-to-reorder, on pointer events rather than HTML5 drag-and-drop. HTML5 DnD
// does not fire at all on a touch screen, so on a phone the ⋮⋮ handle did nothing
// while `touch-action: none` on the cards killed scrolling for the whole tab.
// Now only the handle takes the gesture and the rest of the card scrolls normally.
let rDrag = null;
function reorderGrab(e) {
  if (!reorderMode || (e.button !== undefined && e.button > 0)) return;
  const card = e.target.closest('.card.reorder-mode');
  if (!card || !card.parentNode) return;
  rDrag = { card: card, list: card.parentNode, anchorY: e.clientY, dy: 0, moved: false };
  card.classList.add('dragging');
  card.classList.remove('settling');
  try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
  if (navigator.vibrate) navigator.vibrate(8);
}
function reorderMove(e) {
  if (!rDrag) return;
  e.preventDefault();
  rDrag.dy = e.clientY - rDrag.anchorY;
  if (Math.abs(rDrag.dy) > 3) rDrag.moved = true;
  rDrag.card.style.transform = 'translateY(' + rDrag.dy + 'px)';

  // Swap past whichever neighbour the pointer is currently over
  const cards = Array.prototype.slice.call(rDrag.list.querySelectorAll('.card.reorder-mode'));
  for (let i = 0; i < cards.length; i++) {
    const other = cards[i];
    if (other === rDrag.card) continue;
    const r = other.getBoundingClientRect();
    if (e.clientY > r.top && e.clientY < r.bottom) {
      const mid = r.top + r.height / 2;
      if (e.clientY < mid) rDrag.list.insertBefore(rDrag.card, other);
      else rDrag.list.insertBefore(rDrag.card, other.nextSibling);
      rDrag.anchorY = e.clientY;          // re-anchor so it stays under the finger
      rDrag.dy = 0;
      rDrag.card.style.transform = 'translateY(0px)';
      break;
    }
  }
  // Reach the ends of a long list without letting go
  const vh = window.innerHeight;
  if (e.clientY < 90) window.scrollBy(0, -14);
  else if (e.clientY > vh - 120) window.scrollBy(0, 14);
}
async function reorderDrop(e) {
  if (!rDrag) return;
  const card = rDrag.card, list = rDrag.list, moved = rDrag.moved;
  rDrag = null;
  card.classList.add('settling');
  card.style.transform = '';
  card.classList.remove('dragging');
  setTimeout(function () { card.classList.remove('settling'); }, 180);
  if (!moved) return;
  // Read the new order straight off the DOM, then rebuild the array to match
  const ids = Array.prototype.slice.call(list.querySelectorAll('.card.reorder-mode'))
    .map(function (c) { return c.getAttribute('data-exid'); });
  const arr = SPLIT[selectedDay].exercises, next = [];
  ids.forEach(function (id) {
    const ex = arr.filter(function (x) { return x.id === id; })[0];
    if (ex && next.indexOf(ex) < 0) next.push(ex);
  });
  arr.forEach(function (ex) { if (next.indexOf(ex) < 0) next.push(ex); });
  SPLIT[selectedDay].exercises = next;
  await saveOrder();
  render();
  if (navigator.vibrate) navigator.vibrate(12);
}
document.addEventListener('pointermove', reorderMove, { passive: false });
document.addEventListener('pointerup', reorderDrop);
document.addEventListener('pointercancel', reorderDrop);
// Restore the programmed sequence for the current day
async function resetDayOrder() {
  const orig = DEFAULT_SPLIT[selectedDay];
  if (!orig) return;
  const cur = SPLIT[selectedDay].exercises;
  const ordered = [];
  for (const o of orig.exercises) {
    const match = cur.find(e => (e.origId || e.id) === o.id);
    if (match) ordered.push(match);
  }
  for (const e of cur) if (!ordered.includes(e)) ordered.push(e);
  SPLIT[selectedDay].exercises = ordered;
  await saveOrder();
  render();
}

async function moveExercise(idx, direction) {
  const day = SPLIT[selectedDay];
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= day.exercises.length) return;
  const arr = day.exercises;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  await saveOrder();
  render();
}

function sparkSVG(values, color) {
  // Tiny e1RM trend, oldest → newest
  if (!values || values.length < 2) return '';
  const w = 64, h = 20, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / span) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function isManualDone(exId, dayKey) {

function earlyFinishesThisWeek() {

  ws.setHours(0, 0, 0, 0);

// Guardrail: a tap on "Finish early" opens an honesty prompt rather than finishing instantly
function askFinish(exId) {

  finishConfirm = exId;

function cancelFinish() { finishConfirm = null; render(); }
async function confirmFinish(exId) {
  const done = regularSetsToday(exId);
  if (done < 1) { finishConfirm = null; render(); return; } // safety: at least one working set
  manualDone[exId + '|' + selectedDay] = localDateStr(new Date());
  cardOpen[exId] = false;
  finishConfirm = null;
  const ex = SPLIT[selectedDay].exercises.find(e => e.id === exId);
  earlyFinishes.push({ date: new Date().toISOString(), exId, day: selectedDay, done, target: ex ? ex.sets : null });
  await saveManualDone();

}
/* Start a day, change your mind, and the app should not carry on believing you
   did it. Clearing the completion flag alone is not enough now that completion
   is derived from the logged sets: the sets themselves have to go, or the day
   still counts toward the week, the streak and the calendar. */
function todaysSetsForDay(dayKey) {
  const today = localDateStr(new Date());
  const out = [];
  for (const exId of Object.keys(logs)) {
    if (!Array.isArray(logs[exId])) continue;
    logs[exId].forEach(l => {
      if (l && l.day === dayKey && localDateStr(l.date) === today) out.push({ exId, l });
    });
  }
  return out;
}
function askCancelDay(dayKey) { cancelConfirm = dayKey; render(); }
function dismissCancel() { cancelConfirm = null; render(); }

async function cancelDay(dayKey) {
  const today = localDateStr(new Date());
  const removed = todaysSetsForDay(dayKey);
  // Everything is stashed first, so this is reversible for the rest of the day.
  cancelUndo = {
    day: dayKey,
    sets: removed.map(x => ({ exId: x.exId, l: x.l })),
    completed: lastCompleted[dayKey] && localDateStr(lastCompleted[dayKey]) === today
      ? lastCompleted[dayKey] : null,
    manual: Object.keys(manualDone).filter(k => k.endsWith('|' + dayKey)).map(k => [k, manualDone[k]]),
    early: earlyFinishes.filter(e => e.day === dayKey && localDateStr(e.date) === today),
    extras: (extras[dayKey] || []).slice(),
    at: Date.now()
  };
  // sets
  for (const exId of Object.keys(logs)) {
    if (!Array.isArray(logs[exId])) continue;
    logs[exId] = logs[exId].filter(l => !(l && l.day === dayKey && localDateStr(l.date) === today));
    if (!logs[exId].length) delete logs[exId];
  }
  // the completion flag, but only if it was stamped today
  if (cancelUndo.completed) delete lastCompleted[dayKey];
  cancelUndo.manual.forEach(([k]) => delete manualDone[k]);
  earlyFinishes = earlyFinishes.filter(e => !(e.day === dayKey && localDateStr(e.date) === today));
  // exercises added to the day today go with it
  if (extras[dayKey]) {
    delete extras[dayKey];
    SPLIT[dayKey].exercises = SPLIT[dayKey].exercises.filter(e => !e.added);
  }
  cancelConfirm = null;
  cardOpen = {};
  await save();
  await saveLastCompleted();
  await saveManualDone();
  await saveEarlyFinishes();
  await saveExtras();
  render();
}

async function undoCancelDay() {
  const u = cancelUndo;
  if (!u) return;
  u.sets.forEach(({ exId, l }) => { (logs[exId] = logs[exId] || []).push(l); });
  Object.keys(logs).forEach(k => logs[k].sort((a, b) => new Date(a.date) - new Date(b.date)));
  if (u.completed) lastCompleted[u.day] = u.completed;
  u.manual.forEach(([k, v]) => { manualDone[k] = v; });
  earlyFinishes = earlyFinishes.concat(u.early);
  if (u.extras.length) {
    extras[u.day] = u.extras.slice();
    u.extras.forEach(id => { if (EX_CATALOG[id]) SPLIT[u.day].exercises.push(buildExtraEx(id)); });
  }
  cancelUndo = null;
  await save();
  await saveLastCompleted();
  await saveManualDone();
  await saveEarlyFinishes();
  await saveExtras();
  render();
}

async function reopenEx(exId) {
  delete manualDone[exId + '|' + selectedDay];
  const t = localDateStr(new Date());
  earlyFinishes = earlyFinishes.filter(e => !(e.exId === exId && e.day === selectedDay && localDateStr(e.date) === t));
  await saveManualDone();
  await saveEarlyFinishes();
  render();
}

function renderExerciseCard(ex, idx, totalCount) {
  if (reorderMode) {
    return `
      <div class="card reorder-mode" data-idx="${idx}" data-exid="${ex.id}">
        <div class="exercise-header">
          <div>
            <div class="exercise-name">${idx + 1}. ${ex.name}</div>
            <div class="exercise-meta">${ex.sets} sets</div>
          </div>
          <span class="reorder-handle" role="button" tabindex="0" aria-label="Drag to reorder ${ex.name}"
                onpointerdown="reorderGrab(event)">&#10303;</span>
        </div>
        <div class="move-buttons">
          <button class="move-btn" onclick="moveExercise(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑ Up</button>
          <button class="move-btn" onclick="moveExercise(${idx}, 1)" ${idx === totalCount - 1 ? 'disabled' : ''}>↓ Down</button>
        </div>

      </div>
    `;
  }

  const rbRec = getRebuildRec(ex.id, ex.sets, ex.reps, selectedDay);
  const rec = getLiveRec(ex.id, ex.sets, ex.reps, selectedDay) || getRec(ex.id, ex.sets, ex.reps, selectedDay, idx);
  const todaysSets = getTodaysSets(ex.id);
  const today = localDateStr(new Date());
  const rawPrior = (logs[ex.id] || []).filter(l => localDateStr(l.date) !== today);
  // Day-isolated history: Week A and Week B variants track independently (legacy untagged logs as fallback)
  const taggedPrior = rawPrior.filter(l => l.day === selectedDay);
  const allLogs = taggedPrior.length > 0 ? taggedPrior : rawPrior.filter(l => !l.day);
  const sessions = groupByDate(allLogs);
  const lastSession = sessions[0];

  // Target sets with flexibility to add/remove
  const targetSets = ex.sets;
  const setsTableRows = [];
  
  // Count regular (non-warmup, non-dropset) sets logged today
  const regularSetCount = todaysSets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  
  // Show all logged sets first
  for (let i = 0; i < todaysSets.length; i++) {
    const setData = todaysSets[i];
    const isWarmup = setData.tag === 'warmup';
    const isDropset = setData.tag === 'dropset';
    const className = isWarmup ? 'warmup' : isDropset ? 'dropset' : 'complete';
    const numClass = isWarmup ? 'warmup' : isDropset ? 'dropset' : 'complete';
    // D1/D2/D3 for a run of drops, and working sets carry their number so a 6th
    // set on a 5-set exercise reads as 6, not as another anonymous tick.
    const workingSoFar = todaysSets.slice(0, i + 1)
      .filter(x => x.tag !== 'warmup' && x.tag !== 'dropset').length;
    const dropsSoFar = todaysSets.slice(0, i + 1).filter(x => x.tag === 'dropset').length;
    const label = isWarmup ? 'W'
      : isDropset ? 'D' + (setData.drop || dropsSoFar)
      : String(workingSoFar) + (workingSoFar > targetSets ? '+' : '');
    
    setsTableRows.push(`
      <div class="set-row ${className}">
        <button class="set-num ${numClass} set-type-btn" onclick="cycleSetType('${ex.id}','${setData.date}')" title="Tap to change set type">${label}</button>
        <input type="number" step="0.5" inputmode="decimal" value="${setData.weight}" aria-label="Weight in kg" onchange="updateLog('${ex.id}','${setData.date}',this.value,'weight')">
        <input type="number" inputmode="numeric" value="${setData.reps}" aria-label="Reps" onchange="updateLog('${ex.id}','${setData.date}',this.value,'reps')">
        <button class="delete-btn" aria-label="Delete this set" onclick="deleteLog('${ex.id}','${setData.date}')">✕</button>
      </div>
    `);
  }
  
  // The form used to vanish the moment the target was hit, so an extra set could
  // only be logged by mislabelling it a warmup, which then polluted the working
  // count and the progression maths. It now stays, and anything past the target
  // is simply an extra working set.
  if (true) {
    const nextSetNum = regularSetCount + 1;
    const isExtra = regularSetCount >= targetSets;
    // Carry the weight forward: today's top working set, else what the engine says.
    const doneW = todaysSets.filter(s => s.tag !== 'warmup' && s.tag !== 'dropset' && s.weight > 0)
      .map(s => s.weight);
    let prefillW = doneW.length ? Math.max(...doneW) : null;
    if (prefillW === null && rbRec && typeof rbRec.open === 'number') prefillW = rbRec.open;   // not the pre-break weight
    if (prefillW === null && lastSession) {
      const lw = lastSession.sets.filter(x => x.tag !== 'warmup' && x.tag !== 'dropset' && x.weight > 0)
        .map(x => x.weight);
      if (lw.length) prefillW = Math.max(...lw);   // open at last session's top set
    }
    setsTableRows.push(`
      <div class="log-form"${isExtra ? ' style="border-top:1px dashed #C9D6D3;padding-top:6px;"' : ''}>
        <span class="set-num ${isExtra ? 'extra' : 'next'}">${nextSetNum}</span>
        <input type="number" step="0.5" inputmode="decimal" aria-label="Weight in kg" placeholder="${ex.bodyweight ? '+kg / 0' : 'kg'}" id="w-${ex.id}-set${nextSetNum}"${prefillW !== null ? ` value="${prefillW}"` : ''} onkeydown="if(event.key==='Enter')logRegularSet('${ex.id}')">
        <input type="number" inputmode="numeric" aria-label="Reps" placeholder="reps" id="r-${ex.id}-set${nextSetNum}" onkeydown="if(event.key==='Enter')logRegularSet('${ex.id}')">
        ${ex.bodyweight ? `<button class="btn bw" onclick="logBodyweightSet('${ex.id}')">BW</button>` : ''}
        <button class="btn" onclick="logRegularSet('${ex.id}')">Log</button>
      </div>
      ${isExtra ? `<div style="font-size:12px;color:#5B6E74;margin:-2px 0 6px 2px;">Set ${nextSetNum} is past the ${targetSets} planned \u2014 logs as an extra working set, not a warmup.</div>` : ''}
    `);
  }

  const setsDoneCount = todaysSets.length;
  // Drops were counted as working sets here, so three drops on a 4-set exercise
  // read as "8/4 today". regularSetCount already excluded them; this line did not.
  const workingSetsDone = regularSetCount;
  const warmupsDone = todaysSets.filter(s => s.tag === 'warmup').length;
  const dropsDone = todaysSets.filter(s => s.tag === 'dropset').length;
  const manualDoneFlag = isManualDone(ex.id, selectedDay);
  const isComplete = regularSetCount >= targetSets || manualDoneFlag;
  // Only the lift you are on opens by itself. The rest stay as stops on the route.
  const isNow = !isComplete && currentStopId === ex.id;
  const open = cardOpen[ex.id] !== undefined ? cardOpen[ex.id] : (currentStopId === null ? !isComplete : isNow);
  const hasNotes = !!(ex.warmup || ex.superset || ex.dropset || ex.notes);
  const rbRef = rbRec && typeof rbRec.open === 'number' ? rebuildRef(ex.id, selectedDay) : null;
  const rbPct = rbRef && rbRef.top > 0 ? Math.min(100, Math.round(rbRec.open / rbRef.top * 100)) : null;
  const node = isComplete
    ? '<span class="node"><svg role="img" aria-label="Done" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#10242B"/><polyline points="6.5 11.5 9.8 14.6 15.6 8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    : isNow
    ? '<span class="node"><svg role="img" aria-label="You are here" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FFFFFF" stroke="#E8501A" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="#E8501A"/></svg></span>'
    : '<span class="node"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="#FFFFFF" stroke="#10242B" stroke-width="2.5"/></svg></span>';
  
  // e1RM sparkline: last 8 day-isolated sessions, oldest → newest
  const sparkVals = sessions.slice(0, 8).reverse().map(s => avgE1RM(s.sets));
  const spark = sparkVals.length >= 2 ? sparkSVG(sparkVals, isComplete ? '#1B7F5A' : '#10242B') : '';

  return `
    <div class="card ${isComplete ? 'complete-card' : ''}${open ? '' : ' shut'}${isNow ? ' now' : ''}">
      ${node}
      <div class="card-head" role="button" tabindex="0" aria-expanded="${open}" onclick="toggleCard('${ex.id}', ${open})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('${ex.id}', ${open});}">
        <div style="min-width: 0;">
          <div class="exercise-name">${ex.name}</div>
          ${open ? `<div class="exercise-meta">${ex.reps ? targetSets + ' sets of ' + ex.reps + ' \u00b7 ' : ''}${workingSetsDone} of ${targetSets} today \u00b7 ${sessions.length} session${sessions.length === 1 ? '' : 's'}${ex.superset ? ' <span class="tag">Superset</span>' : ''}${ex.dropset ? ' <span class="tag">Drop set</span>' : ''}</div>` : ''}
        </div>
        <div class="head-right">
          ${spark}
          ${isComplete ? `<span class="done-chip">${manualDoneFlag && regularSetCount < targetSets ? `Done \u00b7 ${regularSetCount} of ${targetSets}` : 'Done'}</span>` : open ? '' : `<span class="target-sets">${targetSets} \u00d7 ${ex.reps || '?'}</span>`}
          ${ex.added ? `<span class="tag warn">Added</span>` : ''}
          <span class="chev ${open ? 'open' : ''}">▼</span>
        </div>
      </div>
      <div class="card-body" style="display: ${open ? 'block' : 'none'};">
      ${ex.warmup && (regularSetCount === 0 || noteOpen[ex.id]) ? (() => {
        const rbOpen = rbRec && typeof rbRec.open === 'number' ? rbRec.open : null;
        const topWeight = rbOpen !== null ? rbOpen : lastSession ? Math.max(...lastSession.sets.map(s => s.weight)) : null;
        const ramp = getWarmupRamp(topWeight);
        if (ramp) return `<div class="ramp"><b>Warm-up:</b> ${ramp.map(r => `${r.weight}kg\u00d7${r.reps}`).join(' \u2192 ')}, then ${topWeight}kg (${rbOpen !== null ? "today's rebuild weight" : 'last working weight'}).</div>`;
        return `<div class="ramp"><b>Warm up first.</b> Log a working set and the ramp will show here next time.</div>`;
      })() : ''}
      ${noteOpen[ex.id] && hasNotes ? `<div class="note-panel">
        ${ex.notes ? `<p>${ex.notes}</p>` : ''}
        ${ex.superset ? `<p><b>Superset.</b> Pair with the next exercise on the same stack.</p>` : ''}
        ${ex.dropset ? `<p><b>Drop set.</b> Last set to failure, then reduce the weight.</p>` : ''}
      </div>` : ''}
      ${rbPct !== null ? `<div class="climb"><div class="climb-bar" role="img" aria-label="${rbPct} percent of the way back to ${fmtKgR(rbRef.top)}"><i style="width:${rbPct}%;"></i></div></div>` : ''}
      <div class="recommendation rec-${rec.type}">${rec.text}</div>
      ${lastSession ? `<div class="last-session"><strong>Last (${daysAgo(lastSession.date)}):</strong> ${formatSets(lastSession.sets)}</div>` : ''}
      <div class="todays-sets">
        <div class="todays-sets-header">
          <span>Today's Sets</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;color:#3E5158">${workingSetsDone} working${warmupsDone ? ` · ${warmupsDone} warmup` : ''}${dropsDone ? ` · ${dropsDone} drop${dropsDone > 1 ? 's' : ''}` : ''}</span>
            <button class="rest-pill" onclick="cycleRest('${ex.id}', event)" title="Rest between sets, tap to change">Rest ${fmtRest(restFor(ex.id))}</button>
          </span>
        </div>
        ${setsTableRows.join('')}
      </div>
      ${finishConfirm === ex.id ? `
      <div class="finish-confirm">
        <div class="fc-q">Cooked, or one more? <span class="fc-sub">${regularSetCount}/${targetSets} done</span></div>
        <div class="fc-btns">

        <button class="btn-small" onclick="addWarmup('${ex.id}')">+ Warm-up</button>

        ${hasNotes ? `<button class="btn-small" aria-expanded="${!!noteOpen[ex.id]}" onclick="toggleNote('${ex.id}')">How to</button>` : ''}
        ${manualDoneFlag
          ? `<button class="btn-small btn-reopen" onclick="reopenEx('${ex.id}')">Reopen</button>`
          : (regularSetCount >= targetSets ? ''
             : (regularSetCount >= 1 && finishConfirm !== ex.id
                ? `<button class="btn-small btn-finish" onclick="askFinish('${ex.id}')">Finish early</button>`
                : ''))}
        <button class="btn-small" aria-expanded="${!!showHistory[ex.id]}" onclick="toggleHistory('${ex.id}')">History</button>
      </div>
      ${ex.added ? `<div style="display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px dashed #C9D6D3; font-size:12px; color:#5B6E74;">
        <span>Added today · sets</span>
        <input type="number" min="1" max="10" value="${ex.sets}" onchange="setExtraSets('${ex.id}', this.value)" style="width:46px;background:#EEF2F1;color:#10242B;border:1px solid #C9D6D3;border-radius:5px;padding:3px 5px;font-family:inherit;font-size:12px;">
        ${todaysSets.length ? '<span style="color:#5B6E74;">logged, so it stays for today</span>'
          : `<button onclick="removeExtraEx('${ex.id}')" style="background:none;border:none;color:#B93D0B;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;margin-left:auto;">Remove</button>`}
      </div>` : ''}
      ${showHistory[ex.id] ? renderHistory(ex.id) : ''}
      </div>
    </div>
  `;
}

// Best working weight to hang a warmup or drop set off: today's top set if there
// is one, otherwise the last one logged for this exercise on this day.
function refWorkingWeight(exId) {
  const today = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset' && s.weight > 0);
  if (today.length) return Math.max(...today.map(s => s.weight));
  const prior = (logs[exId] || []).filter(l => l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0
    && (!l.day || l.day === selectedDay));
  return prior.length ? prior[prior.length - 1].weight : 0;
}

async function addWarmup(exId) {
  if (!logs[exId]) logs[exId] = [];
  const ref = refWorkingWeight(exId);
  logs[exId].push({ date: new Date().toISOString(), weight: ref ? roundToPlate(ref * 0.5) : 20, reps: 10, tag: 'warmup', day: selectedDay });
  await save();
  render();
}

/* A drop set is usually a run of drops, not one. Each tap adds the next drop and
   steps the weight down again, so three drops read as three drops rather than as
   three identical sets or, worse, three warmups. */
const DROP_STEPS = [0.7, 0.55, 0.45, 0.35];
async function addDropset(exId) {
  if (!logs[exId]) logs[exId] = [];
  const ref = refWorkingWeight(exId);
  const already = getTodaysSets(exId).filter(l => l.tag === 'dropset').length;
  const pct = DROP_STEPS[Math.min(already, DROP_STEPS.length - 1)];
  logs[exId].push({ date: new Date().toISOString(),
    weight: ref ? roundToPlate(ref * pct) : 0, reps: 8, tag: 'dropset',
    drop: already + 1, day: selectedDay });
  await save();
  render();
}
async function addWarmupSet(exId) { return addWarmup(exId); }

function renderHistory(exId) {
  const raw = logs[exId] || [];
  const tagged = raw.filter(l => l.day === selectedDay);
  const dayLogs = tagged.length > 0 ? tagged : raw.filter(l => !l.day);
  const sessions = groupByDate(dayLogs);
  if (sessions.length === 0) return '<div class="history"><div style="color:#5B6E74;font-size:12px">No history yet</div></div>';
  return `<div class="history">${sessions.slice(0, 12).map(s => `
    <div class="history-row">
      <span>${new Date(s.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'})}</span>
      <span>${formatSets(s.sets)}</span>
    </div>
  `).join('')}</div>`;
}

function toggleHistory(exId) {
  showHistory[exId] = !showHistory[exId];
  render();
}

async function logBodyweightSet(exId) {
  // Pre-fills 0kg then logs — shortcut for bodyweight exercises
  const regularSetCount = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  const nextSetNum = regularSetCount + 1;
  const rEl = document.getElementById(`r-${exId}-set${nextSetNum}`);
  const wEl = document.getElementById(`w-${exId}-set${nextSetNum}`);
  if (!rEl) return;
  const r = parseInt(rEl.value);
  if (!r || r <= 0) { rEl.focus(); return; }
  if (wEl) wEl.value = '0';
  if (!logs[exId]) logs[exId] = [];
  
  const todayStr = localDateStr(new Date());
  const priorLogs = logs[exId].filter(l => localDateStr(l.date) !== todayStr);
  const hasPriorHistory = priorLogs.length > 0;
  // For BW sets, don't fire PR (0kg e1RM is meaningless for comparison)
  
  logs[exId].push({ date: new Date().toISOString(), weight: 0, reps: r, day: selectedDay, bw: true });
  await save();
  startTimer(true, exId);
  render();
}

async function logRegularSet(exId) {
  const regularSetCount = getTodaysSets(exId).filter(s => s.tag !== 'warmup' && s.tag !== 'dropset').length;
  const nextSetNum = regularSetCount + 1;
  const wEl = document.getElementById(`w-${exId}-set${nextSetNum}`);
  const rEl = document.getElementById(`r-${exId}-set${nextSetNum}`);
  if (!wEl || !rEl) return;
  const w = parseFloat(wEl.value);
  const r = parseInt(rEl.value);
  // Allow 0kg for bodyweight exercises (bw flag), otherwise require positive weight
  const ex = Object.values(SPLIT).flatMap(d => d.exercises).find(e => e.id === exId);
  const isBW = ex?.bodyweight;
  if (isNaN(w) || (!isBW && w <= 0) || (isBW && w < 0) || !r || r <= 0) return;
  if (!logs[exId]) logs[exId] = [];
  
  // Check if this is a new PR — only if the exercise has prior history
  const todayStr = localDateStr(new Date());
  const allPriorLogs = logs[exId].filter(l => localDateStr(l.date) !== todayStr);
  // Compare against same-day history for accurate PRs (Week A and Week B track independently)
  const sameDayLogs = allPriorLogs.filter(l => l.day === selectedDay);
  const priorLogs = sameDayLogs.length > 0 ? sameDayLogs : allPriorLogs.filter(l => !l.day);
  const priorWorking = priorLogs.filter(l => l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0);
  // Sets already logged today count towards the bar to clear, otherwise every set
  // at a new top weight fires the same trophy again.
  const doneToday = logs[exId].filter(l => localDateStr(l.date) === todayStr && l.day === selectedDay
    && l.tag !== 'warmup' && l.tag !== 'dropset' && l.weight > 0);
  const bestSoFar = priorWorking.concat(doneToday);
  const newE1RM = w * (1 + r / 30);
  
  // Three PR types, all day-isolated, working sets only:
  let priorBestE1RM = 0, priorMaxWeight = 0, priorBestRepsAtThisWeight = 0;
  for (const l of bestSoFar) {
    const e = l.weight * (1 + l.reps / 30);
    if (e > priorBestE1RM) priorBestE1RM = e;
    if (l.weight > priorMaxWeight) priorMaxWeight = l.weight;
    if (l.weight === w && l.reps > priorBestRepsAtThisWeight) priorBestRepsAtThisWeight = l.reps;
  }
  const hasHistory = priorWorking.length > 0 && w > 0;
  let prType = null;
  if (hasHistory) {
    if (w > priorMaxWeight) prType = { label: 'WEIGHT PR', detail: `Heaviest ever: ${w}kg (was ${priorMaxWeight}kg)` };
    else if (w === priorMaxWeight && priorBestRepsAtThisWeight > 0 && r > priorBestRepsAtThisWeight) prType = { label: 'REP PR', detail: `${r} reps at ${w}kg (was ${priorBestRepsAtThisWeight})` };
    else if (priorBestE1RM > 0 && newE1RM > priorBestE1RM * 1.01) prType = { label: 'e1RM PR', detail: `Est. 1RM ${newE1RM.toFixed(1)}kg (was ${priorBestE1RM.toFixed(1)}kg)` };
  }
  // Not an all-time PR, but the best since coming back: that is the number that
  // moves during a rebuild, so it gets its own, clearly different, trophy.
  if (!prType && hasHistory && todayStr >= REBUILD_START) {
    const postPrior = priorWorking.filter(l => localDateStr(l.date) >= REBUILD_START);
    if (postPrior.length) {
      const post = bestSoFar.filter(l => localDateStr(l.date) >= REBUILD_START);
      let pMax = 0, pE = 0;
      for (const l of post) { pMax = Math.max(pMax, l.weight); pE = Math.max(pE, l.weight * (1 + l.reps / 30)); }
      if (w > pMax || newE1RM > pE * 1.01) {
        const pct = priorMaxWeight > 0 ? Math.round(w / priorMaxWeight * 100) : null;
        prType = { label: 'BEST SINCE 17 NOV', detail: (w > pMax ? `Heaviest since the restart: ${w}kg` : `Est. 1RM ${newE1RM.toFixed(1)}kg, best since the restart`) + (pct && pct < 100 ? ` · ${pct}% of your all-time ${priorMaxWeight}kg` : '') };
      }
    }
  }
  
  logs[exId].push({ date: new Date().toISOString(), weight: w, reps: r, day: selectedDay });
  
  await save();
  if (navigator.vibrate) navigator.vibrate(prType ? [30, 40, 30] : 10);
  
  // Trophy: bib-styled, names the PR type
  if (prType) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-2deg); background: #FFFFFF; color: #10242B; padding: 22px 30px; border-radius: 16px; border-top: 6px solid #B93D0B; z-index: 998; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,0.7); min-width: 230px;';
    overlay.innerHTML = '<div style="font-size: 30px; margin-bottom: 4px;"></div>'
      + '<div style="font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: 1.5px;">' + prType.label + '</div>'
      + '<div style="font-size: 14px; font-weight: 700; margin-top: 6px;">' + w + 'kg × ' + r + ' reps</div>'
      + '<div style="font-size: 12px; color: rgba(20,19,17,0.6); margin-top: 2px;">' + prType.detail + '</div>';
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 4000);
  }
  
  startTimer(true, exId);
  render();
}


async function deleteLog(exId, date) {
  logs[exId] = (logs[exId] || []).filter(l => l.date !== date);
  await save();
  render();
}

async function updateLog(exId, date, newValue, field) {
  const log = (logs[exId] || []).find(l => l.date === date);
  if (!log) return;
  if (field === 'weight') {
    const v = parseFloat(newValue);
    if (isNaN(v) || v < 0) { render(); return; }   // junk in the box: put the old number back
    log.weight = v;
  } else if (field === 'reps') {
    const v = parseInt(newValue, 10);
    if (isNaN(v) || v < 1) { render(); return; }
    log.reps = v;
  }
  await save();
  render();
}

// Cycle a logged set's type: working → warmup → drop set → working.
// Lets a mistagged set be corrected in place instead of deleting later sets.
async function cycleSetType(exId, date) {
  const log = (logs[exId] || []).find(l => l.date === date);
  if (!log) return;
  if (log.tag === 'warmup') log.tag = 'dropset';
  else if (log.tag === 'dropset') delete log.tag; // becomes a working set
  else log.tag = 'warmup';
  await save();
  render();
}

function renderProgress() {
  return `
    <div class="seg">
      <button class="${progressTab === 'lifts' ? 'active' : ''}" onclick="progressTab = 'lifts'; render();">Lifts</button>
      <button class="${progressTab === 'runs' ? 'active' : ''}" onclick="progressTab = 'runs'; render();">Runs</button>
    </div>
    ${progressTab === 'lifts' ? renderLiftProgress() : renderRunProgress()}
  `;
}

function getPersonalBests() {
  // Best working-set e1RM per exercise across all history (weighted sets only)
  const nameById = {};
  for (const day of Object.values(SPLIT)) {
    for (const ex of day.exercises) if (!nameById[ex.id]) nameById[ex.id] = ex.name;
  }
  const bests = [];
  for (const [exId, entries] of Object.entries(logs)) {
    let best = null;
    for (const l of entries) {
      if (l.tag === 'warmup' || l.tag === 'dropset' || !l.weight || l.weight <= 0) continue;
      const e = l.weight * (1 + l.reps / 30);
      if (!best || e > best.e1rm) best = { e1rm: e, weight: l.weight, reps: l.reps, date: l.date };
    }
    if (best && nameById[exId]) bests.push({ name: nameById[exId], ...best });
  }
  return bests.sort((a, b) => b.e1rm - a.e1rm).slice(0, 8);
}

let progOpen = {}; // per-card expand state on the Progress tab

function toggleProg(key, cur) {
  progOpen[key] = !cur;
  render();
}

function e1rmChartSVG(values, color) {
  // Full-width session chart: e1RM per session, oldest → newest
  if (!values || values.length < 2) return '';
  const W = 320, H = 110, padL = 32, padR = 8, padY = 14;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const x = i => padL + (i / (values.length - 1)) * (W - padL - padR);
  const y = v => H - padY - ((v - min) / span) * (H - padY * 2);
  const line = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block; margin: 6px 0 4px;">
      <line x1="${padL}" y1="${y(max)}" x2="${W-padR}" y2="${y(max)}" stroke="#C9D6D3" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="${padL}" y1="${y(min)}" x2="${W-padR}" y2="${y(min)}" stroke="#C9D6D3" stroke-width="1" stroke-dasharray="3 4"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#10242B"/>`).join('')}
      <text x="2" y="${y(max) + 4}" font-size="9" fill="#3E5158" font-weight="700">${max.toFixed(0)}</text>
      <text x="2" y="${y(min) + 4}" font-size="9" fill="#5B6E74">${min.toFixed(0)}</text>
    </svg>`;
}

function renderLiftProgress() {
  // Build day-isolated exercise records, in PROGRAM order (day sequence, then slot order)
  const dayOrder = [...WEEK_A, ...WEEK_B];
  const allExercises = [];
  for (const dayKey of dayOrder) {
    const day = SPLIT[dayKey];
    day.exercises.forEach((ex, slot) => {
      const dayLogs = (logs[ex.id] || []).filter(l => !l.day || l.day === dayKey);
      if (dayLogs.length === 0) return;
      const sorted = dayLogs.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
      const sessions = groupByDate(sorted); // already newest first
      let change = 0;
      const e1rms = sessions.map(s => avgE1RM(s.sets));
      if (sessions.length >= 2) change = ((e1rms[0] - e1rms[e1rms.length-1]) / e1rms[e1rms.length-1]) * 100;
      allExercises.push({ ...ex, dayKey, dayName: shortDayName(day.name), slot, _sessions: sessions, _e1rms: e1rms, _change: change });
    });
  }
  if (allExercises.length === 0) {
    return '<div class="empty">Log some sessions to see your progression here.</div>';
  }
  
  const dayNames = [...new Set(allExercises.map(e => e.dayName))];
  const filtered = progressFilter === 'all' ? allExercises : allExercises.filter(ex => ex.dayName === progressFilter);
  
  return `
    ${(() => {
      const bests = getPersonalBests();
      if (bests.length === 0) return '';
      return `
        <div class="card">
          <div class="card-label">Personal bests · top e1RM</div>
          ${bests.map(b => `
            <div class="pr-row">
              <span class="pr-name">${b.name}</span>
              <span><span class="pr-val">${b.e1rm.toFixed(0)}kg</span><span class="pr-sub">${b.weight}×${b.reps} · ${daysAgo(b.date)}</span></span>
            </div>`).join('')}
        </div>`;
    })()}
    
    <details class="legend">
      <summary>What the numbers mean</summary>
      <p><b>e1RM</b> is your estimated one-rep max: what the set you just did suggests you could lift once,
      worked out with the Epley formula (weight &times; (1 + reps &divide; 30)). 60kg&times;8 and 70kg&times;5 are
      both about 76kg. It is the fairest single number for comparing sessions where the weight
      <em>and</em> the reps moved, which is why the chart plots it rather than raw kilos.</p>
      <p><b>Slot</b> is where this lift sat in the session, so <span class="lg-k">#3 of 6</span> means it was
      third. The same lift is measurably weaker when it runs late, so a dip on the chart on a day it
      slipped down the order is usually fatigue, not lost strength.</p>
      <p><b>The percentage</b> is the change from your first logged session on this day to your most
      recent one, not week on week.</p>
      <p><b>\u21ba 82%</b> shows while you are climbing back from the break: your latest session as a share
      of your best before it. It turns back into the normal percentage once you are past the old number.</p>
    </details>

    <div class="progress-day-filter">
      <button class="${progressFilter === 'all' ? 'active' : ''}" onclick="progressFilter = 'all'; render();">All</button>
      ${dayNames.map(d => `<button class="${progressFilter === d ? 'active' : ''}" onclick="progressFilter = '${d}'; render();">${d}</button>`).join('')}
    </div>
    
    ${filtered.map(ex => {
      const key = ex.dayKey + '|' + ex.id;
      const open = progOpen[key] === true;
      const sessions = ex._sessions;
      const latest = sessions[0];
      const chartVals = ex._e1rms.slice(0, 12).reverse(); // oldest → newest, last 12
      const back = rebuildBack(ex.id, ex.dayKey);
      // Bodyweight-only sets have no e1RM, so a percentage against a weighted
      // session reads as minus 100. Show the reps instead.
      const bwOnly = latest.sets.filter(x => x.tag !== 'warmup').every(x => !(x.weight > 0));
      // Mid-rebuild the line falls on purpose. It is not a warning, so it is not red.
      const spark = bwOnly ? '' : sparkSVG(chartVals.slice(-8), back !== null ? '#10242B' : ex._change >= 0 ? '#1B7F5A' : '#B93D0B');
      const deltaChip = bwOnly
        ? `<span style="font-size: 12px; font-weight: 700; color: var(--text-2);">bodyweight \u00d7 ${Math.max(...latest.sets.map(x => x.reps || 0))}</span>`
        : back !== null
        ? `<span style="font-size: 12px; font-weight: 800; color: var(--yellow);" title="Latest session as a share of your best before the break">\u21ba ${back}%</span>`
        : sessions.length >= 2
        ? `<span style="font-size: 12px; font-weight: 800; color: ${ex._change >= 0.5 ? 'var(--green)' : ex._change <= -0.5 ? 'var(--red)' : 'var(--text-2)'};">${ex._change >= 0 ? '+' : ''}${ex._change.toFixed(1)}%</span>`
        : '<span style="font-size:12px; color: var(--text-3);">baseline</span>';
      
      // Average position in session (fatigue context for reading the graph)
      const positions = sessions.slice(0, 6).map(s => getSessionPosition(ex.id, localDateStr(s.date), ex.dayKey)).filter(p => p !== null);
      const avgPos = positions.length ? (positions.reduce((a,b) => a+b, 0) / positions.length) : null;
      
      return `
        <div class="card">
          <div class="card-head" onclick="toggleProg('${key}', ${open})">
            <div style="min-width: 0;">
              <div class="exercise-name" style="font-size: 15.5px;">${ex.name}</div>
              <div class="exercise-meta">${ex.dayName} · ${sessions.length} session${sessions.length === 1 ? '' : 's'} · best ${Math.max(...ex._e1rms).toFixed(0)}kg e1RM</div>
            </div>
            <div class="head-right">
              ${spark}
              ${deltaChip}
              <span class="chev ${open ? 'open' : ''}">▼</span>
            </div>
          </div>
          ${open ? `
            <div class="card-body">
              ${e1rmChartSVG(chartVals, '#B93D0B') || '<div style="font-size:12px;color:var(--text-3);">One more session and the chart appears.</div>'}
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0;">

function renderRunProgress() {
  if (runningLogs.length === 0) {
    return '<div style="color: #5B6E74; font-size: 14px; padding: 20px; text-align: center;">Log some runs to see your progression here.</div>';
  }

  const byType = { regular: [], treadmill: [], interval: [], 'interval-treadmill': [] };
  runningLogs.forEach(run => {
    // Unknown/missing type (legacy imports, outdoor runs) buckets as regular instead of crashing
    (byType[run.type] || byType.regular).push(run);
  });

  const typeNames = { regular: 'Regular Runs', treadmill: 'Treadmill', interval: 'Interval', 'interval-treadmill': 'Interval Treadmill' };
  const activeTypes = Object.keys(byType).filter(t => byType[t].length > 0);

  return `
    <div style="display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;">
      ${activeTypes.map(t => `
        <div style="display: inline-block; padding: 6px 12px; background: ${progressFilter === t ? '#E8501A' : '#DCE6E4'}; color: #10242B; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;" onclick="progressFilter = '${t}'; render();">${typeNames[t]}</div>
      `).join('')}
    </div>
    
    ${activeTypes.map(type => {
      const runs = byType[type];
      if (runs.length === 0 || (progressFilter !== 'all' && progressFilter !== type)) return '';
      
      const sortedRuns = runs.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
      const totalDist = runs.reduce((sum, r) => sum + r.distance, 0);
      const totalTime = runs.reduce((sum, r) => sum + r.time, 0);
      const avgSpeed = (totalDist / totalTime * 60).toFixed(1);
      const fastestPace = Math.min(...runs.map(r => r.time / r.distance));
      const fastestPaceMin = Math.floor(fastestPace);
      const fastestPaceSec = Math.round((fastestPace - fastestPaceMin) * 60);
      
      const distances = sortedRuns.map(r => r.distance);
      const minDist = Math.min(...distances) * 0.9;
      const maxDist = Math.max(...distances) * 1.1;
      
      return `
        <div style="margin-bottom: 16px;">
          <div style="font-size: 13px; color: #3E5158; margin-bottom: 10px; font-weight: 600;">${typeNames[type]}</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;">
            <div style="background: #EEF2F1; border: 1px solid #C9D6D3; border-radius: 8px; padding: 10px; text-align: center;">
              <div style="font-size:12px; color: #5B6E74;">Total Distance</div>
              <div style="font-size: 16px; font-weight: 600; color: #B93D0B;">${totalDist.toFixed(1)}km</div>
              <div style="font-size:12px; color: #5B6E74;">in ${runs.length} runs</div>
            </div>
            <div style="background: #EEF2F1; border: 1px solid #C9D6D3; border-radius: 8px; padding: 10px; text-align: center;">
              <div style="font-size:12px; color: #5B6E74;">Avg Speed</div>
              <div style="font-size: 16px; font-weight: 600; color: #B93D0B;">${avgSpeed} km/h</div>
              <div style="font-size:12px; color: #5B6E74;">overall</div>
            </div>
            <div style="background: #EEF2F1; border: 1px solid #C9D6D3; border-radius: 8px; padding: 10px; text-align: center;">
              <div style="font-size:12px; color: #5B6E74;">Best Pace</div>
              <div style="font-size: 16px; font-weight: 600; color: #B93D0B;">${fastestPaceMin}:${fastestPaceSec.toString().padStart(2, '0')}/km</div>
              <div style="font-size:12px; color: #5B6E74;">fastest</div>
            </div>
          </div>
          
          <div style="font-size: 12px; color: #3E5158; margin-bottom: 8px;">Distance Trend</div>
          <div style="background: #EEF2F1; border: 1px solid #C9D6D3; border-radius: 8px; padding: 10px;">
            <div style="display: flex; gap: 2px; height: 30px; align-items: flex-end;">
              ${sortedRuns.map(r => {
                const h = ((r.distance - minDist) / (maxDist - minDist)) * 100;
                return `<div style="flex: 1; background: linear-gradient(180deg, #3FAE85, #3FAE85); border-radius: 2px; height: ${Math.max(5, h)}%; min-height: 5px;" title="${r.distance.toFixed(1)}km - ${new Date(r.date).toLocaleDateString()}"></div>`;
              }).join('')}
            </div>
            <div style="font-size:12px; color: #5B6E74; margin-top: 6px; text-align: center;">Longest: ${Math.max(...distances).toFixed(1)}km · Shortest: ${Math.min(...distances).toFixed(1)}km</div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// ====== Rest Timer ======
// One rest length for a heavy triple and a lateral raise made no sense in an app
// that models rep ranges everywhere else. The default comes off the bottom of the
// exercise's own rep range; tap the pill on the card to override it.
const REST_STEPS = [45, 60, 90, 120, 150, 180, 240];
function exById(exId) {
  return Object.values(SPLIT).flatMap(d => d.exercises).find(e => e.id === exId) || null;
}
function restDefaultFor(ex) {
  if (!ex) return 150;
  const m = String(ex.reps || '').match(/\d+/);
  const low = m ? parseInt(m[0], 10) : 10;
  if (low <= 6) return 180;   // heavy compound
  if (low <= 10) return 150;
  if (low <= 14) return 90;
  return 60;                  // high-rep isolation
}
function restFor(exId) {
  if (restOverrides[exId]) return restOverrides[exId];
  return restDefaultFor(exById(exId));
}
function fmtRest(sec) {
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
async function cycleRest(exId, ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  const cur = restFor(exId);
  let i = REST_STEPS.indexOf(cur);
  if (i < 0) i = REST_STEPS.indexOf(150);
  restOverrides[exId] = REST_STEPS[(i + 1) % REST_STEPS.length];
  await saveRest();
  render();
}

function toggleTimer() {
  if (timerRunning) pauseTimer();
  else startTimer();
}

function startTimer(fresh, exId) {
  if (exId) restLen = restFor(exId);
  // If timer is at 0 or finished, start a fresh rest period
  if (fresh || timerSeconds <= 0 || timerEndedNotified) {
    timerSeconds = restLen;
    timerEndedNotified = false;
  }
  timerRunning = true;
  // Anchor to an absolute end time so backgrounding doesn't lose track
  timerEndTime = Date.now() + timerSeconds * 1000;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 250);
  tickTimer();
  savePlace();
}

function tickTimer() {
  if (!timerRunning || timerEndTime === null) return;
  const remaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
  timerSeconds = remaining;
  if (remaining <= 0) {
    timerSeconds = 0;
    pauseTimer();
    if (!timerEndedNotified) {
      timerEndedNotified = true;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      playBeep();
      flashRestOver();
    }
  }
  updateTimerUI();
}

function pauseTimer() {
  timerRunning = false;
  // Capture remaining time so resume continues from where it left off
  if (timerEndTime !== null) {
    timerSeconds = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
  }
  timerEndTime = null;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  updateTimerUI();
  savePlace();
}

function resetTimer() {
  pauseTimer();
  timerSeconds = restLen;
  timerEndTime = null;
  timerEndedNotified = false;
  updateTimerUI();
  savePlace();
}

// Re-sync the moment the app comes back to the foreground
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerRunning) tickTimer();
});

function updateTimerUI() {
  const display = document.getElementById('timerDisplay');
  const timer = document.getElementById('restTimer');
  const btn = document.getElementById('timerStartBtn');
  const mins = Math.floor(timerSeconds / 60);
  const secs = timerSeconds % 60;
  display.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

  timer.classList.remove('running', 'warning', 'done');
  if (timerSeconds === 0) {
    timer.classList.add('done');
    display.textContent = "GO!";
  } else if (timerRunning && timerSeconds <= 10) {
    timer.classList.add('warning');
  } else if (timerRunning) {
    timer.classList.add('running');
  }
  btn.textContent = timerRunning ? '❚❚' : '▶\ufe0e';
  // Collapsed unless a rest period is actually under way
  timer.classList.toggle('idle', !timerRunning && timerSeconds >= restLen);
}

let audioCtx = null;
// iOS starts every AudioContext suspended and only lets a user gesture resume it.
// The beep used to be built inside a setInterval callback, so on an iPhone it
// never made a sound. This unlocks the context on the first tap of the session.
let audioUnlocked = false;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioUnlocked) {
      const b = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination); src.start(0);
      audioUnlocked = true;
    }
  } catch (e) {}
}
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('click', unlockAudio, { passive: true });

// Phone on silent, or iOS ignoring navigator.vibrate: flash the screen instead.
function flashRestOver() {
  try {
    const f = document.createElement('div');
    f.className = 'rest-flash';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1400);
  } catch (e) {}
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.4);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + i * 0.4 + 0.05);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i * 0.4 + 0.25);
      osc.start(audioCtx.currentTime + i * 0.4);
      osc.stop(audioCtx.currentTime + i * 0.4 + 0.3);
    }
  } catch (e) {}
}

// ===== RUNNING PROGRAM: half marathon, sub 1:45 =====
// Mon 16 Nov 2026 -> Sun 2 May 2027. Twenty-four weeks, with a 10k time trial in
// week 8 because he wants sub-50 for 10k as soon as it is honestly possible.
//
// WHERE HE IS: 7 Nov, 5.67km in 28:29 (5:01/km) at 169bpm average. Riegel
// (1.06) puts that at 51:58 for 10k and 1:54:41 for the half. Sub-1:45 is 4:58/km,
// an 8.5% improvement over 24 weeks, about 0.37% a week. Sub-50 for 10k is 4% in
// 8 weeks, which is quick but normal for someone coming back: returning fitness
// rebuilds faster than new fitness is built.
//
// WHAT WAS WRONG: his runs average around 175bpm and every one of them is tough.
// That is the single biggest thing holding him back. Three hard runs a week means
// no run is easy enough to build the engine and none is fresh enough to be truly
// fast. So easy runs now run by heart rate (6:00 to 6:20, under the cap) and only
// one run a week is hard, plus the long run, which gets goal pace in it from week 14.
//
// THE WEEK: an easy run, a quality run and a long run, on whatever days the week
// allows. His days change all the time, so nothing is pinned to one. Three runs alongside five
// lifting days is the most that fits, so every run has one job.
const E = 6.17;            // easy, 6:00 to 6:20 by heart rate. Shown as 6:10.
const LR = 6.17;           // long runs, same effort
const HMP = 4.93;          // half pace on the watch: 4:56. Watches read courses long,
                           // so 4:56 shown is about 4:58 real, which is sub-1:45.
const EASY_FLOOR = 6.0;    // the quickest an easy run should ever go
const JOG = 7.0;           // recovery jogs between reps

const GOAL_WEEKS = (() => {
  const wk = (week, phase, focus, sessions) => ({ week, phase, focus, sessions });
  const r5 = x => Math.round(x * 2) / 2;
  // Every week's first session is a plain easy run. No club, no group.
  const easy = (d, desc) => ({ type: 'easy', label: 'Easy Run', dist: d, pace: E, desc: desc || 'Easy by heart rate. If 6:00 takes you over the cap, slow down. The pace is a ceiling, not a target.' });
  const club = (d, desc) => easy(d, desc);
  const long = (d, desc) => ({ type: 'long', label: 'Long Run', dist: d, pace: LR, desc });
  // Reps: works out the real distance and the average pace including the warmup,
  // cooldown and jogs, so the session length on the card is the true one.
  const iv = (label, reps, repDist, repPace, recMin, wu, cd, desc, extra) => {
    const jog = (reps - 1) * recMin / JOG;
    const dist = wu + cd + reps * repDist + jog;
    const time = (wu + cd) * E + reps * repDist * repPace + (reps - 1) * recMin;
    return Object.assign({ type: 'interval', label, dist: r5(dist), reps, repDist, repPace,
      avgPace: Math.round(time / dist * 100) / 100, recovery: recMin + 'min easy jog', desc }, extra || {});

  const tp = (type, label, km, pace, wu, cd, desc, extra) => {

const RUN_STAGES = [
  { id: 1, name: 'Half marathon, sub 1:45', short: 'Half marathon', goalPace: 4.97, goalDist: 21.1, targetTime: '1:45:00',
    startPace: 5.43,   // Riegel half pace from the 7 Nov 5.67km run: where the plan begins
    start: '2026-11-16', race: '2027-05-02', weeks: GOAL_WEEKS,
    phases: [
      { name: 'Foundation', weeks: '1–4', purpose: 'Rebuild, first speed', color: '#1D6A82' },
      { name: '10k Block', weeks: '5–8', purpose: 'Sub-50 10k', color: '#B93D0B' },
      { name: 'Half Base', weeks: '9–16', purpose: 'Build the engine', color: '#5A4B9A' },
      { name: 'Race Specific', weeks: '17–21', purpose: 'Own 4:56', color: '#B93D0B' },
      { name: 'Taper', weeks: '22–24', purpose: 'Sharpen, race', color: '#1B7F5A' }
    ]}
];

let runStage = 1;
const PLAN_ID = '2026-11-16-half-145';  // bumped when the goal itself changes
let RACE_DATE, PROGRAM_START, GOAL_PACE, GOAL_DIST, RUN_PROGRAM, RUN_PHASES, ACTIVE_STAGE;

function applyStage(n) {
  const s = RUN_STAGES.find(x => x.id === n) || RUN_STAGES[0];
  ACTIVE_STAGE = s;
  runStage = s.id;
  GOAL_PACE = s.goalPace;
  GOAL_DIST = s.goalDist;
  RUN_PROGRAM = s.weeks;
  RUN_PHASES = s.phases;
  PROGRAM_START = new Date(s.start + 'T00:00:00');
  RACE_DATE = new Date(s.race + 'T00:00:00');
}
applyStage(1);

// Pace helpers: pace in min/km <-> speed in km/h
function paceToSpeed(p) { return 60 / p; }
function speedToPace(s) { return 60 / s; }
function fmtPace(p) { const t = Math.round(p * 60); return `${Math.floor(t / 60)}:${(t % 60).toString().padStart(2,'0')}`; }
// Minutes as a clock: 28.48 -> 28:29, 104.9 -> 1:44:54.
function fmtClock(min) {
  const t = Math.round(min * 60), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
}
// A run's time as he would say it: whole minutes stay "30min", anything with seconds is a clock.
function fmtRunTime(min) { return Math.abs(min - Math.round(min)) < 1e-6 ? Math.round(min) + 'min' : fmtClock(min); }
// The efforts inside a run: the whole thing, and the hard part if one was logged.
function runEfforts(r) {
  const out = [];
  if (r && r.distance > 0 && r.time > 0) out.push({ distance: r.distance, time: r.time, date: r.date, run: r });
  if (r && r.seg && r.seg.distance > 0 && r.seg.time > 0) out.push({ distance: r.seg.distance, time: r.seg.time, date: r.date, run: r, seg: true });
  return out;
}
// Where the plan expects half marathon fitness to be in a given week. Curved, not
// straight: fitness he has had before comes back fastest in the first weeks.
function expectedGoalPace(week) {
  const n = RUN_PROGRAM.length, st = (ACTIVE_STAGE && ACTIVE_STAGE.startPace) || GOAL_PACE;
  const t = Math.max(0, Math.min(1, (week - 1) / Math.max(1, n - 1)));
  return st * Math.pow(GOAL_PACE / st, 1 - Math.pow(1 - t, 1.5));
}
// The heart rate an easy run should stay under. Reserve-based when resting HR is known.
function easyCapHR() { return restHR ? hrAt(0.75) : Math.round(estMaxHR() * 0.84); }


function getProgramWeek() {
  const now = new Date();
  if (now < PROGRAM_START) return 0;
  const diffDays = Math.floor((now - PROGRAM_START) / (1000*60*60*24));
  return Math.min(Math.floor(diffDays / 7) + 1, RUN_PROGRAM.length);
}

function getPlanWeek() { return getProgramWeek() || 1; }
function isPreProgram() { return new Date() < PROGRAM_START; }
function programStartLabel() {
  return PROGRAM_START.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

function getDaysToRace() {
  const now = new Date();
  return Math.ceil((RACE_DATE - now) / (1000*60*60*24));
}

function getCurrentPhase() {
  const w = getProgramWeek();
  if (w === 0) return 'Pre-Program';
  return RUN_PROGRAM[w-1] ? RUN_PROGRAM[w-1].phase : 'Complete';
}

function getReadiness() {
  // Gates are derived from the active stage's program so they always match the plan
  const benchmarks = [];
  for (const w of RUN_PROGRAM) {
    for (const sess of w.sessions) {
      if (sess.benchmark) benchmarks.push({ name: sess.benchmark.name, dist: sess.benchmark.dist, pace: sess.benchmark.pace, strict: !!sess.benchmark.strict, week: w.week });
    }
  }
  // A gate is PROVEN only by a run inside the last 42 days — the same window the
  // fitness engine uses. Fitness decays; a fast run from months ago is history, not
  // evidence of what you can do now. Older qualifying runs are marked EXPIRED so you
  // can see you once had it, without it inflating your readiness.
  const GATE_WINDOW = 42;
  benchmarks.forEach(b => {
    let hit = false, expired = false, hitDate = null;
    // A time trial gate means the time: no tolerance. Session gates keep a couple
    // of seconds a km for GPS wobble.
    const tol = b.strict ? 0 : 0.04;
    for (const run of runningLogs) for (const ef of runEfforts(run)) {
      const runPace = ef.time / ef.distance;
      if (!(ef.distance >= b.dist - 0.05 && runPace <= b.pace + tol)) continue;
      const days = (Date.now() - new Date(run.date)) / 86400000;
      if (days <= GATE_WINDOW) {
        if (!hit || new Date(run.date) > new Date(hitDate)) { hit = true; hitDate = run.date; b.by = ef; }
      } else if (!hit) expired = true;
    }
    b.hit = hit; b.expired = !hit && expired; b.hitDate = hitDate;
    // A harder run legitimately proves easier gates (6km @4:48 proves 3km @5:20).
    // That is real capability, but it is NOT the same as having done the session,
    // so gates cleared before their week are flagged rather than counted as progress.
    b.ahead = hit && b.week > getProgramWeek();
  });
  const hitCount = benchmarks.filter(b => b.hit).length;
  const w = getProgramWeek();
  const due = benchmarks.filter(b => b.week <= w);
  return { benchmarks, hitCount, total: benchmarks.length, due, dueHit: due.filter(b => b.hit).length };
}

function getReadinessStatus() {
  const w = getProgramWeek();
  const { benchmarks, hitCount, total, due, dueHit } = getReadiness();
  const behind = due.length - dueHit;
  let status, color, msg;
  if (w === 0) {
    status = 'Not started'; color = '#3E5158';
    msg = 'Week 1 starts ' + programStartLabel() + '. Log your runs and the readiness gates will track whether ' + fmtPace(GOAL_PACE) + '/km is locked in.';
  } else if (behind === 0) {
    status = 'ON TRACK'; color = '#1B7F5A';
    msg = due.length === 0
      ? `No pace benchmarks are due yet, week ${w} is base work. Just get the runs in; the gates start in week ${benchmarks.length ? Math.min(...benchmarks.map(b => b.week)) : 3}.`
      : `You have hit every pace benchmark due so far (${dueHit}/${due.length}). ${ACTIVE_STAGE.short} at ${fmtPace(GOAL_PACE)}/km is on track. Keep training consistently.`;
  } else if (behind === 1) {
    status = 'SLIGHTLY BEHIND'; color = '#7A5200';
    const missed = due.find(b => !b.hit);
    msg = `You are behind on one benchmark: "${missed.name}". Repeat that session before moving on. Do not progress until you have hit it, the plan only works if each step is proven.`;
  } else {
    status = 'BEHIND'; color = '#B93D0B';
    msg = `You are behind on ${behind} benchmarks. Be honest: either training has been inconsistent, or the timeline needs adjusting. Better to find out now than on race day. Consider holding the current phase an extra week, or revising the goal to a pace you can prove.`;
  }
  return { status, color, msg, hitCount, total, behind };
}

function isSessionDone(s, sessionIndex, weekPlan) {
  const now = new Date();
  const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday(now));
  const runs = runningLogs.filter(r => new Date(r.date) >= weekStart && typeof r.distance === 'number');
  const plan = (weekPlan && weekPlan.length) ? weekPlan : [s];
  const idx  = (weekPlan && weekPlan.length) ? sessionIndex : 0;
  return matchRunsToSessions(runs, plan, !!(weekPlan && weekPlan.length))[idx] !== undefined;
}
/* Each run this week ticks off at most ONE session, and runs go to the sessions they
   look most like, since the day says nothing now. A time trial by its effort. A run
   with a hard part logged, or a quick average, to the quality session. Otherwise by
   distance, closest fit winning: a 6km run is the 6km easy run, not an early tick on
   the 7km long run. As many sessions as possible get ticked before closeness counts,
   and a day he pinned a session to counts too. */
function matchRunsToSessions(runs, plan, useDays) {
  const QUAL = ['tempo', 'interval', 'racepace', 'confidence'];
  const looksHard = r => !!r.seg || /interval/.test(r.type || '') || (r.time > 0 && r.time / r.distance <= EASY_FLOOR - 0.45);
  const cost = (r, p, i) => {
    if (p.benchmark && p.benchmark.strict)
      return runEfforts(r).some(ef => ef.distance >= p.benchmark.dist - 0.05 && ef.time / ef.distance <= p.benchmark.pace + 0.5) ? 0 : Infinity;
    if (!(r.distance >= (p.dist || 0) * 0.8)) return Infinity;
    let c = Math.abs(r.distance - (p.dist || 0));
    if (QUAL.includes(p.type) !== looksHard(r)) c += 4;
    if (useDays && runSlots[i] && runSlots[i].d >= 0 && new Date(r.date).getDay() === runSlots[i].d) c -= 2;
    return c;
  };
  let best = { n: -1, c: Infinity, a: {} };
  const used = new Array(runs.length).fill(false), a = {};
  (function go(i, n, c) {
    if (i === plan.length) { if (n > best.n || (n === best.n && c < best.c)) best = { n, c, a: Object.assign({}, a) }; return; }
    go(i + 1, n, c);
    for (let k = 0; k < runs.length; k++) {
      if (used[k]) continue;
      const x = cost(runs[k], plan[i], i);
      if (x === Infinity) continue;
      used[k] = true; a[i] = k;
      go(i + 1, n + 1, c + x);
      used[k] = false; delete a[i];
    }
  })(0, 0, 0);
  return best.a;
}

// ===== RECALIBRATION ENGINE =====
// When training slips, the plan must be rebuilt from CURRENT fitness rather than
// the fantasy of the original schedule. Everything here is derived from logged runs.
const RIEGEL = 1.06;
const WEEKLY_GAIN = 0.005; // ~0.5%/wk pace improvement with consistent training

// Best current fitness across ALL runs (not just long ones): a fast 4km says more
// about your engine than a plodded 8km, so every run is normalised to a 12km
// equivalent via Riegel and the best one wins.
function getFitnessProfile() {
  const runs = runningLogs.filter(r => {
    if (!r.distance || !r.time) return false;
    const days = (Date.now() - new Date(r.date)) / 86400000;
    const p = r.time / r.distance;
    return days <= 42 && r.distance >= 2 && p > 2.5 && p < 9;
  });
  if (runs.length === 0) return null;
  // Every effort counts, including the hard part of a session: a 10km inside a
  // 13km run says far more than the 13km average does.
  const efforts = runs.flatMap(runEfforts).filter(ef => ef.distance >= 2 && ef.time / ef.distance > 2.5);
  let best = null;
  for (const r of efforts) {
    const eq = r.time * Math.pow(12 / r.distance, RIEGEL);
    if (!best || eq < best.eq) best = { eq, run: r };
  }
  const pace12 = best.eq / 12;
  const k = best.run.time / Math.pow(best.run.distance, RIEGEL); // pace(D) = k·D^0.06
  const longest = Math.max(...runs.map(r => r.distance));
  return {
    pace12, k, runs: runs.length, longest,
    paceGoal: paceAtDistance(k, GOAL_DIST),   // what the best effort says about race distance
    basis: best.run,
    easy: pace12 + 1.05,
    tempo: pace12 - 0.10,
    interval: pace12 - 0.45
  };
}
function paceAtDistance(k, d) { return k * Math.pow(d, RIEGEL - 1); }
function distanceAtPace(k, pace) { return Math.pow(pace / k, 1 / (RIEGEL - 1)); }
function projectPace(pace, weeks) { return pace * Math.pow(1 - WEEKLY_GAIN, Math.max(0, weeks)); }

// The three honest ways out. You can hold any TWO of {distance, pace, date} —
// this computes what the third has to become.
function getRecalOptions() {
  const p = getFitnessProfile();
  if (!p) return null;
  const weeksLeft = Math.max(0, getDaysToRace() / 7);
  const goalPace = (runAdjust && runAdjust.goalPace) || GOAL_PACE;
  const goalDist = (runAdjust && runAdjust.goalDist) || GOAL_DIST;

  // A: keep distance + pace → how long until it's provable?
  const weeksNeeded = p.paceGoal <= GOAL_PACE ? 0
    : Math.log(GOAL_PACE / p.paceGoal) / Math.log(1 - WEEKLY_GAIN);
  const extraWeeks = Math.max(0, Math.ceil(weeksNeeded - weeksLeft));
  const newDate = new Date(RACE_DATE.getTime() + extraWeeks * 7 * 86400000);

  // B: keep distance + date → what pace is provable?
  const provPace = projectPace(p.paceGoal, weeksLeft);
  const provTime = provPace * GOAL_DIST;

  // C: keep pace + date → what distance is provable at 4:30?
  const kProj = p.k * Math.pow(1 - WEEKLY_GAIN, weeksLeft);
  let provDist = distanceAtPace(kProj, GOAL_PACE);
  if (!isFinite(provDist) || provDist < 0) provDist = 0;
  provDist = Math.max(0, Math.min(provDist, GOAL_DIST));

  return { p, weeksLeft, goalPace, goalDist, weeksNeeded, extraWeeks, newDate, provPace, provTime, provDist };
}

// Rebuild the week from what you can actually run today. Race-pace continuous work
// is only prescribed once the gap to goal pace is small enough to be honest.
function buildBridgeWeek(p) {
  const gap = p.paceGoal - GOAL_PACE;
  const easy = Math.round(Math.max(p.easy, E) * 20) / 20;
  const longDist = Math.max(6, Math.min(Math.round(p.longest * 1.1), 16));
  const sessions = [
    { type: 'easy', label: 'Easy Run', dist: 5, pace: easy,
      desc: 'Rebuild block. Conversational, this is aerobic base, not a test. Slow is the point.' },
  ];
  if (gap > 0.35) {
    // Too far off goal pace for continuous work — sharpen with short reps instead
    const repPace = Math.max(GOAL_PACE, p.interval);
    sessions.push({ type: 'interval', label: 'Intervals 5×800m', dist: 6, reps: 5, repDist: 0.8,
      repPace, recovery: '90s walk/jog',
      desc: `Reps at ${fmtPace(repPace)}/km, quick but repeatable. Short reps first: you earn continuous race pace, you don't start there.` });
  } else {
    sessions.push({ type: 'tempo', label: 'Threshold', dist: 6, pace: Math.round(p.tempo * 20) / 20,
      desc: `1.5km warmup, 3km @ ${fmtPace(p.tempo)}/km, 1.5km cooldown. Controlled and hard, not maximal.` });
  }
  sessions.push({ type: 'long', label: 'Long Run', dist: longDist, pace: Math.round((easy + 0.1) * 20) / 20,
    desc: `${longDist}km easy. Time on feet rebuilds the endurance the plan assumed you had. No pace pressure.` });
  return sessions;
}

// ===== RECALIBRATION UI =====
async function saveRunAdjust() {
  const v = runAdjust ? JSON.stringify(runAdjust) : '';
  try { if (v) await window.storage.set('run-adjust', v); else await window.storage.delete('run-adjust'); } catch(e) {}
  try { if (v) localStorage.setItem('gym-tracker-run-adjust', v); else localStorage.removeItem('gym-tracker-run-adjust'); } catch(e) {}
}
function openRecal() { recalOpen = true; recalReason = null; render(); }
function closeRecal() { recalOpen = false; render(); }
function pickReason(r) { recalReason = r; render(); }
async function applyRecal(mode) {
  const o = getRecalOptions();
  if (!o) { closeRecal(); return; }
  runAdjust = { reason: recalReason, mode, plan: PLAN_ID, setAt: new Date().toISOString(), bridgeFrom: localDateStr(new Date()) };
  if (mode === 'extend') { runAdjust.targetDate = o.newDate.toISOString(); runAdjust.extraWeeks = o.extraWeeks; }
  else if (mode === 'repace') { runAdjust.goalPace = o.provPace; runAdjust.goalDist = GOAL_DIST; }
  else if (mode === 'redist') { runAdjust.goalPace = GOAL_PACE; runAdjust.goalDist = Math.round(o.provDist * 2) / 2; }
  await saveRunAdjust();
  recalOpen = false;
  render();
}
async function clearRecal() {
  runAdjust = null;
  await saveRunAdjust();
  render();
}

function renderRecalModal() {
  if (!recalOpen) return '';
  const o = getRecalOptions();
  const reasons = [
    ['missed', 'Missed sessions, life got busy'],
    ['illness', 'Illness or injury'],
    ['toohard', 'The paces are too hard for me right now'],
    ['restart', 'Coming back after a break']
  ];
  let body;
  if (!o) {
    body = `<div style="color:#3E5158;font-size:13px;padding:16px 0;">Not enough recent runs to recalibrate from. Log 1–2 honest runs (any distance) and come back, I'll rebuild the plan from real numbers.</div>`;
  } else if (!recalReason) {
    body = `<div style="font-size:12px;color:#3E5158;margin-bottom:12px;">What actually happened? This changes what I rebuild.</div>` +
      reasons.map(([k, label]) => `<button class="swap-item" onclick="pickReason('${k}')"><div class="swap-item-name">${label}</div></button>`).join('');
  } else {
    const curPace = fmtPace(o.p.paceGoal);
    const gap = o.p.paceGoal - GOAL_PACE;
    const rdl = RACE_DATE.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    const provMin = Math.floor(o.provTime), provSec = Math.round((o.provTime - provMin) * 60);
    const dateStr = o.newDate.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    body = `
      <div style="background:#FFFFFF;border-radius:10px;padding:11px;margin-bottom:12px;font-size:12px;color:#3E5158;line-height:1.5;">
        <strong style="color:#10242B;">Where you actually are:</strong> your best recent run projects to
        <strong style="color:#10242B;">${curPace}/km</strong> for ${GOAL_DIST}km (from ${o.p.basis.distance}km).
        Goal pace is ${fmtPace(GOAL_PACE)}, a gap of <strong style="color:#B93D0B;">${Math.round(gap * 60)}s/km</strong>, with ${Math.round(o.weeksLeft)} weeks left.
      </div>
      <div class="swap-sub">Hold any two, the third has to move</div>
      <button class="swap-item" onclick="applyRecal('extend')">
        <div class="swap-item-name">Keep ${GOAL_DIST}km @ ${fmtPace(GOAL_PACE)}, move the date</div>
        <div class="swap-item-meta">${o.extraWeeks <= 0 ? 'Already achievable, just rebuild the block' : `Needs ~${o.extraWeeks} more weeks → ${dateStr}`}</div>
      </button>
      <button class="swap-item" onclick="applyRecal('repace')">
        <div class="swap-item-name">Keep ${GOAL_DIST}km on ${rdl}, revise the pace</div>
        <div class="swap-item-meta">Provable: ${fmtPace(o.provPace)}/km → ${fmtClock(o.provTime)}</div>
      </button>
      <button class="swap-item" onclick="applyRecal('redist')">
        <div class="swap-item-name">Keep ${fmtPace(GOAL_PACE)}/km on ${rdl}, revise the distance</div>
        <div class="swap-item-meta">Provable: ~${(Math.round(o.provDist * 2) / 2).toFixed(1)}km at ${fmtPace(GOAL_PACE)}/km</div>
      </button>
      <button class="swap-reset" onclick="applyRecal('rebuild')">Change nothing, just rebuild this week from current fitness</button>
      <div style="font-size:12px;color:#5B6E74;margin-top:10px;line-height:1.5;">All four rebuild this week's sessions from what you can run today. Projections assume ~0.5%/week improvement with consistent training.</div>`;
  }
  return `
    <div class="swap-modal show" onclick="if(event.target===this)closeRecal()">
      <div class="swap-sheet">
        <div class="swap-head"><span>⟲ Back on track</span><button class="swap-close" onclick="closeRecal()">✕</button></div>
        <div class="swap-body">${body}</div>
      </div>
    </div>`;
}



let runningSubTab = 'plan';

// ===== DYNAMIC ADJUSTMENT SYSTEM =====
// Tracks actual performance and adjusts phases based on benchmark achievement
// Phase week-ranges are derived from the ACTIVE program so they never go stale
// when the program changes length or shape.
function getPhaseBounds() {
  const order = [], map = {};
  for (const w of RUN_PROGRAM) {
    if (!map[w.phase]) { map[w.phase] = [w.week, w.week]; order.push(w.phase); }
    else map[w.phase][1] = w.week;
  }
  return order.map(name => ({ name, start: map[name][0], end: map[name][1] }));
}
function getPhaseNum(week) {
  const b = getPhaseBounds();
  for (let i = 0; i < b.length; i++) if (week >= b[i].start && week <= b[i].end) return i + 1;
  return b.length;
}
function getPhasePerformance(phaseNum) {
  const b = getPhaseBounds();
  const ph = b[Math.min(Math.max(phaseNum, 1), b.length) - 1];
  const startWeek = ph.start, endWeek = ph.end;
  const { benchmarks, hitCount } = getReadiness();
  
  // Benchmarks relevant to this phase
  const phaseBenchmarks = benchmarks.filter(b => b.week >= startWeek && b.week <= endWeek);
  const phaseHits = phaseBenchmarks.filter(b => b.hit).length;
  const phaseTotal = phaseBenchmarks.length;
  const hitRatio = phaseTotal > 0 ? phaseHits / phaseTotal : 0;
  
  // Score: 0-1 scale
  // 1.0 = hit all benchmarks for phase
  // 0.5 = hit half
  // 0.0 = hit none
  return { hitCount: phaseHits, total: phaseTotal, ratio: hitRatio, phaseBenchmarks };
}

/* The specific failure mode of a fast easy pace: the easy runs all get done,
   because they feel fine, and the quality sessions quietly stop landing because
   he is turning up to them tired. Worth naming when it shows up, since he asked
   for the floor and deserves to know if it is costing him. */
function easyPaceStrain() {
  const wkNow = getProgramWeek();
  if (wkNow < 4) return null;                       // not enough of a pattern yet
  const wkStartAll = new Date(PROGRAM_START);
  let easyDone = 0, easyTotal = 0, qualityDone = 0, qualityTotal = 0;
  for (let w = 1; w < wkNow; w++) {
    const plan = RUN_PROGRAM[w - 1];
    if (!plan) continue;
    const ws = new Date(wkStartAll.getTime() + (w - 1) * 7 * 86400000);
    const a = localDateStr(ws), b = localDateStr(new Date(ws.getTime() + 7 * 86400000));
    const runs = runningLogs.filter(r => {
      const d = localDateStr(r.date); return d >= a && d < b; });
    const used = new Array(runs.length).fill(false);
    // Quality first, and it has to be at something like the prescribed pace: a
    // slow 7km plod is not a completed 6km tempo, and crediting it as one hid
    // exactly the pattern this function exists to find. Each run can only
    // satisfy one session.
    const ordered = plan.sessions.map((ss, i) => ({ ss, i }))
      .sort((x, y) => (SESSION_WEIGHT[y.ss.type] || 30) - (SESSION_WEIGHT[x.ss.type] || 30));
    ordered.forEach(({ ss }) => {
      const isQuality = ['tempo', 'interval', 'racepace', 'confidence', 'timetrial'].includes(ss.type);
      const want = ss.pace || ss.repPace || 6;
      let hit = false;
      for (let k = 0; k < runs.length; k++) {
        if (used[k]) continue;
        const r = runs[k];
        if (r.distance < ss.dist * 0.8) continue;
        if (isQuality) {
          const pace = Math.min(...runEfforts(r).map(ef => ef.time / ef.distance), 99);
          // Halfway between the target and an easy jog. A percentage tolerance
          // does not work now that easy and tempo are only 15s/km apart: at 8%
          // a 6:00 plod counted as a 5:45 tempo, which is the exact confusion
          // this check exists to prevent.
          const cutoff = want + (EASY_FLOOR - want) * 0.5;
          if (pace > cutoff) continue;
        }
        used[k] = true; hit = true; break;
      }
      if (isQuality) { qualityTotal++; if (hit) qualityDone++; }
      else { easyTotal++; if (hit) easyDone++; }
    });
  }
  if (easyTotal < 4 || qualityTotal < 3) return null;
  const easyRate = easyDone / easyTotal, qRate = qualityDone / qualityTotal;
  // Easy work landing but quality work missing is the tell.
  if (easyRate >= 0.7 && qRate <= 0.5)
    return { easyRate, qRate, easyDone, easyTotal, qualityDone, qualityTotal };
  return null;
}

/* What his logged HR says about the pace he is actually running at.
   Perceived effort is not a referee and the pace tables were built on a 5k that
   may not have been a 5k effort at all. HR is the only thing here that can
   settle it, so once there are a few runs with HR the app reads them instead of
   arguing about what "conversational" means. */
function hrVerdict() {
  const withHR = runningLogs.filter(r => r.hr >= 60 && r.hr <= 230 && r.distance >= 2 && r.time > 0);
  if (withHR.length < 3) return { n: withHR.length, need: 3 };
  const recent = withHR.slice(-10);
  // Only the steady stuff: an interval session's average HR says nothing useful.
  const steady = recent.filter(r => !r.seg && (r.time / r.distance) >= EASY_FLOOR - 0.4);
  const pool = steady.length >= 3 ? steady : recent;
  const avgPace = pool.reduce((a, r) => a + r.time / r.distance, 0) / pool.length;
  const avgHR = pool.reduce((a, r) => a + r.hr, 0) / pool.length;
  const z = hrZone(avgHR);
  const cap = easyCapHR();
  return { n: withHR.length, avgPace, avgHR: Math.round(avgHR), zone: z, cap,
           pct: Math.round(hrPct(avgHR) * 100),
           // Under the cap at his easy pace means the pace is fine and the tables
           // were reading off a baseline that understates him.
           easyIsEasy: avgHR <= cap, baselineLow: avgHR <= cap && avgPace <= EASY_FLOOR + 0.1 };
}

function getAdjustmentRecommendation() {
  const w = getProgramWeek();
  if (w === 0) return null; // program hasn't started
  
  const { benchmarks, hitCount, total } = getReadiness();
  
  const phaseNum = getPhaseNum(w);
  const perf = getPhasePerformance(phaseNum);
  const _b = getPhaseBounds()[phaseNum - 1];
  const phaseStart = _b.start, phaseEnd = _b.end;
  // Count benchmarks whose week has actually FINISHED, rather than a pro-rata
  // share of the phase. The old maths did ceil((1/4) * 2) = 1 in week 1 of a
  // four-week phase whose first benchmark is not due until week 2, so the app
  // opened on day one telling him to repeat a session he had not been asked to
  // run yet — directly under a card saying no gates were due. Nagging someone
  // for missing a session that does not exist is the fastest way to lose them.
  const expectedHits = perf.phaseBenchmarks.filter(b => b.week < w).length;
  const actualHits = perf.hitCount;
  const gap = expectedHits - actualHits;
  
  let action, color, msg;
  
  if (gap <= -1) {
    // Ahead: you've hit more benchmarks than expected
    action = 'ACCELERATE';
    color = '#1B7F5A';
    msg = (() => {
      const d = getDynamicShift();
      return d.shift < 0
        ? `You're ahead of schedule, hitting benchmarks early. This week's quality paces have already been scaled ${Math.round(Math.abs(d.shift)*60)}s/km faster to match. Easy runs stay easy.`
        : `You're ahead of schedule, hitting benchmarks early. Log a faster effort and the quality paces will scale up automatically.`;
    })();
  } else if (gap === 0) {
    // On track
    action = 'ON TRACK';
    color = '#1D6A82';
    msg = `You're hitting benchmarks as planned. Stick with the current phase, consistency is what locks in race day.`;
  } else if (gap === 1) {
    // Slightly behind
    action = 'HOLD';
    color = '#7A5200';
    const missedBench = perf.phaseBenchmarks.find(b => !b.hit && b.week < w);
    msg = missedBench
      ? `You're one benchmark behind this phase. Repeat the session for "${missedBench.name}" before moving forward, each step must be proven.`
      : `You're one benchmark behind this phase. Get the outstanding session in before moving on.`;
  } else {
    // Behind by >1
    action = 'REPEAT PHASE';
    color = '#B93D0B';
    msg = `You're behind by ${gap} benchmarks. Hold this phase for another week and nail the missing sessions. Better to over-prepare than under-prepare before race day.`;
  }
  
  return { action, color, msg, phaseNum, gap, expectedHits, actualHits };
}

// Real dynamic scaling. Previously ACCELERATE only *said* it would push intensity
// and then returned the unmodified plan. This actually rewrites the prescribed
// paces from current fitness, so blitzing the gates makes the sessions harder.
function getDynamicShift() {
  const prof = getFitnessProfile();
  if (!prof) return { shift: 0, state: 'none', prof: null };
  // Judged against where the plan expects him to be THIS week, not against race
  // pace. Week 1 of a 24-week plan is meant to be a long way off 4:58.
  const expect = expectedGoalPace(getPlanWeek());
  const gap = prof.paceGoal - expect; // negative = ahead of the plan
  let shift = 0, state = 'hold';
  if (gap < -0.05) {           // ahead of the plan → prescribe faster
    shift = Math.max(gap * 0.6, -0.25);  // cap at 15s/km faster
    state = 'accelerate';
  } else if (gap > 0.15) {     // well behind → ease the quality work back
    const bs = prof.basis || {};
    const hardBasis = !!bs.seg || /interval/.test((bs.run || {}).type || '') || (bs.time > 0 && bs.time / bs.distance <= EASY_FLOOR - 0.45);
    if (hardBasis) {
      shift = Math.min((gap - 0.15) * 0.5, 0.2);
      state = 'ease';
    }
  }
  // Gate bonus: hitting benchmarks ahead of schedule earns a further nudge.
  // Computed inline from readiness — calling getAdjustmentRecommendation() here
  // would recurse, since its ACCELERATE branch calls getDynamicShift().
  try {
    const r = getReadiness();
    const w = getProgramWeek();
    const dueTotal = r.benchmarks.filter(b => b.week <= w).length;
    const hitTotal = r.benchmarks.filter(b => b.hit).length;
    if (hitTotal - dueTotal >= 1 && state !== 'ease') { shift -= 0.05; state = 'accelerate'; }
  } catch (e) {}
  return { shift: Math.max(shift, -0.3), state, gap, prof, expect };
}

// Quality work scales; easy and long runs never do — easy must stay easy.
const QUALITY_TYPES = ['tempo', 'interval', 'racepace', 'confidence'];
function scaleSessions(sessions) {
  const d = getDynamicShift();
  if (!d.shift) return { list: sessions, d };
  const list = sessions.map(s => {
    if (!QUALITY_TYPES.includes(s.type)) return s;
    const o = Object.assign({}, s);
    if (o.repPace) o.repPace = Math.max(3.5, o.repPace + d.shift);
    if (o.pace) o.pace = Math.max(3.5, o.pace + d.shift);
    return o;
  });
  return { list, d };
}

function getEffectiveProgram() {
  // Returns the program with dynamic adjustments applied
  // For now: if behind, extend current phase; if ahead, keep original (no compression to avoid burnout)
  const w = getProgramWeek();
  const adj = getAdjustmentRecommendation();
  
  if (!adj) return RUN_PROGRAM; // pre-program or no adjustment needed
  
  // If REPEAT PHASE, shift all future weeks forward by 1
  if (adj.action === 'REPEAT PHASE') {
    const shifted = RUN_PROGRAM.map((p, i) => ({
      ...p,
      week: p.week + (w >= p.week ? 1 : 0) // shift weeks at/past current
    }));
    return shifted;
  }
  
  // Otherwise return original (ON TRACK, HOLD, or ACCELERATE all follow planned path)
  return RUN_PROGRAM;
}

let runOpen = null;     // which pending session is expanded (null = the next one)
let runSheet = null;    // 'checkpoints' | 'after' | 'settings'
function openRunSheet(k) { runSheet = k; render(); }
function closeRunSheet() { runSheet = null; render(); }

const PHASE_SHORT = { 'Foundation': 'Base', '10k Block': '10k', 'Half Base': 'Half base', 'Race Specific': 'Race pace', 'Taper': 'Taper' };

/* The whole plan as an elevation profile: weekly kilometres as the terrain,
   flags on the time trials and the race, an orange dot where you are. */
function planProfileSVG(w) {
  const prog = RUN_PROGRAM, n = prog.length;
  const km = prog.map(p => p.sessions.reduce((s, x) => s + (x.dist || 0), 0));
  const max = Math.max(...km, 1);
  const step = n > 1 ? 342 / (n - 1) : 0;
  const X = i => 24 + i * step, base = 150, Y = v => base - (v / max) * 96;
  const P = i => X(i).toFixed(1) + ' ' + Y(km[i]).toFixed(1);
  const cur = Math.max(0, Math.min(n - 1, (w || 1) - 1));
  const all = km.map((v, i) => P(i)).join(' L');
  const doneTo = w > n ? n - 1 : cur;
  const doneArea = doneTo > 0 ? `<path d="M24 ${base} L${km.slice(0, doneTo + 1).map((v, i) => P(i)).join(' L')} L${X(doneTo).toFixed(1)} ${base} Z" fill="#E8501A"/>` : '';
  let flags = '', labels = '';
  const flagged = {};
  prog.forEach((p, i) => {
    const s = p.sessions.find(x => x.type === 'race' || x.type === 'timetrial' || x.type === 'confidence');
    if (!s) return;
    flagged[i] = true;
    const x = X(i), y = Y(km[i]), top = y - 25, left = i > n - 4;
    flags += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${top.toFixed(1)}"/><path d="M${x.toFixed(1)} ${top.toFixed(1)} L${(x + (left ? -10 : 10)).toFixed(1)} ${(top + 4).toFixed(1)} L${x.toFixed(1)} ${(top + 8).toFixed(1)} Z"/>`;
    const txt = s.type === 'race' ? 'Race' : (s.benchmark && s.benchmark.dist ? s.benchmark.dist + 'k' : 'Trial');
    labels += `<text x="${(x + (left ? 2 : -3)).toFixed(1)}" y="${(top - 5).toFixed(1)}" text-anchor="${left ? 'end' : 'start'}" font-weight="700" fill="#10242B">${txt}</text>`;
  });
  const pk = km.indexOf(max);
  if (!flagged[pk] && !flagged[pk - 1] && !flagged[pk + 1] && !flagged[pk + 2] && !flagged[pk - 2]) labels += `<text x="${Math.min(350, X(pk)).toFixed(1)}" y="${(Y(max) - 8).toFixed(1)}" text-anchor="middle" font-weight="600" fill="#3E5158">${max.toFixed(0)} km</text>`;
  let ticks = '', names = '';
  (RUN_PHASES || []).forEach((ph, i, arr) => {
    const parts = String(ph.weeks).split('–').map(x => parseInt(x, 10));
    const lo = parts[0], hi = isNaN(parts[1]) ? parts[0] : parts[1];
    if (isNaN(lo)) return;
    const mid = (X(lo - 1) + X(Math.min(n, hi) - 1)) / 2;
    names += `<text x="${Math.min(360, Math.max(30, mid)).toFixed(1)}" y="${base + 19}" text-anchor="middle" font-weight="600" fill="#3E5158">${PHASE_SHORT[ph.name] || ph.name}</text>`;
    if (i < arr.length - 1) { const tx = X(hi - 1) + step / 2; ticks += `<line x1="${tx.toFixed(1)}" y1="${base}" x2="${tx.toFixed(1)}" y2="${base + 6}"/>`; }
  });
  return `<svg class="map-art" role="img" aria-label="The ${n} week plan as an elevation profile of weekly kilometres, peaking at ${max.toFixed(0)} km. You are in week ${Math.min(n, Math.max(1, w || 1))}." viewBox="0 0 390 184" font-family="Inter, system-ui, sans-serif" font-size="11">
    <path d="M24 ${base} L${all} L${X(n - 1).toFixed(1)} ${base} Z" fill="#C4D3D0"/>
    ${doneArea}
    <path d="M${all}" fill="none" stroke="#10242B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="24" y1="${base}" x2="366" y2="${base}" stroke="#10242B" stroke-width="1.5"/>
    <g stroke="#10242B" stroke-width="1.5">${ticks}</g>
    ${names}
    <g stroke="#10242B" stroke-width="1.8" fill="#10242B">${flags}</g>
    ${labels}
    ${w <= n ? `<circle cx="${X(cur).toFixed(1)}" cy="${Y(km[cur]).toFixed(1)}" r="9" fill="#FFFFFF"/><circle cx="${X(cur).toFixed(1)}" cy="${Y(km[cur]).toFixed(1)}" r="6" fill="#E8501A"/>` : ''}
  </svg>`;
}

function fmtRepDist(d) { return d >= 1 ? d + ' km' : Math.round(d * 1000) + ' m'; }

/* One run, opened up. Dark so it reads as the thing to do next. */
function renderSessionCard(s, isToday, isDone, idx) {
  // Interval sessions carry repPace (the number you actually run) and no single
  // overall pace. Reading s.pace blind rendered "NaN:NaN/km".
  const shownPace = s.pace || s.repPace || 6;
  const floor = sessionFloor(s);
  const kcal = sessionKcal(s);
  const speed = paceToSpeed(shownPace);
  // avgPace covers the warmup, cooldown and recoveries, so the time estimate is
  // the real session length rather than the rep pace times the distance.
  const estMin = s.dist * (s.avgPace || s.pace || shownPace);
  const tooLongForTreadmill = estMin > 70 && !s.outside;
  const slot = typeof idx === 'number' ? runSlots[idx] : null;
  const pinned = slot && slot.d >= 0;
  const opts = [[-1, 'Any day'], [1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [0, 'Sun']];
  return `
    <div class="run-card">
      <div class="top">
        <span class="a">${isToday ? 'Next up' : 'Also this week'}${pinned ? ' · ' + DAY_NAMES[slot.d] : ' · any day'}</span>
        <span class="b">${s.dist} km · about ${Math.round(estMin)} min</span>
      </div>
      <div class="ttl">${s.label}</div>
      <div class="nums">
        ${s.reps
          ? `<span><b>${s.reps} × ${fmtRepDist(s.repDist)}</b></span><span><b>${fmtPace(s.repPace)}</b> /km</span><span><b>${paceToSpeed(s.repPace).toFixed(1)}</b> km/h</span>`
          : `<span><b>${fmtPace(shownPace)}</b> /km</span><span><b>${speed.toFixed(1)}</b> km/h on the treadmill</span>`}
      </div>
      ${s.reps ? `<p>Recovery: ${s.recovery}.</p>` : ''}
      <p>${s.desc}</p>
      ${s.type === 'easy' || s.type === 'long' ? `<p><b>Under ${easyCapHR()} bpm</b> the whole way. If the pace takes you over, slow down, even past 6:20. That is the run working, not failing.</p>` : ''}
      ${tooLongForTreadmill ? `<p class="warnline"><b>Over 70 minutes: run this one outside.</b></p>` : ''}
      ${s.outside ? `<p class="warnline"><b>Run this outside.</b> ${s.type === 'race' ? 'Race day is outdoors, no surprises.' : 'Time to practise real-world pacing, wind and terrain.'}</p>` : ''}
      ${s.benchmark ? `<p>Checkpoint: hitting this counts toward your goal readiness.</p>` : ''}
      <details>
        <summary>${floor ? 'Not feeling it? The smaller version' : 'More'}</summary>
        ${floor ? `<p>${floor.text}</p>` : ''}
        <p style="margin-top:4px;">About ${kcal} cal at ${bodyKg} kg.</p>
      </details>
      <div class="acts">
        ${slot ? `<select onchange="setRunDay(${idx}, this.value)" aria-label="Day for this run">${opts.map(([v, n]) => `<option value="${v}"${slot.d === v ? ' selected' : ''}>${n}</option>`).join('')}</select>` : ''}
        <button class="btn accent" onclick="runningSubTab='log'; render();">Log this run</button>
      </div>
    </div>`;
}

function hrVerdictText(v) {
  if (v.need) return { tone: 'info', title: 'Prove the pace', body: `Your runs have been averaging around 175, which is race effort, not easy. Log the average HR off your Garmin with your next ${v.need - v.n} run${v.need - v.n === 1 ? '' : 's'} and this will say whether the easy days are finally easy. ${v.n ? v.n + ' logged so far.' : ''}` };
  const paceStr = fmtPace(v.avgPace);
  if (v.baselineLow) return { tone: 'good', title: 'You were right', body: `Your steady runs average <strong>${v.avgHR} bpm at ${paceStr}/km</strong>, under your easy cap of ${v.cap}. That is easy, so ${paceStr} is a fair easy pace for you and the 5k that set your baseline was not a 5k effort. Your race paces are probably quicker than this plan assumes, and the next time trial will say by how much, so run that one properly.` };
  if (v.easyIsEasy) return { tone: 'good', title: 'Easy is actually easy', body: `Steady runs averaging <strong>${v.avgHR} bpm at ${paceStr}/km</strong>, under your easy cap of ${v.cap}. Easy days are doing their job.` };
  return { tone: 'warn', title: 'Easy is not easy yet', body: `Your steady runs average <strong>${v.avgHR} bpm at ${paceStr}/km</strong>, over your easy cap of ${v.cap} (zone ${v.zone.z}, ${v.zone.name.toLowerCase()}). That is the grey zone: too hard to recover from, too easy to be a workout. Either ease off on the easy days or accept the quality sessions will suffer.` };
}

        }).join('')}

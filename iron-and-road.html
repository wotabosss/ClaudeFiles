<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DCE6E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iron &amp; Road">
<title>Iron &amp; Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════ IRON & ROAD · "The Route" ════════
   Training drawn as a map. Lifts are round stops, runs are diamonds, done is filled.
   One accent (orange) marks where you are. Green means done or held. */
:root {
  --map: #DCE6E4; --contour: #C2D1CE;
  --ink: #10242B; --text: #10242B; --text-2: #3E5158; --text-3: #5B6E74;
  --bg: #FFFFFF; --sheet: #FFFFFF; --surface: #EEF2F1; --raised: #FFFFFF; --bone: #FFFFFF;
  --line: #C9D6D3; --line-2: #9FB2AE;
  --accent: #E8501A; --red: #B93D0B;
  --green: #1B7F5A; --green-bg: #E3F1EB;
  --yellow: #7A5200; --yellow-bg: #FFF4D6; --yellow-line: #E2B93B;
  --blue: #1D6A82; --blue-bg: #E1EEF2;
  --bad-bg: #FDEBE3;
  --purple: #5A4B9A;
  --r: 18px;
  --display: 'Sora', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior-y: none; }
body {
  font-family: var(--body); background: var(--bg); color: var(--text);
  min-height: 100vh; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--display); letter-spacing: -0.02em; }
strong, b { font-weight: 700; }

.container { max-width: 560px; margin: 0 auto; padding-bottom: calc(152px + env(safe-area-inset-bottom)); }

/* ── Map header + sheet ── */
.map { position: relative; background: var(--map); overflow: hidden;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 40px; }
.map .contours { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.map-title { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.map-title.big { font-size: 30px; letter-spacing: -0.035em; line-height: 1.05; }
.map-sub { font-size: 13px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
.map-art { position: relative; display: block; width: calc(100% + 40px); margin: 6px -20px -18px; height: auto; }
.map-side { text-align: right; flex-shrink: 0; }
.map-side .n { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; color: var(--red); }
.map-side .l { font-size: 13px; color: var(--text-2); }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--sheet); color: var(--ink);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pill-btn { height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: var(--sheet); color: var(--ink); font-size: 14px; font-weight: 600; flex-shrink: 0; }
.sheet { position: relative; margin-top: -24px; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 20px 20px 8px; }
.vbadge { font-size: 12px; font-weight: 600; color: var(--text-3); }

@media (prefers-reduced-motion: no-preference) {
  .sheet > * { animation: rise .32s cubic-bezier(.2,.7,.3,1) backwards; }
  .sheet > *:nth-child(2) { animation-delay: .04s; }
  .sheet > *:nth-child(3) { animation-delay: .08s; }
  .sheet > *:nth-child(4) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
}
body.no-anim .sheet > * { animation: none; }

/* ── Type helpers ── */
.eyebrow, .card-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.eyebrow.hot { color: var(--red); }
.card-label { margin-bottom: 10px; }
.section-title { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin: 16px 0 8px; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }

/* ── Cards ── */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card.plain { background: none; padding: 0; }
.rule { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

/* ── Buttons ── */
.btn { background: var(--ink); color: #FFFFFF; border: none; border-radius: 14px; padding: 11px 16px;
  font-size: 15px; font-weight: 600; min-height: 44px; }
.btn:active, .btn-small:active, .tab:active { opacity: .8; }
.btn.wide { width: 100%; height: 54px; border-radius: 16px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.btn.accent { background: var(--accent); color: var(--ink); font-weight: 700; }
.btn.ghost { background: var(--sheet); color: var(--ink); border: 1px solid var(--line-2); }
.btn-small { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px; }
.reset-btn { background: var(--sheet); border: 1px solid var(--line); color: var(--ink); border-radius: 20px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px; }
.link-btn { background: none; border: none; color: var(--text-2); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 10px 0; min-height: 44px; }
.btn-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btn-3 button { height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--sheet); color: var(--ink); font-size: 13px; font-weight: 600; padding: 0 4px; }

/* ── Floating pill nav ── */
.tabs { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%);
  width: min(528px, calc(100% - 32px)); bottom: calc(12px + env(safe-area-inset-bottom));
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--ink); border-radius: 30px; padding: 4px;
  box-shadow: 0 8px 24px rgba(16,36,43,0.22); }
.tab { height: 52px; border: none; border-radius: 26px; background: none; color: #DCE6E4; font-size: 13px; font-weight: 600; }
.tab.active { background: #FFFFFF; color: var(--ink); font-weight: 700; }

/* ── Segmented controls ── */
.week-seg, .seg { display: flex; gap: 4px; background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 10px; }
.week-seg button, .seg button { flex: 1; background: transparent; border: none; color: var(--text-2); border-radius: 11px;
  min-height: 40px; padding: 8px; font-size: 14px; font-weight: 600; }
.week-seg button.active, .seg button.active { background: var(--ink); color: #FFFFFF; }
.week-auto { font-size: 12px; color: var(--text-3); margin: -4px 0 12px; padding: 0 2px; line-height: 1.45; }

/* ── Day chips ── */
.day-selector { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.day-btn { background: var(--sheet); border: 1px solid var(--line); color: var(--text-2); border-radius: 14px;
  padding: 0 3px; text-align: center; overflow: hidden; min-height: 54px; height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.day-btn.active { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.day-name { font-size: 12px; font-weight: 700; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-sub { font-size: 11px; font-weight: 500; opacity: .8; line-height: 1; }

/* ── Session progress ── */
.session-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  margin: 0 -20px 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 20px 8px; border-bottom: 1px solid var(--line); }
.sb-track { flex: 1; height: 6px; border-radius: 3px; background: var(--map); overflow: hidden; }
.sb-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.sb-count { font-size: 13px; font-weight: 700; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── The lift route: exercises as stops ── */
.route { position: relative; }
.route::before { content: ''; position: absolute; left: 11px; top: 22px; bottom: 22px; border-left: 2px dashed var(--line-2); }
.route > .card { position: relative; margin-left: 36px; }
.route > .card.reorder-mode { margin-left: 0; }
.route > .card .node { position: absolute; left: -36px; top: 13px; width: 24px; height: 24px; border-radius: 12px; background: var(--sheet);
  display: flex; align-items: center; justify-content: center; }
.route > .card.shut { background: none; padding: 6px 0 6px 0; margin-bottom: 2px; }
.route > .card.shut .node { top: 15px; }
.route > .card.shut .card-head { min-height: 44px; }
.route > .card.shut.complete-card .exercise-name { color: var(--text-2); }
.route:has(.reorder-mode)::before { display: none; }

.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
.exercise-name { font-size: 15px; font-weight: 600; }
.route > .card:not(.shut) > .card-head .exercise-name { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.exercise-meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.target-sets { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.spark { display: block; }
.card.shut .spark { display: none; }
.done-chip { font-size: 12px; font-weight: 700; color: var(--green); white-space: nowrap; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; border-radius: 8px; padding: 2px 7px; background: var(--sheet); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; vertical-align: 2px; }
.tag.warn { color: var(--yellow); border-color: var(--yellow-line); background: var(--yellow-bg); }
.chev { color: var(--text-3); font-size: 12px; transition: transform .2s; }
.chev.open { transform: rotate(180deg); }
.card-body { margin-top: 12px; }

.climb { margin-bottom: 10px; }
.climb-bar { height: 8px; border-radius: 4px; background: var(--contour); overflow: hidden; margin-bottom: 6px; }
.climb-bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
.recommendation { font-size: 13.5px; line-height: 1.45; margin-bottom: 10px; color: var(--text); }
.recommendation::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 7px; background: var(--text-3); vertical-align: 1px; }
.rec-start::before { background: var(--blue); }
.rec-push::before { background: var(--green); }
.rec-hold::before { background: var(--yellow-line); }
.rec-deload::before { background: var(--accent); }
.last-session { font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
.last-session strong { color: var(--text); }
.note-panel { background: var(--sheet); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
.note-panel p + p { margin-top: 6px; }
.note-panel b { color: var(--text); }
.ramp { font-size: 13px; color: var(--yellow); background: var(--yellow-bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.45; }

.legend { background: var(--surface); border-radius: 14px; padding: 0 14px; margin-bottom: 12px; }
.legend summary { cursor: pointer; list-style: none; padding: 12px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::after { content: ' ▾'; color: var(--text-3); }
.legend[open] summary::after { content: ' ▴'; }
.legend p { font-size: 13px; line-height: 1.55; color: var(--text-2); margin: 0 0 10px; }
.legend p:last-child { padding-bottom: 12px; }
.legend b { color: var(--text); }
.lg-k { font-family: var(--display); color: var(--text); }

.todays-sets-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.08em; margin: 10px 0 6px; }
.set-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 36px; align-items: center; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid var(--line); }
.set-row input, .set-in { width: 100%; min-width: 0; height: 38px; background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--text);
  font-size: 15px; font-weight: 600; text-align: center; padding: 0 4px; }
.set-row input:focus { background: var(--sheet); border-color: var(--ink); outline: none; }
.set-row.warmup input { color: var(--yellow); }
.set-row.dropset input { color: var(--blue); }
.set-num { width: 26px; height: 26px; border-radius: 13px; background: var(--contour); color: var(--text); font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.set-num.complete { background: var(--green); color: #FFFFFF; }
.set-num.warmup { background: var(--yellow-bg); color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow-line); }
.set-num.dropset { background: var(--blue-bg); color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.set-num.next { background: var(--sheet); color: var(--red); box-shadow: inset 0 0 0 2px var(--accent); }
.set-num.extra { background: var(--blue-bg); color: var(--blue); box-shadow: none; }
.set-type-btn { border: none; padding: 0; position: relative; }
.set-type-btn::after { content: ''; position: absolute; inset: -9px; }
.set-type-btn:active { transform: scale(0.92); }
.set-value { flex: 1; font-size: 14px; font-weight: 600; }
.delete-btn { background: none; border: none; color: var(--text-3); font-size: 15px; width: 36px; height: 38px; }

.log-form { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
.log-form input { flex: 1; min-width: 0; height: 48px; background: var(--sheet); color: var(--text); border: 2px solid var(--ink); border-radius: 12px;
  padding: 0 10px; font-family: var(--display); font-size: 20px; font-weight: 700; }
.log-form input::placeholder { color: var(--text-3); font-weight: 600; font-family: var(--body); font-size: 15px; }
.log-form .btn { height: 48px; border-radius: 12px; background: var(--accent); color: var(--ink); font-weight: 700; padding: 0 18px; }
.log-form .btn.bw { background: var(--blue-bg); color: var(--blue); padding: 0 12px; }

.set-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.set-options button { flex: 1; min-width: 88px; background: var(--sheet); border: 1px solid var(--line); color: var(--ink); border-radius: 12px;
  min-height: 44px; padding: 6px 8px; font-size: 13px; font-weight: 600; }
.set-options .btn-finish { color: var(--green); border-color: var(--green); }
.reorder-mode { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.reorder-mode.dragging { box-shadow: 0 10px 30px rgba(16,36,43,0.25); position: relative; z-index: 20; outline: 2px solid var(--accent); }
.reorder-mode.settling { transition: transform 0.16s ease; }
.reorder-handle { color: var(--text-2); font-size: 19px; line-height: 1; cursor: grab; touch-action: none;
  display: inline-flex; align-items: center; justify-content: center; min-width: 46px; min-height: 46px; margin: -10px -8px -10px 0;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; }
.reorder-mode.dragging .reorder-handle { cursor: grabbing; }
.finish-confirm { background: var(--yellow-bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
.fc-q { font-size: 14px; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
.fc-sub { font-size: 12px; font-weight: 600; color: var(--text-2); }
.fc-btns { display: flex; gap: 8px; }
.fc-btns button { flex: 1; border-radius: 12px; min-height: 44px; padding: 8px; font-size: 13px; font-weight: 700; }
.fc-more { background: var(--sheet); border: 1px solid var(--line); color: var(--text); }
.fc-done { background: var(--green); border: 1px solid var(--green); color: #FFFFFF; }

/* ── Day finished ── */
.day-finished { background: var(--green-bg); border-radius: 18px; padding: 24px 18px 18px; text-align: center; margin-bottom: 14px; }
.df-check { width: 56px; height: 56px; border-radius: 28px; background: var(--green); color: #FFFFFF; font-size: 28px; font-weight: 800; line-height: 56px; margin: 0 auto 12px; }
.df-title { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--green); }
.df-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.df-stats { display: flex; justify-content: center; gap: 22px; margin: 16px 0 4px; }
.df-stats > div { display: flex; flex-direction: column; }
.df-num { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--text); }
.df-lab { font-size: 12px; color: var(--text-2); }
.df-early { font-size: 12px; color: var(--yellow); margin-top: 10px; }
.df-btns { display: flex; gap: 8px; margin-top: 18px; }
.df-btns button { flex: 1; border-radius: 12px; min-height: 44px; padding: 10px; font-size: 13px; font-weight: 700; }
.df-undo { background: var(--sheet); border: 1px solid var(--line); color: var(--text); }
.df-show { background: transparent; border: 1px solid var(--green); color: var(--green); }

.history { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.history-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); padding: 5px 0; }
.history-toggle { font-size: 13px; color: var(--blue); background: none; border: none; }

/* ── Rest timer ── */
.rest-timer { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 90;
  background: var(--ink); color: #FFFFFF; border-radius: 22px; padding: 8px 12px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 8px 24px rgba(16,36,43,0.3); cursor: default; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.rest-timer.dragging { cursor: grabbing; opacity: 0.92; }
.rest-timer.idle { padding: 6px; gap: 0; }
.rest-flash { position: fixed; inset: 0; z-index: 400; pointer-events: none; background: var(--accent); animation: restFlash 1.4s ease-out forwards; }
@keyframes restFlash { 0% { opacity: 0; } 8% { opacity: 0.55; } 22% { opacity: 0; } 36% { opacity: 0.55; } 50% { opacity: 0; } 64% { opacity: 0.55; } 100% { opacity: 0; } }
.rest-pill { background: var(--ink); border: none; color: #FFFFFF; border-radius: 12px; padding: 5px 10px; font-size: 13px; font-weight: 700; min-height: 30px; white-space: nowrap; letter-spacing: 0; text-transform: none; }
.rest-timer.idle .timer-grip, .rest-timer.idle .timer-label, .rest-timer.idle .timer-display, .rest-timer.idle .timer-btn.reset { display: none; }
.timer-grip { color: #9FB2AE; font-size: 15px; line-height: 1; letter-spacing: -1px; cursor: grab; touch-action: none;
  width: 26px; min-height: 42px; display: flex; align-items: center; justify-content: center; margin: -8px -2px -8px -4px; }
.rest-timer.warning { background: var(--red); }
.timer-display { font-family: var(--display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.timer-label { font-size: 12px; color: #DCE6E4; text-transform: uppercase; letter-spacing: 0.08em; }
.timer-btn { background: #FFFFFF; border: none; color: var(--ink); width: 40px; height: 40px; border-radius: 20px; font-size: 13px; }
.timer-btn.reset { background: none; color: #FFFFFF; box-shadow: inset 0 0 0 1px #5B6E74; }

/* ── Bottom sheets ── */
.swap-modal { position: fixed; inset: 0; z-index: 1000; display: none; }
.swap-modal.show { display: block; }
.swap-modal::before { content: ''; position: absolute; inset: 0; background: rgba(16,36,43,0.5); }
.swap-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 86vh; overflow-y: auto;
  background: var(--sheet); border-radius: 24px 24px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -12px 44px rgba(16,36,43,0.25); animation: swapUp 0.2s ease; }
@keyframes swapUp { from { transform: translateY(16px); opacity: 0.4; } to { transform: translateY(0); opacity: 1; } }
body.no-anim .swap-sheet { animation: none; }
.swap-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; margin-bottom: 8px; }
.swap-close { background: var(--surface); border: none; color: var(--text); width: 44px; height: 44px; border-radius: 22px; font-size: 14px; flex-shrink: 0; }

<div class="container">
  <div id="content"><div class="empty">Loading...</div></div>
</div>

<nav class="tabs" aria-label="Sections">

  <button class="tab" data-tab="track">Lift</button>

<!-- Settings and backup -->
<div class="swap-modal" id="menuModal" onclick="if(event.target===this)closeMenu()">

      <span>Settings and backup</span>

</div>

<!-- Backup / restore sheet -->

  <div class="swap-sheet">
    <div class="swap-head">
      <span id="bkTitle">Restore a backup</span>
      <button class="swap-close" onclick="closeBackup()" aria-label="Close">✕</button>
    </div>
    <div id="bkBody"></div>
  </div>
</div>

<!-- Exercise Swap Sheet -->

  <div class="swap-sheet">
    <div class="swap-head">
      <span>Swap exercise</span>
      <button class="swap-close" onclick="closeSwap()" aria-label="Close">✕</button>
    </div>
    <div class="swap-body" id="swapBody"></div>

// ===== Weekly volume tracker =====
// Counts the sets you have actually logged, per muscle group, for the current
// program week, and shows them against (a) what the evidence says a week of
// growth-driving volume looks like and (b) what this week of the program
// prescribes if you complete every session.
//
// WHAT COUNTS
//   Working set        1.0 to the primary muscle
//   Secondary muscle   0.5 (a bench press is half a triceps set, a row is half a
//                      biceps set). Standard fractional counting.
//   Drop set           0.5 — real extra stimulus, but it is the tail of a set
//                      already counted, not a fresh one.
//   Warm-up            0.0 — submaximal, nowhere near failure, no growth signal.
//                      This is the convention every volume landmark is built on.
const VOL_DROP_CREDIT = 0.5;

// Weekly set landmarks. mev = below this, maintenance at best. lo–hi = the band
// where the dose-response curve is doing its work. mrv = past here you are
// buying fatigue, not muscle. Numbers are fractional sets, so indirect work is
// already priced in — the arm ceilings sit higher than a direct-only chart.
const VOL_TARGETS = {
  chest:        { mev: 8,  lo: 12, hi: 20, mrv: 24 },
  back:         { mev: 10, lo: 14, hi: 22, mrv: 26 },
  'side-delt':  { mev: 8,  lo: 12, hi: 22, mrv: 26 },
  'rear-delt':  { mev: 6,  lo: 10, hi: 18, mrv: 24 },
  shoulders:    { mev: 4,  lo: 6,  hi: 12, mrv: 16 },
  triceps:      { mev: 6,  lo: 10, hi: 20, mrv: 26 },
  biceps:       { mev: 6,  lo: 10, hi: 20, mrv: 26 },
  quads:        { mev: 8,  lo: 12, hi: 18, mrv: 22 },
  hamstrings:   { mev: 6,  lo: 10, hi: 16, mrv: 20 },
  glutes:       { mev: 4,  lo: 8,  hi: 16, mrv: 20 },
  calves:       { mev: 6,  lo: 10, hi: 16, mrv: 20 }
};
const VOL_ORDER = ['chest','back','side-delt','rear-delt','shoulders','triceps','biceps','quads','hamstrings','glutes','calves'];

// Secondary credit, keyed by group|pattern so a swap inherits it automatically.
const VOL_SECONDARY = {
  'chest|press-flat':         { triceps: 0.5, shoulders: 0.5 },
  'chest|press-incline':      { triceps: 0.5, shoulders: 0.5 },
  'chest|press-machine':      { triceps: 0.5, shoulders: 0.5 },
  'chest|dip':                { triceps: 0.5, shoulders: 0.3 },
  'back|pull-vertical':       { biceps: 0.5 },
  'back|row':                 { biceps: 0.5, 'rear-delt': 0.5 },
  'shoulders|press-vertical': { triceps: 0.5, 'side-delt': 0.5 },
  'triceps|press':            { chest: 0.5, shoulders: 0.3 },
  'quads|squat':              { glutes: 0.5, hamstrings: 0.25 },
  'quads|press':              { glutes: 0.5 },
  'quads|lunge':              { glutes: 0.5, hamstrings: 0.25 },
  'hamstrings|hinge':         { glutes: 0.5 },
  'glutes|thrust':            { hamstrings: 0.5 },
  'glutes|hinge':             { hamstrings: 0.5 }
};
// A handful of movements the pattern rule gets wrong.
const VOL_SEC_OVERRIDE = {
  'sap-cable': {},                                  // straight-arm pulldown: no elbow flexion, no biceps
  'bd-bw':     {},                                  // bench dip: triceps only, not a chest movement
  'sr-rope':   { 'rear-delt': 0.5, biceps: 0.25 },  // rope to face is rear delt first
  'jm-bb':     { chest: 0.25 },                     // part press: a little chest
  'jm-smith':  { chest: 0.25 }
};

// Every group one set of this exercise feeds, and by how much.
function volContribution(exId) {
  const c = EX_CATALOG[exId];
  if (!c || !c.group) return null;
  const out = {};
  out[c.group] = 1;
  const sec = VOL_SEC_OVERRIDE[exId] || VOL_SECONDARY[c.group + '|' + c.pattern] || {};
  for (const g in sec) out[g] = (out[g] || 0) + sec[g];
  return out;
}

function emptyVolTally() { const t = {}; VOL_ORDER.forEach(g => t[g] = 0); return t; }

// The tracker's window. It resets on Monday, which is exactly when the program
// flips A <-> B, so one window is always one program week.
function volWindowStart(days) {
  const m = mondayOf(new Date());
  if (days > 7) m.setDate(m.getDate() - 7);   // 14-day view: this Monday and the last one
  return localDateStr(m);
}

// Sets logged inside the window, tallied by muscle group.
function volCompleted(days) {
  const from = volWindowStart(days);
  const tally = emptyVolTally();
  const seenDates = new Set();
  let working = 0, drops = 0, warmups = 0, unmapped = 0;
  for (const exId of Object.keys(logs)) {
    if (!Array.isArray(logs[exId])) continue;
    const c = volContribution(exId);
    for (const l of logs[exId]) {
      if (!l || !l.date) continue;
      const d = localDateStr(l.date);
      if (d < from) continue;
      if (l.tag === 'warmup') { warmups++; continue; }
      seenDates.add(d);
      const credit = l.tag === 'dropset' ? VOL_DROP_CREDIT : 1;
      if (l.tag === 'dropset') drops++; else working++;
      if (!c) { unmapped++; continue; }
      for (const g in c) if (g in tally) tally[g] += c[g] * credit;
    }
  }
  return { tally, sessions: seenDates.size, from, working, drops, warmups, unmapped };
}

// What the program hands you if you complete every session in the window.
// Reads the live SPLIT, so a swap or an added exercise is reflected straight away.
function volPrescribedWeek(letter) {
  const tally = emptyVolTally();
  {
    const wk = letter === 'A' ? WEEK_A : WEEK_B;
    for (const dayKey of wk) {
      const day = SPLIT[dayKey];
      if (!day || !Array.isArray(day.exercises)) continue;
      const ids = day.exercises.map(e => ({ id: e.id, sets: e.sets || 0 }));
      (extras[dayKey] || []).forEach(id => {
        const cat = EX_CATALOG[id];
        if (cat) ids.push({ id, sets: 3 });   // an added exercise defaults to 3 slots
      });
      for (const e of ids) {
        const c = volContribution(e.id);
        if (!c) continue;
        for (const g in c) if (g in tally) tally[g] += c[g] * e.sets;
      }
    }
  }
  return tally;
}

function volPrescribed(days) {
  const here = volPrescribedWeek(currentWeek);
  if (days <= 7) return here;
  const other = volPrescribedWeek(currentWeek === 'A' ? 'B' : 'A');
  const tally = emptyVolTally();
  VOL_ORDER.forEach(g => tally[g] = here[g] + other[g]);
  return tally;
}

// A group the program deliberately swings between the two weeks (quads on the
// quad week, hamstrings on the posterior week) cannot be judged against a
// one-week band. Derived from the split itself, so it follows any edit you make.
// The gap has to be big in absolute terms AND big relative to the group, or
// ordinary week-to-week variance (biceps 23 vs 20) reads as a deliberate swing.
const VOL_ALT_GAP = 3;
const VOL_ALT_RATIO = 0.4;
function volAlternating() {
  const a = volPrescribedWeek('A'), b = volPrescribedWeek('B');
  const out = {};
  VOL_ORDER.forEach(g => {
    const gap = Math.abs(a[g] - b[g]), top = Math.max(a[g], b[g]);
    out[g] = gap >= VOL_ALT_GAP && top > 0 && gap / top >= VOL_ALT_RATIO;
  });
  return { alt: out, a, b };
}

function volRound(n) { return Math.round(n * 10) / 10; }
function volFmt(n) { const r = volRound(n); return Number.isInteger(r) ? String(r) : r.toFixed(1); }

// Status of one group against its band, scaled for the window length.
function volStatus(done, t, mult) {
  const mev = t.mev * mult, lo = t.lo * mult, hi = t.hi * mult, mrv = t.mrv * mult;
  if (done > mrv) return { cls: 'hi',  key: 'over',  note: 'Over the useful ceiling. Cut a few sets or you are just buying fatigue.' };
  if (done >= lo && done <= hi) return { cls: 'ok', key: 'in', note: '' };
  if (done > hi) return { cls: 'ok', key: 'high', note: 'Above the band but under the ceiling. Fine if recovery holds.' };
  if (done >= mev) return { cls: 'mid', key: 'maint', note: 'Enough to hold what you have, short of the growth band.' };
  return { cls: 'lo', key: 'under', note: '' };
}

function renderVolume() {
  const days = volDays;
  const mult = days / 7;
  const comp = volCompleted(days);
  const pres = volPrescribed(days);
  const swing = volAlternating();

  // Headline: how much of what the program prescribes is actually in the bank.
  let doneTot = 0, presTot = 0;
  VOL_ORDER.forEach(g => { doneTot += comp.tally[g]; presTot += pres[g]; });
  const pct = presTot > 0 ? Math.min(100, Math.round((doneTot / presTot) * 100)) : 0;

  const spark = VOL_ORDER.map(g => {
    const t = VOL_TARGETS[g];
    const st = volStatus(comp.tally[g], t, mult);
    const h = Math.max(3, Math.min(20, Math.round((comp.tally[g] / (t.hi * mult)) * 20)));
    const col = st.cls === 'ok' ? 'var(--green)' : st.cls === 'hi' ? 'var(--red)' : st.cls === 'mid' ? 'var(--yellow)' : 'var(--text-3)';
    return `<i style="height:${h}px;background:${col}" title="${GROUP_LABEL[g]}"></i>`;
  }).join('');

  const fromLabel = new Date(comp.from + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const head = `
    <div class="vol-head" onclick="toggleVolume()">
      <div>
        <div class="vol-title">Volume</div>
        <div class="vol-sub">${comp.sessions} session${comp.sessions === 1 ? '' : 's'} &middot; ${pct}% of plan</div>
      </div>
      <div class="vol-spark">${spark}</div>
      <span class="vol-chev">▾</span>
    </div>`;

  if (!volOpen) return `<div class="vol-wrap">${head}</div>`;

  const rows = VOL_ORDER.map(g => {
    const t = VOL_TARGETS[g];
    const done = comp.tally[g], plan = pres[g];
    const st = volStatus(done, t, mult);
    // Scale so the ceiling, the plan and anything you have actually done all fit.
    const max = Math.max(t.mrv * mult, plan, done) * 1.04;
    const pc = v => Math.max(0, Math.min(100, (v / max) * 100));
    const lo = t.lo * mult, hi = t.hi * mult, mrv = t.mrv * mult;
    const shortBy = lo - done;
    const left = plan - done;
    const word = days > 7 ? 'rotation' : 'week';
    // A group the split deliberately swings between the two weeks cannot be
    // judged against a one-week band, so it is neither scolded nor nagged here.
    const swings = days <= 7 && swing.alt[g];

    // Where you are.
    let note = st.note;
    if (st.key === 'under') {
      note = done === 0
        ? (swings ? '' : `Nothing logged yet. ${volFmt(lo)} sets is the bottom of the band.`)
        : `${volFmt(shortBy)} short of the band.`;
      if (left > 0 && plan >= lo) note = (note ? note + ' ' : '') + `${volFmt(left)} still to come if you finish the ${word}.`;
    } else if (st.key === 'maint') {
      note = `Holding what you have, ${volFmt(shortBy)} short of the growth band.`;
      if (left > 0 && plan >= lo) note += ` ${volFmt(left)} still to come.`;
    }

    // What the program can and cannot do about it. This is the part worth reading:
    // a group the plan itself cannot lift into the band never fixes itself.
    // A shortfall under a full set is rounding, not a deficit. Do not nag about it.
    const planShort = !swings && lo - plan >= 1;
    const addN = Math.ceil(lo - plan);
    let planNote = '';
    if (swings) {
      const other = currentWeek === 'A' ? swing.b[g] : swing.a[g];
      planNote = `Alternates by design: ${volFmt(plan)} this week, ${volFmt(other)} in Week ${currentWeek === 'A' ? 'B' : 'A'}. Judge this one on the rotation view.`;
    } else if (planShort) {
      planNote = `A perfect ${word} of the program only reaches ${volFmt(plan)}. Add about ${addN} set${addN === 1 ? '' : 's'} somewhere or it stays here.`;
    }
    else if (plan > mrv) planNote = `A full ${word} as written lands at ${volFmt(plan)}, past the ceiling.`;
    else if (plan > hi) planNote = `A full ${word} as written lands at ${volFmt(plan)}, above the band but under the ceiling.`;

    const noteCls = st.key === 'over' ? 'bad' : planShort ? 'warn' : '';
    return `
      <div class="vol-row">
        <div class="vol-row-top">
          <span class="vol-name">${GROUP_LABEL[g]}</span>
          <span class="vol-nums"><b>${volFmt(done)}</b> / ${volFmt(t.lo * mult)}–${volFmt(t.hi * mult)} &middot; plan ${volFmt(plan)}</span>
        </div>
        <div class="vol-track">
          <div class="vol-band" style="left:${pc(t.lo * mult)}%;width:${pc(t.hi * mult) - pc(t.lo * mult)}%"></div>
          <div class="vol-fill ${st.cls}" style="width:${pc(done)}%"></div>
          ${plan > 0 ? `<div class="vol-tick" style="left:${pc(plan)}%"></div>` : ''}
        </div>
        ${note ? `<div class="vol-note ${noteCls}">${note}</div>` : ''}
        ${planNote ? `<div class="vol-note ${planShort ? 'warn' : plan > mrv ? 'bad' : ''}">${planNote}</div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="vol-wrap open">
      ${head}
      <div class="vol-body">
        <div class="vol-seg">
          <button class="${days === 7 ? 'active' : ''}" onclick="event.stopPropagation();setVolDays(7)">This week (${currentWeek})</button>
          <button class="${days === 14 ? 'active' : ''}" onclick="event.stopPropagation();setVolDays(14)">Full A+B rotation</button>
        </div>
        <p class="vol-foot" style="margin:0 0 2px;">From Monday ${fromLabel}. ${comp.working} working set${comp.working === 1 ? '' : 's'}${comp.drops ? `, ${comp.drops} drop${comp.drops === 1 ? '' : 's'} at half credit` : ''}${comp.warmups ? `, ${comp.warmups} warm-up${comp.warmups === 1 ? '' : 's'} not counted` : ''}.</p>
        ${rows}
        <div class="vol-key">
          <span><em style="background:rgba(55,200,113,0.35);border:1px solid rgba(55,200,113,0.6)"></em>growth band</span>
          <span><em style="background:var(--bone)"></em>program plan</span>
          <span><em style="background:var(--yellow)"></em>maintenance</span>
          <span><em style="background:var(--red)"></em>over ceiling</span>
        </div>
        <p class="vol-foot">Warm-ups do not count. Drop sets count half. A press gives its triceps and front delts half a set each, a row does the same for biceps and rear delts. ${days === 14 ? 'Bands are doubled for the two-week window.' : 'Legs alternate across A and B, so judge them on the rotation view.'}</p>
      </div>
    </div>`;
}


// ===== Gym floor plan =====
// Nothing here renders. It exists so the test suite can prove every day still
// runs down-up-down or up-down and never sends you up, down and up again, which
// is the constraint the exercise order was built around. Sam knows his gym; the
// app does not need to tell him where the machines are.
// These live downstairs; everything else is up. Dips exist on both floors, so
// they take whichever floor the exercise before them is on and cost no trip.
const DOWNSTAIRS = new Set(['pu-w','pc-m','pc-ez','pd-m','rpd-m','rf-m','llc-m','lc-seated','lc-lying','le-m','scr-m']);
const EITHER_FLOOR = new Set(['cd-m']);

// The floor each exercise in a list sits on, resolving the both-floors ones.
function floorsFor(exercises) {
  const f = exercises.map(e => DOWNSTAIRS.has(e.id) ? 'D' : EITHER_FLOOR.has(e.id) ? null : 'U');
  for (let i = 0; i < f.length; i++) {
    if (f[i]) continue;
    let prev = null, next = null;
    for (let k = i - 1; k >= 0; k--) if (f[k]) { prev = f[k]; break; }
    for (let k = i + 1; k < f.length; k++) if (f[k]) { next = f[k]; break; }
    f[i] = prev || next || 'U';          // follow the neighbour, never force a trip
  }
  return f;
}

// How many times the day makes you change floors, and whether it does it the way
// you want: down-up-down or up-down, never up-down-up.
function floorPlan(exercises) {
  const f = floorsFor(exercises);
  if (!f.length) return { moves: 0, shape: '', label: '', bad: false, floors: f };
  const runs = [f[0]];
  for (const x of f) if (x !== runs[runs.length - 1]) runs.push(x);
  const moves = runs.length - 1;
  const name = { U: 'upstairs', D: 'downstairs' };
  const label = runs.map(r => name[r]).join(' → ');
  // Only an up-down-up pattern is the one you said you do not want.
  const bad = runs.length > 2 && runs[0] === 'U';
  return { moves, shape: runs.join(''), label, bad, floors: f };
}

// a late gym by the clock banned his actual life; judging it by hours of sleep

let wakeTimes = { 0: 9 * 60 + 30, 1: 7 * 60, 2: 7 * 60, 3: 7 * 60, 4: 7 * 60, 5: 7 * 60, 6: 9 * 60 };

/* Perceived effort is a bad referee. He says 5:30 was conversational; the pace
   tables say it should not have been. His Garmin already knows, so the run log
   takes an average HR and the app zones it rather than arguing.
   maxHR is his if he knows it, else the 211 - 0.64*age estimate, which beats
   220 - age but is still only an estimate. */
let maxHR = null;
let restHR = null;
let age = 25;
function estMaxHR() { return maxHR || Math.round(211 - 0.64 * age); }

/* Two ways to zone a heart rate, and for him they disagree violently.
   %max ignores resting HR entirely. Heart rate reserve (Karvonen) works from
   the span between rest and max, and tracks oxygen uptake reserve more closely,
   so it is the better one whenever a resting HR is known.
   It matters here: at a resting HR near 85, 160 bpm is 82% of max, threshold,
   by the first method, but only 68% of reserve, which is the top of easy. A
   high resting HR makes %max overstate how hard he is working, and that is
   exactly the disagreement we were having. */
function hrPct(bpm) {
  if (restHR) return (bpm - restHR) / (estMaxHR() - restHR);
  return bpm / estMaxHR();
}
function hrMethod() { return restHR ? 'HRR' : '%max'; }
function hrAt(frac) {
  if (restHR) return Math.round(restHR + (estMaxHR() - restHR) * frac);
  return Math.round(estMaxHR() * frac);
}
function hrZone(bpm) {
  const p = hrPct(bpm);
  if (p < 0.60) return { z: 1, name: 'Recovery' };
  if (p < 0.70) return { z: 2, name: 'Easy' };
  if (p < 0.80) return { z: 3, name: 'Steady' };
  if (p < 0.90) return { z: 4, name: 'Threshold' };
  return { z: 5, name: 'VO2' };
}
const WIND_DOWN = 45;             // finishing to actually asleep
let liftMinutes = 55;             // his sessions run 50-60; measured from the log where possible

/* Better than any guess: he already timestamps every set, so the gym session's
   real length is sitting in the log. First set to last, plus a padding for the
   warmup before the first logged set and getting changed after the last. */
function measuredLiftMinutes() {
  const byDay = {};
  for (const entries of Object.values(logs)) {
    if (!Array.isArray(entries)) continue;
    for (const l of entries) {
      if (!l || !l.date) continue;
      const k = localDateStr(l.date) + '|' + (l.day || '');
      const t = new Date(l.date).getTime();
      if (!byDay[k]) byDay[k] = { min: t, max: t, n: 0 };
      byDay[k].min = Math.min(byDay[k].min, t);
      byDay[k].max = Math.max(byDay[k].max, t);
      byDay[k].n++;
    }
  }
  const spans = Object.values(byDay)
    .filter(x => x.n >= 8)                              // a real session, not two stray sets
    .map(x => (x.max - x.min) / 60000 + 12)             // padding either end
    .filter(x => x >= 20 && x <= 150)                   // ignore a phone left open overnight
    .sort((a, b) => a - b);
  if (spans.length < 3) return null;                    // not enough history to be worth trusting
  return { mins: Math.round(spans[Math.floor(spans.length / 2)]), n: spans.length };
}
function liftLength() {
  const m = measuredLiftMinutes();
  return m ? { mins: m.mins, measured: true, n: m.n } : { mins: liftMinutes, measured: false };
}
const AMPK_GAP = 180;             // 3h: endurance-then-strength needs this much separation

  if (mins > 1440) mins -= 1440;
  return { mins, wake, asleep, ok: mins >= sleepTarget };
}
function fmtDur(m) {
  const h = Math.floor(m / 60), mm = Math.round(m % 60);

function hhmm(m) {

  } catch (e) {
    try { const l = localStorage.getItem('gym-tracker-run-adjust'); if (l) runAdjust = JSON.parse(l); } catch (e2) {}
  }

  }

  // reload on the same day, then auto-reverts to the canonical program overnight,
  // so the saved program is never permanently overwritten.
  const routineToday = localDateStr(new Date());
  swaps = {};

  const applySwaps = (saved) => {
    for (const dayKey of Object.keys(SPLIT)) {
      const daySwaps = saved[dayKey];
      if (!daySwaps) continue;
      SPLIT[dayKey].exercises = SPLIT[dayKey].exercises.map(ex => {

// ===== STORAGE MANAGEMENT =====
const MAX_RUNS = 10000; // keep last 10,000 runs (~1MB, covers 5+ years of 3 runs/week)
const MAX_LIFT_LOGS_PER_EXERCISE = 1000; // keep last 1000 sets per exercise (~35KB per exercise, covers 5+ years of training)

function enforceStorageLimit() {
  // Remove oldest running logs if over limit
  if (runningLogs.length > MAX_RUNS) {
    runningLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
    runningLogs = runningLogs.slice(-MAX_RUNS); // keep last MAX_RUNS
  }
  
  // Remove oldest lift logs per exercise if over limit
  for (const exId in logs) {
    if (logs[exId].length > MAX_LIFT_LOGS_PER_EXERCISE) {
      logs[exId].sort((a, b) => new Date(a.date) - new Date(b.date));
      logs[exId] = logs[exId].slice(-MAX_LIFT_LOGS_PER_EXERCISE); // keep last MAX
    }
  }
}

async function save() {
  enforceStorageLimit();
  try { await window.storage.set('lift-logs', JSON.stringify(logs)); } catch(e) {}
  try { await window.storage.set('running-logs', JSON.stringify(runningLogs)); } catch(e) {}
  // Fallback: also save to localStorage for offline/downloaded file usage
  try { localStorage.setItem('gym-tracker-running-logs', JSON.stringify(runningLogs)); } catch(e) {}
  try { localStorage.setItem('gym-tracker-lift-logs', JSON.stringify(logs)); } catch(e) {}
}

  'Tap to add. Ten vodka sodas is 650 cal, ten cocktails is 3,200. Same night out, 2,550 apart.</p>'+
  '<div id="drinkRow"></div>'+
  '<div class="lbl" style="margin:26px 0 6px">Or describe what you ate</div>'+
  '<p style="font-size:12.5px;color:var(--ink3);margin-bottom:10px;line-height:1.55">'+
  'Plain words. It matches foods it knows, assumes a normal portion of each, and shows you every assumption to correct.</p>'+
  '<div class="fld"><input id="gTxt" placeholder="e.g. marinated salmon with broccolini" oninput="runGuess()"></div>'+
  '<div id="gOut"></div>'+
  '<div class="brow" id="gLog" style="display:none;margin-top:10px"><button class="btn acc" onclick="logGuess()">Log this estimate</button></div>'+
  '<div class="lbl" style="margin:26px 0 4px">Or type the macros</div>'+
  '<p style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">For restaurant meals and guesses. Not saved to the library.</p>'+
  '<div class="fld"><label>Name</label><input id="mN" placeholder="e.g. pub parma"></div>'+
  '<div class="g4"><div class="fld"><label>Cal</label><input id="mK" type="number" inputmode="numeric"></div>'+
  '<div class="fld"><label>P</label><input id="mP" type="number" inputmode="numeric"></div>'+
  '<div class="fld"><label>C</label><input id="mC" type="number" inputmode="numeric"></div>'+
  '<div class="fld"><label>F</label><input id="mF" type="number" inputmode="numeric"></div></div>'+
  '<div class="brow"><button class="btn pri" onclick="addManual()">Log it</button></div>';}
/* Apostrophes, ampersands and a trailing s all used to break search:
   "cadburys" found nothing, "chocolate" found one of nine, "mac and cheese"
   found nothing because the recipe uses "&". */
function normS(x){return (x||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,'').replace(/\s+/g,' ').trim();}
function matchQ(hay,q){
  var h=normS(hay);
  return q.split(' ').every(function(w){
    if(!w)return true;
    if(h.indexOf(w)>-1)return true;
    if(w.length>3&&w.slice(-1)==='s'&&h.indexOf(w.slice(0,-1))>-1)return true;   // cadburys
    return false;});}
function qFilter(){
  var q=normS($('qS').value),el=$('qR');
  if(!q){el.innerHTML='';return;}
  var out=[];
  meals.forEach(function(m){if(matchQ(m.name,q))out.push({k:'meal',o:m});});
  foods.forEach(function(f){if(matchQ(f.name+' '+f.cat,q))out.push({k:'food',o:f});});
  el.innerHTML=out.length?out.slice(0,30).map(function(x){
    var m=x.k==='meal'?mealMacros(x.o):servingOf(x.o);
    return '<div class="li"><div class="t"><b>'+esc(x.o.name)+'</b><span>'+r0(m.kcal)+' cal &middot; '+r0(m.p)+'p</span></div>'+
      '<button class="ed" onclick="quickAdd(\''+x.k+'\',\''+x.o.id+'\');closeSheet()">Add</button></div>';}).join('')
    :'<div class="blank" style="padding:22px">No match. Use manual entry below.</div>';}
function addManual(){
  var n=$('mN').value.trim()||'Manual entry';
  var k=+$('mK').value||0,p=+$('mP').value||0,c=+$('mC').value||0,f=+$('mF').value||0;
  if(!k&&!p&&!c&&!f){showToast('Enter at least one number');return;}
  logs.push({id:uid(),date:viewDate,kind:'manual',refId:null,qty:1,
    snap:{kcal:k,p:p,c:c,f:f,fib:0,va:0},name:n,slot:settings.slot,loggedAt:new Date().toISOString()});
  closeSheet();renderToday();renderProgress();saveAll();showToast('Logged '+n);}
function sheetLib(){
  var q='';
  var h='<div class="shd"><div><h3>Food library</h3><div class="sb">everything you can log</div></div>'+
    '<button class="cls" onclick="closeSheet()">&times;</button></div>'+
    '<div class="fld"><input id="libS" placeholder="Search" oninput="renderLibList()"></div>'+
    '<div class="brow" style="margin:0 0 6px"><button class="btn" onclick="openSheet(\'food\')">New food</button>'+
    '<button class="btn" onclick="openSheet(\'meal\')">New meal</button></div>'+
    '<div id="libList" style="max-height:52vh;overflow-y:auto"></div>';
  setTimeout(renderLibList,0);return h;}
function renderLibList(){
  var el=$('libList');if(!el)return;
  var q=($('libS')&&$('libS').value||'').toLowerCase().trim();
  var out='';
  var ms=meals.filter(function(m){return !q||m.name.toLowerCase().indexOf(q)>-1;});
  if(ms.length){out+='<div class="lbl" style="margin:16px 0 4px">Meals</div>'+ms.map(function(m){
    var t=mealMacros(m);
    return '<div class="li"><button class="star'+(m.favourite?' on':'')+'" onclick="toggleFavMeal(\''+m.id+'\')">'+
      (m.favourite?'★':'☆')+'</button><div class="t"><b>'+esc(m.name)+'</b>'+
      '<span>'+r0(t.kcal)+' cal &middot; '+m.items.length+' items</span></div>'+
      '<button class="ed" onclick="openSheet(\'meal\',\''+m.id+'\')">Edit</button></div>';}).join('');}
  var fs=foods.filter(function(f){return !q||f.name.toLowerCase().indexOf(q)>-1||(f.cat||'').toLowerCase().indexOf(q)>-1;});
  var cats=[],by={};
  fs.forEach(function(f){var c=f.cat||'Other';if(!by[c]){by[c]=[];cats.push(c);}by[c].push(f);});
  out+=cats.map(function(c){return '<div class="lbl" style="margin:18px 0 4px">'+esc(c)+'</div>'+by[c].map(function(f){
    var s=servingOf(f);
    return '<div class="li"><button class="star'+(f.favourite?' on':'')+'" onclick="toggleFav(\''+f.id+'\')">'+
      (f.favourite?'★':'☆')+'</button><div class="t"><b>'+esc(f.name)+'</b>'+
      '<span>'+esc(f.serving.label)+' &middot; '+r0(s.kcal)+' cal</span></div>'+
      (f.recipe?'<button class="ed" onclick="openRecipe(\''+f.recipe+'\')">Recipe</button>'
               :'<button class="ed" onclick="openSheet(\'food\',\''+f.id+'\')">Edit</button>')+'</div>';}).join('');}).join('');
  el.innerHTML=out||'<div class="blank" style="padding:24px"><b>Nothing found</b></div>';}
function toggleFav(id){var f=foodById(id);if(f){f.favourite=!f.favourite;renderLibList();renderToday();saveAll();}}
function toggleFavMeal(id){var m=mealById(id);if(m){m.favourite=!m.favourite;renderLibList();renderToday();saveAll();}}
function sheetFood(){
  var f=editingFood,used=f?meals.filter(function(m){return m.items.some(function(i){return i.foodId===f.id;});}):[];
  return '<div class="shd"><h3>'+(f?'Edit food':'New food')+'</h3><button class="cls" onclick="closeSheet()">&times;</button></div>'+
  '<div class="fld"><label>Name</label><input id="fName" value="'+(f?esc(f.name):'')+'"></div>'+
  '<div class="fld"><label>Category</label><input id="fCat" value="'+(f?esc(f.cat||''):'')+'" placeholder="e.g. Snacks"></div>'+
  '<div class="tgl"><div class="t"><b>Single item, not per 100 g</b><span>A bottle, a bar, an egg, one burrito</span></div>'+
  '<div class="sw'+(f&&f.unitMode?' on':'')+'" id="fUnit" onclick="this.classList.toggle(\'on\');fPreview()"></div></div>'+
  '<div class="g4" style="margin-top:14px"><div class="fld"><label>Cal</label><input id="fK" type="number" inputmode="decimal" value="'+(f?f.per100.kcal:'')+'" oninput="fPreview()"></div>'+
  '<div class="fld"><label>P</label><input id="fP" type="number" inputmode="decimal" value="'+(f?f.per100.p:'')+'" oninput="fPreview()"></div>'+
  '<div class="fld"><label>C</label><input id="fC" type="number" inputmode="decimal" value="'+(f?f.per100.c:'')+'" oninput="fPreview()"></div>'+
  '<div class="fld"><label>F</label><input id="fF" type="number" inputmode="decimal" value="'+(f?f.per100.f:'')+'" oninput="fPreview()"></div></div>'+
  '<div class="g2"><div class="fld"><label>Fibre</label><input id="fFib" type="number" inputmode="decimal" value="'+(f?(f.per100.fib||0):'')+'" oninput="fPreview()"></div>'+
  '<div class="fld"><label>Serving label</label><input id="fSL" value="'+(f?esc(f.serving.label):'')+'" placeholder="1 cup"></div></div>'+
  '<div class="fld"><label>Serving weight in grams</label><input id="fSG" type="number" inputmode="numeric" value="'+(f?f.serving.grams:100)+'" oninput="fPreview()"></div>'+
  '<div class="prev" id="fPrev"></div>'+
  (used.length?'<p style="font-size:12px;color:var(--ink3);margin-top:12px"><b>Used in '+used.length+' meal'+(used.length>1?'s':'')+'.</b> Editing updates them all.</p>':'')+
  '<div class="brow"><button class="btn" onclick="closeSheet()">Cancel</button>'+
  (f?'<button class="btn dgr" onclick="deleteFood()">Delete</button>':'')+
  '<button class="btn pri" onclick="saveFood()">Save</button></div>';}
function fPreview(){
  var u=$('fUnit').classList.contains('on');
  var k=+$('fK').value||0,p=+$('fP').value||0,c=+$('fC').value||0,f=+$('fF').value||0,
      fib=+$('fFib').value||0,g=+$('fSG').value||100,m=u?1:g/100;
  $('fPrev').innerHTML=u
    ?'<b>1 item</b> = '+r0(k)+' cal, '+r1(p)+'p '+r1(c)+'c '+r1(f)+'f '+r1(fib)+' fibre'
    :'<b>'+g+' g serving</b> = '+r0(k*m)+' cal, '+r1(p*m)+'p '+r1(c*m)+'c '+r1(f*m)+'f '+r1(fib*m)+' fibre';}
function saveFood(){
  var n=$('fName').value.trim();
  if(!n){showToast('Give it a name');return;}
  var u=$('fUnit').classList.contains('on');
  var per={kcal:+$('fK').value||0,p:+$('fP').value||0,c:+$('fC').value||0,
    f:+$('fF').value||0,fib:+$('fFib').value||0,va:0};
  var cat=$('fCat').value.trim()||'Other';
  var sv={label:$('fSL').value.trim()||(u?'1 item':'100 g'),grams:u?1:(+$('fSG').value||100)};
  if(editingFood){
    /* qty means grams for a per-100g food and a count for a unit food. Flipping
       the switch used to leave every stored number in the old meaning, turning a
       20 g log into 20 servings. Convert them instead. */
    if(!!editingFood.unitMode!==u){
      var oldG=(editingFood.serving&&editingFood.serving.grams)||100;
      var newG=sv.grams||100;
      logs.forEach(function(l){
        if(l.refId!==editingFood.id||l.kind!=='food')return;
        l.qty=u?(l.qty/(oldG||100)):(l.qty*newG);});
      meals.forEach(function(m){m.items.forEach(function(i){
        if(i.foodId!==editingFood.id)return;
        i.grams=u?(i.grams/(oldG||100)):(i.grams*newG);});});
    }
    editingFood.name=n;editingFood.cat=cat;editingFood.per100=per;
    editingFood.unitMode=u;editingFood.serving=sv;}
  else{var id=slug(n)||'food';while(foodById(id))id+='-2';
    foods.push({id:id,name:n,cat:cat,per100:per,unitMode:u,serving:sv,favourite:false,useCount:0});}
  closeSheet();renderToday();saveAll();showToast('Saved');}
function deleteFood(){
  var f=editingFood;if(!f)return;
  var used=meals.filter(function(m){return m.items.some(function(i){return i.foodId===f.id;});});
  if(used.length){showToast('Used in '+used.length+' meal(s). Remove it there first.');return;}
  var inLog=logs.filter(function(l){return l.refId===f.id;}).length;
  if(inLog&&!confirm('That is in '+inLog+' logged '+(inLog===1?'entry':'entries')+
    '. They keep the calories already recorded, but you will not be able to resize them. Delete anyway?'))return;
  foods=foods.filter(function(x){return x.id!==f.id;});
  /* Remember it, so migrate() does not put a deleted seed food straight back. */
  if(SEED_FOODS.some(function(sf){return sf.id===f.id;})){
    settings.deleted=settings.deleted||[];
    if(settings.deleted.indexOf(f.id)<0)settings.deleted.push(f.id);}
  closeSheet();renderToday();saveAll();showToast('Deleted');}
function sheetMeal(){
  var d=mealDraft,t=zero();
  d.items.forEach(function(i){var fd=foodById(i.foodId);if(!fd)return;var s=scale(fd,i.grams);
    MK.forEach(function(k){t[k]+=s[k];});});
  return '<div class="shd"><h3>'+(d.id?'Edit meal':'New meal')+'</h3><button class="cls" onclick="closeSheet()">&times;</button></div>'+
  '<div class="fld"><label>Meal name</label><input id="mlName" value="'+esc(d.name)+'" placeholder="e.g. Standard cut day"></div>'+
  '<div class="fld"><label>Add a food</label><input id="mlS" placeholder="Search then tap to add" oninput="mlFilter()"></div>'+
  '<div id="mlR" style="max-height:24vh;overflow-y:auto;margin-bottom:12px"></div>'+
  '<div class="lbl" style="margin-bottom:4px">In this meal</div>'+
  (d.items.length?d.items.map(function(it,i){var fd=foodById(it.foodId);
    return '<div class="mi"><div class="t">'+esc(fd?fd.name:'missing')+'</div>'+
      '<input type="number" inputmode="decimal" value="'+it.grams+'" onchange="mlQty('+i+',this.value)">'+
      '<span style="font-size:11px;color:var(--ink3)">'+(fd&&fd.unitMode?'x':'g')+'</span>'+
      '<button class="rm" onclick="mlRm('+i+')">&times;</button></div>';}).join('')
    :'<div class="blank" style="padding:20px">Nothing added yet</div>')+
  '<div class="prev"><b>Total</b> '+r0(t.kcal)+' cal &middot; '+r0(t.p)+'p '+r0(t.c)+'c '+r0(t.f)+'f '+r1(t.fib)+' fibre</div>'+
  '<div class="brow"><button class="btn" onclick="closeSheet()">Cancel</button>'+
  (d.id?'<button class="btn dgr" onclick="deleteMeal()">Delete</button>':'')+
  '<button class="btn pri" onclick="saveMeal()">Save</button></div>';}
function mlFilter(){
  var q=($('mlS').value||'').toLowerCase().trim(),el=$('mlR');
  if(!q){el.innerHTML='';return;}
  var fs=foods.filter(function(f){return f.name.toLowerCase().indexOf(q)>-1;}).slice(0,20);
  el.innerHTML=fs.length?fs.map(function(f){
    return '<div class="li"><div class="t"><b>'+esc(f.name)+'</b><span>'+esc(f.serving.label)+'</span></div>'+
      '<button class="ed" onclick="mlAdd(\''+f.id+'\')">Add</button></div>';}).join('')
    :'<div class="blank" style="padding:18px">No match</div>';}
function mlAdd(id){var f=foodById(id);if(!f)return;
  mealDraft.name=$('mlName').value;
  mealDraft.items.push({foodId:id,grams:f.unitMode?1:f.serving.grams});
  $('sheetBody').innerHTML=sheetMeal();}
function mlQty(i,v){mealDraft.items[i].grams=+v||0;$('sheetBody').innerHTML=sheetMeal();}
function mlRm(i){mealDraft.name=$('mlName').value;mealDraft.items.splice(i,1);
  $('sheetBody').innerHTML=sheetMeal();}
function saveMeal(){
  var n=$('mlName').value.trim();
  if(!n){showToast('Give the meal a name');return;}
  if(!mealDraft.items.length){showToast('Add at least one food');return;}
  if(mealDraft.id){var m=mealById(mealDraft.id);m.name=n;m.items=mealDraft.items;}
  else{var id='m-'+(slug(n)||'meal');while(mealById(id))id+='-2';
    meals.push({id:id,name:n,items:mealDraft.items,favourite:false,useCount:0});}
  closeSheet();renderToday();saveAll();showToast('Saved');}
function deleteMeal(){meals=meals.filter(function(m){return m.id!==mealDraft.id;});
  closeSheet();renderToday();saveAll();showToast('Deleted');}
function sheetSettings(){
  var s=settings.phase,tg=PHASES[s];
  return '<div class="shd"><h3>Settings</h3><button class="cls" onclick="closeSheet()">&times;</button></div>'+
  '<div class="lbl" style="margin-bottom:10px">Phase</div><div class="pbtn">'+['cut','maintain','bulk'].map(function(p){
    return '<button class="'+(s===p?'on':'')+'" onclick="setPhase(\''+p+'\')">'+PHASE_META[p].name+
      '<span>'+(PHASE_META[p].rate>0?'+':'')+PHASE_META[p].rate+' kg/wk</span></button>';}).join('')+'</div>'+
  '<div class="note-card"><h4>'+PHASE_META[s].name+' targets</h4>'+
  '<p>'+PHASE_META[s].note+'. Weekly budget <b>'+PHASE_META[s].weekly.toLocaleString()+' cal</b>.</p>'+
  ['A','B','C'].map(function(d){return '<p><b>'+DAYTYPES[d].lbl+':</b> '+tg[d].kcal+' cal &middot; '+
    tg[d].p+'p '+tg[d].c+'c '+tg[d].f+'f</p>';}).join('')+
  '<p style="font-size:12px;color:var(--ink3);margin-top:10px">Built from your measured RMR of 1,736 plus real activity, not a generic multiplier.</p></div>'+
  '<div class="tgl"><div class="t"><b>Track fibre</b><span>The thing this plan exists to fix</span></div>'+
  '<div class="sw'+(settings.showFibre?' on':'')+'" onclick="toggleFibre(this)"></div></div>'+
  '<div class="tgl"><div class="t"><b>Dark mode</b><span>For logging dinner in bed</span></div>'+
  '<div class="sw'+(settings.theme==='dark'?' on':'')+'" onclick="toggleTheme(this)"></div></div>'+
  '<div class="brow"><button class="btn" onclick="openSheet(\'lib\')">Food library</button></div>'+
  '<div class="lbl" style="margin:24px 0 10px">Data</div>'+
  '<div class="brow" style="margin-top:0"><button class="btn" onclick="exportData()">Export</button>'+
  '<button class="btn" onclick="document.getElementById(\'impFile\').click()">Import</button></div>'+
  '<input type="file" id="impFile" accept="application/json" style="display:none" onchange="importData(this)">'+
  '<div class="brow"><button class="btn dgr" onclick="clearAll()">Clear all data</button></div>'+
  (function(){
    var stale=!settings.lastExport||((parseISO(isoToday())-parseISO(settings.lastExport))/86400000)>30;
    return (stale&&logs.length>20)
      ? '<div class="note-card warn" style="margin-top:16px"><h4>Back it up</h4><p>'+
        (settings.lastExport?'Last backup was '+fmtDate(settings.lastExport)+'.':'You have never exported.')+
        ' Everything lives in this browser, so clearing site data would take '+logs.length+
        ' logged entries with it. Export takes two seconds.</p></div>' : '';})()+
  '<p style="font-size:12px;color:var(--ink3);margin-top:14px">Keys are namespaced <b>nutri-</b> so nothing can collide with your gym tracker.</p>';}
function setPhase(p){settings.phase=p;openSheet('settings');
  renderToday();renderKitchen();renderProgress();saveAll();}
function applyTheme(){document.documentElement.dataset.theme=settings.theme==='dark'?'dark':'light';
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',settings.theme==='dark'?'#14120F':'#F6F2EA');}
function toggleTheme(el){el.classList.toggle('on');
  settings.theme=el.classList.contains('on')?'dark':'light';applyTheme();saveAll();}
function toggleFibre(el){el.classList.toggle('on');settings.showFibre=el.classList.contains('on');
  renderToday();saveAll();}
function exportData(){
  settings.lastExport=isoToday();
  var b=new Blob([JSON.stringify({v:3,app:'Plate',exported:new Date().toISOString(),
    foods:foods,meals:meals,logs:logs,weights:weights,settings:settings,targets:customTargets},null,2)],
    {type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='plate-backup-'+isoToday()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);showToast('Backup downloaded');}
function importData(input){
  var file=input.files&&input.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){var d;
    try{d=JSON.parse(rd.result);}catch(e){showToast('That file is not valid JSON');input.value='';return;}
    if(!d||typeof d!=='object'||!Array.isArray(d.foods)||!Array.isArray(d.logs)){
      showToast('That file is not a Plate backup');input.value='';return;}
    if(!confirm('Replace all current data with this backup?')){input.value='';return;}
    foods=d.foods;meals=Array.isArray(d.meals)?d.meals:[];logs=d.logs;
    weights=Array.isArray(d.weights)?d.weights:[];
    if(d.settings)for(var k in d.settings)settings[k]=d.settings[k];
    if(!settings.dayTypes)settings.dayTypes={};
    if(!settings.plan)settings.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));
    if(!settings.weekPicks)settings.weekPicks=['r1','r5','r7'];
    if(!settings.got)settings.got=[];
    customTargets=d.targets||null;
    input.value='';closeSheet();applyTheme();renderAll();saveAll();showToast('Imported');};
  rd.readAsText(file);}
function clearAll(){
  if(!confirm('Delete every log, weigh-in and custom food?'))return;
  if(!confirm('Really sure? This cannot be undone.'))return;
  foods=clone(SEED_FOODS);meals=clone(SEED_MEALS);logs=[];weights=[];
  /* water and stock were missing here, so every render threw straight
     afterwards and the save that should have cleared storage never ran. */
  settings={phase:'cut',dayTypes:{},slot:'Snack',showFibre:true,theme:settings.theme,
    plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)),weekPicks:['r1','r5','r7'],got:[],
    water:{},stock:{},deleted:[]};
  customTargets=null;closeSheet();saveAll();renderAll();showToast('Reset to defaults');}

/* ---- shell --------------------------------------------------- */
function setTab(t){
  tab=t;
  ['today','kitchen','prog'].forEach(function(x){$('pg-'+x).classList.toggle('on',x===t);});
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});
  $('fab').style.display=t==='today'?'grid':'none';
  if(t==='kitchen')renderKitchen();
  if(t==='prog')renderProgress();
  window.scrollTo(0,0);}
function renderAll(){renderToday();renderKitchen();renderProgress();}

function installBits(){
  try{
    var mf={name:'Plate',short_name:'Plate',start_url:'.',display:'standalone',
      background_color:'#F6F2EA',theme_color:'#F6F2EA',orientation:'portrait',
      icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
    var t=document.createElement('link');t.rel='apple-touch-icon';t.href=ICON192;
    document.head.appendChild(t);
  }catch(e){}
}
(async function init(){
  try{await load();}catch(e){}
  applyTheme();installBits();
  try{renderAll();}
  catch(e){document.querySelector('.wrap').innerHTML=
    '<div class="blank" style="margin-top:40px"><b>Something went wrong</b>'+String(e.message||e)+
    '<br><br>Your data is safe. Try reloading.</div>';console.error(e);}
})();

</script>

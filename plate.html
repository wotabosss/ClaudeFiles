<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plate">
<title>Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   PLATE v3 — menu-card layout
   Fewer boxes, more type. Hairline rules instead of card soup.
   1 tokens  2 shell  3 today  4 kitchen  5 progress  6 sheets
   ============================================================== */
:root{
  --paper:#F6F2EA; --card:#FFFDF9; --sunk:#EDE7DC; --tint:#E6DFD2;
  --rule:#DFD6C6; --rule2:#C7BBA6;
  --ink:#191713; --ink2:#6A6053; --ink3:#9E9486;
  --acc:#B4472C;
  --p:#2F5EA8; --c:#B0791A; --f:#7B4B8C; --fb:#2A7A66;
  --bad:#BE3B26; --good:#2A7A66;
  --disp:'Fraunces',Georgia,serif;
  --ui:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
  --safe:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --paper:#14120F; --card:#1C1916; --sunk:#252119; --tint:#2E2921;
  --rule:#312B23; --rule2:#4A4237;
  --ink:#F4EFE6; --ink2:#A99E8E; --ink3:#7B7162;
  --acc:#E4744C;
  --p:#7FA9F0; --c:#DDA83F; --f:#BE8FD4; --fb:#54BCA2;
  --bad:#F0705A; --good:#54BCA2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-bottom:calc(72px + var(--safe));transition:background .25s,color .25s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
.d{font-family:var(--disp);font-weight:600;letter-spacing:-.025em}

/* --- 2. shell ------------------------------------------------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--rule)}
.top .in{max-width:600px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:10px}
.mark{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark em{font-style:italic;color:var(--acc)}
.phase{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);
  border-radius:20px;padding:5px 11px}
.gear{width:32px;height:32px;display:grid;place-items:center;font-size:16px;color:var(--ink2)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--rule);padding:8px 0 calc(8px + var(--safe))}
.nav .in{max-width:600px;margin:0 auto;display:flex;padding:0 20px;gap:6px}
.nav button{flex:1;text-align:center;padding:9px 0;border-radius:12px;color:var(--ink3);
  font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;transition:.16s}
.nav button.on{color:var(--paper);background:var(--ink)}
.page{display:none;padding-top:22px;animation:fi .22s ease}
.page.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.title{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.032em;line-height:1.05}
.lede{font-size:13.5px;color:var(--ink2);margin-top:7px;max-width:42ch;line-height:1.5}
.rule{height:1px;background:var(--rule);margin:22px 0}
.lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec .a{font-size:11.5px;color:var(--acc);font-weight:700}

/* --- 3. today ------------------------------------------------- */
.dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dbar b{font-family:var(--disp);font-size:17px;font-weight:600}
.dbar .s{font-size:11px;color:var(--ink3);display:block;margin-top:1px}
.arw{width:30px;height:30px;display:grid;place-items:center;font-size:17px;color:var(--ink3)}
.arw:disabled{opacity:.25}

.big{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.big .l .n{font-family:var(--disp);font-size:62px;font-weight:600;letter-spacing:-.045em;line-height:.88}
.big .l .u{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:8px}
.big .r{text-align:right;flex-shrink:0}
.big .r div{margin-bottom:9px}
.big .r div:last-child{margin-bottom:0}
.big .r .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.big .r .v{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.02em}
.big .r .v.acc{color:var(--acc)}
.over .n{color:var(--bad)}
.prog{height:3px;background:var(--tint);border-radius:2px;overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.prog.ov i{background:var(--bad)}

.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.mg .v{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1}
.mg .v u{font-size:12px;text-decoration:none;font-weight:500;opacity:.62;margin-left:1px}
.ent .k u{font-size:10px;text-decoration:none;font-weight:500;opacity:.55;margin-left:1px;letter-spacing:.02em}
.mg .n{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:5px 0 6px}
.mg .b{height:2.5px;background:var(--tint);border-radius:2px;overflow:hidden}
.mg .b i{display:block;height:100%;border-radius:2px;transition:width .4s}
.mg .t{font-size:10px;color:var(--ink3);margin-top:5px}
.mg.p .v{color:var(--p)}.mg.p .b i{background:var(--p)}
.mg.c .v{color:var(--c)}.mg.c .b i{background:var(--c)}
.mg.f .v{color:var(--f)}.mg.f .b i{background:var(--f)}
.mg.fb .v{color:var(--fb)}.mg.fb .b i{background:var(--fb)}

.pills{display:flex;gap:6px;margin-bottom:14px;border:1px solid var(--rule);border-radius:12px;padding:3px}
.pills button{flex:1;text-align:center;padding:8px 2px;border-radius:9px;font-size:11.5px;font-weight:650;color:var(--ink3)}
.pills button.on{background:var(--ink);color:var(--paper)}

.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.qab{min-width:0;border:1px solid var(--rule);border-radius:14px;padding:12px 13px;background:var(--card);transition:.13s}
.qab.all{grid-column:1/-1;border-style:dashed;background:transparent;text-align:center}
.qab.all b{color:var(--acc)}
.qab:active{transform:scale(.95)}
.qab b{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qab span{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qab.rec{border-color:color-mix(in srgb,var(--acc) 42%,var(--rule))}
.qab.rec span{color:var(--acc)}
.qab.tk{border-color:color-mix(in srgb,var(--c) 48%,var(--rule))}.qab.tk span{color:var(--c)}
.qab.ml{border-color:color-mix(in srgb,var(--p) 48%,var(--rule))}.qab.ml span{color:var(--p)}

.slotname{font-family:var(--disp);font-size:15px;font-weight:600;font-style:italic;color:var(--ink2)}
.slotp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--p)}
.slotp.lo{color:var(--bad)}
.ent{display:flex;align-items:baseline;gap:13px;padding:13px 0;border-bottom:1px solid var(--rule)}
.ent:last-child{border-bottom:0}
.ent .t{flex:1;min-width:0}
.ent .t b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .t span{display:block;font-size:11px;color:var(--ink3);margin-top:3px}
.ent .k{font-family:var(--disp);font-size:18px;font-weight:600;flex-shrink:0}
.ent .x{font-size:19px;color:var(--ink3);width:44px;height:44px;margin:-9px -12px -9px 0;text-align:center;flex-shrink:0;align-self:center}
.grp{margin-bottom:22px}
.grph{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;
  border-bottom:1.5px solid var(--ink);margin-bottom:2px}

.blank{text-align:center;padding:40px 20px;color:var(--ink3);font-size:13px}
.blank b{display:block;font-family:var(--disp);font-style:italic;color:var(--ink2);font-size:19px;
  margin-bottom:7px;font-weight:500}

.fab{position:fixed;right:20px;bottom:calc(84px + var(--safe));z-index:45;width:50px;height:50px;
  border-radius:50%;background:var(--acc);color:#FFF7F4;display:grid;place-items:center;
  font-size:25px;box-shadow:0 6px 20px rgba(180,71,44,.34)}
.fab:active{transform:scale(.92)}
.fab.away{opacity:0;pointer-events:none;transform:scale(.6)}

.wrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.wl .lbl{display:block;margin-bottom:4px}
.wl b{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:-.025em}
.wl .ws{font-size:11.5px;color:var(--ink3);margin-left:7px}
.wbtns{display:flex;gap:7px;flex-shrink:0}
.wbtns button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--rule2);
  color:var(--ink2);font-size:19px;display:grid;place-items:center}
.wbtns button:last-child{border-color:var(--acc);color:var(--acc)}
.wbtns button:active{background:var(--acc);color:#FFF7F4;border-color:var(--acc)}
.cups{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.cup{width:14px;height:20px;border-radius:2px 2px 5px 5px;border:1.5px solid var(--rule2);background:transparent}
.cup.on{background:var(--acc);border-color:var(--acc)}

.stk{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}
.stk .t{flex:1;min-width:0}
.stk .t b{display:block;font-size:14.5px;font-weight:650}
.stk .t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}
.stk .n{font-family:var(--disp);font-size:24px;font-weight:600;color:var(--acc);flex-shrink:0}
.stk.low .n{color:var(--bad)}

.drk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.drk .t{flex:1;min-width:0}
.drk .t b{display:block;font-size:14px;font-weight:600}
.drk .t span{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.drk .c{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--acc);min-width:20px;text-align:center}
.drk .dplus,.drk .dmin{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rule2);
  color:var(--ink2);font-size:17px;display:grid;place-items:center;flex-shrink:0}
.drk .dplus{border-color:var(--acc);color:var(--acc)}
.drk.on .t b{color:var(--acc)}

/* --- 4. kitchen ----------------------------------------------- */
.segs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.segs button{padding:9px 0;margin-right:18px;font-size:12.5px;font-weight:650;color:var(--ink3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.segs button.on{color:var(--ink);border-bottom-color:var(--acc)}

.tot{background:var(--ink);color:var(--paper);border-radius:20px;padding:20px;margin-bottom:18px}
.tot .a{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.tot .a b{font-family:var(--disp);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:.9}
.tot .a span{font-size:11.5px;opacity:.62;text-align:right}
.tot .g{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.tot .g div .v{font-size:15px;font-weight:700}
.tot .g div .n{font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:2px;font-weight:700}
.tot .g div .b{height:2.5px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:6px;overflow:hidden}
.tot .g div .b i{display:block;height:100%;border-radius:2px}
.chk{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}
.ck{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.13)}
.ck.y{background:rgba(90,200,160,.26)}.ck.n{background:rgba(255,140,118,.28)}

.dayrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule)}
.dayrow .mt{flex:1;min-width:0}
.dayrow .mt .lbl{margin-bottom:4px;display:block}
.dayrow .mt b{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.2}
.dayrow .mt span{font-size:11px;color:var(--ink3);display:block;margin-top:4px}
.dayrow .kc{font-family:var(--disp);font-size:23px;font-weight:600;flex-shrink:0}
.logone{border:1.5px solid var(--acc);color:var(--acc);border-radius:20px;padding:7px 14px;
  font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
.logone:active{background:var(--acc);color:#FFF7F4}
.logone.sm{padding:5px 11px;font-size:10.5px;align-self:flex-start}

.snk{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--rule)}
.snk .tx{flex:1;min-width:0}
.snk .tx b{font-size:14.5px;font-weight:650;display:block}
.snk .tx .por{font-size:11.5px;color:var(--ink3);margin-top:2px}
.snk .tx .note{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5;font-style:italic}
.snk .kc{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--ink3);flex-shrink:0;padding-top:1px}
.snk .tog{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rule2);display:grid;
  place-items:center;font-size:16px;color:var(--ink3);flex-shrink:0;transition:.14s}
.snk.on .tog{background:var(--acc);border-color:var(--acc);color:#FFF7F4}
.snk.on .tx b{color:var(--acc)}

.rc{display:flex;gap:16px;align-items:flex-start;width:100%;padding:18px 0;border-bottom:1px solid var(--rule)}
.rc .no{font-family:var(--disp);font-size:30px;font-weight:400;color:var(--rule2);line-height:.85;width:30px;flex-shrink:0}
.rc .mn{flex:1;min-width:0}
.rc h3{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.rc .sb{font-size:12px;color:var(--ink3);margin-top:4px;font-style:italic}
.rc .st{display:flex;gap:15px;margin-top:11px;flex-wrap:wrap}
.rc .st div{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.rc .st div b{display:block;font-family:var(--disp);font-size:16px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;text-transform:none;margin-bottom:1px}
.rc .st .p b{color:var(--p)}.rc .st .fb b{color:var(--fb)}
.mini{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;
  border-radius:5px;margin-right:6px;display:inline-block;margin-bottom:8px}
.mini.beef{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
.mini.chick{background:color-mix(in srgb,var(--fb) 14%,transparent);color:var(--fb)}
.mini.wk{background:var(--ink);color:var(--paper)}

.shop{padding:12px 0;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:13px}
.shop .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule2);flex-shrink:0;
  display:grid;place-items:center;font-size:12px;color:transparent}
.shop.got .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.shop.got .nm{text-decoration:line-through;color:var(--ink3)}
.shop .nm{flex:1;font-size:14.5px}
.shop .q{font-size:13px;color:var(--ink3);font-weight:600}
.aisle{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;
  margin:22px 0 4px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}

.pk{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 6px}
.pkb{border:1px solid var(--rule);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.pkb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.note-card{border-left:2px solid var(--acc);padding:2px 0 2px 16px;margin:18px 0}
.note-card h4{font-family:var(--disp);font-size:18px;font-weight:600;margin-bottom:6px;letter-spacing:-.015em}
.note-card p{font-size:13px;color:var(--ink2);line-height:1.6}
.note-card p+p{margin-top:8px}
.note-card b{color:var(--ink)}
.note-card.warn{border-left-color:var(--bad)}

.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 32px;font-size:14px;color:var(--ink2);line-height:1.6}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;font-family:var(--disp);
  font-size:15px;font-weight:600;color:var(--acc)}
.steps li b{color:var(--ink)}
.ings{list-style:none}
.ings li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ings li:last-child{border:0}
.ings li b{font-weight:600;flex-shrink:0;color:var(--ink)}
.ings li span{color:var(--ink2)}
.hid{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 6px;
  border-radius:4px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-left:6px}
.tline{position:relative;padding-left:60px}
.tline::before{content:'';position:absolute;left:40px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.tr{position:relative;margin-bottom:18px}
.tr .tm{position:absolute;left:-60px;top:0;width:30px;text-align:right;font-size:11.5px;font-weight:700;color:var(--acc)}
.tr::before{content:'';position:absolute;left:-21px;top:6px;width:7px;height:7px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 0 3px var(--paper)}
.tr b{display:block;font-size:14.5px;font-weight:650;margin-bottom:3px}
.tr span{font-size:13px;color:var(--ink2);line-height:1.55}
.tr.idle::before{background:var(--rule2)}.tr.idle .tm{color:var(--ink3)}

/* --- 5. progress ---------------------------------------------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 16px;margin-bottom:8px}
.sv .n{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.sv .l{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:5px}
.sv .s{font-size:11px;color:var(--ink3);margin-top:4px}
.sv svg{display:block;margin-top:8px;width:100%;height:24px;overflow:visible}
.wf{display:flex;gap:9px;margin-bottom:8px;max-width:100%}
.wf input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--rule2);
  padding:11px 2px;font-size:22px;font-family:var(--disp);font-weight:600}
.wf input:focus{outline:none;border-bottom-color:var(--acc)}
.wf button{background:var(--ink);color:var(--paper);border-radius:12px;padding:0 22px;font-weight:700;font-size:13px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{aspect-ratio:1;border-radius:8px;background:var(--sunk);display:grid;place-items:center;
  font-size:11px;color:var(--ink3);font-weight:600}
.cd.pad{background:transparent}
.cd.band{background:color-mix(in srgb,var(--fb) 20%,transparent);color:var(--fb)}
.cd.under{background:color-mix(in srgb,var(--p) 17%,transparent);color:var(--p)}
.cd.over{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.cd.now{outline:1.5px solid var(--acc);outline-offset:1.5px}
.dw{font-size:8.5px;color:var(--ink3);text-align:center;font-weight:700;padding-bottom:5px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:10.5px;color:var(--ink3)}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.wkb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wkd .bar{height:44px;background:rgba(255,255,255,.15);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.wkd .bar i{display:block;width:100%;background:currentColor;border-radius:5px}
.wkd .dd{font-size:8.5px;opacity:.55;margin-top:5px;text-align:center;font-weight:700}
.chart svg{display:block;width:100%;height:130px;overflow:visible}

/* --- 6. sheets ------------------------------------------------ */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(25,18,10,.44);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.24s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--paper);
  border-radius:24px 24px 0 0;max-height:93vh;overflow-y:auto;transform:translateY(101%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:calc(26px + var(--safe));
  box-shadow:0 -12px 44px rgba(40,28,15,.2)}
.sheet.on{transform:translateY(0)}
.sheet .in{max-width:600px;margin:0 auto;padding:6px 20px 0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--rule2);margin:11px auto 4px}
.shd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;
  position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 12px;margin-top:-6px}
.shd h3{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.03em;line-height:1.12}
.shd .sb{font-size:12px;color:var(--ink3);margin-top:5px;font-style:italic}
.cls{font-size:22px;color:var(--ink3);width:30px;text-align:right;flex-shrink:0}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--rule);
  padding:9px 2px;font-size:16px}
.fld input:focus{outline:none;border-bottom-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.brow{display:flex;gap:9px;margin-top:20px}
.btn{flex:1;border:1.5px solid var(--ink);border-radius:13px;padding:14px;font-weight:700;font-size:14px;text-align:center}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--acc);color:#FFF7F4;border-color:var(--acc)}
.btn.dgr{border-color:var(--bad);color:var(--bad)}
.prev{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 0;margin-top:14px;
  font-size:13.5px;color:var(--ink2);line-height:1.6}
.prev b{color:var(--acc)}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--rule)}
.tgl .t b{display:block;font-size:14.5px;font-weight:600}
.tgl .t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.sw{width:44px;height:26px;border-radius:14px;background:var(--tint);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink3);transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px;background:#FFF7F4}
.pbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.pbtn button{border:1.5px solid var(--rule);border-radius:13px;padding:14px 6px;text-align:center;
  font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.pbtn button.on{border-color:var(--acc);color:var(--acc)}
.pbtn button span{display:block;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink3);margin-top:4px}
.pick{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.pick .t{flex:1;min-width:0}
.pick .t b{display:block;font-size:15px;font-weight:600}
.pick .t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}
.pick .r{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule2);flex-shrink:0;
  display:grid;place-items:center;font-size:13px;color:transparent}
.pick .r.on{background:var(--acc);border-color:var(--acc);color:#FFF7F4}
.li{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--rule)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px;font-weight:600}
.li .t span{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.li .star{font-size:15px;color:var(--ink3);width:24px;text-align:center;flex-shrink:0}
.li .star.on{color:var(--c)}
.li .ed{font-size:11px;color:var(--acc);font-weight:700;flex-shrink:0}
.mi{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.mi .t{flex:1;min-width:0;font-size:13.5px}
.mi input{width:64px;background:transparent;border:0;border-bottom:1px solid var(--rule2);
  padding:5px;font-size:13.5px;text-align:right}
.mi .rm{color:var(--bad);font-size:18px;width:40px;height:40px;text-align:center;flex-shrink:0}
.toast{position:fixed;left:50%;bottom:calc(94px + var(--safe));transform:translateX(-50%) translateY(14px);
  z-index:95;background:var(--ink);color:var(--paper);border-radius:24px;padding:12px 20px;
  display:flex;align-items:center;gap:16px;opacity:0;transition:.24s;pointer-events:none;
  box-shadow:0 10px 34px rgba(40,28,15,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Only Undo is tappable. The bar itself used to intercept taps aimed at the
   chips underneath it, so logging two things in a row needed a pause. */
.toast{pointer-events:none}
.toast button{pointer-events:auto}
.toast span{font-size:13px}
.toast button{color:var(--paper);text-decoration:underline;font-weight:700;font-size:14px;padding:10px 6px;margin:-10px -2px}
@media(max-width:365px){.big .l .n{font-size:52px}.title{font-size:27px}.mgrid{gap:10px}}
</style>
</head>

</div>

function pad(n){return n<10?'0'+n:''+n;}

function isoToday(){return iso(new Date());}
function parseISO(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}

async function sget(k){var v=null;
  try{if(window.storage&&window.storage.get){var r=await window.storage.get(k);if(r&&r.value)v=r.value;}}catch(e){}
  if(v===null){try{v=localStorage.getItem(k);}catch(e){}}
  if(v===null||v===undefined)return null;
  try{return JSON.parse(v);}catch(e){return null;}}
async function sset(k,v){var s=JSON.stringify(v);
  try{if(window.storage&&window.storage.set)await window.storage.set(k,s);}catch(e){}
  try{localStorage.setItem(k,s);}catch(e){}}

  await sset(K.weights,weights);await sset(K.settings,settings);await sset(K.targets,customTargets);}
async function load(){
  /* Deep copies. A .slice() shares the objects with SEED_FOODS, so editing a
     food used to rewrite the template it was seeded from, and "reset to
     defaults" handed the edit straight back. */
  var a=await sget(K.foods);foods=(a&&a.length)?a:clone(SEED_FOODS);
  var b=await sget(K.meals);meals=(b&&b.length)?b:clone(SEED_MEALS);
  logs=(await sget(K.logs))||[];weights=(await sget(K.weights))||[];
  var e=await sget(K.settings);if(e){for(var k in e)settings[k]=e[k];}
  if(!settings.dayTypes)settings.dayTypes={};
  if(!settings.plan)settings.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));
  if(!settings.plan.snacks)settings.plan.snacks=[];
  if(!settings.weekPicks)settings.weekPicks=['r1','r5','r7'];
  if(!settings.got)settings.got=[];
  if(!settings.water)settings.water={};
  if(!settings.stock)settings.stock={};
  customTargets=await sget(K.targets);
  migrate();autoSlot();}
/* Existing installs keep their own foods array, so recipes added or
   changed here would never reach them. This reconciles both ways. */
var RENAME={'dare-mocha':1,'egg':1};
function migrate(){
  var valid={};RECIPES.forEach(function(r){valid[r.id]=1;});
  foods=foods.filter(function(f){return !f.recipe||valid[f.recipe];});
  RECIPES.forEach(function(r){
    var per={kcal:r.m[0],p:r.m[1],c:r.m[2],f:r.m[3],fib:r.m[4],va:r.m[5]},ex=foodById(r.id);
    if(ex){ex.name=r.name;ex.per100=per;ex.cat='Prepped meals';ex.unitMode=true;
      ex.serving={label:'1 portion',grams:1};ex.recipe=r.id;}
    else foods.push({id:r.id,name:r.name,cat:'Prepped meals',per100:per,unitMode:true,
      serving:{label:'1 portion',grams:1},favourite:true,useCount:0,recipe:r.id});});
  var gone={};(settings.deleted||[]).forEach(function(id){gone[id]=1;});
  SEED_FOODS.forEach(function(sf){
    var ex=foodById(sf.id);
    /* A seed food you deleted stays deleted. It used to reappear every load. */
    if(!ex){if(!gone[sf.id])foods.push(clone(sf));return;}
    if(sf.pieces&&!ex.pcUser){ex.pieces=sf.pieces;ex.perRow=sf.perRow;ex.pcSrc=sf.pcSrc;}
    /* One-time corrections, applied once and then left alone, so a food you
       have since renamed or adjusted is not reverted on every load. */
    if(RENAME[sf.id]&&!ex.fixed){ex.name=sf.name;ex.per100=clone(sf.per100);ex.fixed=1;}});
  settings.weekPicks=(settings.weekPicks||[]).filter(function(i){return valid[i];});
  if(!settings.weekPicks.length)settings.weekPicks=['r1','r5','r7'];
  ['breakfast','lunch','dinner','shake'].forEach(function(k){
    if(settings.plan[k]&&!foodById(settings.plan[k]))settings.plan[k]=DEFAULT_PLAN[k];});
  settings.plan.snacks=(settings.plan.snacks||[]).filter(function(i){return foodById(i);});}

/* ---- macros -------------------------------------------------- */
var MK=['kcal','p','c','f','fib','va'];
function zero(){return {kcal:0,p:0,c:0,f:0,fib:0,va:0};}
function foodById(id){for(var i=0;i<foods.length;i++)if(foods[i].id===id)return foods[i];return null;}
function mealById(id){for(var i=0;i<meals.length;i++)if(meals[i].id===id)return meals[i];return null;}
function recById(id){for(var i=0;i<RECIPES.length;i++)if(RECIPES[i].id===id)return RECIPES[i];return null;}
function scale(fd,q){var m=fd.unitMode?q:(q/100),o=zero();
  MK.forEach(function(k){o[k]=(fd.per100[k]||0)*m;});return o;}
function servingOf(fd){return scale(fd,fd.unitMode?1:fd.serving.grams);}
function mealMacros(ml){var t=zero();
  ml.items.forEach(function(it){var fd=foodById(it.foodId);if(!fd)return;var s=scale(fd,it.grams);
    MK.forEach(function(k){t[k]+=s[k];});});return t;}
function targetFor(s){return customTargets||PHASES[settings.phase][dayTypeFor(s)];}
function logsFor(s){return logs.filter(function(l){return l.date===s;});}
function liveSnap(l){
  if(l.date===isoToday()){
    if(l.kind==='food'){var fd=foodById(l.refId);if(fd)return scale(fd,l.qty);}
    if(l.kind==='meal'){var ml=mealById(l.refId);if(ml){var m=mealMacros(ml),o=zero();
      MK.forEach(function(k){o[k]=m[k]*l.qty;});return o;}}}
  return l.snap;}
function dayTotal(s){var t=zero();
  logsFor(s).forEach(function(l){var v=liveSnap(l);MK.forEach(function(k){t[k]+=v[k]||0;});});return t;}
function r0(n){return Math.round(n);}
function r1(n){return Math.round(n*10)/10;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function byUse(a,b){if(!!b.favourite!==!!a.favourite)return (b.favourite?1:0)-(a.favourite?1:0);
  return (b.useCount||0)-(a.useCount||0);}
function uid(){return 'x'+Math.floor(performance.now()*1000).toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function $(id){return document.getElementById(id);}

/* ---- water --------------------------------------------------- */
function waterFor(d){return settings.water[d]||0;}
function addWater(ml){
  settings.water[viewDate]=Math.max(0,waterFor(viewDate)+ml);
  if(navigator.vibrate)navigator.vibrate(6);
  renderWater();saveAll();}
function renderWater(){
  var el=$('water');if(!el)return;
  var ml=waterFor(viewDate),g=Math.round(ml/GLASS),need=Math.ceil(WATER_TARGET/GLASS);
  var cups='';
  for(var i=0;i<need;i++) cups+='<span class="cup'+(i<g?' on':'')+'"></span>';
  el.innerHTML='<div class="wrow"><div class="wl"><span class="lbl">Water</span>'+
    '<b>'+(ml/1000).toFixed(2).replace(/0$/,'')+' L</b><span class="ws">of 3 L'+
    (ml>=WATER_TARGET?' &middot; done':'')+'</span></div>'+
    '<div class="wbtns"><button onclick="addWater(-'+GLASS+')">&minus;</button>'+
    '<button onclick="addWater('+GLASS+')">+</button></div></div>'+
    '<div class="cups">'+cups+'</div>';}

/* ---- batch stock: what is actually left in the fridge and freezer -- */
function stockFor(id){return settings.stock[id]||null;}
function cookedBatch(id){
  var r=recById(id);if(!r)return;
  /* Adds to what is already there. It used to overwrite, so cooking a second
     batch on top of two leftovers showed 6 instead of 8. */
  var cur=settings.stock[id];
  var had=cur?cur.left:0,hadF=cur?cur.fridge:0;
  settings.stock[id]={left:had+r.makes,fridge:Math.min(FRIDGE_DAYS,hadF+r.makes),date:isoToday()};
  renderKitchen();saveAll();
  showToast(had?('Added '+r.makes+', now '+(had+r.makes)+' portions'):('Logged '+r.makes+' portions of '+r.name));}
function takePortion(id){
  var s=settings.stock[id];if(!s)return;
  s.left=Math.max(0,s.left-1);
  if(s.fridge>0)s.fridge--;
  if(s.left===0)delete settings.stock[id];}
/* Undo, or deleting the entry, has to put the portion back. */
function giveBackPortion(id){
  if(!id||!recById(id))return;
  var s=settings.stock[id];
  if(!s){settings.stock[id]={left:1,fridge:0,date:isoToday()};return;}
  s.left++;
  if(s.date===isoToday()&&s.fridge<FRIDGE_DAYS)s.fridge++;}
function stockSummary(){
  var out=[];
  RECIPES.forEach(function(r){var s=stockFor(r.id);
    if(s&&s.left>0)out.push({r:r,s:s});});
  return out;}

/* ---- today --------------------------------------------------- */
function renderToday(){
  var t=dayTotal(viewDate),tg=targetFor(viewDate);
  $('dLabel').textContent=viewDate===isoToday()?'Today':(viewDate===addDays(isoToday(),-1)?'Yesterday':fmtDate(viewDate));
  $('dSub').textContent=fmtDate(viewDate);
  $('dNext').disabled=viewDate>=isoToday();
  var left=tg.kcal-t.kcal,pct=tg.kcal?Math.min(100,t.kcal/tg.kcal*100):0;
  $('bigBlock').className='big'+(left<0?' over':'');
  $('bigBlock').innerHTML=
    '<div class="l"><div class="n">'+r0(Math.abs(left))+'</div><div class="u">'+(left<0?'over target':'calories left')+'</div></div>'+
    '<div class="r"><div><div class="k">Eaten</div><div class="v">'+r0(t.kcal)+'</div></div>'+
    '<div><div class="k">Target</div><div class="v">'+r0(tg.kcal)+'</div></div>'+
    '<div><div class="k">Day type</div><button class="v acc" onclick="cycleDayType()">'+DAYTYPES[dayTypeFor(viewDate)].lbl+'</button></div></div>';
  var pr=$('prog');pr.className='prog'+(left<0?' ov':'');
  pr.querySelector('i').style.width=pct+'%';

  var defs=[['p','p','Protein'],['c','c','Carbs'],['f','f','Fat']];
  if(settings.showFibre)defs.push(['fb','fib','Fibre']);
  $('macros').innerHTML=defs.map(function(d){
    var v=t[d[1]]||0,tv=tg[d[1]]||1,pc=Math.min(100,v/tv*100),rem=tv-v;
    return '<div class="mg '+d[0]+'"><div class="v">'+r0(v)+'<u>g</u></div><div class="n">'+d[2]+'</div>'+
      '<div class="b"><i style="width:'+pc+'%"></i></div>'+
      '<div class="t">'+(rem>0?r0(rem)+' g left':'done')+'</div></div>';}).join('');

  $('slots').innerHTML=SLOTS.map(function(s){
    return '<button class="'+(settings.slot===s?'on':'')+'" onclick="setSlot(\''+s+'\')">'+s+'</button>';}).join('');

  /* quick add is scoped to the slot you are logging into, and ranked by
     how often you have actually put that item in that slot */
  var slot=settings.slot,cats=SLOT_CATS[slot]||[],seen={};
  logs.forEach(function(l){if(!l.refId)return;
    var k=(l.slot||'Snack')+'|'+l.refId;seen[k]=(seen[k]||0)+1;});
  function slotUse(id){return seen[slot+'|'+id]||0;}
  var qa=[];
  meals.forEach(function(m){if(slotUse(m.id)>0||slot==='Snack')qa.push({kind:'meal',o:m});});
  foods.forEach(function(f){
    if(slotUse(f.id)>0||cats.indexOf(f.cat)>-1) qa.push({kind:'food',o:f});});
  function catRank(x){return x.kind==='meal'?-1:
    (cats.indexOf(x.o.cat)>-1?cats.indexOf(x.o.cat):99);}
  qa.sort(function(a,b){
    var d=slotUse(b.o.id)-slotUse(a.o.id);if(d)return d;
    var fv=(b.o.favourite?1:0)-(a.o.favourite?1:0);if(fv)return fv;
    var cr=catRank(a)-catRank(b);if(cr)return cr;
    return (b.o.useCount||0)-(a.o.useCount||0);});
  if(!qa.length)qa=foods.filter(function(f){return f.favourite;}).slice(0,8)
    .map(function(f){return {kind:'food',o:f};});
  /* Guarantee every group the slot draws on gets a look in, so a shortcut
     list is never eight of one thing. Two seats each, then fill by rank. */
  var show=[],taken={},pinned=[];
  function seed(pick,lim){var n=0,L=lim||2;for(var i=0;i<qa.length&&n<L;i++){
    if(taken[i]||!qa[i].o.favourite||!pick(qa[i]))continue;
    taken[i]=1;show.push(qa[i]);n++;}}
  /* Two seats are reserved and can never be squeezed out of the eight:
     whatever the plan says you eat in this slot, and one chocolate. */
  var planned=settings.plan[slot.toLowerCase()];
  if(planned)for(var pi=0;pi<qa.length;pi++)
    if(!taken[pi]&&qa[pi].o.id===planned){taken[pi]=1;show.push(qa[pi]);pinned.push(qa[pi]);break;}
  if(cats.indexOf('Chocolate')>-1){
    var ci=-1,best=-1;
    for(var k=0;k<qa.length;k++){
      if(taken[k]||qa[k].kind==='meal'||qa[k].o.cat!=='Chocolate')continue;
      var u=(qa[k].o.useCount||0);
      if(u>best){best=u;ci=k;}}
    if(ci>-1){taken[ci]=1;show.push(qa[ci]);pinned.push(qa[ci]);}}
  seed(function(x){return x.kind==='meal';});
  cats.forEach(function(c){seed(function(x){return x.kind!=='meal'&&x.o.cat===c;});});
  for(var i=0;i<qa.length&&show.length<8;i++)if(!taken[i]){taken[i]=1;show.push(qa[i]);}
  /* Trim from the back, skipping the reserved seats. */
  while(show.length>8){
    var cut=-1;
    for(var z=show.length-1;z>=0;z--)if(pinned.indexOf(show[z])<0){cut=z;break;}
    if(cut<0)break;
    show.splice(cut,1);}
  show.sort(function(a,b){return qa.indexOf(a)-qa.indexOf(b);});
  $('chips').innerHTML=show.slice(0,8).map(function(x){
    var m=x.kind==='meal'?mealMacros(x.o):servingOf(x.o);
    var cls=x.kind==='meal'?'ml':(x.o.recipe?'rec':(x.o.cat==='Takeaway'?'tk':''));
    return '<button class="qab '+cls+'" onclick="quickAdd(\''+x.kind+'\',\''+x.o.id+'\')">'+
      '<b>'+esc(x.o.name)+'</b><span>'+r0(m.kcal)+' cal &middot; '+r0(m.p)+'p</span></button>';}).join('')+
    '<button class="qab all" onclick="openSheet(\'quick\')"><b>Something else</b>'+
    '<span>search, describe a meal, or type macros</span></button>';
  $('qaNote').textContent=SLOTS.indexOf(slot)>-1
    ? 'Showing '+slot.toLowerCase()+' options, most used first. Anything you log here starts appearing here.'
    : '';

  $('phaseChip').textContent=PHASE_META[settings.phase].name;
  watchFab();
  renderWater();
  var ls=logsFor(viewDate);
  $('entryCount').textContent=ls.length?ls.length+' items':'';
  if(!ls.length){$('entries').innerHTML=
    '<div class="blank"><b>Nothing logged yet</b>Tap something above, or open the Kitchen and log a whole planned day at once.</div>';return;}
  var html='';
  SLOTS.forEach(function(sl){
    var g=ls.filter(function(l){return (l.slot||'Snack')===sl;});
    if(!g.length)return;
    var gp=g.reduce(function(a,l){return a+(liveSnap(l).p||0);},0);
    var low=gp<SLOT_MIN_P&&sl!=='Snack';
    html+='<div class="grp"><div class="grph"><span class="slotname">'+sl+'</span>'+
      '<span class="slotp'+(low?' lo':'')+'">'+r0(gp)+' g protein'+(low?' &middot; low':'')+'</span></div>';
    g.forEach(function(l){var s=liveSnap(l);
      var amt=l.kind==='manual'?'':(function(){
        if(l.kind==='meal')return l.qty===1?'':r1(l.qty)+' x ';
        var fd=foodById(l.refId);
        if(!fd)return '';
        if(fd.unitMode)return l.qty===1?'':l.qty+' x ';
        if(fd.pieces){var gsq=fd.serving.grams/fd.pieces,sq=l.qty/gsq;
          var rows=sq/fd.perRow;
          if(Math.abs(sq-Math.round(sq))<0.15){
            var ns=Math.round(sq);
            if(ns===fd.pieces)return 'whole block &middot; ';
            if(Math.abs(rows-Math.round(rows))<0.02&&Math.round(rows)>=1)
              return Math.round(rows)+(Math.round(rows)===1?' row':' rows')+' &middot; ';
            return ns+(ns===1?' square':' squares')+' &middot; ';}}
        return r0(l.qty)+' g &middot; ';})();
      html+='<div class="ent"><button class="t" onclick="editEntry(\''+l.id+'\')" style="text-align:left">'+
        '<b>'+esc(l.name)+'</b><span>'+amt+r0(s.p)+'p &middot; '+
        r0(s.c)+'c &middot; '+r0(s.f)+'f'+(settings.showFibre?' &middot; '+r1(s.fib||0)+' fibre':'')+'</span></button>'+
        '<div class="k">'+r0(s.kcal)+'<u>cal</u></div><button class="x" aria-label="Remove '+esc(l.name||'entry')+'" onclick="delEntry(\''+l.id+'\')">&times;</button></div>';});
    html+='</div>';});
  $('entries').innerHTML=html;
}

/* The floating + duplicates the "Something else" tile at the end of the quick
   add grid, and it sat on top of the chips, winning almost every tap it
   overlapped. Stand it down whenever that grid is actually on screen. */
var fabObs=null;
function watchFab(){
  var g=$('chips'),f=$('fab');
  if(!g||!f||typeof IntersectionObserver==='undefined')return;
  if(fabObs)return;
  fabObs=new IntersectionObserver(function(es){
    es.forEach(function(e){f.classList.toggle('away',e.isIntersecting&&tab==='today');});
  },{rootMargin:'-70px 0px -110px 0px',threshold:0.01});
  fabObs.observe(g);}

/* ---- kitchen ------------------------------------------------- */
function setK(t){kTab=t;
  document.querySelectorAll('#kSegs button').forEach(function(b,i){
    b.classList.toggle('on',['day','recipes','shop','guide'][i]===t);});
  renderKitchen();}
function planItems(){
  var p=settings.plan,out=[];
  [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['shake','Snack']].forEach(function(s){
    if(p[s[0]]){var fd=foodById(p[s[0]]);if(fd)out.push({fd:fd,slot:s[1]});}});
  (p.snacks||[]).forEach(function(id){var fd=foodById(id);if(fd)out.push({fd:fd,slot:'Snack'});});
  return out;}
function planTotal(){var t=zero();
  planItems().forEach(function(x){var s=servingOf(x.fd);MK.forEach(function(k){t[k]+=s[k];});});return t;}
function renderKitchen(){
  var el=$('kBody');

  h+=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['shake','Shake']].map(function(s){
    var fd=p[s[0]]?foodById(p[s[0]]):null,m=fd?servingOf(fd):zero();

      '<div class="por">'+esc(s.por)+'</div>'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+'</div>'+
      '<div class="kc">'+r0(m.kcal)+'</div>'+
      '<button class="logone sm" onclick="logOne(\''+s.id+'\',\'Snack\')">Log</button>'+
      '<button class="tog" onclick="toggleSnack(\''+s.id+'\')">'+(on?'&minus;':'+')+'</button></div>';}).join('');

function logOne(id,slot){
  var fd=foodById(id);if(!fd)return;
  var q=fd.unitMode?1:fd.serving.grams;
  var e={id:uid(),date:viewDate,kind:'food',refId:id,qty:q,snap:scale(fd,q),

function ck(ok,l){return '<span class="ck '+(ok?'y':'n')+'">'+(ok?'✓ ':'! ')+l+'</span>';}
function toggleSnack(id){
  var s=settings.plan.snacks||[],i=s.indexOf(id);
  if(i>-1)s.splice(i,1);else s.push(id);
  settings.plan.snacks=s;renderKitchen();saveAll();
  if(navigator.vibrate)navigator.vibrate(6);}
function openSwap(key){
  swapTarget=key;
  var pool;
  if(key==='breakfast')pool=foods.filter(function(f){return f.cat==='Staples'||f.cat==='Fruit';});
  else if(key==='shake')pool=SHAKE_POOL.map(function(i){return i?foodById(i):{id:'',name:'No shake',unitMode:true};}).filter(Boolean);
  else pool=RECIPES.map(function(r){return foodById(r.id);}).filter(Boolean)
        .concat(foods.filter(function(f){return f.cat==='Takeaway';}));
  var b='<div class="shd"><div><h3>Choose your '+key+'</h3>'+
    '<div class="sb">the totals update the moment you pick</div></div>'+
    '<button class="cls" onclick="closeSheet()">&times;</button></div>';
  b+=pool.map(function(f){
    var cur=settings.plan[key]===f.id;
    var line='skip it';
    if(f.id){var m=servingOf(f);line=r0(m.kcal)+' cal &middot; '+r0(m.p)+'p &middot; '+r1(m.fib)+' fibre';}
    return '<button class="pick" style="width:100%" onclick="doSwap(\''+f.id+'\')">'+
      '<div class="t"><b>'+esc(f.name)+'</b><span>'+line+'</span></div>'+
      '<div class="r'+(cur?' on':'')+'">✓</div></button>';}).join('');
  $('sheetBody').innerHTML=b;showSheet();}
function doSwap(id){settings.plan[swapTarget]=id;closeSheet();renderKitchen();saveAll();}
function logPlanDay(){
  var items=planItems();
  if(!items.length){showToast('Nothing in the plan yet');return;}
  var added=[];
  items.forEach(function(x){
    var q=x.fd.unitMode?1:x.fd.serving.grams;
    var e={id:uid(),date:viewDate,kind:'food',refId:x.fd.id,qty:q,snap:scale(x.fd,q),
      name:x.fd.name,slot:x.slot,loggedAt:new Date().toISOString()};
    logs.push(e);added.push(e.id);x.fd.useCount=(x.fd.useCount||0)+1;
    if(x.fd.recipe)takePortion(x.fd.recipe);});
  if(navigator.vibrate)navigator.vibrate(14);
  renderToday();renderProgress();saveAll();setTab('today');
  showToast('Logged '+items.length+' items',function(){
    logs=logs.filter(function(l){return added.indexOf(l.id)<0;});
    items.forEach(function(x){if(x.fd.recipe)giveBackPortion(x.fd.recipe);});
    renderToday();renderKitchen();renderProgress();saveAll();});}

var GUESS_MODS=[[['deep fried','deep-fried','battered','crumbed'],'Frying oil and crumb',22],
 [['pan fried','pan-fried','fried'],'Frying oil',12],
 [['creamy','cream sauce','alfredo','in cream'],'Cream',26],
 [['roast','roasted','baked'],'Roasting oil',8],
 [['buttered','with butter','butter'],'Butter',10]];
var guessRows=[];
var guessUnknown=[];
/* Whole words only. A plain indexOf found "egg" inside "veggies" and "pea"
   inside "peanut", so a steak and veggies quietly gained an egg. */
function kwAt(txt,kw){
  var re=new RegExp('(^|[^a-z])'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])','i');
  var m=re.exec(txt);
  return m?m.index+m[1].length:-1;}
function runGuess(){
  var txt=($('gTxt').value||'').toLowerCase();
  guessRows=[];guessUnknown=[];
  if(txt.trim()){
    var taken={},spans=[];
    /* longest keyword wins: once "mashed potato" is claimed, the word
       "potato" inside it cannot match again and double-count */
    function free(a,b){for(var i=0;i<spans.length;i++)
      if(a<spans[i][1]&&b>spans[i][0])return false;return true;}
    var order=[];
    GUESS.forEach(function(g){g[0].forEach(function(kw){order.push([kw,g]);});});
    order.sort(function(a,b){return b[0].length-a[0].length;});
    order.forEach(function(pair){
      var kw=pair[0],g=pair[1],at=kwAt(txt,kw);
      if(at<0||taken[g[1]]||!free(at,at+kw.length))return;
      (function(){
        var grams=g[7];
        /* a number just before the word: "200g salmon" or "2 eggs" */
        var before=txt.slice(Math.max(0,at-14),at);
        var mg=before.match(/(\d+(?:\.\d+)?)\s*(g|gm|gram|grams)\s*(?:of\s+)?$/);
        var mc=before.match(/(\d+(?:\.\d+)?)\s*$/);
        if(mg) grams=parseFloat(mg[1]);
        else if(mc&&g[8]) grams=g[7]*parseFloat(mc[1]);
        else if(/\b(two|a couple of)\s*$/.test(before)&&g[8]) grams=g[7]*2;
        taken[g[1]]=1;spans.push([at,at+kw.length]);
        guessRows.push({name:g[1],per:{kcal:g[2],p:g[3],c:g[4],f:g[5],fib:g[6]},g:grams});
      })();
    });
    /* Cooking mods, longest phrase first and span-consuming, so "deep fried"
       cannot also fire the plain "fried" row and charge two lots of oil. */
    var mods=[];
    GUESS_MODS.forEach(function(m){m[0].forEach(function(kw){mods.push([kw,m]);});});
    mods.sort(function(a,b){return b[0].length-a[0].length;});
    mods.forEach(function(pair){
      var kw=pair[0],m=pair[1],at=kwAt(txt,kw);
      if(at<0||taken[m[1]]||!free(at,at+kw.length))return;
      taken[m[1]]=1;spans.push([at,at+kw.length]);
      guessRows.push({name:m[1],per:{kcal:884,p:0,c:0,f:100,fib:0},g:m[2]});});

    /* Anything left over that looks like a food word, so a half-match is not
       presented as if the whole plate was understood. */
    var SKIP={'and':1,'with':1,'the':1,'a':1,'of':1,'some':1,'my':1,'mum':1,'mums':1,
      'made':1,'had':1,'for':1,'on':1,'in':1,'plus':1,'side':1,'sides':1,'dinner':1,
      'lunch':1,'breakfast':1,'tonight':1,'today':1,'about':1,'g':1,'gram':1,'grams':1,'x':1};
    var seen={};
    txt.split(/[^a-z]+/).forEach(function(w,i,arr){
      if(!w||w.length<3||SKIP[w]||seen[w])return;
      var at=kwAt(txt,w);
      if(at>-1&&!free(at,at+w.length))return;   // already part of something matched
      seen[w]=1;guessUnknown.push(w);});
  }
  drawGuess();
}
function guessTotal(){var t=zero();
  guessRows.forEach(function(r){var m=r.g/100;
    ['kcal','p','c','f','fib'].forEach(function(k){t[k]+=(r.per[k]||0)*m;});});return t;}
function drawGuess(){
  var el=$('gOut');if(!el)return;
  if(!guessRows.length){
    el.innerHTML=(guessUnknown.length
      ? '<p style="font-size:12.5px;color:var(--bad);padding:14px 0;line-height:1.55">'+
        'It does not know <b>'+esc(guessUnknown.slice(0,4).join(', '))+'</b>. '+
        'Try the main ingredients on their own, like &ldquo;chicken and rice&rdquo;, or use Type the macros below.</p>'
      : '<p style="font-size:12.5px;color:var(--ink3);padding:14px 0">'+
        'Type what you ate in plain words. It looks for foods it knows and assumes a normal dinner portion of each.</p>');
    var b=$('gLog');if(b)b.style.display='none';return;}
  var t=guessTotal();
  el.innerHTML=guessRows.map(function(r,i){
    var m=r.g/100;
    return '<div class="mi"><div class="t">'+esc(r.name)+'<span style="display:block;font-size:11px;color:var(--ink3)">'+
      r0(r.per.kcal*m)+' cal</span></div>'+
      '<input type="number" inputmode="decimal" value="'+r0(r.g)+'" onchange="guessQty('+i+',this.value)">'+
      '<span style="font-size:11px;color:var(--ink3)">g</span>'+
      '<button class="rm" onclick="guessRm('+i+')">&times;</button></div>';}).join('')+
    '<div class="prev"><b>Estimate</b> '+r0(t.kcal)+' cal &middot; '+r0(t.p)+'p '+r0(t.c)+'c '+r0(t.f)+'f '+
    r1(t.fib)+' fibre<br><span style="font-size:11.5px;color:var(--ink3)">'+
    (guessUnknown.length
      ? 'It did not recognise <b>'+esc(guessUnknown.slice(0,4).join(', '))+'</b>, so those are not counted. '
      : '')+
    'Portions are assumptions. Change any number above and it recalculates. Treat it as within about 15%.</span></div>';
  var bb=$('gLog');if(bb)bb.style.display='block';
}
function drinkCount(id){return logsFor(viewDate).filter(function(l){return l.refId===id;}).length;}
function drawDrinks(){
  var el=$('drinkRow');if(!el)return;
  var ds=foods.filter(function(f){return f.cat==='Drinks';});
  var tot=logsFor(viewDate).filter(function(l){var f=foodById(l.refId);return f&&f.cat==='Drinks';});
  var cal=tot.reduce(function(a,l){return a+(liveSnap(l).kcal||0);},0);
  el.innerHTML=ds.map(function(f){
    var c=drinkCount(f.id);
    return '<div class="drk'+(c?' on':'')+'"><div class="t"><b>'+esc(f.name)+'</b>'+
      '<span>'+r0(f.per100.kcal)+' cal each</span></div>'+
      (c?'<button class="dmin" onclick="unDrink(\''+f.id+'\')">&minus;</button><div class="c">'+c+'</div>':'')+
      '<button class="dplus" onclick="addDrink(\''+f.id+'\')">+</button></div>';}).join('')+
    (tot.length?'<div class="prev"><b>'+tot.length+' drinks</b> &middot; '+r0(cal)+' cal tonight. '+
      (cal>1200?'That is about half a day. Weekly budget absorbs it, see Progress.':'Comfortably absorbed by the weekly budget.')+'</div>':'');}
function addDrink(id){
  var f=foodById(id);if(!f)return;
  logs.push({id:uid(),date:viewDate,kind:'food',refId:id,qty:1,snap:scale(f,1),
    name:f.name,slot:'Snack',loggedAt:new Date().toISOString()});

/* ---- progress ------------------------------------------------ */
function rollingAvg(n){
  var days=[];for(var i=0;i<n;i++)days.push(addDays(isoToday(),-i));
  var wd=days.filter(function(d){return logsFor(d).length>0;});
  if(!wd.length)return null;
  var s=wd.reduce(function(a,d){var t=dayTotal(d);
    return {kcal:a.kcal+t.kcal,p:a.p+t.p,fib:a.fib+t.fib};},{kcal:0,p:0,fib:0});
  return {n:wd.length,kcal:s.kcal/wd.length,p:s.p/wd.length,fib:s.fib/wd.length};}
function spark(v,color){
  if(v.length<2)return '';
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1;
  return '<svg viewBox="0 0 100 24" preserveAspectRatio="none"><polyline points="'+
    v.map(function(x,i){return (i/(v.length-1)*100).toFixed(1)+','+(22-(x-mn)/rg*20).toFixed(1);}).join(' ')+
    '" fill="none" stroke="'+color+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function renderProgress(){
  var a7=rollingAvg(7),a30=rollingAvg(30),l14=[];
  for(var i=13;i>=0;i--)l14.push(dayTotal(addDays(isoToday(),-i)).kcal);
  /* This used to be PHASE_META.weekly/7, which assumes a 3xA + 2xB + 2xC week.
     Race is off, so the real week is mostly A and C and the two figures on this
     screen disagreed by about 115 cal a day. Derive it from the actual days. */
  var any=l14.some(function(v){return v>0;}),tgSum=0;
  for(var z=6;z>=0;z--)tgSum+=targetFor(addDays(isoToday(),-z)).kcal;
  var tgAvg=tgSum/7;
  function sv(l,v,s,sp){return '<div class="sv"><div class="l">'+l+'</div><div class="n">'+v+'</div><div class="s">'+s+'</div>'+(sp||'')+'</div>';}
  $('tStats').innerHTML=
    sv('7-day calories',a7?r0(a7.kcal):'--',a7?(a7.n<7?a7.n+' of 7 days':'vs '+r0(tgAvg)+' target'):'no data',any?spark(l14.slice(7),'var(--acc)'):'')+
    sv('7-day protein',a7?r0(a7.p)+'g':'--',a7?(a7.p>=PROTEIN_FLOOR?'above your floor':'below your 160 g floor'):'no data','')+
    sv('30-day calories',a30?r0(a30.kcal):'--',a30?a30.n+' days logged':'no data',any?spark(l14,'var(--p)'):'')+
    sv('7-day fibre',a7?r1(a7.fib)+'g':'--',a7?'target 35 g':'no data','');
  var wk=[],tot=0,tgt=0;
  for(var j=6;j>=0;j--){var ds=addDays(isoToday(),-j),t=dayTotal(ds).kcal,g=targetFor(ds).kcal;
    wk.push({d:ds,v:t,t:g});tot+=t;tgt+=g;}
  var mx=Math.max.apply(null,wk.map(function(x){return Math.max(x.v,x.t);}))||1,diff=tot-tgt;
  $('weekCard').innerHTML='<div class="a"><b>'+r0(tot)+'</b><span>of '+r0(tgt)+'<br>this week</span></div>'+
    '<div style="font-size:13px;opacity:.82;line-height:1.55">'+
    (Math.abs(diff)<250?'Right on it.'
     :diff>0?'<b>'+r0(diff)+' over.</b> Across the rest of the week that is '+r0(Math.abs(diff)/7)+' a day.'
     :(-diff)>=2000?'<b>'+r0(-diff)+' under.</b> That is '+r1((-diff)/7700)+' kg a week on top of the deficit you already planned. Eat more, or you will lose muscle with it.'
     :'<b>'+r0(-diff)+' under.</b> That is headroom for a night out, not a mistake.')+'</div>'+
    '<div class="wkb">'+wk.map(function(x){
      return '<div class="wkd" style="color:'+(x.v>x.t*1.02?'#FF8C78':'#5EC8A0')+'"><div class="bar">'+
        '<i style="height:'+Math.round(x.v/mx*100)+'%"></i></div>'+
        '<div class="dd">'+['S','M','T','W','T','F','S'][dow(x.d)]+'</div></div>';}).join('')+'</div>';
  renderCal();renderWeight();}
function shiftMonth(n){
  /* Built from the 1st. setMonth on the 31st rolled straight past a short month,
     so September was unreachable from 31 August. */
  var d=calMonth?new Date(calMonth):new Date();
  calMonth=new Date(d.getFullYear(),d.getMonth()+n,1).toISOString();renderCal();}
function renderCal(){
  var b=calMonth?new Date(calMonth):new Date(),y=b.getFullYear(),m=b.getMonth();
  var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('calLabel').textContent=M[m]+' '+y;
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  var h=['S','M','T','W','T','F','S'].map(function(d){return '<div class="dw">'+d+'</div>';}).join('');
  for(var i=0;i<first;i++)h+='<div class="cd pad"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+'-'+pad(m+1)+'-'+pad(d),t=dayTotal(ds).kcal,tg=targetFor(ds).kcal,c='cd';
    if(logsFor(ds).length){var r=t/tg;c+=r<0.9?' under':(r>1.1?' over':' band');}
    if(ds===isoToday())c+=' now';
    h+='<div class="'+c+'" onclick="jumpTo(\''+ds+'\')">'+d+'</div>';}
  $('calGrid').innerHTML=h;}
function jumpTo(ds){if(ds>isoToday())return;viewDate=ds;setTab('today');renderToday();}
function addWeight(){
  var el=$('wKg'),kg=parseFloat(el.value);
  if(!kg||kg<30||kg>200){showToast('Enter a weight between 30 and 200 kg');return;}
  weights=weights.filter(function(w){return w.date!==isoToday();});
  weights.push({date:isoToday(),kg:kg});
  weights.sort(function(a,b){return a.date<b.date?-1:1;});
  el.value='';if(navigator.vibrate)navigator.vibrate(8);
  renderWeight();saveAll();showToast('Logged '+kg+' kg');}
function ma7(){
  /* A real 7-DAY window. Slicing the last 7 entries meant that weighing twice a
     week averaged three weeks of weight and called it a 7-day trend. */
  return weights.map(function(w,i){
    var end=parseISO(w.date),start=end-6*86400000,win=[];
    for(var j=i;j>=0;j--){var t=parseISO(weights[j].date);
      if(t<start)break;if(t<=end)win.push(weights[j].kg);}
    if(!win.length)win=[w.kg];

      avg:win.reduce(function(a,x){return a+x;},0)/win.length};});}
function renderWeight(){
  var m=ma7(),latest=m.length?m[m.length-1]:null,rate=null;

    /* Compare against a point that is itself smoothed. m[0]'s average is a single

    var bi=-1;
    for(var q=m.length-2;q>=0;q--){
      var gap=(parseISO(m[m.length-1].date)-parseISO(m[q].date))/86400000;
      if(gap>=7&&m[q].n>=2){bi=q;break;}
      if(gap>=7&&bi<0)bi=q;}
    if(bi<0)bi=0;

    if(dd>=5)rate=(m[m.length-1].avg-back.avg)/(dd/7);}
  var pm=PHASE_META[settings.phase],inb=rate!==null&&rate>=pm.band[0]&&rate<=pm.band[1];
  $('wStats').innerHTML=
    '<div class="sv"><div class="l">Latest</div><div class="n">'+(latest?r1(latest.kg):'--')+'</div><div class="s">'+(latest?fmtDate(latest.date):'no entries')+'</div></div>'+
    '<div class="sv"><div class="l">7-day trend</div><div class="n">'+(latest?r1(latest.avg):'--')+'</div><div class="s">the honest number</div></div>'+
    '<div class="sv"><div class="l">Rate / week</div><div class="n" style="color:'+(rate===null?'var(--ink)':(inb?'var(--good)':'var(--bad)'))+'">'+
      (rate===null?'--':(rate>0?'+':'')+r1(rate))+'</div><div class="s">'+(rate===null?'need 4+ entries':(inb?'in band':'outside band'))+'</div></div>'+
    '<div class="sv"><div class="l">Phase</div><div class="n" style="font-size:22px">'+pm.name+'</div><div class="s">'+pm.note+'</div></div>';
  var ch=$('wChart');
  if(m.length<2){ch.innerHTML='<div class="blank" style="padding:24px"><b>Not enough data</b>Log at least two weigh-ins.</div>';}
  else{
    var all=m.map(function(x){return x.kg;}).concat(m.map(function(x){return x.avg;}));
    var mn=Math.min.apply(null,all)-0.4,mx=Math.max.apply(null,all)+0.4,rg=(mx-mn)||1;
    var X=function(i){return (i/(m.length-1)*100).toFixed(2);};
    var Y=function(v){return (100-(v-mn)/rg*100).toFixed(2);};
    ch.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none">'+
      '<polyline points="'+m.map(function(x,i){return X(i)+','+Y(x.kg);}).join(' ')+'" fill="none" stroke="var(--rule2)" stroke-width="0.8"/>'+
      '<polyline points="'+m.map(function(x,i){return X(i)+','+Y(x.avg);}).join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="1.9" stroke-linejoin="round"/>'+
      m.map(function(x,i){return '<circle cx="'+X(i)+'" cy="'+Y(x.kg)+'" r="1.1" fill="var(--ink3)"/>';}).join('')+'</svg>'+
      '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:9px">'+
      '<span>'+fmtDate(m[0].date)+'</span><span style="color:var(--acc)">7-day average</span><span>'+fmtDate(m[m.length-1].date)+'</span></div>';}
  $('wList').innerHTML=weights.length?weights.slice().reverse().slice(0,30).map(function(w){
    return '<div class="ent"><div class="t"><b>'+r1(w.kg)+' kg</b><span>'+fmtDate(w.date)+'</span></div>'+
      '<button class="x" onclick="delWeight(\''+w.date+'\')">&times;</button></div>';}).join('')
    :'<div class="blank"><b>No weigh-ins</b>Log one above to start the trend.</div>';}
function delWeight(d){
  var i=weights.findIndex(function(w){return w.date===d;});if(i<0)return;
